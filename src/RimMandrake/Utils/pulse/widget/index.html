<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RimPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout D (owner card 2026-10-10): two short lists, one strip of chips, authors by colour only.
   BENCH green, FOUNDRY orange, ArtPipe purple, emergency/error/critical red; rimworld and mem plain. */
:root{
  --term:#140e0a; --bar:#2a1d14; --strip:#1d140e; --line:#4a3524; --line2:#33251a;
  --cream:#f3e4c7; --text:#cdb898; --muted:#b89c7c; --dim:#8a705a; --faint:#5e4a3a;
  --rust:#d2462e; --red:#ff5547; --mustard:#e0aa3e; --avocado:#9aab5f; --orange:#e2803c;
  --bench:#6fd25c; --foundry:#f08a2a; --art:#b98cf5; --sand:#a8957d; --lk:#e6d5b0; --old:#c0805a;
  --mono:'IBM Plex Mono','Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--term);color:var(--text);font:12.5px/1.5 var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
#app{display:flex;flex-direction:column;height:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(420px 220px at 85% -40px,#3a26171f,transparent 70%),var(--term)}
.stripes{height:3px;flex:none;background:linear-gradient(90deg,var(--red) 0 25%,var(--foundry) 25% 50%,var(--art) 50% 75%,var(--bench) 75%)}
.stripes.down{background:var(--faint)}
.tb{flex:none;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px 0 14px;background:var(--bar);
  border-bottom:1px solid var(--line);color:var(--dim);font-size:10.5px}
.mark{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:15px;color:var(--cream)}
.tb .sp{flex:1}
.lights{display:flex;gap:8px;align-items:center}
.light{display:flex;align-items:center;gap:3px;color:var(--faint)}
.light i{width:6px;height:6px;border-radius:50%;background:var(--avocado);box-shadow:0 0 5px #9aab5f99}
.light.stale{color:var(--mustard)} .light.stale i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mustard)}
.light.down{color:var(--red)} .light.down i{background:var(--rust);border-radius:1px;transform:rotate(45deg);box-shadow:none}
.fresh{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--avocado);box-shadow:0 0 6px #9aab5f99}
.fresh.stale{color:var(--mustard)} .fresh.stale i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mustard)}
.fresh.down{color:var(--red)} .fresh.down i{background:var(--rust);box-shadow:none;animation:blink 1.1s steps(2) infinite}
.btn{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;width:20px;height:20px;border-radius:4px;cursor:pointer;line-height:20px}
.btn:hover{color:var(--cream);background:#ffffff10}
.btn:focus-visible,.ack:focus-visible,.lk:focus-visible{outline:1px solid var(--mustard);outline-offset:1px}

.body{flex:1;overflow-y:auto;padding:2px 0 4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.sec{display:flex;align-items:center;gap:8px;padding:6px 14px 3px;color:var(--dim);font-size:10.5px}
.sec b{color:var(--cream);font-weight:500;font-size:11.5px}
.sec::after{content:"";flex:1;height:1px;background:var(--line2)}
.row{display:grid;grid-template-columns:3px 1fr auto auto;column-gap:8px;align-items:center;height:22px;padding:0 12px;
  white-space:nowrap;position:relative;isolation:isolate}
.row .bar{height:15px;border-radius:2px;background:var(--a,var(--sand))}
.row .x{overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
.row .x .id{color:var(--a,var(--sand));font-size:10.5px;margin-right:7px}
.row .t{color:var(--dim);font-size:10.5px;min-width:26px;text-align:right}
.row .t.old{color:var(--old)}
.row.enter{animation:enter .5s ease-out}
.lk{color:var(--lk);font-size:10.5px;cursor:pointer;border-bottom:1px dotted #e6d5b077;white-space:nowrap}
.lk:hover{color:#fff;border-color:#fff}
.s-BENCH{--a:var(--bench)} .s-FOUNDRY{--a:var(--foundry)} .s-ART{--a:var(--art)}
.look{grid-template-columns:3px 26px 1fr auto auto;height:24px}
.look .th{width:26px;height:18px;border-radius:3px;background:#241911 center/cover;box-shadow:inset 0 0 0 1px var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--a,var(--sand));overflow:hidden}
.look .th img{width:100%;height:100%;object-fit:cover;display:block}
.look .x{color:var(--text)}
.look .x small{color:var(--faint);font-size:10px;margin-left:6px}
.look .x b{color:var(--mustard);font-weight:500}
.row.ask .x{color:var(--cream)}
.row.ask .bar{box-shadow:0 0 8px var(--a);animation:breathe 2.6s ease-in-out infinite}
.row.red{color:var(--red);grid-template-columns:3px 1fr auto auto}
.row.red .bar{background:var(--red)} .row.red .x{color:var(--red)}
.row.red::before{content:"";position:absolute;inset:1px 6px;border-radius:5px;background:#d2462e1c;box-shadow:inset 0 0 0 1px #d2462e55;z-index:-1}
.row.red.new::before{animation:flash .55s steps(2) 6}
.row.dimr .x,.row.dimr .id{opacity:.6}
.ack{opacity:0;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10.5px;padding:0 6px;
  border-radius:8px;cursor:pointer;line-height:15px;margin-left:4px}
.row:hover .ack{opacity:1}.ack:hover{color:var(--cream);border-color:var(--muted)}
.ack.noise{border-color:transparent;color:var(--faint)}
.rr{display:flex;align-items:center}
.more{padding:1px 14px 1px 25px;color:var(--faint);font-size:10.5px;cursor:pointer}
.more:hover{color:var(--muted)}
.empty{padding:6px 14px;color:var(--dim);font-size:11px}
.tag{font-size:10px;color:var(--mustard);border:1px solid #e0aa3e55;border-radius:7px;padding:0 5px;line-height:14px}

.strip{flex:none;display:flex;align-items:center;gap:3px;height:34px;padding:0 10px 0 8px;background:var(--strip);
  border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;font-size:11px}
.chip{display:flex;align-items:center;gap:5px;padding:1px 5px;border-radius:8px;color:var(--c,var(--text));flex:none}
.chip:not([class*=" c-"]){--c:var(--sand)}
.chip i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.chip.idle{opacity:.78} .chip.idle i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c,var(--muted))}
.chip.run i{box-shadow:0 0 6px var(--c,var(--muted))}
.chip.stuck i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mustard)}
.chip.stale{opacity:.45} .chip.stale i{background:transparent;box-shadow:inset 0 0 0 1px var(--c,var(--faint))}
.chip.dim{--c:var(--faint);color:var(--faint)} .chip.dim i{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
.chip.red{--c:var(--red);color:var(--red)} .chip.red i{background:var(--red)}
.chip.wait i{background:var(--mustard);box-shadow:0 0 7px var(--mustard)} .chip.wait small{color:var(--mustard)}
.chip.missing,.chip.unknown{opacity:.6} .chip.missing i,.chip.unknown i{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
.chip small{color:var(--faint);font-size:10px}
.c-BENCH{--c:var(--bench)} .c-FOUNDRY{--c:var(--foundry)} .c-ART{--c:var(--art)} .c-plain{--c:var(--text)}
.strip .gap{flex:1;min-width:4px;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.strip .done{color:var(--avocado);flex:none;cursor:pointer;padding-left:4px}
.row.tel .x{color:var(--mustard)} .row.tel .bar{background:var(--mustard)}
.sparks{flex:none;display:flex;gap:10px;padding:2px 10px 0 12px;font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden}
.sparks span{display:flex;align-items:center;gap:3px} .sparks svg{width:54px;height:14px}
.sparks polyline{fill:none;stroke:var(--sand);stroke-width:1.2} .sparks b{color:var(--muted);font-weight:normal}
body.collapsed .sparks{display:none}
.pill{padding:1px 9px;border-radius:9px;flex:none;margin-right:4px}
.p-red{background:var(--rust);color:#fff3e6;box-shadow:0 0 14px #ff5a3c;animation:pillred 1.6s ease-in-out infinite}
.p-amber,.p-amber_soft{color:var(--a,var(--sand));box-shadow:inset 0 0 0 1px var(--a,var(--sand))}
.p-warn{color:var(--red);box-shadow:inset 0 0 0 1px #ff554777}
.p-down{background:#3a2a20;color:var(--red);box-shadow:inset 0 0 0 1px #d2462e88}
.p-rule{color:var(--cream);box-shadow:inset 0 0 0 1px var(--line)} .p-look{color:var(--lk);box-shadow:inset 0 0 0 1px var(--line)}
.p-recovered{color:var(--avocado);box-shadow:inset 0 0 0 1px #9aab5f66;cursor:pointer}
.row.rec .x{color:var(--avocado)} .row.rec .bar{background:var(--avocado)}
.p-blind{color:var(--mustard);box-shadow:inset 0 0 0 1px #e0aa3e77}
.p-more{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
body.collapsed .body,body.collapsed .tb{display:none}
body.collapsed .strip{border-top:0;cursor:grab}
.strip .btn{flex:none}

@keyframes blink{50%{opacity:.15}}
@keyframes flash{50%{background:#d2462e66}}
@keyframes breathe{50%{opacity:.45}}
@keyframes pillred{50%{box-shadow:0 0 22px #ff5a3c,0 0 4px #ffb199}}
@keyframes enter{from{opacity:0;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body.still *{animation:none!important}
.sec .sa{color:var(--faint);font-size:10px;margin-left:2px} .sec .sa.stale{color:var(--mustard)} .sec .sa.down{color:var(--red)}
.row .t em{font-style:normal;color:var(--faint);margin-right:5px}
.full{white-space:pre-wrap;padding:2px 14px 6px 25px;color:var(--cream);font-size:11.5px;line-height:1.45;user-select:text;cursor:text}
.full small{display:block;color:var(--faint);font-size:10px;margin-top:2px}
.row.qx{cursor:pointer}
#refmsg{white-space:nowrap;font-size:10.5px;color:var(--muted);max-width:230px;overflow:hidden;text-overflow:ellipsis} #refmsg.bad{color:var(--red)} #refmsg.busy{color:var(--mustard)}
.btn.spin{animation:blink .8s steps(2) infinite}
.p-provide{color:var(--mustard);box-shadow:inset 0 0 0 1px #e0aa3e66}
.row.ans .x{color:var(--muted)} .row.ans .bar{background:var(--faint)}
#fresh{white-space:nowrap}.row.clk,.row.grp{cursor:pointer}.row.opened{opacity:.5}.sub{margin-left:22px}.sub .row{min-height:0}.row.clk:hover{background:rgba(255,230,190,.06)}
</style></head>
<body>
<div id="app">
  <div class="stripes" id="stripes"></div>
  <div class="tb" id="tb">
    <span class="mark">RimPulse</span>
    <!-- left of the lights, so it stays on screen when the window hangs off the desktop's right edge -->
    <button class="btn" id="bref" title="Refresh: re-read every source now">&#8635;</button>
    <span id="refmsg"></span>
    <span class="sp"></span>
    <span class="lights" id="lights"></span>
    <span class="fresh" id="fresh"><i></i><span id="freshtxt">connecting</span></span>
    <button class="btn" id="bmotion" title="Pause animation">&#8214;</button>
    <button class="btn" id="bcol" title="Collapse to the strip">&#9662;</button>
  </div>
  <div class="body" id="body"><div class="empty">Waiting for the first pulse from WSL…</div></div>
  <div class="sparks" id="sparks"></div>
  <div class="strip" id="strip"></div>
</div>
<script>
const API = (location.protocol === 'http:' ? '' : 'http://127.0.0.1:8765');
const $ = id => document.getElementById(id);
const api = () => (window.pywebview && window.pywebview.api) || null;
for (const id of ['tb','strip']) $(id).addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('button,a,input,.done')) return;
  const a = api(); if (a && a.start_drag) a.start_drag();
});
let snap = null, lastMsg = 0, seenKeys = new Set(), firstPaint = true, es = null;
const openedHere = new Set();     // look items opened here, drawn opened at once until the next snapshot confirms
const ex = {};                    // which folds are open: rule, look, ruleOld, lookOld, acked
function lsGet(k){ try { return localStorage.getItem(k) } catch(e){ return null } }
function lsSet(k,v){ try { localStorage.setItem(k,v) } catch(e){} }
const pref = JSON.parse(lsGet('pulse.pref') || '{}');
function savePref(){ lsSet('pulse.pref', JSON.stringify(pref)) }

function ago(t){ if(!t) return ''; const s = Math.max(0, Date.now()/1000 - t);
  if (s < 60) return Math.round(s)+'s'; if (s < 3600) return Math.round(s/60)+'m';
  if (s < 86400) return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; }
function hhmm(t){ return new Date(t*1000).toTimeString().slice(0,5) }
function hms(t){ return new Date(t*1000).toTimeString().slice(0,8) }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

const OLD = 3*86400, OLD_AGE_TAG = 72*3600;
const LIMIT = {rule:5, look:4, give:4};
// every row says where it came from and how old that reading is (owner 2026-10-23: "inaccurate", "stale")
const SRC_LABEL = {sessions:'window', ledger:'ledger', hands:'hand', sheets:'sheet', kernel:'kernel', memwatch:'mem',
  telemetry:'tel', probe:'probe', artpipe:'art'};
function srcTag(r){ return `<em>${esc(SRC_LABEL[r.src] || r.src || '?')}</em>` }
function srcTip(r){ const s = snap && snap.sources && snap.sources[r.src];
  return `\nsource: ${r.src_detail || r.src || 'unknown'}` + (s && s.at ? ` · read ${ago(s.at)} ago` : ' · not reporting'); }
function srcAge(names){ return names.map(n => { const s = snap.sources && snap.sources[n], st = srcState(n);
  return `<span class="sa ${st}" title="${esc(n)} collector: ${st} ${esc(srcWhy(n))}">${esc(SRC_LABEL[n] || n)} ${s && s.at ? ago(s.at) : '—'}</span>`; }).join(' '); }
// one light per collector; the snapshot's source names mapped to short labels
const LIGHTS = [['sessions','sessions'],['subagents','agents'],['ledger','ledger'],['hands','hands'],['sheets','sheets'],['probe','game'],['bridge','bridge'],['artpipe','art'],['kernel','kernel'],['memwatch','mem'],['services','svc'],['telemetry','tel']];
const STALE_AFTER = {services:60, kernel:90, sessions:30, subagents:30, memwatch:180, ledger:120, artpipe:120, bridge:120, probe:120, sheets:150, hands:30, telemetry:60};
// Silence is never health (RIMPULSE_SOURCES_FIX_SILENCE_READS_HEALTHY): a source that is absent or failed
// is down; one whose read works but whose data is old (s.stale, set by the daemon) is stale. The game
// probe has no failure mode of its own, so a missing probe is 'stale' (game state unknown), not 'ok'.
function srcState(name){
  const s = snap && snap.sources && snap.sources[name];
  if (!s) return name === 'probe' ? 'stale' : 'down';
  if (!s.ok) return name === 'probe' ? 'stale' : 'down';
  if (s.stale) return 'stale';
  return (Date.now()/1000 - (s.at||0)) > (STALE_AFTER[name] || 60) ? 'stale' : 'ok';
}
function srcWhy(name){ const s = snap && snap.sources && snap.sources[name];
  return !s ? 'not reporting' : (s.error || s.stale || ''); }
function blindPill(){
  const bad = LIGHTS.filter(([n]) => srcState(n) !== 'ok');
  if (!bad.length) return '';
  const down = bad.filter(([n]) => srcState(n) === 'down');
  const tip = bad.map(([n,l]) => `${l}: ${srcState(n)} ${srcWhy(n)}`).join('\n');
  return `<span class="pill ${down.length ? 'p-down' : 'p-blind'}" title="${esc(tip)}">◌ ${down.length ? 'blind' : 'stale'}: ${esc(bad.map(([,l]) => l).join(', '))}</span>`;
}
const THUMB_TY = {image:'▣', page:'▤', sheets:'☰', web:'☰', folder:'▦', save:'◈', doc:'▤', data:'▤', file:'▤'};

function seatCls(r){ return r.seat ? ' s-' + esc(r.seat) : '' }
function redHTML(r, isNew){
  let right = r.link ? `<a class="lk" tabindex="0" data-link="${esc(r.link.value)}" data-type="${r.link.type}" title="${esc(r.link.value)}">${esc(r.link.label)} ↗</a>` : '';
  if (r.incident && !r.acked)
    right += `<button class="ack" data-id="${esc(r.incident)}" title="Seen it — stop alarming">ack</button><button class="ack noise" data-id="${esc(r.incident)}" data-noise="1" title="Not worth an alarm (counts against alert precision)">noise</button>`;
  return `<div class="row red${isNew?' enter new':''}${r.acked?' dimr':''}" title="${esc(r.text + srcTip(r))}"><span class="bar"></span><span class="x">✖ ${esc(r.text)}</span><span class="rr">${right}</span><span class="t">${srcTag(r)}${hhmm(r.since)}</span></div>`;
}
function recHTML(r){
  return `<div class="row rec" title="${esc(r.text + srcTip(r))}"><span class="bar"></span><span class="x">↺ ${esc(r.text)}</span><span class="rr"></span><span class="t">${srcTag(r)}${hhmm(r.since)}</span></div>`;
}
function ruleHTML(r, isNew){
  const ask = r.kind === 'amber' || r.kind === 'amber_soft';
  let id, text;
  if (ask) { id = r.kind === 'amber' ? 'asks' : 'finished'; text = r.kind === 'amber' ? r.label.replace(/^(asks|waiting): /,'') : 'idle, waiting for you'; }
  else { id = r.title; text = r.reason; }
  const lk = r.link ? `<a class="lk" tabindex="0" data-link="${esc(r.link.value)}" data-type="${r.link.type}" title="${esc(r.link.value)}">open ↗</a>` : '<span></span>';
  const ack = ask && r.incident && !r.acked ? `<button class="ack" data-id="${esc(r.incident)}" title="Seen it — stop alarming">ack</button>` : '';
  const old = (Date.now()/1000 - r.since) > OLD_AGE_TAG;
  const rl = r.link ? ` data-link="${esc(r.link.value)}" data-type="${r.link.type}"` : '';
  // a question card expands to its whole text (every question and its options); the row stays one line
  const qk = ask && r.kind === 'amber' ? 'q:' + r.key : null, open = qk && ex[qk];
  const qx = qk && !r.link ? ` qx" data-ex="${esc(qk)}` : '';
  const tip = (r.full || r.text) + (r.ask_why ? `\nwhy '${r.ask === 'provide' ? 'to provide' : 'to rule'}': ${r.ask_why}` : '') + srcTip(r)
    + (qk ? '\nclick to ' + (open ? 'fold' : 'read the whole question') : '');
  const full = open ? `<div class="full">${esc(r.full || r.text)}<small>${r.asked_at ? 'asked ' + hhmm(r.asked_at) + ' · ' : ''}${esc(r.src_detail || '')} · gone the moment it is answered</small></div>` : '';
  return `<div class="row${seatCls(r)}${ask?' ask':''}${isNew?' enter':''}${r.link?' clk':''}${qx}"${rl} title="${esc(tip)}"><span class="bar"></span><span class="x"><span class="id">${esc(id)}${qk ? (open ? ' ▾' : ' ▸') : ''}</span>${esc(text)}</span><span class="rr">${lk}${ack}</span><span class="t${old?' old':''}">${srcTag(r)}${ago(r.since)}</span></div>` + full;
}
function ansHTML(r){
  const a = r.answered || {};
  const lk = r.link ? `<a class="lk" tabindex="0" data-link="${esc(r.link.value)}" data-type="${r.link.type}" title="${esc(r.link.value)}">open ↗</a>` : '<span></span>';
  const tip = `${r.full || r.text}\nanswered ${a.t ? hhmm(a.t) : ''} by ${a.by || '?'} (${a.event || ''} event, ${a.seat || ''}): ${a.text || ''}\nnobody has moved its needs off the owner yet` + srcTip(r);
  return `<div class="row ans${seatCls(r)}" title="${esc(tip)}"><span class="bar"></span><span class="x"><span class="id">${esc(r.title)}</span>✓ ${esc(a.by || 'answered')}: ${esc(a.text || '')}</span><span class="rr">${lk}</span><span class="t">${srcTag(r)}${ago(a.t || r.since)}</span></div>`;
}
function groupLooks(looks){
  const out = [], groups = {};
  for (const r of looks) {
    if (!r.group) { out.push(r); continue; }
    let g = groups[r.group];
    if (!g) { g = groups[r.group] = {isGroup: true, group: r.group, members: [], since: 0, key: 'g:' + r.group, kind: 'look'}; out.push(g); }
    g.members.push(r); g.since = Math.max(g.since, r.since);
  }
  for (const g of Object.values(groups)) { g.unopened = g.members.filter(m => !m.opened).length; g.pin = g.unopened ? 1 : 0; }
  return out;
}
function groupHTML(g, isNew){
  const open = ex[g.key];
  const head = `<div class="row look grp${g.unopened ? '' : ' opened'}" data-ex="${esc(g.key)}" title="click to ${open ? 'fold' : 'show each one'}"><span class="bar"></span><span class="th">${open ? '▾' : '▸'}</span><span class="x">${esc(g.group)}: ${g.members.length}${g.unopened ? ` <b>· ${g.unopened} unopened</b>` : ''}</span><span class="rr"></span><span class="t">${ago(g.since)}</span></div>`;
  if (!open) return head;
  const ms = g.members.slice().sort((a,b) => (a.opened - b.opened) || a.title.localeCompare(b.title));
  return head + `<div class="sub">${ms.map(m => lookHTML(m, false)).join('')}</div>`;
}
function lookHTML(r, isNew){
  if (r.isGroup) return groupHTML(r, isNew);
  const th = r.thumb ? `<span class="th"><img src="${API}/api/thumb?id=${encodeURIComponent(r.key)}" alt="" onerror="this.replaceWith(document.createTextNode('▣'))"></span>`
                     : `<span class="th">${THUMB_TY[r.ltype]||'▤'}</span>`;
  const extra = r.unseen ? ` <b>· ${r.unseen} unseen</b>` : '';
  const tip = (r.src === 'ledger' ? (r.full || r.text) + (r.ask_why ? `\nwhy 'to look at': ${r.ask_why}` : '') + '\n' : '')
    + (r.names ? r.names : (r.link ? r.link.value : '')) + srcTip(r);
  const lk = r.link ? `<a class="lk" tabindex="0" data-link="${esc(r.link.value)}" data-type="${r.link.type}" data-seen="${esc(r.seen_id||'')}" title="Open — marks it seen">↗</a>` : '<span></span>';
  const old = (Date.now()/1000 - r.since) > OLD_AGE_TAG;
  const rl = r.link ? ` data-link="${esc(r.link.value)}" data-type="${r.link.type}" data-seen="${esc(r.seen_id||'')}"` : '';
  return `<div class="row look${seatCls(r)}${isNew?' enter':''}${r.link?' clk':''}${r.opened?' opened':''}"${rl} title="${esc(tip)}"><span class="bar"></span>${th}<span class="x">${esc(r.title)}${extra}<small>${r.opened ? '✓ opened · ' : ''}${esc(r.ltype)}${r.src === 'ledger' && r.reason ? ' · ' + esc(r.reason) : ''}</small></span><span class="rr">${lk}</span><span class="t${old?' old':''}">${srcTag(r)}${ago(r.since)}</span></div>`;
}

function section(label, items, key, fmt, isNew, srcs){
  items = items.slice().sort((a,b) => ((b.pin||0) - (a.pin||0)) || ((a.opened?1:0) - (b.opened?1:0)) || (b.since - a.since));
  const now = Date.now()/1000, recent = items.filter(r => r.pin || now - r.since < OLD), older = items.filter(r => !r.pin && now - r.since >= OLD);
  let h = `<div class="sec"><b>${label}</b>${items.length}${srcs ? ' ' + srcAge(srcs) : ''}</div>`;
  if (!items.length) return h + `<div class="empty">nothing waiting</div>`;
  const shown = ex[key] ? recent : recent.slice(0, LIMIT[key]);
  h += shown.map(r => fmt(r, isNew(r))).join('');
  if (recent.length > shown.length) h += `<div class="more" data-ex="${key}">+ ${recent.length - shown.length} more</div>`;
  if (older.length) h += `<div class="more" data-ex="${key}Old">older (${older.length}) ${ex[key+'Old'] ? '▴' : '▾'}</div>` + (ex[key+'Old'] ? older.map(r => fmt(r, false)).join('') : '');
  return h;
}

function render(){
  if (!snap) return;
  const rows = snap.rows || [];
  const isNew = r => !firstPaint && !seenKeys.has(r.key + '|' + r.kind);
  const reds = rows.filter(r => r.kind === 'red' && !r.acked);
  const asks = rows.filter(r => (r.kind === 'amber' || r.kind === 'amber_soft') && !r.acked && r.seat);
  const rulings = rows.filter(r => r.kind === 'review');
  const gives = rows.filter(r => r.kind === 'provide');
  const answered = rows.filter(r => r.kind === 'answered');
  const looks = groupLooks(rows.filter(r => r.kind === 'look').map(r => ({...r, opened: r.opened || openedHere.has(r.seen_id)})));
  const acked = rows.filter(r => r.acked && ['red','amber','amber_soft','warn'].includes(r.kind));
  let h = reds.map(r => redHTML(r, isNew(r))).join('');
  // a question card being asked heads the list: it is the only truly blocking thing
  h += section('to rule', asks.map(r => ({...r, pin: r.kind === 'amber' ? 2 : 1})).concat(rulings), 'rule', ruleHTML, isNew, ['sessions','ledger']);
  if (gives.length) h += section('to provide', gives, 'give', ruleHTML, isNew, ['ledger']);
  h += section('to look at', looks, 'look', lookHTML, isNew, ['hands','sheets','ledger']);
  // his card or words landed after the ask, but no agent has moved needs off him: not his to do, still shown
  if (answered.length) h += `<div class="more" data-ex="answered" title="answered by card or in his words after the ask; the agent owes the follow-through">answered, agent to follow up (${answered.length}) ${ex.answered ? '▴' : '▾'}</div>` + (ex.answered ? answered.map(ansHTML).join('') : '');
  // telemetry alerts (E:\telemetry via telemetryd): amber 'warn' rows; reds already render above
  // plus the one-line "WSL restarted, these windows ended" notice (src sessions)
  const tel = rows.filter(r => (r.src === 'telemetry' || r.src === 'sessions') && r.kind === 'warn' && !r.acked);
  if (tel.length) h += tel.map(r => redHTML(r, isNew(r)).replace('class="row red', 'class="row red tel').replace('✖ ', '◆ ')).join('');
  // broke while he was away, and the evidence says it is fine again: history, never red (incident model)
  const rec = rows.filter(r => r.kind === 'recovered');
  if (rec.length) h += `<div class="more" data-ex="recovered">recovered (${rec.length}) ${ex.recovered ? '▴' : '▾'}</div>` + (ex.recovered ? rec.map(recHTML).join('') : '');
  if (acked.length) h += `<div class="more" data-ex="acked">acknowledged (${acked.length}) ${ex.acked ? '▴' : '▾'}</div>` + (ex.acked ? acked.map(r => redHTML(r, false)).join('') : '');
  const body = $('body'), st = body.scrollTop;
  body.innerHTML = h; body.scrollTop = st;
  for (const r of rows) seenKeys.add(r.key + '|' + r.kind);
  renderStrip(); renderSparks(); firstPaint = false; toastNew();
}

// four telemetry sparklines (design 08 §8): last 2 h, one point a minute; absent = not drawn, never 0
const SPARKS = [['tps_ratio','tps×',2],['exc_per_s','exc/s',1],['host_free_gb','mem GB',0],['min_vol_free_gb','disk GB',0]];
function sparkSVG(pts){
  const v = pts.filter(p => p[1] !== null);
  if (v.length < 2) return '';
  const t0 = v[0][0], t1 = v[v.length-1][0] || t0 + 1;
  let lo = Math.min(...v.map(p => p[1])), hi = Math.max(...v.map(p => p[1])); if (hi === lo) { hi += 1; lo -= 1; }
  const xy = v.map(p => `${(54 * (p[0]-t0) / Math.max(1, t1-t0)).toFixed(1)},${(13 - 12 * (p[1]-lo) / (hi-lo)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 54 14"><polyline points="${xy}"/></svg>`;
}
function renderSparks(){
  const sp = snap && snap.sparks, el = $('sparks');
  if (!sp) { el.innerHTML = ''; return; }
  el.innerHTML = SPARKS.map(([k, label, dp]) => {
    const pts = sp[k] || [], last = [...pts].reverse().find(p => p[1] !== null);
    return `<span title="${esc(label)} · last 2 h (telemetry)">${esc(label)} ${sparkSVG(pts)}<b>${last ? last[1].toFixed(dp) : '–'}</b></span>`;
  }).join('');
}

function chipHTML(c){
  const cls = ['chip', c.state, c.seat ? 'c-' + c.seat : '', c.plain ? 'c-plain' : ''].join(' ');
  let extra = '';
  if (c.n > 1) extra = `<small>×${c.n}</small>`;
  if (c.agents) extra += `<small>+${c.agents} agent${c.agents > 1 ? 's' : ''}</small>`;
  if (c.state === 'wait') extra += `<small>asks you</small>`;
  if (c.state === 'missing') extra += `<small>no window</small>`;
  if (c.state === 'unknown') extra += `<small>?</small>`;
  if (c.state === 'stale') extra += `<small>${ago(c.since)}</small>`;
  if (c.state === 'dim') return `<span class="${cls}" title="idle windows that are not seats · newest ${ago(c.since)}"><i></i>${esc(c.label)}</span>`;
  return `<span class="${cls}" title="${esc(c.title || c.label)}"><i></i>${esc(c.label)}${extra}</span>`;
}
// Collapsed, the strip is all he sees: every pill carries its own cause (owner 2026-10-22, N1), the
// rule/look counts ride along, and a frozen snapshot over a healthy connection still reads stale (N5).
const PILL_KINDS = ['red', 'amber', 'amber_soft', 'warn', 'recovered', 'rule', 'provide', 'look'];
function renderStrip(){
  const pills = (snap ? snap.strip : []).filter(p => PILL_KINDS.includes(p.kind)).map(p =>
    `<span class="pill p-${p.kind}${p.seat ? ' s-' + esc(p.seat) : ''}" title="${esc(p.title || p.text)}">${esc(p.text)}</span>`);
  if (!online()) pills.unshift(`<span class="pill p-down">✖ monitor down ${lastMsg ? ago(lastMsg/1000) : ''}</span>`);
  else if (snap && Date.now()/1000 - snap.collected_at > 20) pills.unshift(`<span class="pill p-down" title="the daemon answers but its last collection is old">◌ stale ${ago(snap.collected_at)}</span>`);
  else if (snap) { const b = blindPill(); if (b) pills.push(b); }
  const rf = refShown();
  if (rf && rf.cls === 'bad') pills.unshift(`<span class="pill p-down" title="${esc(rf.text)}">✖ ${esc(short(rf.text, 48))}</span>`);
  const chips = snap ? snap.chips || [] : [];
  const live = chips.filter(c => c.state !== 'dim'), dim = chips.filter(c => c.state === 'dim');
  const done = snap ? (snap.strip.find(p => p.kind === 'done') || null) : null;
  const dg = snap && snap.digest;
  $('strip').innerHTML = pills.join('') + live.map(chipHTML).join('') + '<span class="gap"></span>' + dim.map(chipHTML).join('')
    + (done ? `<span class="done" ${dg ? `data-link="${esc(dg.path)}" data-type="path"` : ''} title="finished since ${snap.done_since ? hhmm(snap.done_since) : ''}${dg ? ' · open digest' : ''}">${esc(done.text.replace(' ',''))}</span>` : '')
    + `<button class="btn${refreshing ? ' spin' : ''}" id="bref2" title="Refresh: re-read every source now" style="${document.body.classList.contains('collapsed') ? '' : 'display:none'}">&#8635;</button>`
    + `<button class="btn" id="bexp" title="Expand" style="${document.body.classList.contains('collapsed') ? '' : 'display:none'}">▴</button>`;
  $('bexp').onclick = () => setCollapsed(false);
  $('bref2').onclick = doRefresh;
  foldOverflow();
}
// Never clip silently: pills/chips that do not fit are hidden and counted in one visible "+N" pill whose
// tooltip lists them; clicking it expands the widget.
function foldOverflow(){
  const st = $('strip'); if (!st.clientWidth || st.scrollWidth <= st.clientWidth) return;
  const items = [...st.querySelectorAll('.pill, .chip')], hidden = [];
  const room = () => st.scrollWidth > st.clientWidth;
  const more = document.createElement('span'); more.className = 'pill p-more'; st.insertBefore(more, st.querySelector('.gap'));
  // drop from the right: dim chips first, then chips, then the lowest-priority pills (rule/look before alarms)
  const order = items.slice().reverse().sort((a, b) => rank(a) - rank(b));
  for (const el of order) { if (!room()) break; el.style.display = 'none'; hidden.push(el.title || el.textContent);
    more.textContent = `+${hidden.length} more`; }
  more.title = hidden.join('\n'); more.onclick = () => setCollapsed(false);
  function rank(el){ return el.classList.contains('dim') ? 0 : el.classList.contains('chip') ? 1
    : el.classList.contains('p-look') || el.classList.contains('p-rule') || el.classList.contains('p-provide') || el.classList.contains('p-recovered') ? 2
    : el.classList.contains('p-warn') ? 3 : 4; }
}

function online(){ return lastMsg && (Date.now() - lastMsg) < 40000 }
function short(s, n){ s = String(s || ''); return s.length <= n ? s : s.slice(0, n - 1) + '…' }
// REFRESH (owner 2026-10-23: "a new 'refresh' button ... It's annoying how inaccurate it often is"): a full
// re-collect on the daemon, synchronous; the answer says "refreshed hh:mm:ss" or why it failed - never quietly
// keeps showing the old data as if it were new.
let refreshing = false, refLocal = null;
function refShown(){
  if (refreshing) return {text: 'refreshing…', cls: 'busy'};
  const sr = snap && snap.refresh;
  const r = refLocal && (!sr || refLocal.at >= sr.at) ? refLocal : sr ? (sr.ok
      ? {text: 'refreshed ' + hms(sr.collected_at) + (Object.keys(sr.sources_down || {}).length ? ' · not ok: ' + Object.keys(sr.sources_down).join(', ') : ''), cls: '', at: sr.at, ok: true}
      : {text: 'refresh failed: ' + sr.error, cls: 'bad', at: sr.at}) : null;
  if (!r) return null;
  if (r.cls !== 'bad' && Date.now()/1000 - r.at > 900) return null;   // an old success says nothing new
  return r;
}
async function doRefresh(){
  if (refreshing) return;
  refreshing = true; tickFresh();
  try {
    const r = await fetch(API + '/api/refresh', {method: 'POST', cache: 'no-store'});
    const j = await r.json();
    if (j.ok && j.snap) { lastMsg = Date.now(); refLocal = null; refreshing = false; accept(j.snap); }
    else refLocal = {text: 'refresh failed: ' + (j.error || ('HTTP ' + r.status)), cls: 'bad', at: Date.now()/1000};
  } catch(e) { refLocal = {text: 'refresh failed: the monitor did not answer (' + (e.message || e) + ')', cls: 'bad', at: Date.now()/1000}; }
  refreshing = false; tickFresh();
}
$('bref').onclick = doRefresh;
function tickFresh(){
  $('lights').innerHTML = snap ? LIGHTS.map(([n,l]) => `<span class="light ${srcState(n)}" title="${n} collector: ${srcState(n)} ${esc(srcWhy(n))}"><i></i>${l}</span>`).join('') : '';
  const f = $('fresh'), ft = $('freshtxt');
  f.className = 'fresh';
  if (!online()) { f.classList.add('down'); ft.textContent = lastMsg ? 'monitor down · retrying' : 'connecting'; $('stripes').classList.add('down'); }
  else { const age = Date.now()/1000 - snap.collected_at; $('stripes').classList.remove('down');
    if (age > 20) { f.classList.add('stale'); ft.textContent = 'stale ' + ago(snap.collected_at); }
    else ft.textContent = 'live ' + Math.round(age) + 's'; }
  const rf = refShown(), rm = $('refmsg');
  rm.textContent = rf ? rf.text : ''; rm.className = rf ? rf.cls : ''; rm.title = rf ? rf.text : '';
  $('bref').classList.toggle('spin', refreshing);
  renderStrip();
}

const BOOT_VERSION = { v: null };
function accept(s){
  // a new page version on the server: reload once so the widget never runs stale UI code
  if (s.widget_version && location.protocol === 'http:') {
    if (BOOT_VERSION.v === null) BOOT_VERSION.v = s.widget_version;
    else if (s.widget_version !== BOOT_VERSION.v) { location.reload(); return; }
  }
  openedHere.clear(); snap = s; render(); tickFresh();
}
function connect(){
  try { es && es.close() } catch(e){}
  es = new EventSource(API + '/api/stream');
  es.onmessage = ev => { lastMsg = Date.now(); accept(JSON.parse(ev.data)); };
  es.addEventListener('error', () => {});
}
setInterval(async () => { try { const r = await fetch(API + '/api/now', {cache:'no-store'}); if (r.ok) { lastMsg = Date.now(); const s = await r.json(); if (!snap || s.collected_at > snap.collected_at) accept(s); } } catch(e){ if (es && es.readyState === 2) connect(); } }, 10000);
setInterval(tickFresh, 1000);

async function post(path, obj){ try { await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)}); } catch(e){} }

document.addEventListener('click', e => {
  const a = e.target.closest('.ack'); if (a) { post('/api/ack', {id: a.dataset.id, noise: !!a.dataset.noise, actor: 'widget'}); a.closest('.row').classList.add('dimr'); return; }
  const l = e.target.closest('.lk, .done, .row.clk'); if (l && l.dataset.link) {
    openLink(l.dataset.link, l.dataset.type);
    if (l.dataset.seen) { openedHere.add(l.dataset.seen); post('/api/seen', {id: l.dataset.seen}); render(); }   // opened = dimmed, never removed
    return; }
  const rp = e.target.closest('.p-recovered'); if (rp) { ex.recovered = true; setCollapsed(false); render(); return; }
  const m = e.target.closest('.more, .grp, .qx'); if (m) { ex[m.dataset.ex] = !ex[m.dataset.ex]; render(); return; }
});
function openLink(v, type){ const p = api(); if (p) p.open(v); else if (type === 'url') window.open(v, '_blank'); else navigator.clipboard && navigator.clipboard.writeText(v); }

function setCollapsed(c, user = true){ pref.collapsed = c; savePref(); document.body.classList.toggle('collapsed', c);
  renderStrip(); if (user) fit(); }
$('bcol').onclick = () => setCollapsed(true);
$('strip').addEventListener('dblclick', e => { if (!e.target.closest('.done')) setCollapsed(!document.body.classList.contains('collapsed')); });
$('bmotion').onclick = () => { pref.still = !pref.still; savePref(); document.body.classList.toggle('still', pref.still); };

// The window's size changes ONLY when he collapses or expands it — never on a data update.
function fit(){ const p = api(); if (p && p.set_collapsed) p.set_collapsed(document.body.classList.contains('collapsed')); }

function toastNew(){ const p = api(); if (!p || !p.toast || !snap) return;
  for (const r of snap.rows) {
    if (r.acked || !r.toast_key || r.toasted_elsewhere) continue;
    if (r.kind === 'red') p.toast(r.toast_key, 'RimPulse · ' + (r.text.startsWith('OOM') ? 'OOM kill' : r.src === 'sessions' ? 'window lost' : r.src === 'telemetry' ? 'telemetry alarm' : 'alarm'), r.text);
    else if (r.kind === 'amber' && r.seat) p.toast(r.toast_key, 'RimPulse · ' + r.who + ' is waiting on you', r.text);
  } }

window.addEventListener('pywebviewready', () => { if (snap) toastNew(); });
document.body.classList.toggle('still', !!pref.still);
if (pref.collapsed) setCollapsed(true, false);
connect(); tickFresh();
</script>
</body></html>
