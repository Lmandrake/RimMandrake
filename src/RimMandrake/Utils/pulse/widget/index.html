<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RimFlow Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept C (the Marquee) as one floating widget — owner card 2026-10-08 20:39. */
:root{
  --term:#140e0a; --bar:#2a1d14; --strip:#1d140e; --line:#4a3524; --line2:#33251a;
  --cream:#f3e4c7; --text:#cdb898; --muted:#b89c7c; --dim:#8a705a; --faint:#5e4a3a;
  --rust:#d2462e; --red:#ff6a4a; --amber:#f2a516; --mustard:#e0aa3e; --orange:#e2803c;
  --avocado:#9aab5f; --teal:#5f9c9a; --tealhi:#7fc1bd;
  --mono:'IBM Plex Mono','Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--term);color:var(--text);font:12.5px/1.62 var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
#app{display:flex;flex-direction:column;height:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(420px 220px at 85% -40px,#3a26171f,transparent 70%),var(--term)}
.stripes{height:3px;flex:none;background:linear-gradient(90deg,var(--rust) 0 25%,var(--orange) 25% 50%,var(--mustard) 50% 75%,var(--avocado) 75%)}
.stripes.down{background:var(--faint)}

/* title bar — drag handle */
.tb{flex:none;display:flex;align-items:center;gap:10px;height:30px;padding:0 10px 0 14px;background:var(--bar);
  border-bottom:1px solid var(--line);color:var(--muted);font-size:11.5px}
.mark{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:15px;color:var(--cream);letter-spacing:.2px}
.mark small{font-family:var(--mono);font-style:normal;font-weight:400;font-size:11px;color:var(--dim);margin-left:6px}
.tb .sp{flex:1}
.fresh{display:flex;align-items:center;gap:6px;color:var(--dim)}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--avocado);box-shadow:0 0 6px #9aab5f99}
.fresh.stale{color:var(--mustard)} .fresh.stale i{background:var(--mustard);box-shadow:none}
.fresh.down{color:var(--red)} .fresh.down i{background:var(--rust);animation:blink 1.1s steps(2) infinite}
.btn{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;width:20px;height:20px;border-radius:4px;cursor:pointer;line-height:20px}
.btn:hover{color:var(--cream);background:#ffffff10}
.btn:focus-visible,.ack:focus-visible,.lk:focus-visible{outline:1px solid var(--mustard);outline-offset:1px}

/* body — the digest-style roster */
.body{flex:1;overflow-y:auto;padding:8px 0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.row{isolation:isolate;display:grid;grid-template-columns:18px 48px 1fr auto;align-items:baseline;column-gap:6px;padding:0 12px 0 14px;
  min-height:20px;white-space:nowrap;position:relative}
.row .g{text-align:center}
.row .t{color:var(--dim);font-size:11.5px;text-align:right;padding-right:6px}
.row .x{overflow:hidden;text-overflow:ellipsis}
.row .r{display:flex;gap:8px;align-items:baseline;font-size:11.5px}
.row.enter{animation:enter .5s ease-out}
.lk{color:var(--dim);border-bottom:1px dotted #8a705a88;cursor:pointer;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.lk:hover{color:var(--mustard);border-color:var(--mustard)}
.ack{opacity:0;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10.5px;padding:0 6px;
  border-radius:8px;cursor:pointer;line-height:15px}
.row:hover .ack{opacity:1}.ack:hover{color:var(--cream);border-color:var(--muted)}
.ack.noise{border-color:transparent;color:var(--faint)}

.k-red{color:var(--red)}
.k-red::before{content:"";position:absolute;inset:1px 6px;border-radius:5px;background:#d2462e1c;box-shadow:inset 0 0 0 1px #d2462e55;z-index:-1}
.k-red.new::before{animation:flash .55s steps(2) 6}
.k-red:not(.acked) .g{animation:redglow 1.8s ease-in-out infinite}
.k-amber{color:var(--amber)}
.k-amber::before{content:"";position:absolute;inset:1px 6px;border-radius:5px;background:#f2a51612;z-index:-1;animation:amberpulse 2.6s ease-in-out infinite}
.k-amber .g{animation:amberglyph 2.6s ease-in-out infinite}
.k-amber_soft{color:#c99a45}
.k-amber_soft .g{animation:amberglyph 4s ease-in-out infinite}
.k-stuck{color:#a88a55}
.k-run{color:var(--teal)}
.k-run .g{animation:breathe 3.2s ease-in-out infinite}
.k-review{color:var(--mustard)}
.k-idle{color:var(--dim)}
.k-done{color:var(--avocado)}
.k-done .x .who{color:#7d8a52}
.acked{opacity:.5}.acked::before{display:none}.acked .g{animation:none}
.stale .x{color:var(--faint)!important}
.tag{font-size:10px;color:var(--mustard);border:1px solid #e0aa3e55;border-radius:7px;padding:0 5px;line-height:14px}

.sec{display:flex;align-items:center;gap:8px;padding:7px 14px 2px;color:var(--faint);font-size:11px}
.sec::after{content:"";flex:1;height:1px;background:var(--line2)}
.sec b{font-weight:500;color:var(--dim)}
.foot{padding:6px 14px 2px;color:var(--faint);font-size:11px}
.empty{padding:14px;color:var(--dim)}
.more{padding:2px 14px 0 82px;color:var(--faint);font-size:11px;cursor:pointer}
.more:hover{color:var(--muted)}

/* the marquee strip — the memorable thing */
.strip{flex:none;display:flex;align-items:center;gap:12px;height:36px;padding:0 10px 0 14px;background:var(--strip);
  border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;font-size:12px}
.strip .pills{display:flex;gap:10px;align-items:center;overflow:hidden;flex:1;mask-image:linear-gradient(90deg,#000 90%,transparent)}
.pill{padding:1px 9px;border-radius:9px;flex:none}
.p-red{background:var(--rust);color:#fff3e6;box-shadow:0 0 14px #ff5a3c;animation:pillred 1.6s ease-in-out infinite}
.p-red.new{animation:pillflash .5s steps(2) 6,pillred 1.6s ease-in-out 3s infinite}
.p-amber{background:var(--amber);color:#2b1d12;box-shadow:0 0 12px #ffbf3c88;animation:pillamber 2.6s ease-in-out infinite}
.p-amber_soft{color:var(--amber);box-shadow:inset 0 0 0 1px #f2a51677}
.p-run{color:var(--teal);padding:1px 2px}
.p-done{color:var(--avocado);padding:1px 2px}
.p-down{background:#3a2a20;color:var(--red);box-shadow:inset 0 0 0 1px #d2462e88}
.strip .btn{flex:none}
body.collapsed .body,body.collapsed .tb{display:none}
body.collapsed .strip{border-top:0;cursor:grab}

@keyframes blink{50%{opacity:.15}}
@keyframes flash{50%{background:#d2462e66}}
@keyframes redglow{50%{text-shadow:0 0 10px #ff5a3c}}
@keyframes amberpulse{50%{background:#f2a51626}}
@keyframes amberglyph{50%{text-shadow:0 0 9px #ffbf3c;opacity:.75}}
@keyframes breathe{50%{opacity:.45}}
@keyframes pillred{50%{box-shadow:0 0 22px #ff5a3c,0 0 4px #ffb199}}
@keyframes pillflash{50%{background:#ff8a6a}}
@keyframes pillamber{50%{box-shadow:0 0 18px #ffbf3ccc}}
@keyframes enter{from{opacity:0;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body.still *{animation:none!important}
</style></head>
<body>
<div id="app">
  <div class="stripes" id="stripes"></div>
  <div class="tb pywebview-drag-region" id="tb">
    <span class="mark">pulse<small>rimflow</small></span>
    <span class="sp"></span>
    <span id="clock"></span>
    <span class="fresh" id="fresh"><i></i><span id="freshtxt">connecting</span></span>
    <button class="btn" id="bmotion" title="Pause animation">‖</button>
    <button class="btn" id="bcol" title="Collapse to the strip">▾</button>
  </div>
  <div class="body" id="body"><div class="empty">Waiting for the first pulse from WSL…</div></div>
  <div class="strip pywebview-drag-region" id="strip">
    <div class="pills" id="pills"></div>
    <button class="btn" id="bexp" title="Expand" style="display:none">▴</button>
  </div>
</div>
<script>
const API = (location.protocol === 'http:' ? '' : 'http://127.0.0.1:8765');
const $ = id => document.getElementById(id);
const api = () => (window.pywebview && window.pywebview.api) || null;
let snap = null, lastMsg = 0, seenKeys = new Set(), firstPaint = true, showAllDone = false, es = null;
const pref = JSON.parse(localStorageGet('pulse.pref') || '{}');

function localStorageGet(k){ try { return localStorage.getItem(k) } catch(e){ return null } }
function localStorageSet(k,v){ try { localStorage.setItem(k,v) } catch(e){} }
function savePref(){ localStorageSet('pulse.pref', JSON.stringify(pref)) }

function ago(t){ if(!t) return ''; const s = Math.max(0, Date.now()/1000 - t);
  if (s < 60) return Math.round(s)+'s'; if (s < 3600) return Math.round(s/60)+'m';
  if (s < 86400) return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; }
function hhmm(t){ const d = new Date(t*1000); return d.toTimeString().slice(0,5) }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

const GLYPH = {red:'✖', amber:'◐', amber_soft:'◑', stuck:'◌', run:'▶', review:'◇', idle:'·', done:'✓'};
const STALE_AFTER = {sessions:30, subagents:30, memwatch:180, ledger:120, artpipe:120, bridge:120, probe:120};

function srcStale(src){
  const s = snap && snap.sources && snap.sources[src]; if (!s) return src === 'probe' ? false : true;
  if (!s.ok && !s.at) return true;
  return (Date.now()/1000 - (s.at||0)) > (STALE_AFTER[src] || 60);
}

function rowHTML(r, isNew){
  const timeCol = r.kind === 'done' || r.kind === 'red' ? hhmm(r.since) : ago(r.since);
  const stale = srcStale(r.src);
  const cls = ['row','k-'+r.kind, r.acked?'acked':'', stale?'stale':'', isNew?'enter':'', (isNew && r.kind==='red')?'new':''].join(' ');
  let right = '';
  if (r.link) right += `<a class="lk" tabindex="0" data-link="${esc(r.link.value)}" data-type="${r.link.type}" title="${esc(r.link.value)}">${esc(r.link.label)}</a>`;
  if (stale) right += `<span class="tag" title="This line's source has not refreshed">stale</span>`;
  if (r.incident && !r.acked && ['red','amber','amber_soft'].includes(r.kind))
    right += `<button class="ack" data-id="${esc(r.incident)}" title="Seen it — stop alarming">ack</button><button class="ack noise" data-id="${esc(r.incident)}" data-noise="1" title="Not worth an alarm (counts against alert precision)">noise</button>`;
  let text = esc(r.text);
  if (r.kind === 'done') text = `<span class="who">${esc(r.who.padEnd(8,' '))}</span>${text}`;
  return `<div class="${cls}" title="${esc(r.text)}"><span class="g">${GLYPH[r.kind]||'·'}</span><span class="t">${timeCol}</span><span class="x">${text}</span><span class="r">${right}</span></div>`;
}

function render(){
  if (!snap) return;
  const rows = snap.rows || [];
  const alarms = rows.filter(r => ['red','amber','amber_soft','stuck'].includes(r.kind) && !r.acked);
  const now = rows.filter(r => ['run','idle'].includes(r.kind));
  const review = rows.filter(r => r.kind === 'review');
  const acked = rows.filter(r => r.acked);
  const done = rows.filter(r => r.kind === 'done').sort((a,b) => b.since - a.since);
  const isNew = r => !firstPaint && !seenKeys.has(r.key + '|' + r.kind);
  let h = '';
  if (alarms.length) h += alarms.map(r => rowHTML(r, isNew(r))).join('');
  h += `<div class="sec"><b>now</b></div>` + (now.length ? now.map(r => rowHTML(r, isNew(r))).join('') : `<div class="foot">Nothing running.</div>`);
  if (review.length) h += `<div class="sec"><b>waiting on your ruling</b> ${review.length}</div>` + review.slice(0, pref.allReview ? 99 : 3).map(r => rowHTML(r, isNew(r))).join('')
      + (review.length > 3 && !pref.allReview ? `<div class="more" data-more="allReview">+ ${review.length-3} more</div>` : '');
  const ds = snap.done_since ? hhmm(snap.done_since) : '';
  const dg = snap.digest;
  h += `<div class="sec"><b>finished since ${ds}</b>${dg ? ` <a class="lk" data-link="${esc(dg.path)}" data-type="path" title="${esc(dg.path)}">digest ${hhmm(dg.at)}</a>` : ''}</div>`;
  const lim = showAllDone ? 999 : 6;
  h += done.length ? done.slice(0, lim).map(r => rowHTML(r, isNew(r))).join('') : `<div class="foot">Nothing finished yet.</div>`;
  if (done.length > lim) h += `<div class="more" data-more="done">+ ${done.length-lim} more finished</div>`;
  if (acked.length) h += `<div class="sec"><b>acknowledged</b></div>` + acked.map(r => rowHTML(r, false)).join('');
  const c = snap.counts || {};
  h += `<div class="foot">${c.filed||0} filed · ${c.implemented||0} implemented · ${c.closed||0} closed · ${c.verifies||0} verifies · ${c.drops||0} drops</div>`;
  const body = $('body'), st = body.scrollTop;
  body.innerHTML = '<div id="inner">' + h + '</div>'; body.scrollTop = st;
  for (const r of rows) seenKeys.add(r.key + '|' + r.kind);
  renderStrip(isNew); firstPaint = false; fit(); toastNew();
}

function renderStrip(){
  const pills = (snap ? snap.strip : []).map(p => {
    let t = esc(p.text); if (p.since && (p.kind==='amber'||p.kind==='amber_soft')) t += ' ' + ago(p.since);
    return `<span class="pill p-${p.kind}">${t}</span>`; });
  if (!online()) pills.unshift(`<span class="pill p-down">✖ monitor down ${lastMsg ? ago(lastMsg/1000) : ''}</span>`);
  $('pills').innerHTML = pills.join('') || `<span class="pill p-done">✓ all quiet</span>`;
}

function online(){ return lastMsg && (Date.now() - lastMsg) < 40000 }
function tickFresh(){
  $('clock').textContent = new Date().toTimeString().slice(0,5);
  const f = $('fresh'), ft = $('freshtxt');
  f.className = 'fresh';
  if (!online()) { f.classList.add('down'); ft.textContent = lastMsg ? 'monitor down · retrying' : 'connecting'; $('stripes').classList.add('down'); }
  else { const age = Date.now()/1000 - snap.collected_at; $('stripes').classList.remove('down');
    if (age > 20) { f.classList.add('stale'); ft.textContent = 'stale ' + ago(snap.collected_at); }
    else ft.textContent = 'live ' + Math.round(age) + 's'; }
  renderStrip();
}

const BOOT_VERSION = { v: null };
function accept(s){
  // a new page version on the server: reload once so the widget never runs stale UI code
  if (s.widget_version && location.protocol === 'http:') {
    if (BOOT_VERSION.v === null) BOOT_VERSION.v = s.widget_version;
    else if (s.widget_version !== BOOT_VERSION.v) { location.reload(); return; }
  }
  snap = s; render(); tickFresh();
}
function connect(){
  try { es && es.close() } catch(e){}
  es = new EventSource(API + '/api/stream');
  es.onmessage = ev => { lastMsg = Date.now(); const s = JSON.parse(ev.data);
    accept(s); };
  es.addEventListener('error', () => { /* EventSource retries by itself; the header shows the gap */ });
}
// heartbeat comments keep lastMsg fresh only via messages; poll /api/now as a liveness check
setInterval(async () => { try { const r = await fetch(API + '/api/now', {cache:'no-store'}); if (r.ok) { lastMsg = Date.now(); const s = await r.json(); if (!snap || s.collected_at > snap.collected_at) accept(s); } } catch(e){ if (es && es.readyState === 2) connect(); } }, 10000);
setInterval(tickFresh, 1000);

async function ack(id, noise){
  try { await fetch(API + '/api/ack', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, noise: !!noise})}); } catch(e){}
}

document.addEventListener('click', e => {
  const a = e.target.closest('.ack'); if (a) { ack(a.dataset.id, a.dataset.noise); a.closest('.row').classList.add('acked'); return; }
  const l = e.target.closest('.lk'); if (l) { openLink(l.dataset.link, l.dataset.type); return; }
  const m = e.target.closest('.more'); if (m) { if (m.dataset.more === 'done') showAllDone = true; else { pref[m.dataset.more] = true; savePref(); } render(); return; }
});
function openLink(v, type){ const p = api(); if (p) p.open(v); else if (type === 'url') window.open(v, '_blank'); else navigator.clipboard && navigator.clipboard.writeText(v); }

function setCollapsed(c){ pref.collapsed = c; savePref(); document.body.classList.toggle('collapsed', c);
  $('bexp').style.display = c ? '' : 'none'; fit(); }
$('bcol').onclick = () => setCollapsed(true);
$('bexp').onclick = () => setCollapsed(false);
$('strip').addEventListener('dblclick', () => setCollapsed(!document.body.classList.contains('collapsed')));
$('bmotion').onclick = () => { pref.still = !pref.still; savePref(); document.body.classList.toggle('still', pref.still); };

let lastH = 0;
function fit(){ const p = api(); if (!p || !p.fit) return;
  let h;
  if (document.body.classList.contains('collapsed')) h = 3 + 36 + 2;
  else { const i = $('inner'); h = 3 + 31 + 36 + 2 + 14 + Math.min(i ? i.offsetHeight : 200, 430); }
  if (Math.abs(h - lastH) > 2) { lastH = h; p.fit(h, document.body.classList.contains('collapsed')); } }

function toastNew(){ const p = api(); if (!p || !p.toast || !snap) return;
  for (const r of snap.rows) {
    if (r.acked || !r.toast_key || r.toasted_elsewhere) continue;
    if (r.kind === 'red') p.toast(r.toast_key, 'RimFlow · ' + (r.text.startsWith('OOM') ? 'OOM kill' : 'window lost'), r.text);
    else if (r.kind === 'amber') p.toast(r.toast_key, 'RimFlow · ' + r.who + ' is waiting on you', r.text);
  } }

window.addEventListener('pywebviewready', () => { fit(); if (snap) toastNew(); });
document.body.classList.toggle('still', !!pref.still);
if (pref.collapsed) setCollapsed(true);
connect(); tickFresh();
</script>
</body></html>
