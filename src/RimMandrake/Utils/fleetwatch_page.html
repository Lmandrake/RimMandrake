<title>Fleet Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Fleet Watch: one phone-first column in priority order. Data: db `parts` (one row per live or finished item),
   `mods` (one doc per mod, 7-day window), `board/summary` + `board/factory`, `feed`. Written by fleet_refresh.py. */
:root{
  --bg:#f3efe7; --panel:#fffdf8; --ink:#2a2118; --muted:#7a6a58; --line:#e2d8c8; --accent:#a0522d;
  --ok:#3d7a3a; --run:#b7791f; --stop:#9b2c2c; --wait:#5a6b8c; --alarm:#b0306a;
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1712; --panel:#26201a; --ink:#efe6d8; --muted:#a8957f; --line:#3a3128; --accent:#d9895a;
  --ok:#7cc077; --run:#e0a84a; --stop:#e07a7a; --wait:#93a6cc; --alarm:#f07fb2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1712; --panel:#26201a; --ink:#efe6d8; --muted:#a8957f; --line:#3a3128; --accent:#d9895a;
  --ok:#7cc077; --run:#e0a84a; --stop:#e07a7a; --wait:#93a6cc; --alarm:#f07fb2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.head b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);letter-spacing:-.01em;margin-right:4px}
.head .ok{color:var(--ok)} .head .bad{color:var(--alarm);font-weight:600}
.stamp.stale{color:var(--alarm)}
.headline{margin:0;font-size:14px;color:var(--muted)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
h2 .n{font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:500}
#needs h2{color:var(--accent)}
#needs p{margin:0;font-weight:500}
#problems{border-color:var(--alarm)} #problems h2{color:var(--alarm)}
ul{list-style:none;margin:0;padding:0}
li.row{padding:5px 0;border-top:1px solid var(--line);min-width:0}
li.row:first-child{border-top:0}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.g{width:1.1em;flex:none;text-align:center}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.m{flex:none;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.l2{margin:1px 0 0 calc(1.1em + 8px);font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.alarm .l2{-webkit-line-clamp:3}
.alarm .g,.alarm .l2{color:var(--alarm)}
.s-Building .g{color:var(--run)} .s-Checking .g{color:var(--wait)}
.pass{color:var(--ok)} .fail{color:var(--stop)} .weak{color:var(--run)}
.empty{color:var(--muted);font-size:13px}
details.mod{border-top:1px solid var(--line);padding:6px 0}
details.mod:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px;min-width:0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted);flex:none;width:1.1em;text-align:center}
details[open]>summary::before{content:"▾"}
summary .t{font-family:var(--display);font-weight:700}
.st{margin:3px 0 4px calc(1.1em + 8px);font-size:13px;color:var(--muted)}
.st div{overflow-wrap:anywhere}
.st .nx{color:var(--ink)}
.tasks{margin-left:calc(1.1em + 8px)}
.tasks li{display:flex;gap:8px;font-size:13px;min-width:0;padding:1px 0}
.tasks .g{width:1em}
.tasks .ok{color:var(--ok)} .tasks .park{color:var(--wait)} .tasks .open{color:var(--muted)}
#feed li{display:flex;gap:10px;font-size:13px;padding:2px 0;min-width:0}
#feed time{font-family:var(--mono);color:var(--muted);flex:none}
#feed span{min-width:0;overflow-wrap:anywhere}
details.fold>summary{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.fold[open]>summary{margin-bottom:6px}
</style>
<div class="wrap">
  <div class="head"><b>Fleet Watch</b><span id="clock">—</span><span id="fac">factory …</span><span id="workers"></span><span id="tok"></span><span class="stamp" id="stamp">Connecting…</span></div>
  <p class="headline" id="headline"></p>
  <section id="needs"><h2>Needs you</h2><p id="needstext">Nothing.</p></section>
  <section id="problems" hidden><h2>Stuck or circling <span class="n" id="np"></span></h2><ul id="plist"></ul></section>
  <section><h2>Working <span class="n" id="nw"></span></h2><ul id="wlist"></ul></section>
  <section id="checking" hidden><h2>Checking <span class="n" id="nc"></span></h2><ul id="clist"></ul></section>
  <section><h2>Off the line today <span class="n" id="nd"></span></h2><ul id="dlist"></ul></section>
  <section><h2>Mods worked on lately <span class="n">7 days</span></h2><div id="mods"><p class="empty">Waiting for data…</p></div></section>
  <section><details class="fold"><summary>Feed</summary><ul id="feed"></ul></details></section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = t => t ? new Date(t*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "";
const now = () => Date.now()/1000;
const midnight = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime()/1000; };
const tok = n => n == null ? "" : n >= 1e6 ? (n/1e6).toFixed(n >= 1e8 ? 0 : 1) + "M" : n >= 1e3 ? Math.round(n/1e3) + "k" : String(n);
const mins = (a, b) => Math.max(0, Math.round(((b ?? now()) - a)/60));
const LIVE = new Set(["Building", "Checking"]);
let parts = [], summary = {}, factory = null, modDocs = [], openMods = new Set(), touchedMods = false;

function line(r, metaBits, second, cls){
  return `<li class="row s-${esc(r.status)} ${cls||""}"><div class="l1"><span class="g">${esc(r.glyph || "•")}</span>`
    + `<span class="t">${esc(r.short || r.title || r.item)}</span><span class="m">${metaBits.filter(Boolean).map(esc).join(" · ")}</span></div>`
    + (second ? `<div class="l2">${second}</div>` : "") + `</li>`;
}
function liveMeta(r){ return [r.model, mins(r.started) + "m", r.ga]; }
function stuckWords(r){
  const bits = [`${r.tool_calls || 0} steps`, r.stuck];
  if (r.now) bits.push(r.now);
  let s = esc(bits.join(", ").replace(/, (?=[^,]*$)/, " · "));
  const said = String(r.said || "").replace(/[*_`#>]+/g, "").replace(/\s+-\s+/g, " ").trim().split(/(?<=[.!?])\s/)[0];
  if (said) s += `<br>${esc(said.length > 120 ? said.slice(0, 119) + "…" : said)}`;
  return s;
}
function renderParts(){
  const t0 = midnight();
  const rows = parts.filter(r => LIVE.has(r.status) || (r.finished_at || 0) >= t0).sort((a,b) => (a.started || 0) - (b.started || 0));
  const live = rows.filter(r => LIVE.has(r.status));
  const stuck = live.filter(r => r.stuck);
  const work = live.filter(r => !r.stuck && r.status === "Building");
  const check = live.filter(r => !r.stuck && r.status === "Checking");
  $("problems").hidden = !stuck.length; $("np").textContent = stuck.length || "";
  $("plist").innerHTML = stuck.map(r => line(r, liveMeta(r), stuckWords(r), "alarm")).join("");
  $("nw").textContent = work.length;
  $("wlist").innerHTML = work.length ? work.map(r => line(r, liveMeta(r))).join("") : '<li class="empty">Nobody is building right now.</li>';
  $("checking").hidden = !check.length; $("nc").textContent = check.length;
  $("clist").innerHTML = check.map(r => line(r, liveMeta(r))).join("");
  const done = rows.filter(r => !LIVE.has(r.status)).sort((a,b) => (b.finished_at||0) - (a.finished_at||0));
  const pass = done.filter(r => r.receipt && r.receipt.check === "PASS").length;
  const fail = done.filter(r => r.receipt && r.receipt.check === "FAIL").length;
  $("nd").innerHTML = done.length ? `${done.length} · <span class="pass">${pass} PASS</span> · <span class="fail">${fail} FAIL</span>` : "";
  $("dlist").innerHTML = done.length ? done.map(r => {
    const rc = r.receipt || {};
    const chk = rc.check ? `<span class="${rc.check === "PASS" ? "pass" : rc.check === "FAIL" ? "fail" : "weak"}">${esc(rc.check)}</span>` : "no check";
    const meta = [rc.commits != null ? rc.commits + (rc.commits === 1 ? " commit" : " commits") : "", rc.tokens ? tok(rc.tokens) + " tok" : ""];
    const g = r.receipt ? (rc.ok ? "✓" : "✗") : (r.glyph || "■");
    const second = `${chk}${rc.outcome ? " · " + esc(rc.outcome) : r.status === "Ended" ? " · stopped reporting" : ""}`;
    return line(Object.assign({}, r, {glyph: g}), meta, second, rc.ok === false ? "bad" : "");
  }).join("") : '<li class="empty">Nothing finished yet today.</li>';
}
function renderMods(){
  const cut = now() - 7*86400;
  const docs = modDocs.filter(m => (m.last_at || 0) >= cut).sort((a,b) => (a.infra - b.infra) || (b.last_at - a.last_at));
  if (!touchedMods) docs.filter(m => !m.infra).slice(0, 3).forEach(m => openMods.add(m.id));
  const mark = t => t === "✓" ? "ok" : t === "⏸" ? "park" : "open";
  $("mods").innerHTML = docs.length ? docs.map(m => {
    const w = (m.waits || []).join("; ");
    const next = w ? w[0].toUpperCase() + w.slice(1) : m.next ? "Next: " + m.next : "";
    const tally = `${m.closed ? m.closed + "✓ " : ""}${m.open ? m.open + "○ " : ""}${m.parked ? m.parked + "⏸ " : ""}`;
    return `<details class="mod" data-id="${esc(m.id)}"${openMods.has(m.id) ? " open" : ""}><summary><span class="t">${esc(m.name)}</span>`
      + `<span class="m">${esc(tally)}${esc(new Date(m.last_at*1000).toLocaleDateString([], {day:"numeric", month:"short"}))}</span></summary>`
      + `<div class="st"><div>${esc(m.counts)}</div><div>${esc(m.proof)}</div>${next ? `<div class="nx">${esc(next)}</div>` : ""}</div>`
      + `<ul class="tasks">${(m.tasks||[]).map(x => `<li><span class="g ${mark(x.mark)}">${esc(x.mark)}</span><span class="t">${esc(x.title)}</span><span class="m">${esc(x.date)}</span></li>`).join("")}`
      + `${m.more ? `<li class="empty">and ${m.more} more</li>` : ""}</ul></details>`;
  }).join("") : '<p class="empty">No mod work in the last 7 days.</p>';
}
$("mods").addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  touchedMods = true; e.target.open ? openMods.add(id) : openMods.delete(id);
}, true);
function renderHead(){
  $("clock").textContent = hm(now());
  const f = factory;
  if (f){
    $("fac").innerHTML = f.ok ? '<span class="ok">factory ok</span>' : `<span class="bad">factory stopped${f.why ? ": " + esc(f.why) : ""}</span>`;
    $("workers").textContent = f.running == null ? "" : `${f.running}/${f.target ?? "?"} workers`;
    $("tok").textContent = `${tok(f.tokens_today)} tokens today (UTC)`;
  }
  const at = summary.updated || 0;
  if (at){
    const m = Math.round((now() - at)/60);
    $("stamp").textContent = `updated ${m < 1 ? "just now" : m + "m ago"}`;
    $("stamp").classList.toggle("stale", m > 30);  // heartbeat is 20m on a 5m timer: >30m is a dead refresher
  }
  $("headline").textContent = summary.headline || "";
  $("needstext").textContent = summary.needs_you || "Nothing.";
}
function renderFeed(docs){
  const rows = docs.map(d => d.data() || {}).sort((a,b) => (b.at||0) - (a.at||0)).slice(0, 40);
  $("feed").innerHTML = rows.length ? rows.map(r => `<li><time>${hm(r.at)}</time><span>${esc(r.text)}</span></li>`).join("") : '<li class="empty">Nothing yet.</li>';
}
setInterval(() => { renderHead(); renderParts(); }, 30000);

(async () => {
  const db = await claude.use("db");
  if (!db){ $("stamp").textContent = "Sign in to see the live board."; return; }
  const fail = setTimeout(() => { $("stamp").textContent = "Still waiting for data…"; }, 10000);
  db.collection("parts").onSnapshot(s => { clearTimeout(fail); parts = s.docs.map(d => d.data() || {}); renderParts(); },
    () => { $("stamp").textContent = "Could not read the board."; });
  db.collection("mods").onSnapshot(s => { modDocs = s.docs.map(d => d.data() || {}); renderMods(); });
  db.doc("board/summary").onSnapshot(s => { summary = s.exists ? (s.data() || {}) : {}; renderHead(); });
  db.doc("board/factory").onSnapshot(s => { factory = s.exists ? s.data() : null; renderHead(); });
  db.collection("feed").onSnapshot(s => renderFeed(s.docs));
})();
</script>
