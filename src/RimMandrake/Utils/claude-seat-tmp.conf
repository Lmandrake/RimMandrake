# systemd-tmpfiles USER rule for Claude seat temp dirs, 2026-10-08
# (SEAT_MEMORY_CLONES_DRIVES_1). Installed by claude_bounded.sh into
# ~/.config/user-tmpfiles.d/ and run by systemd-tmpfiles-clean.timer (user),
# which that script also enables.
#
# Seats keep TMPDIR / CLAUDE_CODE_TMPDIR in ~/.seat-tmp/<SEAT> on ext4 instead of
# /tmp (tmpfs, charged to the seat as shmem). ext4 is not cleared at boot, so
# entries untouched for 3 days are aged out here. A live seat is never touched:
# every launcher holds a shared flock on its seat dir, and tmpfiles skips a
# locked directory and everything below it (tmpfiles.d(5), "BSD file lock").
d %h/.seat-tmp 0700 - - 3d

# Background-task .output files have no size cap upstream (one session's reached
# 6.2 GB on 10-05), so stale ones are pruned after 2 days EVEN in a live seat:
# this glob names the tasks dirs directly, so the seat-dir lock does not cover it.
# A running task's .output is still being written, so its mtime stays fresh.
e %h/.seat-tmp/*/claude-%U/*/*/tasks - - - 2d
