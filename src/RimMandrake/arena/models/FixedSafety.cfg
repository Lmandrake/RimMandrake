\* The fixed protocol, safety half: every guard on, two owner messages.
\* Expect TypeOK, S1-S6 and L2Bound to hold (9,382,729 distinct states, ~75 s on 10 workers).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Msgs = {m1, m2}
  Bugs = {}
  RC_DROPS_TO_DEAD = FALSE
  MaxGoodbyes = 2
  MaxReloads = 3
  MaxCrashes = 1
  YieldBound = 2
INVARIANTS TypeOK S1 S2 S3 S4 S5 S6 L2Bound
