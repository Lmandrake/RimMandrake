\* The fixed protocol, liveness half: every guard on, one owner message (the two-message
\* graph's liveness check outgrows the seat's memory cap).  Expect L1 and L2 to hold under
\* the spec's weak fairness (768,039 distinct states, ~50 s with a local -metadir).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Msgs = {m1}
  Bugs = {}
  RC_DROPS_TO_DEAD = FALSE
  MaxGoodbyes = 2
  MaxReloads = 3
  MaxCrashes = 1
  YieldBound = 2
PROPERTIES L1 L2
