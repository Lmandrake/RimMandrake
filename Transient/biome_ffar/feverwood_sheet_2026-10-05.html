<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>
</head>

"canon": {"dir": "design/RimStarWars/canon_references/fambaa", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** Deleted: the comic/ink infobox icon (`wookieepedia_infobox.jpg`, `Fambaa.png`, *Alien Archive*) and the Legends pencil-and-wash plate (`wookieepedia_fieldguide.jpg`, *Wildlife of Star Wars*). Every remaining image is the realistic *Phantom Menace* CGI design:\n\n- `wookieepedia_factfile.webp` (`Fambaa-FF47.png`, *Official Star Wars Fact File* 47) \u2014 a single fambaa, three-quarter front view, carrying the shield-generator dish. The clearest anatomy reference.\n- `wookieepedia_shieldgenerator.jpg` (`FambaaShield-SWE.png`) and `wookieepedia_herd.jpg` (`Fambaas-SWE.jpg`, the same render pair on green) \u2014 two fambaas side by side in the Battle of Naboo shield role.\n\nWhat the realistic renders show:\n- **Body**: a broad, heavy, low-slung sauropod/iguana-like quadruped with a deep chest, short thick neck held forward and low, thick pillar legs with heavy wrinkled skin folds at the joints, and a long tapering tail.\n- **Hide**: olive-khaki to greenish-tan, covered in a fine raised pebbly/cobbled scale pattern (like a gila monster or crocodile belly) with darker olive mottling; paler grey-cream underside, throat and inner legs.\n- **Head**: broad, blunt, heavy-browed head with a wide lipless mouth; small fangs at the front of the upper jaw and **a short tusk jutting up from each side of the lower jaw**; a **yellow-amber eye** with a dark pupil (this settles the old yellow-vs-reddish-orange uncertainty \u2014 the reddish-orange eye was only in the deleted pencil plate).\n- **Feet**: broad elephant-like feet with short blunt dark claws.\n- **Tack (military role)**: red-brown leather saddle harness and head bridle carrying shield-generator hardware.\n\n**Where the deleted images disagreed**: the pencil plate showed a muc h a wide, drooping, lipless mouth (open, dark\n  inside) at the bottom and TWO round black eyes stacked vertically on the side of the head (one above\n  the other, per Legends text, confirmed in both images; they sit on a raised, wrinkled brow\n  mound). Wrinkled leathery folds around the mouth and brow.\n- **Legs**: stubby, thick, soft cylindrical leg-stumps in rows under the belly (canon image shows\n  roughly four/five visible per side, short and blob-ended, not jointed); the body hangs low, almost\n  dragging.\n- **Back/colour**: dark teal-green to grey-green flanks and head, with the back a segmented ridge of\n  glossy, translucent BLUE panels (bright cobalt/electric blue in both the render and the film still).\n  Underside and face greener/greyer. (The deleted painted plate showed a far more saturated\n  blue-purple back with lime-green flanks \u2014 do not use that.)\n- **Texture**: smooth, wet, gelatinous, semi-translucent skin with a glossy sheen over the blue back;\n  wrinkles at the face; no hair, no hard shell (the hard mirrored carapace belongs to the adult form,\n  NOT shown in any image).\n- **Prose vs images**: canon prose says \"five pairs of legs\" and \"dark green with blue splotches\";\n  images show dark green with a large contiguous glossy blue segmented back, not scattered\n  splotches. The deleted painted plate added spiky green dorsal ridges on the flanks -- not seen in canon or film; omit them.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both realistic images (`canon_1` Databank CGI, `legends_1` ROTS film still), both showing the larval/mount form, and the canon/Legends text.*\n- [ ] BODY PLAN: a fat, soft caterpillar/grub body, long and low, with a blunt rounded front and no neck, tapering to a smaller rump; rows of short thick soft leg-stumps (not jointed) under a low-hung, almost dragging belly; large enough to carry a mounted armoured humanoid on its back\n- [ ] COLOUR LAYOUT: dark teal/grey-green flanks, head and underside; the back a contiguous segmented ridge of glossy translucent bright cobalt-blue panels, the brightest element\n- [ ] Face: a bulbous front with a wide drooping lipless mouth at the bottom and two round black eyes stacked vertically on the side of a raised, wrinkled brow mound\n- [ ] Smooth, wet, gelatinous, semi-translucent skin with a glossy sheen; no fur and no hard shell (larval form)\n- [ ] Realistic rendering: wet translucent gelatinous skin and natural lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a hard-shelled beetle (that is the adult, shown in no image), not a jointed-legged insect; no spiky green dorsal ridges and no saturated blue-purple back with lime flanks (the deleted painted plat", "ruling": "", "base": "", "imgs": ["img/3c162262297be12804a8.webp", "img/35433b062cf682a630d3.webp"]}, "letters": ["B", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Gelagrub, RSW_Gelagrub", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "feverwood_sheet_2026-10-05", "note": "follow canon precisely"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "feverwood_sheet_2026-10-05", "note": "follow canon precisely"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "see notes from feverwood"}, {"at": "2026-10-09", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": ""}, {"at": "2026-10-09", "verdict": "kee e realistic-labelled files there are food photos and dinner scenes).\n\nThe two candidate images (official realistic renders of the\nanimal itself, not food shots) are internally consistent with each other but\n**disagree sharply with the \"bird\" / \"swamp turkey\" framing in the text**.\nNeither shows anything resembling feathers, a beak, wings, or a\nturkey-like silhouette (canon text nonetheless says nunas could grow blue and red feathers, so absence of feathers in these renders is not a species-wide prohibition). What they actually show is a squat, hunched,\n**toad- or turtle-like amphibian/reptile**: a heavy domed/ridged shell-like\nback rising into a peak, a wide froglike head with a broad flat mouth and\nbulging pink or amber eyes, floppy skin flaps hanging at the sides of the\nhead (read as loose jowls/wattle, not ears), thick bent hind legs ending in\nclawed toed feet, and mottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on either image. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or watt", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both realistic renders and the `## ruling` below (owner ruling 2026-10-08 in the visual brief).*\n- [ ] BODY PLAN: a small, squat, hunched two-legged animal, wider than tall seen head-on; a heavy domed/ridged shell-like back rising to a peak; thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing, drawn with a suggestion of thick bird-like legs (owner ruling 2026-09-14: \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\")\n- [ ] COLOUR LAYOUT: mottled olive-to-dark-green pebbled/warty skin over the whole body; bulging pink or amber eyes the brightest element of the head\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Realistic rendering: natural wet pebbled amphibian skin texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a turkey or other bird (no beak, no wings, no feathered body \u2014 canon allows some blue/red feathers, never a feather coat), not a plain frog (legs read thick and standing, per the 2026-09-14 ruling), not a rounded legless blob", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "base": "", "imgs": ["img/b8fc8a62f6e3d7b1bc49.webp", "img/a502c7cabfbb362a4fa7.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Nuna, RSW_Nuna; artpipe jobs on record: desert_swaca_nuna, pyrelands_nuna_female_v1, pyrelands_nuna_v1, pyrelands_nuna_v2", "rulings": [{"at": "2026-09-14", "verdict": "3", " a3f10c61e21f2b6906316dc82a8beb890e8": "img/a8dd1f199a5b1a7b2e6c.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/convor", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The flat *Galaxy of Creatures* cartoon still (`wookieepedia_cam_disguise.jpg`) was deleted. The only live-action convor found is **Morai**, the convor that follows Ahsoka, in the live-action *Ahsoka* series \u2014 StarWars.com databank still `starwarscom_morai_ahsoka.jpg` (searched: `Images of convorees`, `Images of Morai`, wiki file search, StarWars.com databank `morai` and `convor`; the wiki holds no live-action Morai file). It is a wide shot and the bird is small in frame. The Card Trader infobox render `wookieepedia_convoree_infobox.png` is a stylised animation-era illustration, KEPT only because it is the one image that shows the prehensile tail and plumage up close \u2014 use it for anatomy, not for its big cartoon eyes.\n\nWhat the live-action Morai shows: a **real-looking barn-owl-like bird** \u2014 upright, slim-to-plump owl standing on a rock, a pale heart-shaped white facial disc, pale cream-white breast, soft pale grey-buff back and wings with faint tawny shoulders, long wing tips folded down past the body. It reads as a real owl, not a big-eyed toy.\n\ud83d\udd34 **Live-action and animated versions DISAGREE:** the animated/illustrated convor is a round, plump ball with huge glowing amber eyes and brown/gold mottling; live-action Morai is a natural, proportionate barn-owl with normal-sized dark eyes in a pale facial disc. Follow the realistic proportions (normal owl head-to-body ratio, normal eyes); plumage may range brown/cream/gold (text: gold, green or brown) \u2014 Morai herself is the pale form. The prehensile tail is not visible in the live-action still; keep it from the text and the infobox.\n\n**The current donor sprite (`donor_current_sprite.png`)** shows a brown/cream mottled owl with a visible long ringed prehensile tail \u2014 keep the tail; push the proportions and plumage toward a real owl.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the live-action Morai still (proportions, per the owner's 2026-10-08 realism ruling in the visual brief) and the Card Trader infobox render (anatomy only: the tail), as read by the visual brief.*\n- [ ] BODY PLAN: a small (about 0.2 m), compact, upright owl with real owl proportions \u2014 rounded head with a flat facial disc and short hooked beak, normal-sized eyes (not oversized cartoon eyes), two wings with long folded wing tips reaching down past the body \u2014 plus a long, ringed, prehensile grasping tail\n- [ ] COLOUR LAYOUT: dense, soft owl plumage in brown/cream/gold (text: gold, green or brown), finely mottled, with a paler facial disc and breast; or the pale form (Morai): white heart-shaped facial disc, cream-white breast, pale grey-buff back and wings with faint tawny shoulders; eyes dark\n- [ ] Long, ringed, prehensile tail used for grasping \u2014 not a standard fan-shaped bird tail\n- [ ] Realistic rendering: natural feather texture and lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not a round plush ball with huge glowing amber eyes (the animated convor); not an ordinary owl with a fan tail; not a Kiros bird (no purple/blue feathers)", "ruling": "", "base": "", "imgs": ["img/123ff9bd281626457b96.webp", "img/6a0a625b4bece650def4.webp"]}, "letters": ["A", "F", "G", "B"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Convor, RSW_Convor; artpipe jobs on record: desertportb_convor, leaningscrub_convor_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolve s into a wide, flat, fan-shaped, webbed foot-like paddle** at the base, edged with small claw-like spikes (bright yellow, thin-skinned). The animal balances upright on this tail fan (mating display per the text). Short, stubby, human-like clawed hands on small arms at the chest.\n- **Four wings:** **two large rear wings and two smaller front wings**, all broad, thin, leathery, scalloped and spiky, **with talon-like claws along the outer edges** and large **dark blue concentric eye-spot rings** on a white and pale-blue membrane with yellow rims (`legends_1`). In flight/at rest (`legends_2`) the wings fold as a large yellow, green-veined, spiky-edged diamond or heart shape with the long tail fan trailing. Matches the text: blue and yellow, white underside, talons on the wing edges.\n- **Body and head:** the torso is a smooth, bulging, egg-shaped belly, **pale blue with darker blue dots** (`legends_1`), with a pale cream throat; the body is hairless, with soft bare skin. **The head is small and blue, jowly, with a short curved beak and a red eye**, held up on a short neck.\n- **Colour:** yellow, blue and white. Yellow on the tail fan and wing rims; blue on the belly, head, eye-spots and spots; white or cream on the underside and wing centres. Canon sheets (`canon_1`, `canon_2`) show the same palette in duller form: cream-yellow, pimpled, wormy tail and blue-white wings.\n- **Canon pair:** `canon_1` shows an urusai in a sarlacc's tentacle-and-nest scene, wings narrow and folded, its tail wrapping like a thick pimpled tentacle; `canon_2` shows one clinging head-down to a sarlacc tooth. Their anatomy agrees but is mostly hidden.\n- **Disagreement:** the text (canon) says \"jowly, beaked face with red eyes\", \"fan-shaped tail with spikes and white underside\" and four wings: images agree. The Legends text says females have two wings, males four; the images show four.\n- **Size:** 2 m wingspan, 43 kg (Legends text); no scale object in the images.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the two Legends sheets (the clear views) and the canon text; the canon crops agree but hide most anatomy.*\n- [ ] BODY PLAN: a thin, tubular, hairless body rising upright from a tail that spreads into a flat, fan-shaped, spiked paddle with a white underside; a bulging egg-shaped belly; short stubby clawed hands on small arms at the chest; a small head held up on a short neck\n- [ ] Four broad, leathery, scalloped wings (two larger rear, two smaller front) with talon-like claws along the outer edges\n- [ ] COLOUR LAYOUT: overall yellow, blue and white palette \u2014 yellow on the tail fan and wing rims; wings white or pale blue with large dark blue concentric eye-spot rings and yellow rims; bulging pale-blue belly with darker blue dots and a pale cream throat; white undersides\n- [ ] Small jowly blue head with a short curved beak and red eyes\n- [ ] Smooth bare skin, no feathers, no fur\n- [ ] NEGATIVE: not a bird (no feathers, no two-legged stance, no long beak), not a bat or mynock (not two plain dark wings), not the non-canon Disney Infinity render (blue and tan, two wings, two legs)", "ruling": "**Confirmed 2026-10-09 \u2014 decision taken by question card:** the Must show stands unchanged; **four wings always**, on every sprite; no two-winged female variant.", "base": "", "imgs": ["img/e54e6d177caabf5ca7ef.webp", "img/3aa4bfc7cdc9d0393458.webp", "img/36095342804bea018d3a.webp", "img/ef28c50b6b53c09929d8.webp"]}, "letters": ["B", "D", "E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 1, "donorPurged": true, "noArtWhy": "searched by graphic and by name: RSW_Urusai, Urusai; artpipe jobs on record: desert_swaca_urusai, leaningscrub_urusai_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_20 hed *Alien Archive* illustration (`wookieepedia_alienarchive.jpg`) was deleted 2026-10-08. The target is now\n**`wookieepedia_bf2_render.png`**, the photoreal *Star Wars Battlefront II* (canon, video game) model of the bird in\nflight. `wookieepedia_woswfg_legends.jpg` is a naturalistic Legends painting from *The Wildlife of Star Wars* and\ndisagrees on wing type (below).\n\nFrom the Battlefront II render (realistic):\n- **Plumage**: warm golden-tan to honey-brown feathers over the body and long broad wings, with soft darker brown\n  shading along the feather tracts and paler tips; the coat is fairly even \u2014 **no strong black barring** is visible.\n- **Head and neck**: a bald, blue-grey, vulture-like head and a long thin bare blue-grey neck, held stretched forward\n  in flight; a long slim pale orange-tan beak.\n- **Tail**: a very long, thin, trailing tail streamer of golden feathers, longer than the body.\n- **Silhouette**: a lean, long-necked, long-winged soaring bird, closer to a heron or crane than a stocky raptor.\n- **Disagreement (loud)**: the deleted *Alien Archive* drawing showed heavy dark banding under the wings, a dark belly\n  patch, a hooked red-tipped beak and big blue-grey talons; the realistic render shows none of that banding, a\n  slimmer straighter beak and the legs tucked out of sight. Follow the render.\n- **Legends painting** (`woswfg_legends`): same bald blue-grey head and long neck, but **pterosaur-like membrane\n  wings** in bright orange-yellow and an open toothed beak. It is Legends; use it for head and neck only, never the\n  wings.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of `wookieepedia_bf2_render.png` (the *Battlefront II* render, primary) and the owner's 2026-10-08 realism ruling.*\n- [ ] BODY PLAN: a lean, long-necked, long-winged soaring b   let base = null, shown = false;

    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b8860b;color:#000;padding:10px 14px;font:600 15px sans-serif;display:flex;gap:14px;align-items:center;box-shadow:0 2px 8px #000';

<!-- ══ FILL IN #3 (optional) ════════════════════════════════════════════════════════
     Only if the default row is wrong for your items. The default already handles a
     thumbnail, a consequence line, meta chips and the inferred/contested/absent marks.
<script id="RENDER">
  window.itemBody = it => `<div class="effect">${esc(it.effect)}</div>`;
</script>
-->

<script>
"use strict";

/* ─────────────────────────────────────────────────────────────────────────────────────
   config + items
   ───────────────────────────────────────────────────────────────────────────────────── */
const CFG   = JSON.parse(document.getElementById('CONFIG').textContent);
const ITEMS = JSON.parse(document.getElementById('ITEMS').textContent);
const OPTS  = CFG.options || [];
const OPTBY = Object.fromEntries(OPTS.map(o => [o.key, o]));
const SIDECAR = window.__SIDECAR__ || null;


const el   = id => document.getElementById(id);
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
window.esc = esc;

/* ─────────────────────────────────────────────────────────────────────────────────────
   storage keys are NAMESPACED, and this is not decoration.

   MEASURED: every file:// page shares ONE storage origin. A page in /tmp/a.html read a
   key written by a page in /tmp/b/other.html — origin is literally "file://". So two
   review sheets opened from disk share localStorage AND IndexedDB. An unnamespaced
   'decisions' key means sheet B silently eats sheet A's review, and an unnamespaced
   IndexedDB handle means sheet B auto-writes into sheet A's FILE while reporting "saved".
   ───────────────────────────────────────────────────────────────────────────────────── */
const NS = 'rs:' + (CFG.sheetId || 'unnamed') + ':';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); }
              catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
};

/* ─────────────────────────────────────────────────────────────────────────────────────
   state
   ───────────────────────────────────────────────────────────────────────────────────── */
let DEC = {};                 // id -> {decision, note, prefill, at}
let dirty = new Map();        // id -> decision object, pending flush
const undoStack = [], redoStack = [];
let focusIdx = -1, shown = [], backend = null, frozen = false;

const prefillOf = it => (it.prefill ?? null);
const decOf     = id => DEC[id] || null;
const decisionOf = id => { const d = decOf(id); return d && d.decision ? d.decision : ''; };
const isDecided = id => !!decisionOf(id);
/* A CLEARED row is not a disagreement. {decision:'', prefill:'keep'} means "I unset this",
   so the amber override rail and the "overrides only" filter must both leave it alone —
   serve_sheet.py counts it the same way. */
const isOverride = id => {
  const d = decOf(id); if (!d || !d.decision) return false;
  const pf = d.prefill ?? null;
  return pf !== null && pf !== '' && d.decision !== pf;
};

/* ─────────────────────────────────────────────────────────────────────────────────────
   persistence — three backends, one interface: load() and save(ops).

   The server backend is the good one. It exists because moving the write out of the page
   relocates the rules an agent has to remember (merge per row, keep unknown top-level
   keys, refuse a truncating write, stamp provenance) into plumbing that enforces them.
   ───────────────────────────────────────────────────────────────────────────────────── */
class ServerBackend {
  constructor(cfg) { this.cfg = cfg; this.name = 'sidecar'; this.writes = 0; }
  async load() {
    const r = await fetch('/decisions', { headers: { 'X-Sheet-Token': this.cfg.token } });
    if (!r.ok) throw new Error('GET /decisions ' + r.status);
    const doc = await r.json();
    frozen = doc.frozen === true;
    this.writes = doc.writeCount || 0;
    return doc.decisions || {};
  }
  async save(ops, opts = {}) {
    const r = await fetch('/decisions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Sheet-Token': this.cfg.token },
      body: JSON.stringify(opts.force ? { ops, force: true } : { ops }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.status === 423) { frozen = true; throw new Error('frozen: ' + (body.frozenMeaning || 'read-only')); }
    if (r.status === 409) {
      const e = new Error(body.hint || body.error || 'refused a truncating write');
      /* Only the truncation refusal is forceable. A "decisions is not an object" 409 is a
         corrupt file, and forcing past it would destroy exactly what it is protecting. */
      e.forceable = body.error === 'truncating-write';
      throw e;
    }
    if (!r.ok) throw new Error(body.error || ('POST /decisions ' + r.status));
    this.writes = body.writeCount;
    return body;
  }
  get where() { return this.cfg.decisionsPath || CFG.decisionsFile; }
}

/* Fallback for a sheet opened straight off disk with nothing running. No paste: the
   decisions file already exists next to the sheet, so the human OPENS it rather than
   doing Save-As into a folder the picker will not let us preselect. */
class FileBackend {
  constructor() { this.name = 'file'; this.handle = null; this.writes = 0; }
  static available() { return typeof window.showOpenFilePicker === 'function'; }

  async idb(mode = 'readonly') {
    if (!this._db) this._db = await new Promise((res, rej) => {
      const r = indexedDB.open('review_sheets', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('handles');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db.transaction('handles', mode).objectStore('handles');
  }
  // NB the key is namespaced: see the shared file:// origin note above.
  async remember(h) { const s = await this.idb('readwrite'); s.put(h, NS + 'handle'); }
  async recall() {
    const s = await this.idb();
    return new Promise(res => { const g = s.get(NS + 'handle'); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); });
  }

  async link(handle) {
    // Verify the handle is for THIS sheet's file before writing a byte. A stale or
    // cross-sheet handle that passes silently writes one review into another's file.
    const want = CFG.decisionsFile;
    if (want && handle.name !== want)
      throw new Error(`that file is "${handle.name}", this sheet writes "${want}" — pick the right one`);
    if (await handle.queryPermission({ mode: 'readwrite' }) !== 'granted')
      if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted')
        throw new Error('write permission refused');
    this.handle = handle; await this.remember(handle); return handle;
  }
  async pick() {
    const [h] = await window.showOpenFilePicker({
      id: 'review-sheets',                     // makes the picker reopen in the same folder
      multiple: false,
      types: [{ description: 'Decisions', accept: { 'application/json': ['.json'] } }],
    });
    return this.link(h);
  }
  async load() {
    const h = this.handle || await this.recall();
    if (!h) return null;                        // not linked yet
    if (await h.queryPermission({ mode: 'readwrite' }) !== 'granted') { this.handle = h; return null; }
    this.handle = h;
    const doc = JSON.parse(await (await h.getFile()).text() || '{}');
    frozen = doc.frozen === true; this.doc = doc; this.writes = doc.writeCount || 0;
    return doc.decisions || {};
  }
  async save(ops) {
    if (!this.handle) throw new Error('not linked to a file yet');
    // Read-modify-write, because THIS page is not the only author of its own file: a
    // whole-file writer deletes keys it does not know about (frozen/frozenOn/…).
    const doc = JSON.parse(await (await this.handle.getFile()).text() || '{}');
    /* Judge the freeze on the doc we JUST read, not on a boot-time global: a freeze
       applied while the sheet is open must bite on the next write, not after a reload.
       The freeze is enforced, not announced. */
    if (doc.frozen === true) {
      frozen = true; paintLink();
      throw new Error('frozen: ' + (doc.frozenMeaning || 'the decisions file is read-only'));
    }
    if (frozen) throw new Error('frozen: read-only');
    const merged = Object.assign({}, doc.decisions || {}, ops);
    for (const [k, v] of Object.entries(ops)) if (v === null) delete merged[k];
    doc.decisions = merged;
    doc.savedBy = 'review-sheet-page'; doc.savedAt = new Date().toISOString();
    doc.writeCount = (doc.writeCount || 0) + 1;
    doc.decidedCount = Object.values(doc.decisions).filter(v => v && v.decision).length;
    const w = await this.handle.createWritable();
    await w.write(JSON.stringify(doc, null, 2) + '\n'); await w.close();
    this.writes = doc.writeCount;
    return { writeCount: doc.writeCount, savedAt: doc.savedAt };
  }
  get where() { return this.handle ? this.handle.name : (CFG.decisionsPath || CFG.decisionsFile); }
}

/* Last resort. Loud, because this is the state that once cost a human a 71-row review:
   they finished, the file was byte-identical to the pre-fill, and every choice was in
   localStorage. */
class LocalBackend {
  constructor() { this.name = 'localStorage'; this.writes = 0; }
  async load() { return LS.get('decisions', null); }
  async save(ops) {
    const cur = LS.get('decisions', {}) || {};
    Object.assign(cur, ops);
    for (const [k, v] of Object.entries(ops)) if (v === null) delete cur[k];   // null deletes
    LS.set('decisions', cur);
    this.writes++; return { writeCount: this.writes };
  }
  get where() { return 'browser storage — NOT a file'; }
}

/* ─────────────────────────────────────────────────────────────────────────────────────
   flush: debounced, op-based. Only touched rows are ever sent, so no client bug can
   empty the file — the failure this format was bitten by.
   ───────────────────────────────────────────────────────────────────────────────────── */
let flushTimer = null, saving = false, lastSaved = null, saveErr = null, forceNext = false;
/* Whether the banner currently on screen is one FLUSH put there. Only those get cleared on
   a successful save — a seed or freeze banner is not mine to remove. */
let saveBannerUp = false;
function queue(id) {
  DEC[id].at = new Date().toISOString();
  dirty.set(id, DEC[id]);
  paintLink();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);       // notes are typed per keystroke
}
async function flush() {
  if (saving || !dirty.size || !backend) return;
  const ops = Object.fromEntries(dirty); dirty.clear();
  const force = forceNext; forceNext = false;
  saving = true; saveErr = null; paintLink();
  try {
    const r = await backend.save(ops, { force });
    lastSaved = new Date(); if (r && r.writeCount) backend.writes = r.writeCount;
    /* The write landed — so the refusal on screen is now a LIE. Nothing else clears it:
       paintLink only repaints the pill, and a red "refused…" banner over a disabled
       "clearing…" button left the human staring at a failure that had already succeeded.
       Saved-but-contradicted is worse than not-saved, because he has no reason to look
       again. Only clear it when there is nothing left pending to fail. */
    if (saveBannerUp && !dirty.size) { clearBanner(); saveBannerUp = false; }
  } catch (e) {
    saveErr = e.message || String(e);
    for (const [k, v] of Object.entries(ops)) if (!dirty.has(k)) dirty.set(k, v);   // keep it pending
    // A forced write that fails must say so with a FRESH banner and a live button, not
    // leave the stale one up: showTruncationRefusal/showErr rebuild the node entirely.
    if (e.forceable) showTruncationRefusal(e); else showErr(saveErr);
    saveBannerUp = true;
  } finally { saving = false; paintLink(); if (dirty.size && !saveErr) setTimeout(flush, 300); }
}

/* The truncation guard is right to refuse a batch that clears dozens of decided rows —
   and undoing a bulk action is exactly such a batch when it is legitimate. Without a way
   through, those ops sit pending forever and the screen and the file diverge silently.
   So the page offers the way through as an explicit human act: one button, one click,
   sending force=1 for that batch only. It is never sent automatically. */
function showTruncationRefusal(e) {
  const b = banner('bad',
    esc(e.message || 'refused: this batch clears an implausible number of decided rows.')
    + ` <b>${dirty.size}</b> change(s) are still pending in the page and nothing has been `
    + 'written. If you meant to clear them, say so:',
    '<button class="btn pri" id="forceSave">yes — clear them anyway</button>');
  const btn = b.querySelector('#forceSave');
  if (btn) btn.onclick = () => {
    btn.disabled = true; btn.textContent = 'clearing…';
    forceNext = true; saveErr = null; clearTimeout(flushTimer);
    Promise.resolve(flush()).then(() => {
      /* A success removes this whole banner and a failure rebuilds it, so in both cases
         this node is gone. Still connected means the flush no-opped (a save already in
         flight, nothing pending) — give the human a live button back rather than one
         permanently reading "clearing…". */
      if (btn.isConnected) { btn.disabled = false; btn.textContent = 'yes — clear them anyway'; }
    });
  };
}
addEventListener('beforeunload', e => {
  if (dirty.size) { e.preventDefault(); e.returnValue = 'Unsaved decisions are still pending.'; }
});

/* ─────────────────────────────────────────────────────────────────────────────────────
   decisions
   ───────────────────────────────────────────────────────────────────────────────────── */
function setDecision(id, key, opts = {}) {
  if (frozen) { showErr('This sheet is frozen — decisions are read-only.'); return; }
  const it = byId.get(id); if (!it) return;
  const before = DEC[id] ? JSON.parse(JSON.stringify(DEC[id])) : null;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  if (rec.prefill === undefined) rec.prefill = prefillOf(it);
  rec.decision = (rec.decision === key && opts.toggle) ? '' : key;
  rec.decidedAt = new Date().toISOString();      // a human act: prefilled vs yours is countable
  if (!opts.noUndo) { undoStack.push({ entries: [{ id, before }] }); redoStack.length = 0; }
  queue(id);
  patchRow(id);
  paintCounts();
  /* Deliberately NOT auto-focusing the note here. An earlier version grabbed focus and
     demanded "why?" on every disagreement; it reads as nagging, and a control that fights
     the human gets worked around rather than used. The row still MARKS itself as an
     override (the ⟲ chip and the amber rail in card()), the "overrides only" filter still
     finds them, and `serve_sheet.py --overrides` still reads them as a group — which is
     what section 2b actually asks for, since the reader is the agent, not the human. */
}
function setNote(id, text) {
  if (frozen) return;
  const it = byId.get(id); if (!it) return;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  rec.note = text; queue(id); paintCounts();
}
/* Undo and redo work on ONE entry shape — {entries:[{id, before}]} — whether the action
   touched one row or eighty. An earlier version had a separate batch shape that undo()
   did not understand, so `u` silently did nothing after a bulk apply. Measured, not
   theorised: an irreversible bulk action over 80 rows is one nobody dares use. */
function applyEntries(entries) {
  const inverse = entries.map(({ id }) =>
    ({ id, before: DEC[id] ? JSON.parse(JSON.stringify(DEC[id])) : null }));
  for (const { id, before } of entries) {
    if (before === null) delete DEC[id]; else DEC[id] = before;
    /* null is DELETE in the protocol. Sending an empty stub instead left a row behind that
       reads as "looked at it, decided nothing" — undoing back to a row that was never
       touched must remove the entry, not invent one. */
    dirty.set(id, before === null ? null : DEC[id]);
    patchRow(id);
  }
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400);
  paintCounts(); paintLink();
  return inverse;
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  redoStack.push({ entries: applyEntries(u.entries) });
}
function redo() {
  const r = redoStack.pop(); if (!r) return;
  undoStack.push({ entries: applyEntries(r.entries) });
}
function bulkGroup(group, key) {
  const rows = shown.filter(it => it.group === group);
  if (!rows.length) return;
  const entries = rows.map(it => ({ id: it.id, before: DEC[it.id] ? JSON.parse(JSON.stringify(DEC[it.id])) : null }));
  rows.forEach(it => setDecision(it.id, key, { noUndo: true, bulk: true }));
  undoStack.push({ entries });
  redoStack.length = 0;
  render();
}

/* ─────────────────────────────────────────────────────────────────────────────────────
   render
   ───────────────────────────────────────────────────────────────────────────────────── */
const byId = new Map(ITEMS.map(it => [it.id, it]));
let renderMs = 0;

function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function defaultBody(it) {
  const marks = [];
  if (it.inferred)  marks.push('<span class="mark inferred" title="guessed from the name — the data was empty">⚠ inferred</span>');
  if (it.contested) marks.push('<span class="mark contested" title="defensible both ways">◆ contested</span>');
  if (it.occurs === false) marks.push('<span class="mark absent">does not occur</span>');
  for (const [k, v] of Object.entries(it.meta || {})) marks.push(`<span class="mark absent">${esc(k)}: ${esc(v)}</span>`);
  return `<div class="effect">${esc(it.effect || '')}</div>`
       + (marks.length ? `<div class="marks">${marks.join('')}</div>` : '');
}

function card(it) {
  const d = decOf(it.id), key = d && d.decision ? d.decision : '';
  const o = OPTBY[key];
  const ovr = isOverride(it.id);
  const body = (window.itemBody || defaultBody)(it);
  const thumb = it.thumb
    ? `<div class="thumb" data-zoom="${esc(it.thumb)}" data-cap="${esc(it.label || it.id)}"><img src="${esc(it.thumb)}" loading="lazy" decoding="async" alt=""></div>`
    : '';
  /* window.itemOptions(it) -> option list for THIS row (default: all). A sheet whose options
     differ per row (column letters) shows only the ones that row has. */
  const rowOpts = (window.itemOptions && window.itemOptions(it)) || OPTS;
  const opts = rowOpts.map(op => `<button data-set="${esc(op.key)}" class="${op.key === key ? 'sel' : ''}"`
      + `${op.key === key ? ` style="background:${esc(op.color)}"` : ''}`
      + ` title="${esc(op.label)} (${esc(op.hotkey || '')})">${esc(op.label)}</button>`).join('');
  return `<div class="row${ovr ? ' override' : ''}" data-id="${esc(it.id)}"${o ? ` style="color:${esc(o.color)}"` : ''}>
    ${thumb}
    <div class="main">
      <div class="label">${esc(it.label || it.id)}<span class="id">${esc(it.id)}</span>
        ${ovr ? `<span class="mark ovr" title="you overruled the pre-fill, which said ${esc(d.prefill)}">⟲ was ${esc(d.prefill)}</span>` : ''}</div>
      ${body}
    </div>
    <div class="ctrl">
      <div class="opts">${opts}</div>
      <textarea class="note" rows="1" placeholder="note…">${esc(d ? d.note || '' : '')}</textarea>
    </div>
  </div>`;
}

function passes(it) {
  const q = el('q').value.trim().toLowerCase();
  if (q) {
    const hay = `${it.id} ${it.label || ''} ${it.effect || ''} ${it.group || ''}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const fs = el('fstate').value;
  if (fs === '__undecided' && isDecided(it.id)) return false;
  if (fs === '__decided' && !isDecided(it.id)) return false;
  if (fs && fs.startsWith('k:') && decisionOf(it.id) !== fs.slice(2)) return false;
  const fg = el('fgroup').value;
  if (fg && it.group !== fg) return false;
  const fm = el('fmark').value;
  if (fm === 'override' && !isOverride(it.id)) return false;
  if (fm === 'contested' && !it.contested) return false;
  if (fm === 'inferred' && !it.inferred) return false;
  if (fm === 'noted' && !String((decOf(it.id) || {}).note || '').trim()) return false;
  return true;
}

function render() {
  const t0 = performance.now();
  shown = ITEMS.filter(passes);
  const groups = new Map();
  for (const it of shown) { if (!groups.has(it.group)) groups.set(it.group, []); groups.get(it.group).push(it); }
  let html = '';
  for (const [name, items] of groups) {
    /* an option with bulk:false gets no "all X" button (e.g. per-row column letters, where
       the same key means a different picture on every row) */
    const bulk = OPTS.filter(op => op.bulk !== false).map(op => `<button class="btn" data-bulk="${esc(op.key)}" data-group="${esc(name)}">all ${esc(op.label.toLowerCase())}</button>`).join('');
    /* de-stick groups of <=3: a sticky label sits on top of the only row in a group of
       one, which makes it unreadable and unclickable. */
    html += `<div class="gh${items.length <= 3 ? ' nostick' : ''}">${esc(name)}`
          + `<span class="ghcount">${items.length}</span><span class="ghbulk">${bulk}</span></div>`;
    html += items.map(card).join('');
  }
  el('list').innerHTML = html || `<div style="padding:40px 18px;color:var(--dim)">Nothing matches these filters.</div>`;
  for (const ta of el('list').querySelectorAll('.note')) if (ta.value) grow(ta);
  renderMs = performance.now() - t0;
  measure();                                  // new .gh nodes have no top yet
  paintCounts();
  if (focusIdx >= shown.length) focusIdx = shown.length - 1;
  paintFocus(false);
}

/* patch ONE row instead of re-rendering the list: at 600 rows a full innerHTML rebuild
   on every keystroke drops the caret out of the note field and feels broken. */
function patchRow(id) {
  const node = document.querySelector(`.row[data-id="${cssEsc(id)}"]`);
  if (!node) return;
  const it = byId.get(id), d = decOf(id), key = d && d.decision ? d.decision : '';
  const o = OPTBY[key];
  node.style.color = o ? o.color : '';
  node.classList.toggle('override', isOverride(id));
  for (const b of node.querySelectorAll('[data-set]')) {
    const on = b.dataset.set === key;
    b.classList.toggle('sel', on);
    b.style.background = on ? OPTBY[b.dataset.set].color : '';
  }
  const lab = node.querySelector('.label .mark.ovr');
  if (isOverride(id) && !lab) node.querySelector('.label').insertAdjacentHTML('beforeend',
    `<span class="mark ovr">⟲ was ${esc(d.prefill)}</span>`);
  if (!isOverride(id) && lab) lab.remove();
}

/* ── measured header height, every render and every resize ───────────────────────────── */
function measure() {
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
  for (const g of document.querySelectorAll('.gh')) g.style.top = h + 'px';
}
addEventListener('resize', measure);

/* ─────────────────────────────────────────────────────────────────────────────────────
   counts, link state, banners
   ───────────────────────────────────────────────────────────────────────────────────── */
function paintCounts() {
  const total = ITEMS.length;
  let decided = 0, ovr = 0, noted = 0, contested = 0, yours = 0;
  const per = {};
  for (const it of ITEMS) {
    const k = decisionOf(it.id);
    if (k) { decided++; per[k] = (per[k] || 0) + 1;
      const d = decOf(it.id);
      if (d.decidedAt || isOverride(it.id) || prefillOf(it) == null) yours++; }
    if (isOverride(it.id)) ovr++;
    if (String((decOf(it.id) || {}).note || '').trim()) noted++;
    if (it.contested && !isDecided(it.id)) contested++;
  }
  const inn = OPTS.filter(o => o.counts === 'in').reduce((n, o) => n + (per[o.key] || 0), 0);
  const out = OPTS.filter(o => o.counts === 'out').reduce((n, o) => n + (per[o.key] || 0), 0);
  el('progress').innerHTML =
    `<b>${yours}</b>/${total} decided by you`
    + (decided - yours ? ` · <b>${decided - yours}</b> still the agent's prefill` : '')
    + ` · <b>${total - decided}</b> empty`
    + (OPTS.some(o => o.counts) ? ` · ${inn} in · ${out} stripped` : '')
    + ` · ${ovr} overruled · ${noted} noted`
    + (shown.length !== total ? ` · showing ${shown.length}` : '')
    + ` · render ${renderMs.toFixed(0)}ms`;
  paintPosture(inn, out, total - decided);
}

function paintPosture(inn, out, undecided) {
  const p = CFG.posture || {};
  const strip = p.mode === 'whitelist';
  el('posturePanel').innerHTML =
    `<h3>Posture — ${esc((p.mode || 'whitelist').toUpperCase())}</h3>`
    + `<div>${esc(p.explain || (strip
        ? 'Default is EXCLUDE. Anything not kept will be stripped.'
        : 'Default is INCLUDE. Only what you cut will be stripped.'))}</div>`
    + `<div style="margin-top:5px"><b style="color:var(--ok)">${inn}</b> kept · `
    + `<b style="color:var(--bad)">${out}</b> stripped`
    + (strip && undecided ? ` · <b style="color:var(--warn)">${undecided} undecided, which this posture also strips</b>` : '')
    + `</div>`;
}

function paintLink() {
  const p = el('link');
  const n = dirty.size;
  let cls = 'pill live', txt;
  if (!backend) { txt = 'connecting…'; cls = 'pill'; }
  else if (frozen) { txt = '🔒 frozen — read only'; cls = 'pill'; }
  else if (saveErr) { txt = '⚠ not saved — ' + saveErr.slice(0, 60); cls = 'pill bad'; }
  else if (saving) txt = '↑ saving…';
  else if (n) txt = `● ${n} pending`;
  else if (backend.name === 'localStorage') { txt = '⚠ browser storage only — NOT a file'; cls = 'pill bad'; }
  else if (backend.name === 'file' && !backend.handle) { txt = '○ not linked — click “link file”'; cls = 'pill bad'; }
  else txt = `● ${backend.name} · saved${lastSaved ? ' ' + ago(lastSaved) : ''} · ${backend.writes} write${backend.writes === 1 ? '' : 's'}`;
  p.className = cls; p.textContent = txt; p.title = backend ? backend.where : '';
  /* The copy-JSON escape hatch is shown exactly while the work is NOT in a file, and it
     disappears the moment a link is established. */
  const unlinked = !!backend && (backend.name === 'localStorage'
                                 || (backend.name === 'file' && !backend.handle));
  el('exportbar').classList.toggle('hide', !unlinked);
  if (!unlinked) el('exportTa').classList.add('hide');
}
const ago = d => { const s = Math.round((Date.now() - d) / 1000);
  return s < 2 ? 'just now' : s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; };
setInterval(() => { if (!dirty.size && !saving) paintLink(); }, 5000);

/* Banners share one node, so every writer must set its OWN class. The seed banner used to
   leave 'banner warn' behind and every later error — save failed, frozen, 409 — rendered
   amber for the rest of the session. Colour is the only thing that says "this one matters". */
function banner(cls, html, extra = '') {
  const b = el('err');
  b.className = 'banner ' + cls;
  b.classList.remove('hide');
  b.innerHTML = html + ' ' + extra
    + ' <button class="btn" onclick="this.parentNode.classList.add(\'hide\')">dismiss</button>';
  return b;
}
function showErr(msg, extra = '') { banner('bad', esc(msg), extra); }
/* Take the banner down and empty it. Emptying matters as much as hiding: a stale node
   left in the DOM comes back with the next classList toggle still carrying old text and
   a disabled button. */
function clearBanner() {
  const b = el('err');
  b.classList.add('hide');
  b.className = 'banner bad hide';
  b.innerHTML = '';
}


/* ─────────────────────────────────────────────────────────────────────────────────────
   PACK: keyboard. Mouse-only across 600 rows is the real bottleneck.
   ───────────────────────────────────────────────────────────────────────────────────── */
const KEYMAP = [
  ['j / ↓', 'next row'], ['k / ↑', 'previous row'],
  ['1 … 9', 'set the decision for the focused row'],
  ['⇧ + 1…9', 'apply to the whole visible group'],
  ['n', 'jump into the note'], ['Enter', 'leave the note'],
  ['u / ⇧U', 'undo / redo — bulk actions undo as one'],
  ['g', 'next undecided row'], ['c', 'next contested row'],
  ['/', 'search'], ['v', 'list / grid'],
  ['z', 'zoom the focused thumbnail'], ['?', 'this help'],
];
function paintKeys() {
  el('keysBody').innerHTML = KEYMAP.map(([k, d]) =>
    `<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(d)}</td></tr>`).join('')
    + OPTS.map(o => `<tr><td><kbd>${esc(o.hotkey)}</kbd></td><td>= ${esc(o.label)}</td></tr>`).join('');
}
function focusRow(i, scroll = true) {
  if (!shown.length) return;
  focusIdx = Math.max(0, Math.min(shown.length - 1, i));
  paintFocus(scroll);
}
function paintFocus(scroll) {
  for (const r of document.querySelectorAll('.row.focus')) r.classList.remove('focus');
  const it = shown[focusIdx]; if (!it) return;
  const node = document.querySelector(`.row[data-id="${cssEsc(it.id)}"]`);
  if (!node) return;
  node.classList.add('focus');
  if (scroll) {
    const top = node.getBoundingClientRect().top;
    const hh = document.querySelector('header').offsetHeight + 34;   // clear the sticky group label
    if (top < hh || top > innerHeight - 90)
      scrollBy({ top: top - hh - 8, behavior: 'instant' });
  }
}
function jumpTo(pred, from = focusIdx) {
  for (let n = 1; n <= shown.length; n++) {
    const i = (from + n + shown.length) % shown.length;
    if (pred(shown[i])) { focusRow(i); return true; }
  }
  return false;
}

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (typing) { document.activeElement.blur(); return; }
    el('keys').classList.remove('on'); el('zoom').classList.remove('on');
    return;
  }
  if (typing) {
    if (e.key === 'Enter' && document.activeElement.classList.contains('note')) {
      e.preventDefault(); document.activeElement.blur();
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;

  if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); focusRow(focusIdx + 1); return; }
  if (k === 'k' || k === 'ArrowUp')   { e.preventDefault(); focusRow(focusIdx - 1); return; }
  if (k === '/') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (k === '?') { el('keys').classList.toggle('on'); return; }
  if (k === 'u') { undo(); return; }
  if (k === 'U') { redo(); return; }
  if (k === 'g') { if (!jumpTo(it => !isDecided(it.id))) showErr('No undecided rows in view.'); return; }
  if (k === 'c') { if (!jumpTo(it => it.contested)) showErr('No contested rows in view.'); return; }
  if (k === 'v' && CFG.media) { toggleGrid(); return; }
  if (k === 'n') { const it = shown[focusIdx]; if (it) {
      const n = document.querySelector(`.row[data-id="${cssEsc(it.id)}"] .note`); if (n) { e.preventDefault(); n.focus(); } }
    return; }
  if (k === 'z') { const it = shown[focusIdx]; if (it && it.thumb) openZoom(it.thumb, it.label || it.id); return; }

  const op = OPTS.find(o => o.hotkey === k);
  if (op) {
    const it = shown[focusIdx >= 0 ? focusIdx : 0]; if (!it) return;
    e.preventDefault();
    if (focusIdx < 0) focusRow(0);
    setDecision(it.id, op.key);
    focusRow(focusIdx + 1);                     // advance, so triage is one key per row
    return;
  }
  const shifted = OPTS.find(o => o.hotkey && '!@#$%^&*('['123456789'.indexOf(o.hotkey)] === k);
  if (shifted) { const it = shown[focusIdx]; if (it) { e.preventDefault(); bulkGroup(it.group, shifted.key); } }
});

/* ─────────────────────────────────────────────────────────────────────────────────────
   PACK: grid / contact sheet
   ───────────────────────────────────────────────────────────────────────────────────── */
function toggleGrid() {
  const on = !document.body.classList.contains('grid');
  document.body.classList.toggle('grid', on);
  el('btnGrid').classList.toggle('on', on);
  el('btnGrid').textContent = on ? 'list' : 'grid';
  el('cell').classList.toggle('hide', !on);
  LS.set('grid', on); measure(); paintFocus(false);
}
function openZoom(src, cap) {
  el('zimg').src = src; el('zcap').textContent = cap; el('zoom').classList.add('on');
}
el('zoom').onclick = () => el('zoom').classList.remove('on');

/* ─────────────────────────────────────────────────────────────────────────────────────
   wiring
   ───────────────────────────────────────────────────────────────────────────────────── */
el('list').addEventListener('click', e => {
  const set = e.target.closest('[data-set]');
  if (set) { const row = set.closest('.row'); setDecision(row.dataset.id, set.dataset.set, { toggle: true });
             focusIdx = shown.findIndex(it => it.id === row.dataset.id); paintFocus(false); return; }
  const bulk = e.target.closest('[data-bulk]');
  if (bulk) { bulkGroup(bulk.dataset.group, bulk.dataset.bulk); return; }
  const th = e.target.closest('[data-zoom]');
  if (th) { openZoom(th.dataset.zoom, th.dataset.cap); return; }
  const row = e.target.closest('.row');
  if (row) { focusIdx = shown.findIndex(it => it.id === row.dataset.id); paintFocus(false); }
});
el('list').addEventListener('input', e => {
  if (e.target.classList.contains('note')) {
    setNote(e.target.closest('.row').dataset.id, e.target.value);
    grow(e.target);
  }
});
/* Notes auto-grow. A one-line box that hides what the human just wrote makes the most
   valuable field on the row look like the least important one. */
function grow(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
}

for (const id of ['q', 'fstate', 'fgroup', 'fmark'])
  el(id).addEventListener(id === 'q' ? 'input' : 'change', () => { render(); LS.set('filters', filtersNow()); });
const filtersNow = () => ({ q: el('q').value, s: el('fstate').value, g: el('fgroup').value, m: el('fmark').value });

el('fold').onclick = () => { autofoldArmed = false; setFold(!document.body.classList.contains('folded')); };
function setFold(f) {
  document.body.classList.toggle('folded', f);
  el('fold').textContent = f ? '▸ brief' : '▾ brief';
  LS.set('folded', f);
  measure();                                    // the header just changed height
}

/* The brief has two jobs that fight each other: it must be SEEN — it carries the posture
   and any rule the agent invented, and burying those is the most expensive mistake this
   format makes — and it must not sit in front of the rows the human came to work on.
   Bounding its height stops the worst case. Auto-folding on the FIRST real scroll
   resolves the rest: they see it, then the moment they start working it gets out of the
   way, and the fold is remembered from then on. One click brings it back. */
let autofoldArmed = false;
function armAutofold(neverChosen) {
  if (!neverChosen) return;                     // they have folded or unfolded before: respect it
  autofoldArmed = true;
  addEventListener('scroll', onFirstScroll, { passive: true });
}
function onFirstScroll() {
  if (!autofoldArmed || scrollY < 220) return;
  autofoldArmed = false;
  removeEventListener('scroll', onFirstScroll);
  setFold(true);
  el('fold').classList.add('flash');            // say where it went
  setTimeout(() => el('fold').classList.remove('flash'), 2400);
}
el('nextUndecided').onclick = () => { if (!jumpTo(it => !isDecided(it.id), focusIdx)) showErr('No undecided rows in view.'); };
el('btnKeys').onclick = () => el('keys').classList.toggle('on');
el('btnGrid').onclick = toggleGrid;
el('cell').oninput = e => { document.documentElement.style.setProperty('--cell', e.target.value + 'px'); measure(); };

/* ── copy JSON: the export route when the work is NOT in a file ───────────────────────
   The whole decisions doc, on the clipboard, in the shape the file wants — so a session
   that never reached disk can be recovered by pasting rather than retyped or lost. */
function decisionsDoc() {
  return JSON.stringify({
    sheetId: CFG.sheetId || 'unnamed',
    posture: (CFG.posture || {}).mode || '',
    criterion: CFG.criterion || '',
    exportedBy: 'review-sheet-page',        // NOT savedBy: this is a copy, not a save
    exportedAt: new Date().toISOString(),
    decidedCount: Object.values(DEC).filter(v => v && v.decision).length,
    decisions: DEC,
  }, null, 2) + '\n';
}
async function copyDecisions(btn) {
  const text = decisionsDoc(), ta = el('exportTa'), why = el('copywhy');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    // Show the JSON rather than fail quietly: the clipboard API is refused on some
    // file:// pages, and a copy button that does nothing is how a review gets lost.
    ta.classList.remove('hide'); ta.value = text; ta.focus(); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    why.textContent = ok
      ? 'copied — and shown below so you can check it landed'
      : 'the clipboard is blocked here — the JSON is below: select all (Ctrl/⌘+A), copy, '
        + 'and paste it over the decisions .json';
  }
  btn.textContent = ok ? 'copied ✓' : 'copy it below ↓';
  setTimeout(() => { btn.textContent = 'copy JSON'; }, 2500);
}
el('copyJson').onclick = () => copyDecisions(el('copyJson'));

for (const b of document.querySelectorAll('[data-copy]'))
  b.onclick = () => copyText(el(b.dataset.copy).textContent, b);
async function copyText(text, btn) {
  const label = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'copied ✓'; }
  catch (e) {                                   /* refused on some file:// pages */
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); btn.textContent = 'copied ✓'; }
    catch (e2) { btn.textContent = 'press ⌘/Ctrl+C'; }
    ta.remove();
  }
  setTimeout(() => btn.textContent = label, 1400);
}

/* ─────────────────────────────────────────────────────────────────────────────────────
   boot
   ───────────────────────────────────────────────────────────────────────────────────── */
async function boot() {
  el('title').textContent = CFG.title || 'Review sheet';
  el('subtitle').textContent = CFG.subtitle || '';
  document.title = CFG.title || 'Review sheet';
  el('briefBody').innerHTML = (CFG.briefHtml || '')
    + (CFG.criterion ? `<div class="crit">Ranked by: ${esc(CFG.criterion)}</div>` : '');

  /* Any rule the agent INVENTED goes in its own panel, stated plainly. An invented premise
     presented as a finding is the most expensive mistake this format makes. */
  if ((CFG.invented || []).length) {
    el('inventedPanel').classList.remove('hide');
    el('inventedPanel').innerHTML = '<h3>⚠ Rules I invented — overrule these</h3><ul style="margin:4px 0 0 16px;padding:0">'
      + CFG.invented.map(s => `<li>${esc(s)}</li>`).join('') + '</ul>';
  }

  el('fstate').innerHTML = `<option value="">any state</option><option value="__undecided">undecided</option>`
    + `<option value="__decided">decided</option>`
    + OPTS.map(o => `<option value="k:${esc(o.key)}">= ${esc(o.label)}</option>`).join('');
  const groups = [...new Set(ITEMS.map(it => it.group))].sort();
  el('fgroup').innerHTML = `<option value="">all ${esc(CFG.groupLabel || 'group')}s (${groups.length})</option>`
    + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  paintKeys();
  document.body.classList.add('perf');
  if (CFG.media) el('btnGrid').classList.remove('hide');

  const f = LS.get('filters', null);
  if (f) { el('q').value = f.q || ''; el('fstate').value = f.s || ''; el('fgroup').value = f.g || ''; el('fmark').value = f.m || ''; }
  const foldChoice = LS.get('folded', null);    // read BEFORE setFold writes it
  setFold(foldChoice === true);
  armAutofold(foldChoice === null);

  /* pick a backend */
  let loaded = null;
  if (SIDECAR && SIDECAR.mode === 'server') {
    backend = new ServerBackend(SIDECAR);
    el('dpath').textContent = SIDECAR.decisionsPath;
    el('spath').textContent = SIDECAR.sheetPath;
    el('pathwhy').textContent = 'the sidecar owns this file — nothing to copy or paste';
    el('pathbar').classList.remove('hide'); el('spathbar').classList.remove('hide');
    try { loaded = await backend.load(); }
    catch (e) { showErr('Could not read the decisions file: ' + e.message); }
  } else if (FileBackend.available()) {
    backend = new FileBackend();
    el('pathbar').classList.remove('hide');
    el('dpath').textContent = CFG.decisionsPath || CFG.decisionsFile;
    el('pathwhy').innerHTML = 'no sidecar running — <button class="btn pri" id="linkBtn">link file</button> '
      + 'or drag it onto this page';
    el('spathbar').classList.toggle('hide', !CFG.sheetPath);
    el('spath').textContent = CFG.sheetPath || '';
    setTimeout(() => { const b = el('linkBtn'); if (b) b.onclick = async () => {
      try { await backend.pick(); const d = await backend.load(); if (d) { DEC = d; render(); } paintLink(); }
      catch (e) { showErr(e.message); } }; }, 0);
    try { loaded = await backend.load(); } catch (e) { loaded = null; }
    if (loaded === null) showErr('Not linked to a file yet — decisions are being held in the browser only. '
      + 'Click “link file” (or drag the decisions .json onto this page) before you start. '
      + 'Whatever you have already done can be lifted out with “copy JSON” in the brief above.');
  } else {
    backend = new LocalBackend();
    loaded = await backend.load();
    showErr('This browser cannot write files (no File System Access API) and no sidecar is running. '
      + 'Work is held in browser storage only — run serve_sheet.py, or use “copy JSON” in the '
      + 'brief above to lift it out and paste it over the decisions .json.');
  }

  /* Seed. Only rows the loaded file says NOTHING about take the pre-fill. Seeding
     all-or-nothing is how 350 pre-filled rows once vanished because two rows had been
     clicked — and the mirror-image bug is just as bad: ANY record for a row, including
     one whose decision is '', is a human act. CLEARING a row is a decision, so re-seeding
     over it puts a choice on the screen that the file does not hold, and under whitelist
     posture the row is stripped while the sheet says it is kept. */
  let seeded = 0, kept = 0, cleared = 0;
  DEC = loaded && typeof loaded === 'object' ? loaded : {};
  for (const it of ITEMS) {
    const rec = Object.prototype.hasOwnProperty.call(DEC, it.id) ? DEC[it.id] : undefined;
    if (rec != null) { if (rec.decision) kept++; else cleared++; continue; }
    if (prefillOf(it) != null) {
      DEC[it.id] = { decision: prefillOf(it), prefill: prefillOf(it), note: '' };
      seeded++;
    }
  }
  if (seeded && (kept || cleared)) {
    banner('warn', `Filled in <b>${seeded}</b> rows from the pre-fill and left your existing `
      + `entries untouched — <b>${kept}</b> decided`
      + (cleared ? `, <b>${cleared}</b> deliberately cleared` : '') + '.');
  }

  /* drag the decisions file onto the page — no picker at all (Chromium) */
  if (backend instanceof FileBackend) {
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', async e => {
      e.preventDefault();
      const item = e.dataTransfer.items && e.dataTransfer.items[0];
      if (!item || !item.getAsFileSystemHandle) return;
      try { const h = await item.getAsFileSystemHandle();
        if (h.kind !== 'file') return showErr('Drop the decisions .json, not a folder.');
        await backend.link(h); const d = await backend.load(); if (d) { DEC = d; render(); }
        paintLink(); el('err').classList.add('hide');
      } catch (err) { showErr(err.message); }
    });
  }

  if (LS.get('grid', false) && CFG.media) toggleGrid();
  render();
  paintLink();
  if (frozen) showErr('This sheet is FROZEN. The decisions file is the source of truth and is read-only.');
}
boot();
</script>
</body>
</html>
