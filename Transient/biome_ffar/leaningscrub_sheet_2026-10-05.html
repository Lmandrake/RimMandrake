<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

" eye-color citation more than \"Blue\").\n  Note wookieepedia_infobox.jpg is a hand-painted/illustrated concept-style\n  piece (possibly a bestiary-book plate) rather than a film/show frame \u2014 treat\n  its exact palette as one artist's interpretation, though it agrees closely\n  with the separate wookieepedia_bestiary.jpg painting on stripe pattern, ear\n  shape, and mane.\n- **Sloped hyena posture**: front legs visibly longer/more developed than hind\n  legs in all three images, confirming the \"smaller hind legs\" text detail.\n- **Prominent lower jaw and tusk**, visible fangs, in all three.\n\nwookieepedia_citadel.jpg (the in-show CGI frame, a pair of \"dark anoobas\" from\nthe Citadel) is the darkest/most desaturated of the three \u2014 near-black in low\npurple lighting \u2014 but even here the dorsal mane spikes, ear shape, and tail\nare consistent with the other two images. This is plausibly the \"black\"\ncolor-cite individual type rather than contradicting the gray/blue-gray\nmajority.\n\n**donor_current_sprite.png is weak evidence**: it is the ONLY anooba art\npresent on disk in this repo's SWBestiary mod, and it is a Dessicated\n(corpse) variant only \u2014 there is no live/default sprite for RSW_Anooba on\ndisk at all right now. A desiccated corpse pose cannot show fur color, stripe\npattern, ear shape, or live posture reliably, so it should not be used to\nvalidate or invalidate any of t", "must": "- [ ] Large, erect, pointed ears with pink/red-toned interior skin\n- [ ] Spiky dorsal mane/ridge of longer fur running from the skull down the spine\n- [ ] Tiger-like dark stripes over a blue-grey to grey coat \u2014 not a flat solid gray\n- [ ] Long, thin, low-carried or curled tail, not a canine brush tail\n- [ ] Front legs visibly longer/more developed than the hind legs (sloped hyena stance)\n- [ ] Prominent lower jaw with visible fangs (chin tusk present on larger individuals)", "ruling": "", "base": "", "imgs": ["img/b66603f45454cf05f12b.webp", "i ghtly-spiraled than every\nreference image, the body reads as a flat solid mass with no shag/fur texture\nor chin-beard fringe, and the overall proportions are boxier/more compact\nthan the real animal's heavy-set but clearly leonine-maned silhouette. A\nregen should exaggerate the horn spiral and add visible shaggy fur texture,\nespecially the hanging beard under the chin.", "must": "- [ ] Heavyset, shaggy, long-haired quadruped body\n- [ ] Pair of large, tightly-curled, ram-like spiraling horns\n- [ ] Hanging beard-like fringe of fur at the chin/chest\n- [ ] A very wide, flat, slit-like mouth running nearly the full width of the muzzle below a broad flat nose (as in `wookieepedia_infobox.jpg`)\n- [ ] Body coat dark brown to near-black\n- [ ] Horns pale ivory/tan/cream, contrasting against the dark coat\n- [ ] Fully fur-covered body with no bare skin visible", "ruling": "**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Bantha/BanthaW`:\n\n> \"Look at the canon library and regen to modern standards. Criteria: it MUST have that very wide-slit mouth as shown in the canon imagery.\"\n\nOn `swanimals/Bantha/BanthaW_j`:\n\n> \"Female short-horn version of above\"", "base": "", "imgs": ["img/30732e15cc290ec428aa.webp", "img/f0cd9d82f278c3505128.webp", "img/550521e9c92a1d892bdc.webp"]}, "letters": ["A", "B", "C", "E", "F", "G", "H", "I"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Bantha, RSW_Bantha; artpipe jobs on record: desert_swaca_bantha, doubles_redo_bantha_w_v1, doubles_redo_bantha_wj_v1, longshade_rsw_bantha_v1, longshade_rsw_bantha_v2, longshade_rsw_bantha_v3, longshade_rsw_bantha_v4", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our ow e4e8951ed9ee09c1d94767fef2": "img/158c89d1666a22a18891.webp", "8cf86dfb280e6cdd4f420ae754530bb3c1b87a3642ff562317ca3ae73083105e": "img/8cf86dfb280e6cdd4f42.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/cannok", "brief": "Three images agree closely and reinforce each other \u2014 this is a\nwell-corroborated design across very different art styles (game concept art,\nin-game 3D render, and a comic panel):\n- **Squat, bloated, toad-like body** posture confirmed in both the KOTOR2\n  concept sketch and the in-game render.\n- **Color**: dull tan/khaki/olive-yellow-green mottled hide on the back and\n  flanks, consistently **paler/whitish on the belly/underside** \u2014 visible in\n  both the concept art and the in-game render. Matches \"mottled yellow-green\"\n  closely.\n- **Spiked dorsal ridge**: a fan/row of thin pointed spines running from the\n  crown of the head down the back \u2014 present in all three images, most\n  dramatic in the concept art (long thin quills radiating off the skull) and\n  the in-game render (shorter spikes continuing down a segmented back plus\n  a spiked tail tip).\n- **Eyes**: the concept art shows a single large deep-socketed eye (not\n  obviously stalked); the in-game render clearly shows **two eyes on\n  short stalks that can be read independently** \u2014 matching the \"bulging\n  eyestalks\" text description more precisely than the concept art does.\n- **Mouth**: both the concept art and in-game render show a wide,\n  low-slung jaw lined with many small sharp teeth, matching the toothy-mouth\n  description.\n- **Legs/feet**: thick, stocky legs ending in clawed toes are visible in the\n  in-game render; the \"4 tridactyl feet\" detail is a bit harder to confirm\n  precisely at this resolution but is consistent with what's visible.\n- The comic panel (*Tales of the Jedi*, first appearance) only shows a\n  cropped close-up of a toothy tan head with the same spike-fringe and\n  needle teeth \u2014 consistent with, not contradicting, the other two.\n\nOverall this is a strongly consistent design across sources: squat toad/frog-\nlike quadruped, mottled tan-olive hide, pale belly, fringe of dorsal spines,\nwide toothy mouth, stalked eyes.\n\n**The current donor sprite** (`donor_current_sprite.png`) is a strong match:\nolive-tan mottled body, spiked dorsal ridge/fringe, wide fanged mouth, and\npebbled belly texture. One difference worth noting: the donor sprite draws a\nsingle large amber eye rather than the two independently-moving stalked eyes\nthe in-game KOTOR2 render and the source text both call for \u2014 a regen should\nadd the stalked-eye detail rather than a single flat eye.", "must": "- [ ] Squat, bloated, toad-like quadruped body\n- [ ] Mottled tan/khaki/olive-yellow-green hide on the back and flanks, paler/whitish on\n  the belly\n- [ ] Fringe of thin pointed spines running from the crown of the head down the back\n- [ ] Wide, low-slung jaw lined with many small sharp teeth\n- [ ] Two eyes on short stalks that read independently, not a single flat eye", "ruling": "", "base": "", "imgs": ["img/1f08ad8103f7432a4c53.webp", "img/37e887c545e609ae995c.webp", "img/ed3b421015ac1db5a501.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Cannok, RSW_Cannok; artpipe jobs on record: desertportb_cannok", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Different animals in different faces, and too cartoonish"}], "desc": {"def": "RSW_Cannok", "label": "cannok", "description": "Cannoks were small, aggressive predators native to the moon of Dxun. They had a habit of eating anything that could fit i 9dbf40fb23d45a177.webp", "aa9d0ab1d5054ef3f7c3cdec779663811fa052358d04c732f25bb40eb6ef04b0": "img/aa9d0ab1d5054ef3f7c3.webp", "e88f9a66d31f0841669164a56ebee1e6b8bfbb18f9744760373aa7a5ef571cfa": "img/e88f9a66d31f08416691.webp", "d5718381cc41b9dcce1d871324a39c4c4bd01b37da4f7ef4b739719e33fc7441": "img/d5718381cc41b9dcce1d.webp", "dfc421ff4d871aeaa1def4a4ed5131c067a9c4ec87eeb2db6ce3c4a0ea027392": "img/dfc421ff4d871aeaa1de.webp", "550bf96d6a9d4bc119024a4327471895a512fe2980e8b1b47b6dc35ba7e8d99b": "img/550bf96d6a9d4bc11902.webp", "f45c7cbc5051f9c07d9a618eee0001e90ef28790fda21a454bcf565f166d59f2": "img/f45c7cbc5051f9c07d9a.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/eopie", "brief": "The candidate images agree closely with each other and diverge sharply from\nthe donor sprite's color. Eopies read as **pale \u2014 cream, dusty tan, or a\npinkish-grey** skin tone, never brown. The body plan is unmistakably\ncamel-like: a long, low-slung barrel body on four thin legs, each ending in\nsmall clawed/hoofed toes, topped by a genuinely elongated **trunk-like\nsnout** (more tapir/small-elephant trunk than a simple long muzzle) with one\nlarge dark eye set well back on the head. None of the images show visible fur\nor hair \u2014 the hide reads smooth-to-leathery, not woolly. Every reference shows\nthe eopie loaded with practical tan/brown leather cargo saddlebags and woven\nwicker panniers strapped across its back and neck, which is core to its\nin-universe role as a pack animal, though that's harness/tack rather than a\nbody feature. The stylized \"EOPIES!\" cartoon thumbnail is a much lower-fidelity\nsource (flat shading, exaggerated cartoon eyes) but still agrees on the pale\ntan color and the long trunk-snout silhouette, so it corroborates rather than\ncontradicts the higher-fidelity images.\n\n**The current donor sprite (`donor_current_sprite.png`) gets the color\nroughly right** \u2014 it's a similar pale dusty pink-grey \u2014 **but the shape is\nwrong**: i ges show ram- or bison-style curved horns, not antlers.", "must": "- [ ] Bison-like stocky body with humped shoulders and a low-carried head\n- [ ] Long coarse shaggy curly brown fur (mane over shoulders), short strong legs with dark hoof feet\n- [ ] Curved horns (dark grey in canon) sweeping out and up\n- [ ] Broad dark grey muzzle/nose pad, small eyes under shaggy fur\n- [ ] Thin hairless rope-like tail", "ruling": "", "base": "nerf", "imgs": ["img/7006dd5acabd4733b016.webp", "img/7c1c0e1e046a3f3a2e6a.webp", "img/54cb5d5bd8441a0b873e.webp", "img/ef7928d4f30a9220277d.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: FeralNerf, RSW_FeralNerf; artpipe jobs on record: desertportb_feralnerf", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Not a Nerf from Star wars..."}], "desc": {"def": "RSW_FeralNerf", "label": "feral nerf", "description": "Nerfs were a species of antlered, herbivorous mammalia found all across the galaxy. Because of the nerf's ability to easily adapt to harsh environments, several defined sub-species existed and were often referred to as 'feral' or 'wild' variants of the same animal.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_FeralNerf"}, "group": "Fauna"}, {"id": "RSW_FrilledGorg", "kind": "fauna", "label": "Frilled gorg", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 1.0 \u00b7 11 picture set(s) across 4 graphics", "tier": "sw", "tierText": "Star Wars tier (RSW_), no canon-library entry", "canonTag": "canon not yet checked", "flags": [], "prefillShort": "your earlier pick (desert sitting 1): IN GAME \u20 de-view reference reads warm\ntan-orange; the card reads greener) \u2014 never a flat colour \u2014 with paler\nskin at the belly and joints. `kotor_screenshot.jpg` shows two gizka in\nthe *Ebon Hawk* cargo hold, confirming pack/infestation behavior and a\nsize reference \u2014 roughly knee-height or smaller, a fast-breeding\nvermin-scale creature rather than a large animal.\n\nNo donor mod screenshot could be obtained \u2014 `mlie.starwarsanimalcollection`\nis not present anywhere on this machine's disk (Workshop cache or common\nMods folder), so there is no `donor_current_sprite.png` candidate for this\nentry.", "must": "- [ ] Small bipedal dinosaur-like reptile \u2014 theropod build, body held HORIZONTAL over two strong hind legs; NOT a frog, NOT a toad, NOT an upright hopper\n- [ ] A thick tapering TAIL extending behind for balance \u2014 part of the silhouette in every facing\n- [ ] Tiny vestigial forelimbs tucked against the chest, never weight-bearing\n- [ ] Oversized head with a rounded, blunt, beak-like snout, broad cheeks and a backswept crest at the rear of the skull\n- [ ] TWO modest-sized eyes on the sides of the head \u2014 a front (south) view shows both; never a single central cyclops eye, never huge bulging frog eyes\n- [ ] Scaly mottled hide in tan, warm orange-brown and olive patches \u2014 not a flat colour\n- [ ] Roughly knee-height or smaller \u2014 a vermin-scale creature, not a large animal", "ruling": "2026-09-16, owner: \"Check your canon. I see clear references to bipedal and no\nmention of four legs. I think this is a canon error in your search.\" Upheld on\nre-inspection: the background gizka in kotor_screenshot.jpg stands wholly on\nits two hind legs, forelimbs raised; the infobox render's thin forelimbs are\nnot weight-bearing. The earlier Visual brief's \"quadruped in a sprawling\nstance\" was a misread of the foreground close-up and is superseded by the\nMust-show line above. Gizka renders BIPEDAL: two working hind legs, vestigial\nraised forelimbs.\n\n2026-09-16, owner (giz art review): gizka has TWO eyes. The south-facing\nreview renders showed a single central cyclops eye \u2014 that came from this\nentry's own earlier \"reads almost one-eyed/cyclopean\" phrasing, which the\nimage model took literal", "base": "", "imgs": ["img/003a681b515ec1b5ea27.webp", "img/928bdc04dd580c564346.webp", "img/15d2e59decdb4f5e6a72.webp", "img/b5468709d352bd2404f1.webp", "img/3d1e94125adf47e87328.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G", "H"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Gizka, RSW_Gizka; artpipe jobs on record: desert_swaca_gizka, pyrelands_gizka_2leg_option, pyrelands_gizka_biped_v3, pyrelands_gizka_biped_v4, pyrelands_gizka_dino_v5, pyrelands_gizka_v1, pyrelands_gizka_v2", "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "totally wrong. Four legs instead of 2. Not canon, Not facing differently. "}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "We had a good Gizka.... it didn't need to be redone, and it isn't a frog."}], "desc": {"def": "RSW_Gizka", "label": "gizka", "description": "Whatever their native world, their extraordinary reproduction rate led to a fair amount of gizka on many worlds, even including uncharted planets such as Lehon, finding their way from the wreckage of crashed starships. It has been alternatively postulated that they came from that planet originally, spreading along with the Infinite Empire. Their exponential population growth led to them being considered pests on almost as many world y\ncorroborate each other reasonably well, though the two wiki images likely\nshare a common source (both appear to be illustrations tied to the 2001\n*Field Guide*, not independent photographic/film evidence, so treat this as\none strong consistent illustration tradition rather than triangulated proof):\n\n- `wookieepedia_infobox.webp` (the field-guide-style infobox illustration,\n  full-body profile view): a low-slung, digitigrade **quadruped** with a\n  **reddish-brown to maroon back and flanks**, a **lighter grey-tan\n  underside, throat, and legs**, a long tapering rat-like tail, and an\n  elongated snout packed with **large interlocking jagged teeth** \u2014 visible\n  even with the jaw mostly closed, which is clearly the source of the\n  \"saw-toothed\" name. Small **red eyes**, a pair of short blunt horn-like\n  spikes near the nose, and a wispy fringe of hair-like bristles along the\n  belly and backs of the legs (consistent with the text's \"sensed vibrations\n  through hair\").\n- `wookieepedia_coruscant_scene.webp` (an adult and juvenile grank scavenging\n  from a tipped-over trash can on Coruscant, with a small unrelated\n  yellow/cream creature nearby): confirms the same **reddish-brown/maroon\n  dorsal coloring fading to tan-grey underneath**, the same twin nose-horns,\n  and shows the mouth **open**, revealing a genuinely saw-like double row of\n  jagged white teeth \u2014 the strongest single confirmation of the \"saw-toothed\"\n  name. Also shows faint **darker mottled spotting** on the flank of the\n  adult, consistent with a reptilian/scaled hide rather than a furred one\n  (matching \"Reptomammal\"). Both the adult and the smaller juvenile share\n  identical coloring \u2014 no juvenile/adult color difference visible.\n- `steam_workshop_roster_grid.jpg` (Steam Workshop preview screenshot from\n  the donor mod's current 1.6 listing, id `3497316713` \u2014 a 12-creature\n  roster grid; Grank is the bottom-right tile, clearly labeled \"GRANK\"): the\n  mod's own flat-vector icon art, independently drawn by the mod author,\n  **also lands on a maroon/wine-red back with a tan/cream belly, snout\n  underside, and open mouth showing white fangs**, a long thin down-curving\n  tail, and a small ear/horn nub \u2014 i.e. the mod author converged on\n  essentially the same reddish-brown-over-tan palette as the two Wookieepedia\n  illustrations, independently of them.\n\n**N", "must": "- [ ] Low-slung, digitigrade quadruped with a long, tapering, rat-like tail\n- [ ] Reddish-brown to maroon dorsal/back coloring, fading to a lighter tan-grey underside and throat\n- [ ] Elongated snout packed with large interlocking jagged (saw-like) teeth, visible even with the jaw closed\n- [ ] Small red eyes\n- [ ] A pair of short, blunt, horn-like spikes near the nose\n- [ ] A wispy fringe of hair-like bristles along the belly and backs of the legs", "ruling": "", "base": "", "imgs": ["img/b6ae0e779bc040660694.webp", "img/1a49ad567ce62abbcf3d.webp", "img/b08fb23618200d0f4b04.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Grank, RSW_Grank; artpipe jobs on record: desertportb_grank, grank_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}], "desc": {"def": "RSW_Grank", "label": "Grank", "description": "The Grank (or 'saw-toothed grank') were a medium-sized carnivore believed to have originated on the planet Naboo. They were a species of predatory scavengers with sharp teeth and powerful jaws. Despite their fearsome gnarled appearance they were very affectionate when domesticated. This made them popular pets and lead to them establishing wild populations on multiple worlds as a result.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Grank"}, "gr rd art shows a pair)\n- [ ] Four legs\n- [ ] Thin, whip-like tail\n- [ ] Smooth hide with no visible fur", "ruling": "**Antelope \u2014 canon identity stands.** Owner, 2026-09-18: *\"antelope and close,\nthis is acceptance\"* (on PYRELANDS_CREATURE_RERENDER_1's acceptance). The\nfour-legged Dantooine grassland quadruped described above IS the identity;\nthe shipped painterly v2 set was drawn from this entry and the owner locked\nthat specific art 2026-09-17 (*\"Lock in that Iriaz.\"* \u2014 one horn, the second\nprotrusion confirmed as an ear). A \"two-legged Dathomir\" alternative was\nflagged once (2026-09-14) and investigated on IRIAZ_ART_REGEN_1: it matches\nnothing in this repo and is dead \u2014 do not re-render against it.\n\n**Two horns \u2014 REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1), superseding the 2026-09-17 one-horn lock:\n\n> \"Use canon imag", "base": "", "imgs": ["img/c0d83217baccbe877fec.webp", "img/b8a57066d139bb540826.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G", "H", "I"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Iriaz, RSW_Iriaz; artpipe jobs on record: desert_swaca_iriaz, doubles_redo_iriaz_edit_v1, longshade_rsw_iriaz_v1, pyrelands_iriaz_v1, pyrelands_iriaz_v2, pyrelands_iriaz_v3", "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "Looks cartoonish, south isn't south, north isn't north"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-04", "verdict": "redo", rences/kowakianmonkeylizard", "brief": "Four images: two CANON (a detailed CG infobox render, and a small game portrait of a red individual named Pilf Mukmuk) and two LEGENDS (an infobox plate and a Unknown Aliens-style painting, plus a concept painting). Canon and Legends agree on the body plan; the canon text adds feathers, which only the CG render and game portrait show.\n- **Silhouette**: a thin-limbed, pot-bellied biped about 70 cm tall (Legends text), stooped or perched, long stalk arms and legs, narrow shoulders, a round belly, a thin whip-like tail that curls up behind (prehensile in poses).\n- **Head**: small and triangular, dominated by a wide, hooked, glossy dark-brown or black parrot-like beak, no nose, a wide red-lipped mouth that opens to a toothless pink-red interior, small close-set yellow eyes, a pale white/grey striped or scaly face mask in the canon render.\n- **Ears**: two enormous, floppy, backward-sweeping ears, narrowing to thin curved points, often longer than the head (clearly larger than the face in every image), yellow on the inside with a blue-grey edge in the CG render, sometimes torn or pierced.\n- **Colour, canon CG**: blue-grey feathery/hairy ruff (a bib of fluffy blue plumage around the shoulders), a bright orange crest tuft on the top of the head, a bright yellow-gold belly and thighs, yellow-edged blue-grey forearms and a blue-grey tail; blue-grey toes with long dark red-brown claws. The canon text lists red, blue, yellow, brown, green, purple and orange individuals, so colour varies by individual.\n- **Colour, Legends**: warm tan-brown skin with a dark brown ruff of hair at the neck and jaw corners and a ratty tuft on the head (infobox, vine-swinging pose), or a pale green-tan body with a rusty hair ruff and long dark ear rims (concept). The game portrait is a rust-red individual with a green ruff and a green crest.\n- **Hands and feet**: long spindly fingers and long, three-toed (plus a hind toe) bird-like feet ending in sharp curved claws.\n- **Disagreement**: the Legends images show furry hair, not feathers; the canon render shows feathery blue plumage and a hair-like crest. The beak, ears, belly and spindly build are common to all.", "must": "- [ ] Spindly stick limbs, pot belly, small stooped biped (about 70 cm), long thin curling tail\n- [ ] Small triangular head with a wide hooked dark parrot beak, red lips, close-set yellow eyes\n- [ ] Two huge floppy backward-sweeping ears, thin and pointed\n- [ ] A ruff of fluffy feathers/hair around the neck and shoulders and a tuft or crest on top of the head\n- [ ] Long clawed bird-like toes and spindly clawed fingers\n- [ ] Body colour as a distinct individual variant (canon CG: blue ruff, yellow belly and thighs, orange crest)", "ruling": "", "base": "", "imgs": ["img/254f97ded01df4cfb420.webp", "img/0d3d9aaca70164cdf8b0.webp", "img/9ea27573884940003d29.webp", "img/f56587414600e94b21db.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: KowakianMonkeyLizard, RSW_KowakianMonkeyLizard; artpipe jobs on record: desertportb_kowakianmonkeylizard", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "different faces must look the same. See web"}], "desc": {"def": "RSW_KowakianMonkeyLizard", "label": "kowakian monkey-lizard", "description": "Kowakian monkey-lizards were a bipedal reptillian primate species native to a jungle-like Outer Rim planet called Kowak. Their intelligence and cunning made them popular exports as exotic pets, with some specimens escaping and establishing wild colonies.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_KowakianMonkeyLiz he sourced text closely (reddish-brown shell, yellow\n  eyes, large jaws, many legs) and is the strongest single reference.\n- `wookieepedia_kashyyyk.jpg` \u2014 small in-game screenshot (*Republic\n  Commando*, \"A kreetle found on Kashyyyk\"): low-res but shows the same\n  domed, ribbed, **pinkish-maroon shell** with visible yellow eye-glints and\n  short leg nubs. Confirms the shell color and low domed-beetle silhouette\n  at production-game fidelity, not just concept art.\n- `wookieepedia_geonosis.jpg` \u2014 small in-game screenshot (\"A kreetle found\n  on Geonosis,\" also *Republic Commando*): same domed **reddish/rust-pink\n  ribbed shell**, yellow eyes, stubby legs \u2014 consistent with the Kashyyyk\n  screenshot, reinforcing reddish-brown/maroon as the in-game standard\n  color rather than a one-off render choice.\n- `swg_kreetle.jpg` \u2014 *Star Wars Galaxies* in-game creature: same domed,\n  ribbed-shell, many-legged body plan and pink eye-glints, but the shell\n  renders as **olive/khaki-brown** rather than reddish-maroon \u2014 noticeably\n  more green-brown than the other three sources. This is a genuine\n  cross-image disagreement, not a text/image one: body plan and eye color\n  agree everywhere, but SWG's coloring skews duller/greener while the\n  *Republic Commando*-era art and screenshots both skew red.\n\n**Net read**: a low, domed, segmented/ribbed shell (pillbug or hermit-crab\nsilhouette) in reddish-brown-to-maroon (SWG's more olive/khaki version is a\nsecondary, less-corroborated variant), a mottled tan/spotted head, dark\nmandibles/tusks, bright yellow eyes, and many short jointed legs along the\nsides (five pairs per the text; three pairs as actually modeled in\n*Republic Commando*). This is a small, floor-hugging arthropod \u2014 treat it as\na scavenger/pest-scale creature, not anything human-sized.", "must": "- [ ] Low, domed, segmented/ribbed shell (pillbug or hermit-crab silhouette)\n- [ ] Shell colour reddish-brown to maroon (the better-corroborated read; olive/khaki-brown is a secondary, less-corroborated variant)\n- [ ] Mottled tan/gold head with dark reddish spots\n- [ ] Dark, curved mandibles/tusks at the front\n- [ ] Bright yellow eyes\n- [ ] Many short jointed legs along the sides of the body", "ruling": "**RULED** (owner, 2026-09-13, review sheet): `wookieepedia_infobox.jpg`", "base": "", "imgs": ["img/d34a7f2d885e1332c546.webp", "img/2deee56e89234020752f.webp", "img/e68f9a5dbc72f80ff8ec.webp", "img/ea85ecf522dc242f3f91.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Kreetle, RSW_Kreetle; artpipe jobs on record: canon_kreetle_v1, desert_swaca_kreetle, facingrepair_kreetle_v1, kreetle_v1, stillsand_regen_RSW_Kreetle_v2", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}], "desc": {"def": "RSW_Kreetle", "label": "kreetle", "description": "Kreetle were a fast breeding arthropod native to the planet Tatooine. They were was often found in cities, homes, and other urban areas and were universally considered a pest. They gave birth to young in the form of maggot-like larvae. Kreetles thrived on dead creatures, garbage and vegetable remains (including waste). They were found on many worlds having stowed away in supplies and once escaping establishing themselves in the wild.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Kreetle"}, "group": "Fauna"}, {"id": "RSW_Kybuck", "kind": "fauna", "label": "Kybuck", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.6 \u00b7 2 picture set(s)", "tier": "canon", "tierText": "canon Star Wars c part on the sides/top of the face.\n- **Body:** small and low, squat, round, **splayed like a lizard or frog rather than a cat's tucked stance**: the elbows stick out sideways in the 3D renders (`canon_2`, `legends_1`, `canon_3`). `canon_1` is the exception: a fluffy upright cat-bodied form on four stilt-like legs.\n- **Limbs:** in all images the legs are **thin, bird-like, scaly dark-brown or black legs ending in clawed, webbed or splayed bird-like feet** (three forward toes with talons), not furred paws. Hind legs look slightly longer.\n- **Coat/colour:** two looks. (a) `canon_1` (CGI render, file `LothCat-AG.png`): **fluffy white-cream fur** with brown leopard-like spots/dapples, especially on the ears, flanks and a banded bushy tail; short bristly pale fur ruff around the cheeks; ear tips dark brown. (b) `canon_2`, `canon_3` (painting) and `legends_1` (Legends, SWTOR): **short-haired golden-orange to amber coat with dark brown/black tiger-or-leopard spots and stripes**, a cream-white chin/belly, ears striped inside. Taken together the species is a spotted/striped orange-and-cream animal, and the white fluffy form is the outlier.\n- **Tail:** a **bushy, upturned tail curved up over the back**, ringed with darker bands (`canon_1` thick and fluffy; `canon_2` curled like a question mark; `canon_3` held up and fluffy).\n- **Size:** small, small-dog or cat sized. In `canon_3` a distant loth-cat sits on a rock in tall grass beside the foreground one; no scale object otherwise.", "must": "- [ ] Wide, flat, frog-like head with a very broad mouth, pale chin pouch and small even white teeth with a pair of fangs\n- [ ] Two tall, upright, pointed cat-like ears marked with spots or stripes\n- [ ] Thin, scaly, bird-like legs and clawed three-toed feet instead of furred cat paws\n- [ ] Orange-amber coat with dark brown spots and stripes and a cream chin and belly (the white-fluffy canon_1 look is the alternate colouring)\n- [ ] Bushy tail curled up over the back, banded darker\ ", "7caf1f348df7eeb0d0318392e4c5564b1f2a7141e6ebdeb9f8d78a8640ee49bc": "img/7caf1f348df7eeb0d031.webp", "58806a1dcfa826335650825ac0a54e1fdec32b7becf2ba930d27bca7450ad0f2": "img/58806a1dcfa826335650.webp", "a9b8972c03273e5ac1e454f33beb04f106d0706c5572d1225b905dae0718d236": "img/a9b8972c03273e5ac1e4.webp", "8efe8aab34b8a421531d1b63d3f8b6111c39ebe1aa2790975d992cf6faecfb0a": "img/8efe8aab34b8a421531d.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/massiff", "brief": "Four images that disagree on the head shape and the stance. The canon page's own two images are not consistent with each other.\n- **`canon_1` (infobox, Outlaws 3D render, large clean view):** a heavy reptile-dog built like a **crocodilian on long, thick, digitigrade legs**: **long, narrow, gharial-like snout** with a row of thin curved teeth and a pink mouth/tongue, one big round dark-blue eye set on the side high on the skull, scaly grey-blue head and neck fading into **orange-tan/rust body** with black patches. **A tall crest of thin, long, backward-raked black spines along the neck and back**, plus rows of rounded dark bony studs along the flanks. Rough, plated hide, not furry. Big three-clawed feet with long dark talons; the hindquarters carry the weight like a big theropod, forelimbs shorter. The thick tail is not clearly shown.\n- **`canon_2` (screen frame, The Mandalorian book/series, pack in a canyon):** a pack of **hyena/dog-like, lean, low animals** seen small and far away. Short broad head with a wide open jaw, a spiky crest/ruff at the back of the head and along the spine, a pale throat/chest, dark-brown mottled hide with armoured plates. Digitigrade legs and a stalking stance, head carried low.\n- **`legends_1` (Attack of the Clones frame):** a squat, thick-bodied, **hump-backed** quadruped, dark brown, with **thick plated armour across the shoulders and back** (knobbly bone plates with yellow-brown mottling), **a ridge of tall, thin, pale spines** along the spine, short snout, a **round yellow eye** with dark pupil, small head hanging low between the shoulders. This is the most \"squat quadruped\" of the four and matches the prose.\n- **`legends_2` (painted, arena fight):** two massiffs locked in a fight: **green-grey, lizard/crocodile-like**, wide gaping jaws full of conical teeth, red tongue and mouth interior, a crest of dark spikes on the back of the head and neck, scarred skin. Looks more like a big monitor lizard.\n- **Disagreement:** the text says \"squat quadruped, canine and reptilian, about one metre high, humped back, brown and grey or grey-green plates, large black or yellow eyes\". `canon_1` is much taller, long-snouted and rust-orange; the movie frame (`legends_1`) and the canyon pack (`canon_2`) are squat and brown. **Trust `legends_1` and `canon_2` for body proportion (squat, humped, brown, short snout) and `canon_1` for the spine crest, scale pattern and teeth detail.** Do not give it a gharial snout without the owner's ruling.\n- **C", "must": "- [ ] Row of tall, thin, backward-raked spines running from the back of the head down the spine (age shown by spine size)\n- [ ] Hump-backed, squat, heavy quadruped with a head carried low\n- [ ] Armoured, plated reptile hide (not fur), brown with grey and grey-green plates\n- [ ] Wide jaws that open very wide, filled with long conical teeth\n- [ ] Large round eye, black or yellow\n- [ ] Short, thick limbs with big dark curved claws", "ruling": "", "base": "", "imgs": ["img/34486c01172155ff10da.webp", "img/62cb1ca63a5bf10b684a.webp", "img/3b53dd59150c0c87ebbf.webp", "img/326c3e09e58605ae8f1b.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Massiff, RSW_Massiff; artpipe jobs on record: desert_swaca_massiff", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, r arge, thick, and gently curved, colored a contrasting **pale\nivory/bone-tan** against the dark fur \u2014 the single most visually distinctive\nand identifying feature. The head/face is wide and lipless with a visible row\nof blunt, slightly serrated teeth in an undershot jaw, small dark\nclose-set eyes, and a heavily creased, mud-caked hide visible on the bare\npatches of the face around the eyes and mouth. Four short, thick, stump-like\nlegs support a heavy low body \u2014 genuinely rhino-proportioned rather than\nbovine.\n\n**The current donor sprite (`donor_current_sprite.png`) is a strong match**:\ndark brown/near-black body, a pale grey-tan horn that reads clearly against\nthe dark coat, a low squat rhino-like silhouette, and a textured/ridged back\nsuggesting the shaggy coat, plus visible teeth in the jaw. The donor's body\ncolor leans slightly more black/charcoal than the muddier medium-brown seen\nin the film references, and the horn could read a touch more contrastingly\npale/ivory, but the overall silhouette, horn placement, and general \"shaggy\ndark rhino\" read is already well aligned with canon \u2014 this is one of the\nbetter-matching donors found in this pass.", "must": "- [ ] Heavily built, low-slung, rhinoceros-like quadruped entirely covered in thick, shaggy, matted wool/fur \u2014 not bare grey skin\n- [ ] Fur reads dark muddy brown throughout, lighter/dirtier where mud has dried and packed in, darker toward the legs and underside\n- [ ] Single large, thick, gently curved frontal horn in a contrasting pale ivory/bone-tan against the dark fur\n- [ ] Wide, lipless head with a visible row of blunt, slightly serrated teeth in an undershot jaw\n- [ ] Small, dark, close-set eyes\n- [ ] Four short, thick, stump-like legs supporting a low, heavy, rhino-proportioned body", "ruling": "", "base": "", "imgs": ["img/50f47cbfc3b54034151d.webp", "img/06a1356b5983627da1d8.webp", "img/ca458a0f0c783b83c038.webp"]}, "letters": ["A", "B"], "related": [], "elsewhe unched,\n**toad- or turtle-like amphibian/reptile**: a heavy domed/ridged shell-like\nback rising into a peak, a wide froglike head with a broad flat mouth and\nbulging pink or amber eyes, floppy skin flaps hanging at the sides of the\nhead (read as loose jowls/wattle, not ears), thick bent hind legs ending in\nclawed toed feet, and mottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on any of the three images, across two\ndifferent render styles and two different eras of official art. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or wattle rather than a wing. It is far more simplified and\nflat-cartoon-shaded than any candidate image (RimWorld's chunky low-detail\nart style, no visible skin texture or individual toes), and it omits the\nvisible hind legs / froggy stance entirely \u2014 the sprite reads as a rounded\nblob-with-a-face rather than a standing biped \u2014 but the *silhouette family*\n(squat, hunched, domed-backed, green, toad/turtle-adjacent, not bird-like)\nis a genuine match to canon, which is not true of every creature audited so\nfar in this library.", "must": "- [ ] Heavy domed/ridged shell-like back rising to a peak\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing\n- [ ] Mottled olive-to-dark-green pebbled/warty skin \u2014 no feather texture, beak or wings anywhere", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "base": "", "imgs": ["img/7f5a1b03b56e88bce921.webp", "img/b8fc8a62f6e3d7b1bc49.webp", "img/a502c7cabfbb362a4fa7.webp"]}, "letters": ["A", "B", "C", "D", "E"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Nuna, RSW_Nuna; artpipe jobs on record: desert_swaca_nuna, pyrelands_nuna_female_v1, pyrelands_nuna_v1, pyrelands_nuna_v2", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog."}, {"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "north and south aren't the right color"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "current", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "We already had a good looking Nuna"}, {"at": "2026-10-04", "verdict": "keep", "trust": "ruled", "sheet": "art_doubles_compare_2026-10-04", "note": "Finally, yes, keep B."}, {"at": "2026-10-04", "verdict": "keep", "trust": "ruled", "sheet": "a ki to tan-brown, with finely striated pale-cream striping along the neck, shoulders and thighs; yellowish cream belly and underside of throat; in the plate, mottled brown and cream. The tail turns blue-grey toward the tip. In the film still, the chest and neck are lighter green-cream with a blue-green tail and blue eyes.\n- **Feet**: long toes, slender, with sharp curved claws, large webbed feet are drawn in the plate (the foot is long, spread and flattened like a wading foot) but not clearly in the CG render.\n- **Pose**: in the plate, one stands upright and the other bends deep with the beak down at the water surface and the arms flung out for balance, tail up.\n- **Size**: about 1 m long from beak to tail tip, small, shown at about waist height of a Gungan only in the film still (a large Gungan or beast looms beside it); no explicit scale elsewhere, so treat it as roughly heron-sized.", "must": "- [ ] Slender two-legged, long-necked wader with horizontal body and a very long thin whip-like tail\n- [ ] Long thin down-curved pointed beak, small round head with a large pale eye\n- [ ] Olive-tan skin with fine cream striations on neck, shoulders and thighs, cream underside; tail blue-grey toward the tip\n- [ ] Short thin forelimbs with clawed fingers held to the chest\n- [ ] Long spindly legs, long-toed feet with sharp claws (wading feet in the plate)", "ruling": "", "base": "", "imgs": ["img/395d65948d1824484216.webp", "img/e2d8f4c20ee8635e88a9.webp", "img/cb1aa04f12ea3a729790.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Pikobis, RSW_Pikobis; artpipe jobs on record: desertportb_pikobis", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-s age (with the discarded\nlightsaber) confirms the curious/shiny-object-seeking behavior described in\nthe text and shows the stubby wings spread, functioning more like small\nflippers/arms than flight wings \u2014 consistent with \"short flights only.\"\n\n**The donor sprite disagrees with canon in two ways.** First, color: the\ndonor sprite's back/wings are rendered in a **flat, fairly dark charcoal\ngray** with almost no brown or warm tone, and its cheek patch is a small,\nsaturated **red-orange** blotch rather than the softer warm tan/orange seen\nin every reference image \u2014 the real animal reads warmer and more\nmottled/textured than the donor's flat two-tone fill. Second, the beak: the\ndonor sprite draws a small **visible dark beak/bill nub** at the front of\nthe face; canon porgs are explicitly and visibly **beakless** \u2014 a flat face\nwith only a tiny nostril crease, no protruding beak shape at all. Body\nsilhouette (round egg shape, big head, tiny legs, short wings) and the\nwhite belly / dark back split are otherwise correctly captured by the donor\nsprite.", "must": "- [ ] Round, egg/teardrop-shaped body with a disproportionately large head-to-body ratio\n- [ ] Huge, black-pupiled eyes dominating the face\n- [ ] Flat, BEAKLESS face \u2014 only a small nostril bump, no protruding beak shape\n- [ ] Short, furry-looking stub wings held close to the body\n- [ ] Thin orange legs with webbed feet tucked almost entirely under the round belly\n- [ ] White/cream face and underbelly, gray-to-brown mottled back and wings, warm orange-tan cheek/eye patches", "ruling": "**RULED** (owner, 2026-09-13, review sheet): `wookieepedia_infobox.jpg`", "base": "", "imgs": ["img/d954940e028b7e148463.webp", "img/52c25c71166af32148e8.webp", "img/4a7e1e8fa9cc12bf9025.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Porg, RSW_Porg; artpipe jobs on record: desertportb_porg", "rulings": [{"at": "2026-0 hort stubby legs** and a big flat blunt head that merges into the body with almost no neck. Thick-set and soft. The painting shows it only waist-high on a crouching man, so it is small (roughly dog-sized; the text says just under 1 m long).\n- **Head:** a broad, smooth, flat-faced head with a heavy downturned mouth line, **two small bulging, heavy-lidded eyes on short fleshy turrets/stalks on top of the head**, usually blue, pale grey-blue or sky-blue irises, giving a sleepy, droopy look. **A short, thick, flexible elephant-trunk-like snout hangs from the middle of the face, curving down and ending in a small slightly flared, finger-like tip** (clear in all three).\n- **Horns and spikes:** **a pair of short, dark, curved horns** (black or deep blue, cone-shaped on a bumpy base) rising from the crown near the eye turrets, plus **a row of small dark conical spikes down the spine**, thinning into a short spiky tail ridge.\n- **Colour and skin:** soft, smooth, thick-skinned hide. `canon_1` is dusty blue-green to grey on the flanks with a cream-tan top; the back and head carry a **cobbled/pebbly pattern of tan blotches** (like a giraffe's or turtle shell's polygons). `canon_2` (watercolour, uninflated) is **orange-amber with darker mottling**. `canon_3` (painting, night) is **pale butter-yellow with an orange-yellow honeycomb pattern on the back**. Colour varies by source, so the safe base is a soft warm tan-yellow to amber with blotchy darker polygons, and cool blue-green appears in the CGI render.\n- **Feet:** tiny, dark, three-toed stubby feet, partly hidden by the body.\n- **Inflation (`canon_2`, left sketch):** inflated, the whole body becomes a huge smooth sphere with the head, horns and small limbs tiny at the front edge. The text's measurements (9 m long, 60 cm high) are inconsistent with this, so treat the sphere as the intended form.", "must": "- [ ] Low, fat, barrel-shaped body on short stubby legs, with a big flat blunt head and almost no neck\n- [ ] Short, t Four wings:** **two large rear wings and two smaller front wings**, all broad, thin, leathery, scalloped and spiky, **with talon-like claws along the outer edges** and large **dark blue concentric eye-spot rings** on a white and pale-blue membrane with yellow rims (`legends_1`). In flight/at rest (`legends_2`) the wings fold as a large yellow, green-veined, spiky-edged diamond or heart shape with the long tail fan trailing. Matches the text: blue and yellow, white underside, talons on the wing edges.\n- **Body and head:** the torso is a smooth, bulging, egg-shaped belly, **pale blue with darker blue dots** (`legends_1`), with a pale cream throat; the body is hairless, with soft bare skin. **The head is small and blue, jowly, with a short curved beak and a red eye**, held up on a short neck.\n- **Colour:** yellow, blue and white. Yellow on the tail fan and wing rims; blue on the belly, head, eye-spots and spots; white or cream on the underside and wing centres. Canon sheets (`canon_1`, `canon_2`) show the same palette in duller form: cream-yellow, pimpled, wormy tail and blue-white wings.\n- **Canon pair:** `canon_1` shows an urusai in a sarlacc's tentacle-and-nest scene, wings narrow and folded, its tail wrapping like a thick pimpled tentacle; `canon_2` shows one clinging head-down to a sarlacc tooth. Their anatomy agrees but is mostly hidden.\n- **Disagreement:** the text (canon) says \"jowly, beaked face with red eyes\", \"fan-shaped tail with spikes and white underside\" and four wings: images agree. The Legends text says females have two wings, males four; the images show four.\n- **Size:** 2 m wingspan, 43 kg (Legends text); no scale object in the images.", "must": "- [ ] Four broad, leathery, scalloped wings (two larger rear, two smaller front) with talon-like claws along the outer edges\n- [ ] Wings white or pale blue with large dark blue concentric eye-spot rings and yellow rims\n- [ ] Tail that spreads into a flat, fan-shaped, spiked paddle with a white underside\n- [ ] Small jowly blue head with a short beak and red eyes\n- [ ] Smooth bare skin, bulging pale-blue belly with darker blue dots\n- [ ] Overall yellow, blue and white palette", "ruling": "", "base": "", "imgs": ["img/e54e6d177caabf5ca7ef.webp", "img/3aa4bfc7cdc9d0393458.webp", "img/36095342804bea018d3a.webp", "img/ef28c50b6b53c09929d8.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: RSW_Urusai, Urusai; artpipe jobs on record: desert_swaca_urusai", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Look at canon, each face appears diferent creature."}], "desc": {"def": "RSW_Urusai", "label": "urusai", "description": "Urusai were winged reptavians native to the desert planet Tatooine. They were predominantly opportunistic scavengers of carrion that would use the thermal currents of their homeworld to travel far and wide in search of an easy meal. Their tolerance to harsh climates and propensity to be clean, efficive corpse disposal meant they were spread to numerous worlds by various corporate and criminal organisations.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Urusai"}, "group": "Fauna"}, {"id": "RM_Vissler", "kind": "fauna", "label": "Vissler", "effect": "fauna \u00b7 in this biome's own roster \u00b7 commonality 0.2 \u00b7 1 picture set(s)", "tier": "ours", "tierText": "our own design (franchise-free RM_/RUT_)", "canonTag": "", "flags": [], "prefillShort": "what the game shows now (no pick of yours)", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to what the game shows now", "prefillSource": "inferred", "contested": tru Four images: one canon (Buggles, a pet voorpak from Star Wars: Visions-style/Secrets and Holograms art) and three Legends. All show a **fluffy ball on thin legs**; none shows a normal quadruped.\n- **Silhouette:** a **round, puffball body, about the size of a head**, with a face on the front and a **set of thin, long, stick-like legs** poking out underneath. The Legends art shows the legs as **spindly, jointed, spider-like or bird-like, with small clawed feet** (`legends_2` and `legends_3`: six to eight visible stick legs; the text says six). `canon_1` shows the same ball standing on tall ostrich-like legs with big splayed three-toed claws, so it is larger than a pet that can be \"lifted\"; treat the legs as long and thin in all versions.\n- **Head:** the face sits on the front of the ball, no neck. Large round **eyes with a coloured mask-like ring or patch around them** (pink-purple/magenta rings in `legends_2` and `legends_3`; a dusky red-brown ring in `canon_1`; yellow patches in `legends_1`), irises blue, lavender or green. A small **pointed pink-brown nose**, a wide smile, and **small needle teeth** in the open mouth (visible in `legends_1`, `legends_2`).\n- **Ears or horns:** **two small tufts or pointed ear-like stalks on top of the head**: pale thin stalks ending in small white bud-like tips (`canon_1`), a pair of rounded ear-tufts (`legends_2`, `legends_3`), or longer horn-like pale blue-green tufts (`legends_1`).\n- **Fur:** very soft, dense, puffy fur covering the whole ball. **Colour disagreement:** canon (`canon_1`) is **cream-white with a pale tan back and white face**; `legends_1` is a **bright orange-red shaggy fur**, almost like a fox or Furby; `legends_2` and `legends_3` are **golden-tan to amber on the back with a white fluffy chest, throat and cheek ruff**. The text says \"soft white fur\" in canon. The white face and chest plus a warm golden-buff back is the common core.\n- **Size:** small enough to be held in one hand (`legends_1` shows it in a palm, the body about the size of a fist). `canon_1` is shown larger, relative to its legs, than the Legends art.", "must": "- [ ] Round, fluffy puffball body with no visible neck, soft white fur in canon (golden-buff back, white face and chest in Legends)\n- [ ] Thin, long, stick-like jointed legs (six per the text) ending in small clawed or toed feet\n- [ ] Large round eyes ringed with a coloured mask-like patch, a small pointed nose and a wide smile with tiny needle teeth\n- [ ] Two small tufts, ear stalks or bud-tipped stalks on top of the head\n- [ ] Hand-sized pet creature (kept small despite the long legs)", "ruling": "", "base": "", "imgs": ["img/0fcf85d4f13b1bc86d9b.webp", "img/78dae2bf16e00e955e7f.webp", "img/b2725622f4f27ec059d0.webp", "img/c8ab74f50f11d5cbc4d5.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: RSW_Voorpak, Voorpak; artpipe jobs on record: desertportb_voorpak, longshade_rsw_voorpak_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Check lore, each face looks different"}], "desc": {"def": "RSW_Voorpak", "label": "voorpak", "description": "Voorpaks were a non-sentient but still quite smart species of puffy-looking mammalians that were native to the planet of Naboo. Diminutive carnivores, voorpaks were much beloved by many due to their cuteness and as pets which in turn led to their export to many other worlds.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Voorpak"}, "group": "Fauna"}, {"id": "RSW_Vulptex", "kind": "fauna", "label": "Vulptex", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.08 d42942694af71de413cda9b29065337f6756eb4b4": "img/ae92389e5a404e3a012a.webp", "53f0ce8abf53773a909c4aed04fa220605100571f8b42581ca0b3968c69dafe1": "img/53f0ce8abf53773a909c.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/vulptex", "brief": "All four candidate images agree closely with each other and with the text.\nThe vulptex is NOT a smooth-furred fox with sparkly highlights \u2014 the\n\"crystalline\" coat is a bold, literal visual feature: individual bristles\nread as hard, faceted, glass-like **shards/spikes** standing up off the\nbody (most visible along the spine, shoulders, and especially the tail,\nwhich is a dense brush of spike-like points rather than a soft fluffy\nbrush). The two studio/promotional renders (`wookieepedia_infobox.jpg`,\n`wookieepedia_masterwork.jpg`) show this clearly in clean lighting: a\ngrey-blue-white coat with visible individual crystal facets catching cool\nlight, a long slender fox muzzle, very large upright triangular ears, a\nlong thin tail covered in the same spiked coat, and notably **long, thin\nlegs and an upright, almost deer-like stance** \u2014 taller and leggier than a\nreal-world fox, not low-slung. The two in-film screencaps\n(`wookieepedia_craitsurface.jpg`, `wookieepedia_battlescreencap.jpg`)\nconfirm the same silhouette and coat under real film lighting/grading, and\nalso confirm the text's eye-color inconsistency firsthand: the cave shot\nshows glowing **orange/amber** eyes, while the daylight battle shot shows\nclearly **blue** eyes \u2014 the two production sources Wookieepedia cites are\nnot reconciled in the actual footage either, so both are genuinely correct\ndepending on shot/lighting.\n\n**The donor sprite (`donor_current_sprite.png`) disagrees with canon on\nnearly every visual axis.** It is a flat cartoon icon: a low-slung,\nelongated, short-legged body (closer to a ferret or a lounging rabbit than\nan upright fox), a smooth smoothly-shaded white coat with pale blue patches\nand a solid black outline, and **no crystalline/faceted texture\nwhatsoever** \u2014 no spikes, no shard shapes, no faceted shading anywhere on\nthe body or tail. The white base color and cool blue tint are the only\nthings it gets right; the silhouette (should be tall/leggy/upright, is\nlow/long/crouched), the ear size (canon's ears are dramatically larger\nrelative to the head), and above all the signature crystalline bristle\ntexture (entirely absent) are all mismatched against every reference image.\nAny regen should prioritize the spiked/faceted coat texture first \u2014 it's\nthe one feature that makes a vulptex recognizable as a vulptex rather than\na generic white fox \u2014 and correct the body proportions toward a taller,\nlonger-legged stance.", "must": "- [ ] Coat reads as hard, faceted, glass-like crystal shards/spikes standing up off the body \u2014 not smooth fur\n- [ ] Tail is a dense brush of spike-like crystalline points, not a soft fluffy brush\n- [ ] Long, slender fox muzzle with very large, upright, triangular ears\n- [ ] Long, thin legs and an upright, deer-like stance \u2014 taller and leggier than a real-world fox, not low-slung\n- [ ] Coat colour is grey-blue-white with visible individual crystal facets", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`", "base": "", "imgs": ["img/d79ec437a33b1224b5ff.webp", "img/f1fcc9f697a68cc8708c.webp", "img/f95e6d4a9b7abce0166c.webp", "img/f5b4e66980c997715cb9.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: RSW_Vulptex, Vulptex; artpipe jobs on record: canon_vulptex_v1, desertportb_vulptex", "rulings": [{"at": "2026-09-14", "verdict": "4", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": ""}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the cre ders. Between the eyes is a **ridged, grooved patch or brow plate** (banded folds, `canon_1` and `canon_2`).\n- **Palps:** **two long, thin, curved stalk-like cranial palps (antennae) rise from the top of the head**, bending outward, with small knobbed tips in `canon_1`.\n- **Spikes and skin:** a **crest of conical horn-like spikes around the top and sides of the head, over the shoulders and down the arms and back**: orange-brown in `canon_1`, tan to rose in `canon_2`, grey-brown in `legends_1` and `legends_2`. The skin is **warty, bumpy and rough everywhere**, with small raised tubercles.\n- **Colour disagreement:** `canon_1` is **olive-green with a yellow-ochre belly and orange-brown spikes**; `canon_2` is **rosy brown to dusty pink-tan with tan warts**; `legends_1` (the film puppet) is **tan-brown**; `legends_2` is **grey-brown**. The text says \"brown, warty skin\", and the belly turns bright yellow when full. So brown is the baseline; olive-green and rose-tan are the render variants, and a yellow belly is a state change.\n- **Size:** 1.5 m tall per the text; it looks bigger than a human torso in the puppet shot.", "must": "- [ ] Squat, toad-like body hunched forward, supported on long, thin, strong forelimbs with big long-fingered hands\n- [ ] Very wide, thick-lipped, downturned mouth in a broad flat head with no neck\n- [ ] Large bulging heavy-lidded eyes (orange, amber or yellow-green) with a ridged brow patch between them\n- [ ] Two long, thin, curved palp stalks rising from the top of the head\n- [ ] Row of conical horn-like spikes around the head, over the shoulders and down the arms\n- [ ] Rough warty skin, brown as a baseline (olive-green and rose-tan variants), with a big round belly that can show bright yellow when full", "ruling": "", "base": "", "imgs": ["img/de88ef69ca76b55efcaf.webp", "img/49e2e276cfeeef6564b8.webp", "img/fba316e26b426d38d903.webp", "img/a6a9799ff9e6e231e3b2.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noAr
