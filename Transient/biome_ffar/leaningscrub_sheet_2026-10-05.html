<script id="RENDER">
/* Layout (owner complaint 2026-10-04, "poorly constructed"): one compact strip per graphic. Each picture
   set is a card whose facings sit SIDE BY SIDE; cards wrap across the width, so a row is about one
   thumbnail tall. Provenance is a tooltip, never wallpaper. Letters are row-local; the pick buttons on
   the right show only this row's letters. */
const FACE_ABBR = { south: 'S', east: 'E', north: 'N', west: 'W', single: '' };
window.itemBody = it => {
  const d = (typeof DEC !== 'undefined' && DEC[it.id]) || {};
  const purge = new Set(d.purge || []);
  const picks = Object.assign({}, it.prefillPicks || {}, d.picks || {});
  const variants = new Set(d.variants || []);
  const cell = (c, f) => {
    const s = c.faces[f];
    if (!s) return `<div class="bs-cell bs-gap" title="no ${f} picture in this set">—</div>`;
    const t = it.thumbs[s];
    if (!t) return `<div class="bs-cell bs-gap" title="picture not archived">?</div>`;
    const p = purge.has(s);
    const btn = c.purgeable ? `<button class="ac-purge${p ? ' on' : ''}" title="reject + PURGE: delete this picture from the art store so it never appears again" onclick="event.stopPropagation();artTogglePurge('${it.id}','${s}')">${p ? '✕ purging' : '✕'}</button>` : '';
    return `<div class="bs-cell${p ? ' ac-purged' : ''}"><div class="thumb ac-thumb" data-zoom="${t}" data-cap="${esc(it.label)} · ${c.letter} · ${f}"><img src="${t}" loading="lazy" alt=""></div>${FACE_ABBR[f] ? `<span class="bs-face">${FACE_ABBR[f]}</span>` : ''}${btn}</div>`;
  };
  const col = (c, g) => {
    const picked = g.primary ? d.decision === c.letter : picks[g.key] === c.letter;
    const tip = `${c.label}\n${c.detail}${c.ppc ? `\n\nresolution: ${c.srcPx[0]}×${c.srcPx[1]} px over the ${it.scale.kind === 'plant' ? 'quad' : 'drawSize'} = ${c.ppc} px/cell` : ''}${c.also ? '\n\nidentical copies:\n' + c.also.join('\n') : ''}${c.prompt ? '\n\nprompt: ' + c.prompt : ''}`;
    const vr = variants.has(c.letter);
    const vbtn = `<button class="bs-var${vr ? ' on' : ''}" title="keep this set as a valid VARIANT as well as your one pick (saved as variants: [...] on the row)" onclick="event.stopPropagation();artToggleVariant('${it.id}','${c.letter}')">${vr ? '✓ variant' : '+ variant'}</button>`;
    return `<div class="bs-set ac-${c.kind}${c.winner ? ' ac-win' : ''}${picked ? ' ac-picked' : ''}${vr ? ' bs-isvar' : ''}">
      <div class="bs-head bs-pick" data-pick-id="${esc(it.id)}" data-pick-g="${esc(g.key)}" data-pick-l="${c.letter}" data-pick-primary="${g.primary ? 1 : 0}" title="${esc(tip)}\n\nclick to pick this set"><b>${c.letter}</b>${c.near_of ? `<i class="bs-nearof" title="near-duplicate of set ${c.near_of} (dHash within ${NEAR_BITS} bits on every facing)">≈${c.near_of}</i>` : ''}<span>${esc(c.short)}</span>${c.also ? `<i class="sub">+${c.also.length}</i>` : ''}</div>
      <div class="bs-faces">${g.facings.map(f => cell(c, f)).join('')}</div>
      <div class="bs-foot">${vbtn}${g.primary && c.ppc ? `<i class="bs-ppc" title="resolution of this set: ${c.srcPx[0]} px wide over ${fmt(it.scale.kind === 'plant' ? it.scale.quad : it.scale.drawSize[0])} cells = ${c.ppc} px per cell (enhanced zoom resolves 128–256)">${c.ppc} px/cell</i>` : ''}</div>
    </div>`;
  };
  const canon = it.canon ? `<div class="bs-canonp"><div class="bs-head bs-chead"><b>canon</b><span>${it.canon.base ? 'entry for the base species: ' + esc(it.canon.base) : 'reference — not pickable'}</span></div>
      <div class="bs-cimgs">${it.canon.imgs.map(u => `<div class="thumb bs-cthumb" data-zoom="${u}" data-cap="canon reference · ${esc(it.canon.dir)}"><img src="${u}" loading="lazy" alt=""></div>`).join('') || '<span class="sub">entry has no images</span>'}</div>
      <div class="bs-must"><b>Must show</b><pre>${esc(it.canon.must || '(this entry lists no Must show)')}</pre>${it.canon.ruling ? `<b>Your ruling on the entry</b><pre>${esc(it.canon.ruling)}</pre>` : ''}<details><summary>visual brief</summary><pre>${esc(it.canon.brief)}</pre></details></div></div>` : '';
  const sec = (g, i) => {
    /* Every set in LETTER order, so the letters read contiguously (owner, Vhaulk note 2026-10-04: "I see only
       A and C, no B"). A near-duplicate keeps its place and its letter as a narrow stub that expands in place. */
    const ordered = g.cols.slice().sort((a, b) => LETTER_ORDER.indexOf(a.letter) - LETTER_ORDER.indexOf(b.letter));
    const stub = c => `<details class="bs-nearstub"${d.decision === c.letter || picks[g.key] === c.letter || variants.has(c.letter) ? ' open' : ''}><summary title="set ${c.letter} looks almost the same as set ${c.near_of} — click to show it"><b>${c.letter}</b><span>≈ ${c.near_of}</span><span class="sub">near-<br>duplicate<br>▸ show</span></summary>${col(c, g)}</details>`;
    const many = it.graphics.length > 1;
    const cur = g.primary ? d.decision : picks[g.key];
    const head = many ? `<div class="bs-gh" title="${esc(g.res || 'renders matched by name, not bound to a texture path')}"><b>${esc(g.role)}</b>${g.res ? ` <span class="sub">${esc(g.res.split('/').pop())}</span>` : ''} · ${g.primary ? 'buttons on the right' : `click a set · picked <b>${esc(cur || 'nothing')}</b>`}</div>` : '';
    const prior = g.prior ? `<div class="bs-prior" title="${esc(g.prior.was)}">${esc(g.prior.text)}${g.prior.note ? ' — “' + esc(g.prior.note) + '”' : ''}</div>` : '';
    return `<div class="bs-g">${head}${prior}
      <div class="bs-strip">${ordered.map(c => c.near_of ? stub(c) : col(c, g)).join('')}</div></div>`;
  };
  const links = it.related.length ? `<div class="bs-links">related (judged separately): ${it.related.map(r => `<a href="#" data-jump="${esc(r.id)}">${esc(r.label)} <span class="sub">${esc(r.id)}</span></a> <span class="sub">${esc(r.why)}</span>`).join(' · ')}</div>` : '';
  const elsewhere = it.elsewhere.length ? `<div class="sub">also related, not in this biome: ${it.elsewhere.map(esc).join(', ')}</div>` : '';
  const noart = it.noArt ? `<div class="bs-noart">NO ART YET — nothing found after searching every source:<div style="font-size:11px;font-weight:normal;opacity:.85;margin-top:3px;word-break:break-word">${esc(it.noArtWhy)}</div></div>` : '';
  const rline = r => `<div class="ac-r bs-r ac-t-${r.trust}" title="${esc(r.at + ' ' + r.verdict + ' · ' + r.trust + ' · ' + r.sheet + (r.note ? '\n“' + r.note + '”' : ''))}">${esc(r.at)} <b>${esc(r.verdict)}</b> <span class="sub">${esc(r.trust)} · ${esc(r.sheet)}</span> ${r.note ? '“' + esc(r.note) + '”' : ''}</div>`;
  const rs = it.rulings.slice().reverse();          /* newest first; older ones fold */
  const rul = rs.length ? `<div class="ac-rulings">${rs.slice(0, 2).map(rline).join('')}${rs.length > 2 ? `<details><summary class="sub">${rs.length - 2} older ruling(s)</summary>${rs.slice(2).map(rline).join('')}</details>` : ''}</div>` : '';
  const ds = it.desc || {};
  const dtext = ds.description || '';
  const desc = !ds.def ? `<div class="bs-desc sub">in-game description: UNMEASURED — no ThingDef of this row in the live def dump</div>`
    : dtext.length > 260 ? `<details class="bs-desc" title="${esc(ds.source)}"><summary><b>${esc(ds.label)}</b> — <span class="bs-dclamp">${esc(dtext)}</span></summary></details>`
    : `<div class="bs-desc" title="${esc(ds.source)}"><b>${esc(ds.label)}</b> — ${esc(dtext || '(the def has no description)')}</div>`;
  const pf = it.prefillSource === 'sit1' ? '' : it.contested ? '<span class="mark inferred" title="' + esc(it.prefillWhy) + '">⚠ agent prefill: ' + esc(it.prefillShort) + '</span>' : '<span class="mark absent">prefill: ' + esc(it.prefillShort) + '</span>';
  return `<div class="ac-body bs-body" style="${it.band ? 'border-left:6px solid ' + it.band + ';padding-left:8px' : ''}">
    <div class="bs-meta"><div class="effect">${esc(it.effect)}</div>
    <div class="marks"><span class="mark bs-tier bs-${it.tier}">${esc(it.tierText)}</span>${it.canonTag ? `<span class="mark bs-nocanon">${esc(it.canonTag)}</span>` : ''}${it.flags.filter(f => f !== 'NO ART YET').map(f => `<span class="mark contested">${esc(f)}</span>`).join('')}${pf}</div>
    ${desc}${links}${elsewhere}${rul}${noart}</div>
    <div class="bs-content"><div class="bs-graphics">${it.graphics.map(sec).join('')}</div>${scaleBlock(it)}${canon}</div></div>`;
};
const fmt = x => (x == null ? '?' : (+x).toFixed(3).replace(/\.?0+$/, ''));
function scaleBlock(it) {
  const s = it.scale; if (!s) return '';
  const size = s.kind === 'plant'
    ? `<b>${fmt(s.quad)}-cell</b> plant <span class="sub">= drawSize.x ${fmt(s.drawSize[0])} × visualSize.max ${fmt(s.visualMax)}</span>${s.mesh > 1 ? ` · <b>×${s.mesh}</b> per cell` : ''}`
    : `<b>${fmt(s.cells)} cells</b> <span class="sub">adult drawSize ${fmt(s.drawSize[0])}×${fmt(s.drawSize[1])}</span> · bodySize ${fmt(s.bodySize)}`;
  const sizeTip = s.kind === 'plant' ? `Plant.Print draws a SQUARE quad of drawSize.x × visualSizeRange (max at maturity)${s.mesh > 1 ? `; maxMeshCount ${s.mesh} prints ${s.mesh} quads on a ${Math.round(Math.sqrt(s.mesh))}×${Math.round(Math.sqrt(s.mesh))} sub-grid of ONE cell` : '; one mesh, centred, lifted so its base sits on the cell edge'}` : 'the adult (last) life stage bodyGraphicData.drawSize — what the engine draws';
  const q = s.kind === 'plant' ? s.quad : (s.drawSize || [])[0];
  const vcls = !s.ppc ? '' : s.ppc < 64 ? 'bs-low' : s.ppc < 120 ? 'bs-mid' : s.ppc > 256 ? 'bs-over' : 'bs-ok';
  const res = s.img ? `<div class="bs-scl bs-scres ${vcls}" title="${esc(s.verdict)}. Enhanced zoom (owner, 2026-10-04) resolves 128–256 px per cell of the draw size; below 128 reads soft at max zoom, below 64 loses detail. Shown: set ${esc(s.set)} (${esc(s.by)}, ${esc(s.face)} facing).">set <b>${esc(s.set)}</b> · ${s.srcPx[0]}px ÷ ${fmt(q)} = <b>${s.ppc} px/cell</b> <span class="sub">${s.ppc < 64 ? 'below 64 floor' : s.ppc < 120 ? 'soft at max zoom' : s.ppc > 256 ? 'above 256 max zoom' : 'in the 128–256 zoom range'} · ${esc(s.by)}</span></div>` : `<div class="sub">${esc(s.why || '')}</div>`;
  const pic = s.img ? `<div class="bs-scimg" data-zoom="${s.full}" data-cap="${esc(it.label)} · set ${esc(s.set)} · max zoom ${s.zoomFullPpc || '?'} px/cell (human | this), then normal play 32 and zoomed out 18 px/cell, each also ×4 nearest"><img src="${s.img}" alt=""></div>` : '';
  return `<div class="bs-scale"><div class="bs-head bs-schead"><b>in-game size</b><span>vanilla human beside it at the same scale · max zoom ${s.zoomPpc ? s.zoomPpc + ' px/cell' : ''}${s.zoomFitted ? ' (shrunk to fit)' : ''}${s.zoomCropped ? ' (cropped, not shrunk)' : ''} + normal play 32 · click to enlarge</span></div>${pic}
    <div class="bs-scl bs-scsize" title="${esc(sizeTip)}">${size}</div>${res}
    <div class="bs-scsrc ${s.status === 'measured' ? '' : 'bs-fallback'}" title="${esc(s.source)}">${s.status === 'measured' ? 'MEASURED' : 'FALLBACK'} · ${esc(s.source)}</div></div>`;
}

const LETTER_ORDER = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const NEAR_BITS = 10;
window.artToggleVariant = (id, letter) => {
  if (frozen) return;
  const it = byId.get(id); if (!it) return;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  const s = new Set(rec.variants || []);
  if (s.has(letter)) s.delete(letter); else s.add(letter);
  rec.variants = [...s].sort((a, b) => LETTER_ORDER.indexOf(a) - LETTER_ORDER.indexOf(b));
  rec.variantsAt = new Date().toISOString();
  queue(id); patchRow(id); paintCounts();
};
window.artPick = (id, g, letter) => {
  if (frozen) return;
  const it = byId.get(id); if (!it) return;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  rec.picks = Object.assign({}, it.prefillPicks || {}, rec.picks || {});
  rec.picks[g] = letter; rec.decidedAt = new Date().toISOString();
  queue(id); patchRow(id); paintCounts();
};
document.addEventListener('click', e => {
  if (e.target.closest('.ac-purge') || e.target.closest('.bs-var')) return;
  const p = e.target.closest('[data-pick-l]');
  if (p) {
    e.preventDefault(); e.stopPropagation();
    if (p.dataset.pickPrimary === '1') setDecision(p.dataset.pickId, p.dataset.pickL);
    else window.artPick(p.dataset.pickId, p.dataset.pickG, p.dataset.pickL);
    return;
  }
  const j = e.target.closest('[data-jump]');
  if (j) {
    e.preventDefault(); e.stopPropagation();
    const node = document.querySelector(`.row[data-id="${cssEsc(j.dataset.jump)}"]`);
    if (node) { node.scrollIntoView({ block: 'center' }); node.classList.add('bs-flash'); setTimeout(() => node.classList.remove('bs-flash'), 1500); }
    else alert('That row is hidden by the current filter.');
  }
}, true);

window.artRepaint = id => {
  const node = document.querySelector(`.row[data-id="${cssEsc(id)}"] .ac-body`);
  const it = byId.get(id);
  if (node && it) node.outerHTML = window.itemBody(it);
};
window.artTogglePurge = (id, sha) => {
  if (frozen) return;
  const it = byId.get(id); if (!it) return;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  const s = new Set(rec.purge || []);
  if (s.has(sha)) s.delete(sha); else s.add(sha);
  rec.purge = [...s]; rec.purgeTouched = true;
  queue(id); patchRow(id); paintCounts();
};
addEventListener('DOMContentLoaded', () => {
  /* A decision click is recorded as decidedAt, so a row touched ONLY to purge or annotate
     never turns its prefill into a ruling at ingest (art_sheet.py docstring). */
  const orig = window.setDecision;
  if (typeof orig === 'function') window.setDecision = function (id, key, opts) {
    orig(id, key, opts);
    if (DEC[id]) { DEC[id].decidedAt = new Date().toISOString(); queue(id); }
  };
  /* The template's patchRow repaints only the buttons; the picked-column frame and the purge
     marks live in the row body, so repaint that too (also covers undo/redo). */
  const origPatch = window.patchRow;
  if (typeof origPatch === 'function') window.patchRow = function (id) { origPatch(id); window.artRepaint(id); };
});
/* Column letters are per row: the pick buttons show only the letters this row has (template hook). */
window.itemOptions = it => OPTS.filter(o => !(o.key.length === 1 && /[A-Za-z]/.test(o.key)) || (it.letters || []).includes(o.key));
</script>
<style>
.ac-grid{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;align-items:flex-start}

<script>
"use strict";

/* ─────────────────────────────────────────────────────────────────────────────────────
   config + items
   ───────────────────────────────────────────────────────────────────────────────────── */
const CFG   = JSON.parse(document.getElementById('CONFIG').textContent);
const ITEMS = JSON.parse(document.getElementById('ITEMS').textContent);
const OPTS  = CFG.options || [];
const OPTBY = Object.fromEntries(OPTS.map(o => [o.key, o]));
const SIDECAR = window.__SIDECAR__ || null;


const el   = id => document.getElementById(id);
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
window.esc = esc;

/* ─────────────────────────────────────────────────────────────────────────────────────
   storage keys are NAMESPACED, and this is not decoration.

   MEASURED: every file:// page shares ONE storage origin. A page in /tmp/a.html read a
   key written by a page in /tmp/b/other.html — origin is literally "file://". So two
   review sheets opened from disk share localStorage AND IndexedDB. An unnamespaced
   'decisions' key means sheet B silently eats sheet A's review, and an unnamespaced
   IndexedDB handle means sheet B auto-writes into sheet A's FILE while reporting "saved".
   ───────────────────────────────────────────────────────────────────────────────────── */
const NS = 'rs:' + (CFG.sheetId || 'unnamed') + ':';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); }
              catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
};

/* ─────────────────────────────────────────────────────────────────────────────────────
   state
   ───────────────────────────────────────────────────────────────────────────────────── */
let DEC = {};                 // id -> {decision, note, prefill, at}
let dirty = new Map();        // id -> decision object, pending flush
const undoStack = [], redoStack = [];
let focusIdx = -1, shown = [], backend = null, frozen = false;

const prefillOf = it => (it.prefill ?? null);
const decOf     = id => DEC[id] || null;
const decisionOf = id => { const d = decOf(id); return d && d.decision ? d.decision : ''; };
const isDecided = id => !!decisionOf(id);
/* A CLEARED row is not a disagreement. {decision:'', prefill:'keep'} means "I unset this",
   so the amber override rail and the "overrides only" filter must both leave it alone —
   serve_sheet.py counts it the same way. */
const isOverride = id => {
  const d = decOf(id); if (!d || !d.decision) return false;
  const pf = d.prefill ?? null;
  return pf !== null && pf !== '' && d.decision !== pf;
};

/* ─────────────────────────────────────────────────────────────────────────────────────
   persistence — three backends, one interface: load() and save(ops).

   The server backend is the good one. It exists because moving the write out of the page
   relocates the rules an agent has to remember (merge per row, keep unknown top-level
   keys, refuse a truncating write, stamp provenance) into plumbing that enforces them.
   ───────────────────────────────────────────────────────────────────────────────────── */
class ServerBackend {
  constructor(cfg) { this.cfg = cfg; this.name = 'sidecar'; this.writes = 0; }
  async load() {
    const r = await fetch('/decisions', { headers: { 'X-Sheet-Token': this.cfg.token } });
    if (!r.ok) throw new Error('GET /decisions ' + r.status);
    const doc = await r.json();
    frozen = doc.frozen === true;
    this.writes = doc.writeCount || 0;
    return doc.decisions || {};
  }
  async save(ops, opts = {}) {
    const r = await fetch('/decisions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Sheet-Token': this.cfg.token },
      body: JSON.stringify(opts.force ? { ops, force: true } : { ops }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.status === 423) { frozen = true; throw new Error('frozen: ' + (body.frozenMeaning || 'read-only')); }
    if (r.status === 409) {
      const e = new Error(body.hint || body.error || 'refused a truncating write');
      /* Only the truncation refusal is forceable. A "decisions is not an object" 409 is a
         corrupt file, and forcing past it would destroy exactly what it is protecting. */
      e.forceable = body.error === 'truncating-write';
      throw e;
    }
    if (!r.ok) throw new Error(body.error || ('POST /decisions ' + r.status));
    this.writes = body.writeCount;
    return body;
  }
  get where() { return this.cfg.decisionsPath || CFG.decisionsFile; }
}

/* Fallback for a sheet opened straight off disk with nothing running. No paste: the
   decisions file already exists next to the sheet, so the human OPENS it rather than
   doing Save-As into a folder the picker will not let us preselect. */
class FileBackend {
  constructor() { this.name = 'file'; this.handle = null; this.writes = 0; }
  static available() { return typeof window.showOpenFilePicker === 'function'; }

  async idb(mode = 'readonly') {
    if (!this._db) this._db = await new Promise((res, rej) => {
      const r = indexedDB.open('review_sheets', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('handles');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db.transaction('handles', mode).objectStore('handles');
  }
  // NB the key is namespaced: see the shared file:// origin note above.
  async remember(h) { const s = await this.idb('readwrite'); s.put(h, NS + 'handle'); }
  async recall() {
    const s = await this.idb();
    return new Promise(res => { const g = s.get(NS + 'handle'); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); });
  }

  async link(handle) {
    // Verify the handle is for THIS sheet's file before writing a byte. A stale or
    // cross-sheet handle that passes silently writes one review into another's file.
    const want = CFG.decisionsFile;
    if (want && handle.name !== want)
      throw new Error(`that file is "${handle.name}", this sheet writes "${want}" — pick the right one`);
    if (await handle.queryPermission({ mode: 'readwrite' }) !== 'granted')
      if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted')
        throw new Error('write permission refused');
    this.handle = handle; await this.remember(handle); return handle;
  }
  async pick() {
    const [h] = await window.showOpenFilePicker({
      id: 'review-sheets',                     // makes the picker reopen in the same folder
      multiple: false,
      types: [{ description: 'Decisions', accept: { 'application/json': ['.json'] } }],
    });
    return this.link(h);
  }
  async load() {
    const h = this.handle || await this.recall();
    if (!h) return null;                        // not linked yet
    if (await h.queryPermission({ mode: 'readwrite' }) !== 'granted') { this.handle = h; return null; }
    this.handle = h;
    const doc = JSON.parse(await (await h.getFile()).text() || '{}');
    frozen = doc.frozen === true; this.doc = doc; this.writes = doc.writeCount || 0;
    return doc.decisions || {};
  }
  async save(ops) {
    if (!this.handle) throw new Error('not linked to a file yet');
    // Read-modify-write, because THIS page is not the only author of its own file: a
    // whole-file writer deletes keys it does not know about (frozen/frozenOn/…).
    const doc = JSON.parse(await (await this.handle.getFile()).text() || '{}');
    /* Judge the freeze on the doc we JUST read, not on a boot-time global: a freeze
       applied while the sheet is open must bite on the next write, not after a reload.
       The freeze is enforced, not announced. */
    if (doc.frozen === true) {
      frozen = true; paintLink();
      throw new Error('frozen: ' + (doc.frozenMeaning || 'the decisions file is read-only'));
    }
    if (frozen) throw new Error('frozen: read-only');
    const merged = Object.assign({}, doc.decisions || {}, ops);
    for (const [k, v] of Object.entries(ops)) if (v === null) delete merged[k];
    doc.decisions = merged;
    doc.savedBy = 'review-sheet-page'; doc.savedAt = new Date().toISOString();
    doc.writeCount = (doc.writeCount || 0) + 1;
    doc.decidedCount = Object.values(doc.decisions).filter(v => v && v.decision).length;
    const w = await this.handle.createWritable();
    await w.write(JSON.stringify(doc, null, 2) + '\n'); await w.close();
    this.writes = doc.writeCount;
    return { writeCount: doc.writeCount, savedAt: doc.savedAt };
  }
  get where() { return this.handle ? this.handle.name : (CFG.decisionsPath || CFG.decisionsFile); }
}

/* Last resort. Loud, because this is the state that once cost a human a 71-row review:
   they finished, the file was byte-identical to the pre-fill, and every choice was in
   localStorage. */
class LocalBackend {
  constructor() { this.name = 'localStorage'; this.writes = 0; }
  async load() { return LS.get('decisions', null); }
  async save(ops) {
    const cur = LS.get('decisions', {}) || {};
    Object.assign(cur, ops);
    for (const [k, v] of Object.entries(ops)) if (v === null) delete cur[k];   // null deletes
    LS.set('decisions', cur);
    this.writes++; return { writeCount: this.writes };
  }
  get where() { return 'browser storage — NOT a file'; }
}

/* ─────────────────────────────────────────────────────────────────────────────────────
   flush: debounced, op-based. Only touched rows are ever sent, so no client bug can
   empty the file — the failure this format was bitten by.
   ───────────────────────────────────────────────────────────────────────────────────── */
let flushTimer = null, saving = false, lastSaved = null, saveErr = null, forceNext = false;
/* Whether the banner currently on screen is one FLUSH put there. Only those get cleared on
   a successful save — a seed or freeze banner is not mine to remove. */
let saveBannerUp = false;
function queue(id) {
  DEC[id].at = new Date().toISOString();
  dirty.set(id, DEC[id]);
  paintLink();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);       // notes are typed per keystroke
}
async function flush() {
  if (saving || !dirty.size || !backend) return;
  const ops = Object.fromEntries(dirty); dirty.clear();
  const force = forceNext; forceNext = false;
  saving = true; saveErr = null; paintLink();
  try {
    const r = await backend.save(ops, { force });
    lastSaved = new Date(); if (r && r.writeCount) backend.writes = r.writeCount;
    /* The write landed — so the refusal on screen is now a LIE. Nothing else clears it:
       paintLink only repaints the pill, and a red "refused…" banner over a disabled
       "clearing…" button left the human staring at a failure that had already succeeded.
       Saved-but-contradicted is worse than not-saved, because he has no reason to look
       again. Only clear it when there is nothing left pending to fail. */
    if (saveBannerUp && !dirty.size) { clearBanner(); saveBannerUp = false; }
  } catch (e) {
    saveErr = e.message || String(e);
    for (const [k, v] of Object.entries(ops)) if (!dirty.has(k)) dirty.set(k, v);   // keep it pending
    // A forced write that fails must say so with a FRESH banner and a live button, not
    // leave the stale one up: showTruncationRefusal/showErr rebuild the node entirely.
    if (e.forceable) showTruncationRefusal(e); else showErr(saveErr);
    saveBannerUp = true;
  } finally { saving = false; paintLink(); if (dirty.size && !saveErr) setTimeout(flush, 300); }
}

/* The truncation guard is right to refuse a batch that clears dozens of decided rows —
   and undoing a bulk action is exactly such a batch when it is legitimate. Without a way
   through, those ops sit pending forever and the screen and the file diverge silently.
   So the page offers the way through as an explicit human act: one button, one click,
   sending force=1 for that batch only. It is never sent automatically. */
function showTruncationRefusal(e) {
  const b = banner('bad',
    esc(e.message || 'refused: this batch clears an implausible number of decided rows.')
    + ` <b>${dirty.size}</b> change(s) are still pending in the page and nothing has been `
    + 'written. If you meant to clear them, say so:',
    '<button class="btn pri" id="forceSave">yes — clear them anyway</button>');
  const btn = b.querySelector('#forceSave');
  if (btn) btn.onclick = () => {
    btn.disabled = true; btn.textContent = 'clearing…';
    forceNext = true; saveErr = null; clearTimeout(flushTimer);
    Promise.resolve(flush()).then(() => {
      /* A success removes this whole banner and a failure rebuilds it, so in both cases
         this node is gone. Still connected means the flush no-opped (a save already in
         flight, nothing pending) — give the human a live button back rather than one
         permanently reading "clearing…". */
      if (btn.isConnected) { btn.disabled = false; btn.textContent = 'yes — clear them anyway'; }
    });
  };
}
addEventListener('beforeunload', e => {
  if (dirty.size) { e.preventDefault(); e.returnValue = 'Unsaved decisions are still pending.'; }
});

/* ─────────────────────────────────────────────────────────────────────────────────────
   decisions
   ───────────────────────────────────────────────────────────────────────────────────── */
function setDecision(id, key, opts = {}) {
  if (frozen) { showErr('This sheet is frozen — decisions are read-only.'); return; }
  const it = byId.get(id); if (!it) return;
  const before = DEC[id] ? JSON.parse(JSON.stringify(DEC[id])) : null;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  if (rec.prefill === undefined) rec.prefill = prefillOf(it);
  rec.decision = (rec.decision === key && opts.toggle) ? '' : key;
  rec.decidedAt = new Date().toISOString();      // a human act: prefilled vs yours is countable
  if (!opts.noUndo) { undoStack.push({ entries: [{ id, before }] }); redoStack.length = 0; }
  queue(id);
  patchRow(id);
  paintCounts();
  /* Deliberately NOT auto-focusing the note here. An earlier version grabbed focus and
     demanded "why?" on every disagreement; it reads as nagging, and a control that fights
     the human gets worked around rather than used. The row still MARKS itself as an
     override (the ⟲ chip and the amber rail in card()), the "overrides only" filter still
     finds them, and `serve_sheet.py --overrides` still reads them as a group — which is
     what section 2b actually asks for, since the reader is the agent, not the human. */
}
function setNote(id, text) {
  if (frozen) return;
  const it = byId.get(id); if (!it) return;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  rec.note = text; queue(id); paintCounts();
}
/* Undo and redo work on ONE entry shape — {entries:[{id, before}]} — whether the action
   touched one row or eighty. An earlier version had a separate batch shape that undo()
   did not understand, so `u` silently did nothing after a bulk apply. Measured, not
   theorised: an irreversible bulk action over 80 rows is one nobody dares use. */
function applyEntries(entries) {
  const inverse = entries.map(({ id }) =>
    ({ id, before: DEC[id] ? JSON.parse(JSON.stringify(DEC[id])) : null }));
  for (const { id, before } of entries) {
    if (before === null) delete DEC[id]; else DEC[id] = before;
    /* null is DELETE in the protocol. Sending an empty stub instead left a row behind that
       reads as "looked at it, decided nothing" — undoing back to a row that was never
       touched must remove the entry, not invent one. */
    dirty.set(id, before === null ? null : DEC[id]);
    patchRow(id);
  }
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400);
  paintCounts(); paintLink();
  return inverse;
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  redoStack.push({ entries: applyEntries(u.entries) });
}
function redo() {
  const r = redoStack.pop(); if (!r) return;
  undoStack.push({ entries: applyEntries(r.entries) });
}
function bulkGroup(group, key) {
  const rows = shown.filter(it => it.group === group);
  if (!rows.length) return;
  const entries = rows.map(it => ({ id: it.id, before: DEC[it.id] ? JSON.parse(JSON.stringify(DEC[it.id])) : null }));
  rows.forEach(it => setDecision(it.id, key, { noUndo: true, bulk: true }));
  undoStack.push({ entries });
  redoStack.length = 0;
  render();
}

/* ─────────────────────────────────────────────────────────────────────────────────────
   render
   ───────────────────────────────────────────────────────────────────────────────────── */
const byId = new Map(ITEMS.map(it => [it.id, it]));
let renderMs = 0;

function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function defaultBody(it) {
  const marks = [];
  if (it.inferred)  marks.push('<span class="mark inferred" title="guessed from the name — the data was empty">⚠ inferred</span>');
  if (it.contested) marks.push('<span class="mark contested" title="defensible both ways">◆ contested</span>');
  if (it.occurs === false) marks.push('<span class="mark absent">does not occur</span>');
  for (const [k, v] of Object.entries(it.meta || {})) marks.push(`<span class="mark absent">${esc(k)}: ${esc(v)}</span>`);
  return `<div class="effect">${esc(it.effect || '')}</div>`
       + (marks.length ? `<div class="marks">${marks.join('')}</div>` : '');
}

function card(it) {
  const d = decOf(it.id), key = d && d.decision ? d.decision : '';
  const o = OPTBY[key];
  const ovr = isOverride(it.id);
  const body = (window.itemBody || defaultBody)(it);
  const thumb = it.thumb
    ? `<div class="thumb" data-zoom="${esc(it.thumb)}" data-cap="${esc(it.label || it.id)}"><img src="${esc(it.thumb)}" loading="lazy" decoding="async" alt=""></div>`
    : '';
  /* window.itemOptions(it) -> option list for THIS row (default: all). A sheet whose options
     differ per row (column letters) shows only the ones that row has. */
  const rowOpts = (window.itemOptions && window.itemOptions(it)) || OPTS;
  const opts = rowOpts.map(op => `<button data-set="${esc(op.key)}" class="${op.key === key ? 'sel' : ''}"`
      + `${op.key === key ? ` style="background:${esc(op.color)}"` : ''}`
      + ` title="${esc(op.label)} (${esc(op.hotkey || '')})">${esc(op.label)}</button>`).join('');
  return `<div class="row${ovr ? ' override' : ''}" data-id="${esc(it.id)}"${o ? ` style="color:${esc(o.color)}"` : ''}>
    ${thumb}
    <div class="main">
      <div class="label">${esc(it.label || it.id)}<span class="id">${esc(it.id)}</span>
        ${ovr ? `<span class="mark ovr" title="you overruled the pre-fill, which said ${esc(d.prefill)}">⟲ was ${esc(d.prefill)}</span>` : ''}</div>
      ${body}
    </div>
    <div class="ctrl">
      <div class="opts">${opts}</div>
      <textarea class="note" rows="1" placeholder="note…">${esc(d ? d.note || '' : '')}</textarea>
    </div>
  </div>`;
}

function passes(it) {
  const q = el('q').value.trim().toLowerCase();
  if (q) {
    const hay = `${it.id} ${it.label || ''} ${it.effect || ''} ${it.group || ''}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const fs = el('fstate').value;
  if (fs === '__undecided' && isDecided(it.id)) return false;
  if (fs === '__decided' && !isDecided(it.id)) return false;
  if (fs && fs.startsWith('k:') && decisionOf(it.id) !== fs.slice(2)) return false;
  const fg = el('fgroup').value;
  if (fg && it.group !== fg) return false;
  const fm = el('fmark').value;
  if (fm === 'override' && !isOverride(it.id)) return false;
  if (fm === 'contested' && !it.contested) return false;
  if (fm === 'inferred' && !it.inferred) return false;
  if (fm === 'noted' && !String((decOf(it.id) || {}).note || '').trim()) return false;
  return true;
}

function render() {
  const t0 = performance.now();
  shown = ITEMS.filter(passes);
  const groups = new Map();
  for (const it of shown) { if (!groups.has(it.group)) groups.set(it.group, []); groups.get(it.group).push(it); }
  let html = '';
  for (const [name, items] of groups) {
    /* an option with bulk:false gets no "all X" button (e.g. per-row column letters, where
       the same key means a different picture on every row) */
    const bulk = OPTS.filter(op => op.bulk !== false).map(op => `<button class="btn" data-bulk="${esc(op.key)}" data-group="${esc(name)}">all ${esc(op.label.toLowerCase())}</button>`).join('');
    /* de-stick groups of <=3: a sticky label sits on top of the only row in a group of
       one, which makes it unreadable and unclickable. */
    html += `<div class="gh${items.length <= 3 ? ' nostick' : ''}">${esc(name)}`
          + `<span class="ghcount">${items.length}</span><span class="ghbulk">${bulk}</span></div>`;
    html += items.map(card).join('');
  }
  el('list').innerHTML = html || `<div style="padding:40px 18px;color:var(--dim)">Nothing matches these filters.</div>`;
  for (const ta of el('list').querySelectorAll('.note')) if (ta.value) grow(ta);
  renderMs = performance.now() - t0;
  measure();                                  // new .gh nodes have no top yet
  paintCounts();
  if (focusIdx >= shown.length) focusIdx = shown.length - 1;
  paintFocus(false);
}

/* patch ONE row instead of re-rendering the list: at 600 rows a full innerHTML rebuild
   on every keystroke drops the caret out of the note field and feels broken. */
function patchRow(id) {
  const node = document.querySelector(`.row[data-id="${cssEsc(id)}"]`);
  if (!node) return;
  const it = byId.get(id), d = decOf(id), key = d && d.decision ? d.decision : '';
  const o = OPTBY[key];
  node.style.color = o ? o.color : '';
  node.classList.toggle('override', isOverride(id));
  for (const b of node.querySelectorAll('[data-set]')) {
    const on = b.dataset.set === key;
    b.classList.toggle('sel', on);
    b.style.background = on ? OPTBY[b.dataset.set].color : '';
  }
  const lab = node.querySelector('.label .mark.ovr');
  if (isOverride(id) && !lab) node.querySelector('.label').insertAdjacentHTML('beforeend',
    `<span class="mark ovr">⟲ was ${esc(d.prefill)}</span>`);
  if (!isOverride(id) && lab) lab.remove();
}

/* ── measured header height, every render and every resize ───────────────────────────── */
function measure() {
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
  for (const g of document.querySelectorAll('.gh')) g.style.top = h + 'px';
}
addEventListener('resize', measure);

/* ─────────────────────────────────────────────────────────────────────────────────────
   counts, link state, banners
   ───────────────────────────────────────────────────────────────────────────────────── */
function paintCounts() {
  const total = ITEMS.length;
  let decided = 0, ovr = 0, noted = 0, contested = 0, yours = 0;
  const per = {};
  for (const it of ITEMS) {
    const k = decisionOf(it.id);
    if (k) { decided++; per[k] = (per[k] || 0) + 1;
      const d = decOf(it.id);
      if (d.decidedAt || isOverride(it.id) || prefillOf(it) == null) yours++; }
    if (isOverride(it.id)) ovr++;
    if (String((decOf(it.id) || {}).note || '').trim()) noted++;
    if (it.contested && !isDecided(it.id)) contested++;
  }
  const inn = OPTS.filter(o => o.counts === 'in').reduce((n, o) => n + (per[o.key] || 0), 0);
  const out = OPTS.filter(o => o.counts === 'out').reduce((n, o) => n + (per[o.key] || 0), 0);
  el('progress').innerHTML =
    `<b>${yours}</b>/${total} decided by you`
    + (decided - yours ? ` · <b>${decided - yours}</b> still the agent's prefill` : '')
    + ` · <b>${total - decided}</b> empty`
    + (OPTS.some(o => o.counts) ? ` · ${inn} in · ${out} stripped` : '')
    + ` · ${ovr} overruled · ${noted} noted`
    + (shown.length !== total ? ` · showing ${shown.length}` : '')
    + ` · render ${renderMs.toFixed(0)}ms`;
  paintPosture(inn, out, total - decided);
}

function paintPosture(inn, out, undecided) {
  const p = CFG.posture || {};
  const strip = p.mode === 'whitelist';
  el('posturePanel').innerHTML =
    `<h3>Posture — ${esc((p.mode || 'whitelist').toUpperCase())}</h3>`
    + `<div>${esc(p.explain || (strip
        ? 'Default is EXCLUDE. Anything not kept will be stripped.'
        : 'Default is INCLUDE. Only what you cut will be stripped.'))}</div>`
    + `<div style="margin-top:5px"><b style="color:var(--ok)">${inn}</b> kept · `
    + `<b style="color:var(--bad)">${out}</b> stripped`
    + (strip && undecided ? ` · <b style="color:var(--warn)">${undecided} undecided, which this posture also strips</b>` : '')
    + `</div>`;
}

function paintLink() {
  const p = el('link');
  const n = dirty.size;
  let cls = 'pill live', txt;
  if (!backend) { txt = 'connecting…'; cls = 'pill'; }
  else if (frozen) { txt = '🔒 frozen — read only'; cls = 'pill'; }
  else if (saveErr) { txt = '⚠ not saved — ' + saveErr.slice(0, 60); cls = 'pill bad'; }
  else if (saving) txt = '↑ saving…';
  else if (n) txt = `● ${n} pending`;
  else if (backend.name === 'localStorage') { txt = '⚠ browser storage only — NOT a file'; cls = 'pill bad'; }
  else if (backend.name === 'file' && !backend.handle) { txt = '○ not linked — click “link file”'; cls = 'pill bad'; }
  else txt = `● ${backend.name} · saved${lastSaved ? ' ' + ago(lastSaved) : ''} · ${backend.writes} write${backend.writes === 1 ? '' : 's'}`;
  p.className = cls; p.textContent = txt; p.title = backend ? backend.where : '';
  /* The copy-JSON escape hatch is shown exactly while the work is NOT in a file, and it
     disappears the moment a link is established. */
  const unlinked = !!backend && (backend.name === 'localStorage'
                                 || (backend.name === 'file' && !backend.handle));
  el('exportbar').classList.toggle('hide', !unlinked);
  if (!unlinked) el('exportTa').classList.add('hide');
}
const ago = d => { const s = Math.round((Date.now() - d) / 1000);
  return s < 2 ? 'just now' : s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; };
setInterval(() => { if (!dirty.size && !saving) paintLink(); }, 5000);

/* Banners share one node, so every writer must set its OWN class. The seed banner used to
   leave 'banner warn' behind and every later error — save failed, frozen, 409 — rendered
   amber for the rest of the session. Colour is the only thing that says "this one matters". */
function banner(cls, html, extra = '') {
  const b = el('err');
  b.className = 'banner ' + cls;
  b.classList.remove('hide');
  b.innerHTML = html + ' ' + extra
    + ' <button class="btn" onclick="this.parentNode.classList.add(\'hide\')">dismiss</button>';
  return b;
}
function showErr(msg, extra = '') { banner('bad', esc(msg), extra); }
/* Take the banner down and empty it. Emptying matters as much as hiding: a stale node
   left in the DOM comes back with the next classList toggle still carrying old text and
   a disabled button. */
function clearBanner() {
  const b = el('err');
  b.classList.add('hide');
  b.className = 'banner bad hide';
  b.innerHTML = '';
}


/* ─────────────────────────────────────────────────────────────────────────────────────
   PACK: keyboard. Mouse-only across 600 rows is the real bottleneck.
   ───────────────────────────────────────────────────────────────────────────────────── */
const KEYMAP = [
  ['j / ↓', 'next row'], ['k / ↑', 'previous row'],
  ['1 … 9', 'set the decision for the focused row'],
  ['⇧ + 1…9', 'apply to the whole visible group'],
  ['n', 'jump into the note'], ['Enter', 'leave the note'],
  ['u / ⇧U', 'undo / redo — bulk actions undo as one'],
  ['g', 'next undecided row'], ['c', 'next contested row'],
  ['/', 'search'], ['v', 'list / grid'],
  ['z', 'zoom the focused thumbnail'], ['?', 'this help'],
];
function paintKeys() {
  el('keysBody').innerHTML = KEYMAP.map(([k, d]) =>
    `<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(d)}</td></tr>`).join('')
    + OPTS.map(o => `<tr><td><kbd>${esc(o.hotkey)}</kbd></td><td>= ${esc(o.label)}</td></tr>`).join('');
}
function focusRow(i, scroll = true) {
  if (!shown.length) return;
  focusIdx = Math.max(0, Math.min(shown.length - 1, i));
  paintFocus(scroll);
}
function paintFocus(scroll) {
  for (const r of document.querySelectorAll('.row.focus')) r.classList.remove('focus');
  const it = shown[focusIdx]; if (!it) return;
  const node = document.querySelector(`.row[data-id="${cssEsc(it.id)}"]`);
  if (!node) return;
  node.classList.add('focus');
  if (scroll) {
    const top = node.getBoundingClientRect().top;
    const hh = document.querySelector('header').offsetHeight + 34;   // clear the sticky group label
    if (top < hh || top > innerHeight - 90)
      scrollBy({ top: top - hh - 8, behavior: 'instant' });
  }
}
function jumpTo(pred, from = focusIdx) {
  for (let n = 1; n <= shown.length; n++) {
    const i = (from + n + shown.length) % shown.length;
    if (pred(shown[i])) { focusRow(i); return true; }
  }
  return false;
}

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (typing) { document.activeElement.blur(); return; }
    el('keys').classList.remove('on'); el('zoom').classList.remove('on');
    return;
  }
  if (typing) {
    if (e.key === 'Enter' && document.activeElement.classList.contains('note')) {
      e.preventDefault(); document.activeElement.blur();
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;

  if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); focusRow(focusIdx + 1); return; }
  if (k === 'k' || k === 'ArrowUp')   { e.preventDefault(); focusRow(focusIdx - 1); return; }
  if (k === '/') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (k === '?') { el('keys').classList.toggle('on'); return; }
  if (k === 'u') { undo(); return; }
  if (k === 'U') { redo(); return; }
  if (k === 'g') { if (!jumpTo(it => !isDecided(it.id))) showErr('No undecided rows in view.'); return; }
  if (k === 'c') { if (!jumpTo(it => it.contested)) showErr('No contested rows in view.'); return; }
  if (k === 'v' && CFG.media) { toggleGrid(); return; }
  if (k === 'n') { const it = shown[focusIdx]; if (it) {
      const n = document.querySelector(`.row[data-id="${cssEsc(it.id)}"] .note`); if (n) { e.preventDefault(); n.focus(); } }
    return; }
  if (k === 'z') { const it = shown[focusIdx]; if (it && it.thumb) openZoom(it.thumb, it.label || it.id); return; }

  const op = OPTS.find(o => o.hotkey === k);
  if (op) {
    const it = shown[focusIdx >= 0 ? focusIdx : 0]; if (!it) return;
    e.preventDefault();
    if (focusIdx < 0) focusRow(0);
    setDecision(it.id, op.key);
    focusRow(focusIdx + 1);                     // advance, so triage is one key per row
    return;
  }
  const shifted = OPTS.find(o => o.hotkey && '!@#$%^&*('['123456789'.indexOf(o.hotkey)] === k);
  if (shifted) { const it = shown[focusIdx]; if (it) { e.preventDefault(); bulkGroup(it.group, shifted.key); } }
});

/* ─────────────────────────────────────────────────────────────────────────────────────
   PACK: grid / contact sheet
   ───────────────────────────────────────────────────────────────────────────────────── */
function toggleGrid() {
  const on = !document.body.classList.contains('grid');
  document.body.classList.toggle('grid', on);
  el('btnGrid').classList.toggle('on', on);
  el('btnGrid').textContent = on ? 'list' : 'grid';
  el('cell').classList.toggle('hide', !on);
  LS.set('grid', on); measure(); paintFocus(false);
}
function openZoom(src, cap) {
  el('zimg').src = src; el('zcap').textContent = cap; el('zoom').classList.add('on');
}
el('zoom').onclick = () => el('zoom').classList.remove('on');

/* ─────────────────────────────────────────────────────────────────────────────────────
   wiring
   ───────────────────────────────────────────────────────────────────────────────────── */
el('list').addEventListener('click', e => {
  const set = e.target.closest('[data-set]');
  if (set) { const row = set.closest('.row'); setDecision(row.dataset.id, set.dataset.set, { toggle: true });
             focusIdx = shown.findIndex(it => it.id === row.dataset.id); paintFocus(false); return; }
  const bulk = e.target.closest('[data-bulk]');
  if (bulk) { bulkGroup(bulk.dataset.group, bulk.dataset.bulk); return; }
  const th = e.target.closest('[data-zoom]');
  if (th) { openZoom(th.dataset.zoom, th.dataset.cap); return; }
  const row = e.target.closest('.row');
  if (row) { focusIdx = shown.findIndex(it => it.id === row.dataset.id); paintFocus(false); }
});
el('list').addEventListener('input', e => {
  if (e.target.classList.contains('note')) {
    setNote(e.target.closest('.row').dataset.id, e.target.value);
    grow(e.target);
  }
});
/* Notes auto-grow. A one-line box that hides what the human just wrote makes the most
   valuable field on the row look like the least important one. */
function grow(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
}

for (const id of ['q', 'fstate', 'fgroup', 'fmark'])
  el(id).addEventListener(id === 'q' ? 'input' : 'change', () => { render(); LS.set('filters', filtersNow()); });
const filtersNow = () => ({ q: el('q').value, s: el('fstate').value, g: el('fgroup').value, m: el('fmark').value });

el('fold').onclick = () => { autofoldArmed = false; setFold(!document.body.classList.contains('folded')); };
function setFold(f) {
  document.body.classList.toggle('folded', f);
  el('fold').textContent = f ? '▸ brief' : '▾ brief';
  LS.set('folded', f);
  measure();                                    // the header just changed height
}

/* The brief has two jobs that fight each other: it must be SEEN — it carries the posture
   and any rule the agent invented, and burying those is the most expensive mistake this
   format makes — and it must not sit in front of the rows the human came to work on.
   Bounding its height stops the worst case. Auto-folding on the FIRST real scroll
   resolves the rest: they see it, then the moment they start working it gets out of the
   way, and the fold is remembered from then on. One click brings it back. */
let autofoldArmed = false;
function armAutofold(neverChosen) {
  if (!neverChosen) return;                     // they have folded or unfolded before: respect it
  autofoldArmed = true;
  addEventListener('scroll', onFirstScroll, { passive: true });
}
function onFirstScroll() {
  if (!autofoldArmed || scrollY < 220) return;
  autofoldArmed = false;
  removeEventListener('scroll', onFirstScroll);
  setFold(true);
  el('fold').classList.add('flash');            // say where it went
  setTimeout(() => el('fold').classList.remove('flash'), 2400);
}
el('nextUndecided').onclick = () => { if (!jumpTo(it => !isDecided(it.id), focusIdx)) showErr('No undecided rows in view.'); };
el('btnKeys').onclick = () => el('keys').classList.toggle('on');
el('btnGrid').onclick = toggleGrid;
el('cell').oninput = e => { document.documentElement.style.setProperty('--cell', e.target.value + 'px'); measure(); };

/* ── copy JSON: the export route when the work is NOT in a file ───────────────────────
   The whole decisions doc, on the clipboard, in the shape the file wants — so a session
   that never reached disk can be recovered by pasting rather than retyped or lost. */
function decisionsDoc() {
  return JSON.stringify({
    sheetId: CFG.sheetId || 'unnamed',
    posture: (CFG.posture || {}).mode || '',
    criterion: CFG.criterion || '',
    exportedBy: 'review-sheet-page',        // NOT savedBy: this is a copy, not a save
    exportedAt: new Date().toISOString(),
    decidedCount: Object.values(DEC).filter(v => v && v.decision).length,
    decisions: DEC,
  }, null, 2) + '\n';
}
async function copyDecisions(btn) {
  const text = decisionsDoc(), ta = el('exportTa'), why = el('copywhy');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    // Show the JSON rather than fail quietly: the clipboard API is refused on some
    // file:// pages, and a copy button that does nothing is how a review gets lost.
    ta.classList.remove('hide'); ta.value = text; ta.focus(); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    why.textContent = ok
      ? 'copied — and shown below so you can check it landed'
      : 'the clipboard is blocked here — the JSON is below: select all (Ctrl/⌘+A), copy, '
        + 'and paste it over the decisions .json';
  }
  btn.textContent = ok ? 'copied ✓' : 'copy it below ↓';
  setTimeout(() => { btn.textContent = 'copy JSON'; }, 2500);
}
el('copyJson').onclick = () => copyDecisions(el('copyJson'));

for (const b of document.querySelectorAll('[data-copy]'))
  b.onclick = () => copyText(el(b.dataset.copy).textContent, b);
async function copyText(text, btn) {
  const label = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'copied ✓'; }
  catch (e) {                                   /* refused on some file:// pages */
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); btn.textContent = 'copied ✓'; }
    catch (e2) { btn.textContent = 'press ⌘/Ctrl+C'; }
    ta.remove();
  }
  setTimeout(() => btn.textContent = label, 1400);
}

/* ─────────────────────────────────────────────────────────────────────────────────────
   boot
   ───────────────────────────────────────────────────────────────────────────────────── */
async function boot() {
  el('title').textContent = CFG.title || 'Review sheet';
  el('subtitle').textContent = CFG.subtitle || '';
  document.title = CFG.title || 'Review sheet';
  el('briefBody').innerHTML = (CFG.briefHtml || '')
    + (CFG.criterion ? `<div class="crit">Ranked by: ${esc(CFG.criterion)}</div>` : '');

  /* Any rule the agent INVENTED goes in its own panel, stated plainly. An invented premise
     presented as a finding is the most expensive mistake this format makes. */
  if ((CFG.invented || []).length) {
    el('inventedPanel').classList.remove('hide');
    el('inventedPanel').innerHTML = '<h3>⚠ Rules I invented — overrule these</h3><ul style="margin:4px 0 0 16px;padding:0">'
      + CFG.invented.map(s => `<li>${esc(s)}</li>`).join('') + '</ul>';
  }

  el('fstate').innerHTML = `<option value="">any state</option><option value="__undecided">undecided</option>`
    + `<option value="__decided">decided</option>`
    + OPTS.map(o => `<option value="k:${esc(o.key)}">= ${esc(o.label)}</option>`).join('');
  const groups = [...new Set(ITEMS.map(it => it.group))].sort();
  el('fgroup').innerHTML = `<option value="">all ${esc(CFG.groupLabel || 'group')}s (${groups.length})</option>`
    + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  paintKeys();
  document.body.classList.add('perf');
  if (CFG.media) el('btnGrid').classList.remove('hide');

  const f = LS.get('filters', null);
  if (f) { el('q').value = f.q || ''; el('fstate').value = f.s || ''; el('fgroup').value = f.g || ''; el('fmark').value = f.m || ''; }
  const foldChoice = LS.get('folded', null);    // read BEFORE setFold writes it
  setFold(foldChoice === true);
  armAutofold(foldChoice === null);

  /* pick a backend */
  let loaded = null;
  if (SIDECAR && SIDECAR.mode === 'server') {
    backend = new ServerBackend(SIDECAR);
    el('dpath').textContent = SIDECAR.decisionsPath;
    el('spath').textContent = SIDECAR.sheetPath;
    el('pathwhy').textContent = 'the sidecar owns this file — nothing to copy or paste';
    el('pathbar').classList.remove('hide'); el('spathbar').classList.remove('hide');
    try { loaded = await backend.load(); }
    catch (e) { showErr('Could not read the decisions file: ' + e.message); }
  } else if (FileBackend.available()) {
    backend = new FileBackend();
    el('pathbar').classList.remove('hide');
    el('dpath').textContent = CFG.decisionsPath || CFG.decisionsFile;
    el('pathwhy').innerHTML = 'no sidecar running — <button class="btn pri" id="linkBtn">link file</button> '
      + 'or drag it onto this page';
    el('spathbar').classList.toggle('hide', !CFG.sheetPath);
    el('spath').textContent = CFG.sheetPath || '';
    setTimeout(() => { const b = el('linkBtn'); if (b) b.onclick = async () => {
      try { await backend.pick(); const d = await backend.load(); if (d) { DEC = d; render(); } paintLink(); }
      catch (e) { showErr(e.message); } }; }, 0);
    try { loaded = await backend.load(); } catch (e) { loaded = null; }
    if (loaded === null) showErr('Not linked to a file yet — decisions are being held in the browser only. '
      + 'Click “link file” (or drag the decisions .json onto this page) before you start. '
      + 'Whatever you have already done can be lifted out with “copy JSON” in the brief above.');
  } else {
    backend = new LocalBackend();
    loaded = await backend.load();
    showErr('This browser cannot write files (no File System Access API) and no sidecar is running. '
      + 'Work is held in browser storage only — run serve_sheet.py, or use “copy JSON” in the '
      + 'brief above to lift it out and paste it over the decisions .json.');
  }

  /* Seed. Only rows the loaded file says NOTHING about take the pre-fill. Seeding
     all-or-nothing is how 350 pre-filled rows once vanished because two rows had been
     clicked — and the mirror-image bug is just as bad: ANY record for a row, including
     one whose decision is '', is a human act. CLEARING a row is a decision, so re-seeding
     over it puts a choice on the screen that the file does not hold, and under whitelist
     posture the row is stripped while the sheet says it is kept. */
  let seeded = 0, kept = 0, cleared = 0;
  DEC = loaded && typeof loaded === 'object' ? loaded : {};
  for (const it of ITEMS) {
    const rec = Object.prototype.hasOwnProperty.call(DEC, it.id) ? DEC[it.id] : undefined;
    if (rec != null) { if (rec.decision) kept++; else cleared++; continue; }
    if (prefillOf(it) != null) {
      DEC[it.id] = { decision: prefillOf(it), prefill: prefillOf(it), note: '' };
      seeded++;
    }
  }
  if (seeded && (kept || cleared)) {
    banner('warn', `Filled in <b>${seeded}</b> rows from the pre-fill and left your existing `
      + `entries untouched — <b>${kept}</b> decided`
      + (cleared ? `, <b>${cleared}</b> deliberately cleared` : '') + '.');
  }

  /* drag the decisions file onto the page — no picker at all (Chromium) */
  if (backend instanceof FileBackend) {
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', async e => {
      e.preventDefault();
      const item = e.dataTransfer.items && e.dataTransfer.items[0];
      if (!item || !item.getAsFileSystemHandle) return;
      try { const h = await item.getAsFileSystemHandle();
        if (h.kind !== 'file') return showErr('Drop the decisions .json, not a folder.');
        await backend.link(h); const d = await backend.load(); if (d) { DEC = d; render(); }
        paintLink(); el('err').classList.add('hide');
      } catch (err) { showErr(err.message); }
    });
  }

  if (LS.get('grid', false) && CFG.media) toggleGrid();
  render();
  paintLink();
  if (frozen) showErr('This sheet is FROZEN. The decisions file is the source of truth and is read-only.');
}
boot();
</script>
</body>
</html>
