<title>the Miasma — flora & fauna art</title>

<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

40142b09b22565e7e29f837e1b97b5edbe5eaea6886b3bda59": "img/be17ce9687aaa940142b.webp", "5afc74ba7cac2e438f485296c05d5c4461b1a0b08066fc1f9c136418c1f5abbb": "img/5afc74ba7cac2e438f48.webp", "1f2c6d18e39de1f8a45f8ecdd2c5444080232a509a679a969dd44aea4d83f777": "img/1f2c6d18e39de1f8a45f.webp", "a6fcbae3a838d9cf3de2100f64a59ec0dccce4411e98a933780b4a8257d63efe": "img/a6fcbae3a838d9cf3de2.webp", "53f3136f47c898f1d7146013a3f4e4f9b18ac66e8f2fb3dfb4cb842748f2fdc3": "img/53f3136f47c898f1d714.webp", "e4c1c5872d406aeffe7e4fdde67ce70e49c9eaf0ee6fd8cd7af4b74ad9950486": "img/e4c1c5872d406aeffe7e.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/blarth", "brief": "All three images are LEGENDS continuity (Blarth/Legends page); no canon-page image exists. They agree closely.\n- **Body**: a stout, rotund, low-slung amphibian-like quadruped, roughly seal/hippo-pup in bulk, with a barrel torso and short stubby legs. Front legs short with small clawed/toed feet; hind end tapers into a long, thick tail.\n- **Colour**: pale powder blue-grey hide, lighter cream-white on belly and throat, soft warm peach-orange highlights; smooth, wrinkled, rubbery skin with no fur or scales.\n- **Markings**: scattered small circular whorl/spiral dimples (concentric ring pores) over the back and flanks.\n- **Head**: wide, flat, toad-like head with a very broad mouth, small pointed teeth, one or two curved tusk-like lower teeth, small half-closed eyes, ridged/brow-wrinkled skin above, short horn nubs near the eyes.\n- **Tongue/drool**: a huge flat pink-salmon tongue lolling out of the mouth, with drool strands dripping (the infobox piece, the pup piece, and the comic frame all show it).\n- **Tail**: very long (about body length or more), thin-ish, tapering, prehensile, ending in tiny finger-like nubs (clearly drawn in the infobox piece). Carried trailing or curled up.\n- **Size cue**: in the comic frame it is about knee-to-waist height of a humanoid child and sprawls over a body length; pups are small round blobs with the same pale blue colouring.\n- Captioned: infobox plate (side view), a Coruscant pet comic frame (lower-detail, whiter hide), and a mother with pups wearing a ribbed collar (pet context). Prose says amphibian that can stay underwater two hours; images show nothing aquatic but the build.", "must": "- [ ] Rotund barrel body, short stubby legs, low to the ground\n- [ ] Smooth pale blue-grey hide with a lighter cream belly, no fur\n- [ ] Small circular whorl/spiral dimples scattered over back and flanks\n- [ ] Very wide toad-like mouth with a big flat pink tongue lolling out and drool\n- [ ] One or two curved lower tusks/teeth and small half-lidded eyes\n- [ ] Long tapering prehensile tail ending in tiny finger-like nubs", "ruling": "", "base": "", "imgs": ["img/60d6b30e1c240c7f2473.webp", "img/86c7e8adfd127124bea9.webp", "img/0f24f6cbcf24fbc7c36d.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Blarth, RSW_Blarth", "rulings": [], "desc": {"def": "RSW_Blarth", "label": "blarth", "description": "Blarths were medium-sized predators native to the planet Naboo named for the low burping sound that it made. Amiable and easily tamed, they were kept as a household pet and watch animal by Gungans since prehistoric times. More recently the animals had made their way to off-world pet shops on worlds such as Coruscant.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Blarth"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Blarth, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Blarth.xml (declared)", "kind": "animal", "cells": 2, "bodySize": 0.32, "mesh": 1, "drawSize": [2, 2], "visualMax": null, "quad": 2, "img": "img/scale_RSW_Blarth_be17ce9687_dab99c.png", "full": "img/scale_RSW_Blarth_be17ce9687_dab99c_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [256, ars 3D render, side view):** a compact, low, crab/trilobite-like body. The top is a smooth teal-blue overlapping armour carapace (flared plates like a horseshoe-crab or isopod shell, pale veining on the head plate) that sweeps back past the body. Beneath it the flesh is soft pinkish-tan, with a wide, lip-lined slit of a mouth low on the front of the underbelly. Two small amber/orange eyes sit under the carapace brim. Six rigid, blade-like blue-grey chitin legs (jointed with rusty-orange joints) point down and slightly forward like picks; two small pincer claws sit near the mouth. Five very long, thick, flesh-pink tentacles (finely ringed like an earthworm) trail and loop from the front/upper body, each longer than the whole body; the distal third is grey and studded with small thorn spikes, ending in a flat pink paddle-pad with a ring of dark suckers.\n- **Legends (`wookieepedia_legends_1.webp`, comic panel):** the same animal reads as a squid-like thing in red-orange with yellow-gold armour plates and yellow scaly sucker-skin, a large yellow eye with a black slit pupil, and a yellow beak/crest. LEGENDS continuity, and the colours (red-orange and yellow, not teal and pink) do not match canon. Do not blend the palettes.\n- Text agrees with both on the count: five tentacles, six legs, half-shell.\n- Size: the tentacles dwarf the body; no scale reference in the images (comic shows it filling a corridor beside droid-suited figures, indicating human-plus size).", "must": "- [ ] Low armoured half-shell carapace over the back (teal-blue, overlapping flared plates), soft pink underbelly exposed below it\n- [ ] Exactly six stiff, blade/pick-like chitin legs, angled down and forward\n- [ ] Exactly five very long, ringed, flesh-pink tentacles, each longer than the body\n- [ ] Tentacles grey and thorn-spiked toward the tips, ending in a flat pink sucker-pad\n- [ ] Wide lip-lined slit mouth low on the front of the underbelly, with small pincer claws beside it\n- [ ] Two small amber eyes tucked under the carapace brim", "ruling": "", "base": "", "imgs": ["img/d14f64919d971af0173f.webp", "img/f078ccae4b3ddbff3fe6.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Blixus, RSW_Blixus", "rulings": [], "desc": {"def": "RSW_Blixus", "label": "blixus", "description": "Blixus were rare, half-shelled crustapod creatures native to the planet Sljee. These semi-aquatic predators were known to be deadly in the swamps and lagoons they inhabit. They were known to periodically shed their exoskeleton if broken or damaged which could be harvested for useful chitin. It is believed many were accidently transplanted to various worlds as exotic display animals or pets that grew too large to contain.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Blixus"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Blixus, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Blixus.xml (declared)", "kind": "animal", "cells": 6, "bodySize": 4, "mesh": 1, "drawSize": [6, 6], "visualMax": null, "quad": 6, "img": "img/scale_RSW_Blixus_30c7d3d4d7_5079c8.png", "full": "img/scale_RSW_Blixus_30c7d3d4d7_5079c8_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [256, 256], "ppc": 43, "verdict": "BELOW 64/cell \u2014 detail lost when zoomed in", "zoomPpc": 60, "zoomFitted": false, "zoomCropped": false, "zoomFullPpc": 128, "sets": [{"l": "A", "ppc": 43, "px": 256}]}, "group": "Fauna"}, {"donorAbsent": "", "id": "RSW_Bogwing", "kind": "fauna", "label": "Bogwing", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.5 \u00b7 2 picture set(s) across 2 graphics", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "what the game shows now (no pick of yours)", "prefill": "A", "prefillWhy": tail and huge wings. Nothing contradicts. Greater vs lesser race: no image\n  distinguishes them.", "must": "- [ ] Two huge narrow membrane wings, each longer than the body, pointed tips, brown-mauve membrane with dark bone edges\n- [ ] Tiny slim body with long thin neck and small bird-like head with short pointed beak and one round yellow-orange eye\n- [ ] Very long thin straight whip tail trailing well behind the body\n- [ ] Spindly hind legs ending in large splayed 3-toed talons, held down/forward\n- [ ] Teal/blue-green back and limbs over a pale grey-mauve belly (canon colouring), smooth scaleless skin\n- [ ] Reads as a pterosaur-like light flier, not a feathered bird or a bat", "ruling": "", "base": "", "imgs": ["img/01c815671100d751dd19.webp", "img/a18aa05fc95980642e13.webp", "img/fb056e77f3c1d6a6120d.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Bogwing, RSW_Bogwing", "rulings": [], "desc": {"def": "RSW_Bogwing", "label": "bogwing", "description": "The bogwing is a fast flying reptavian native to Dagobah. They could be found on a number of worlds located across the galaxy. They mostly fed on small creatures dwelling in the lower levels of tree canopies (including rodents like leaftails) to avoid larger predators.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Bogwing"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Bogwing, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Bogwing.xml (declared)", "kind": "animal", "cells": 1.4, "bodySize": 0.7, "mesh": 1, "drawSize": [1.4, 1.4], "visualMax": null, "quad": 1.4, "img": "img/scale_RSW_Bogwing_e9f308c20a_ec7642.png", "full": "img/scale_RSW_Bogwing_e9f308c20a_ec7642_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [256, 256], "ppc": 183, "verdict": "in the 128\u2013256/cell range enhanced zoom resolves", "zo a1a4d7758.webp", "08e7783b9032b1996b83b15928217bda1352750d9829dd72ccb6aaa10b81ba65": "img/08e7783b9032b1996b83.webp", "9bd1be3ab3a2e3e1a1117b51c7c7c9b2a0a2f56ee501f5a71057fbf6ef48f4bd": "img/9bd1be3ab3a2e3e1a111.webp", "3c8b996f6d1a65e8ebba6ef44f247ccf9d249bcbe91638f3536270f1bc63e90b": "img/3c8b996f6d1a65e8ebba.webp", "89fb3421c8aa6683e7f3d8cde93f66bd1150a90c1d0c00076877a022fca332d3": "img/89fb3421c8aa6683e7f3.webp", "56b29f4a33734ff74139de8f888aff9e92bdda1a66b53ad359711fe4dba5a4a4": "img/56b29f4a33734ff74139.webp", "481a1f1e5132bd0a9d1da7bbd5574e0224e94eac30dd872afbfe8f9e5e722b64": "img/481a1f1e5132bd0a9d1d.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/shiro", "brief": "Four images were retrieved, and they show real disagreement:\n\n- `shirodisneyinfinity.png` (the canon infobox art, *Disney Infinity 3.0*) is\n  a small, stylized, cartoonish render \u2014 a rounded green creature on a\n  low-poly Naboo-swamp background. It reads as green-skinned as the infobox\n  text states, but is a low-detail toy/game-art style rather than a\n  naturalistic reference \u2014 body plan is hard to read precisely (chibi\n  proportions), though the turtle-like rounded-shell silhouette is visible.\n- `shirotrap_legends.jpg` and `shirotrap_retracted_legends.jpg` (both\n  Legends-era, captioned \"a Shiro-trap retracted into its shell\") show the\n  animal fully withdrawn \u2014 from these alone you mostly see a mottled,\n  earth-toned, dirt-and-plant-covered shell mass, consistent with the \"rolls\n  in mud, collects seeds in shell ridges\" text. Because the plant/soil\n  disguise is the whole point of a Shiro-trap, these images are **not a\n  clean read of the animal's own skin/shell color** \u2014 they show it\n  deliberately camouflaged.\n- `shiros_group_legends.jpg` (captioned as the general Legends infobox image,\n  file `Shiros.jpg`, showing multiple individuals) is the best like-for-like\n  match to the text: a group of hard-shelled, dome-backed reptiles with\n  ridged/spiny shells in duller brown-green earth tones, resting in a muddy\n  swamp setting \u2014 consistent with \"hard-shelled... native to the Gungan\n  Swamps,\" \"rolled in mud,\" omnivorous swamp reptile.\n\n**Disagreement**: the canon *Disney Infinity 3.0* art is a bright, clean\ngreen cartoon creature; the Legends reference images (uncamouflaged group\nshot) read as duller, mud-toned brown-green \u2014 but note the Legends text\nitself explicitly says the animals accumulate mud and camouflage, so a\n\"clean\" green Shiro may simply not appear undirtied in any Legends art.\n**Treat the canon infobox image (`shirodisneyinfinity.png`) as the color\nanchor** (it is the current, non-Legends canon source, and its green skin\ncolor is also independently stated in the infobox text, not just visually\ninferred) \u2014 but use the Legends group shot (`shiros_group_legends.jpg`) as\nthe anchor for **body plan and shell texture** (hard ridged/spiny dome\nshell, stubby retractable head/legs/tail, turtle-like proportions), since\nthe canon art is too low-detail/stylized to read shell texture from.", "must": "- [ ] Green skin (per the canon infobox art and text) \u2014 treat as the color anchor over the duller mud-toned Legends group shot\n- [ ] Hard, ridged/spiny dome shell covering the back\n- [ ] Stubby, retractable head, legs and tail (turtle-like withdrawal into the shell)\n- [ ] Turtle-like rounded proportions overall \u2014 not a smooth or unarmoured body", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `shiros_group_legends.jpg`\n\n> \"There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)\"", "base": "", "imgs": ["img/f2756f3129732788f2d5.webp", "img/8003243599a18a3071eb.webp", "img/7ba1243aa9a0eb4ceb1e.webp", "img/5232cd876ec65bfde5c6.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged":  conical teeth** (upper and lower, inner and outer rows), visible in `canon_1`. A **long, smooth, pink-mauve, prehensile tongue** with a knobbed tip shoots out of the mouth (`canon_2`, `legends_2` film frame).\n- **Head details:** wrinkled, folded, lumpy skin on the face; bulbous eyes set high on each side; a few short, fleshy stubs or stalks on the crown of the head, from which grow **one to three very long, thin, whip-like antennae, orange-tan at the base, ending in a dark blue-purple lure bulb at the tip** (the antennae are longer than the whole body).\n- **Limbs:** **three pairs of thin, jointed, crab-like walking legs** hanging from the underside of the rear body, each ending in a flat paddle or blunt claw, plus a **pair of broad, fan-shaped pectoral fins** behind the head (finely ribbed, orange-red).\n- **Size:** 20 m long per the text; the film frame shows it dwarfing a submersible.", "must": "- [ ] Huge fish-like head with an enormous gaping mouth and double rows of long pale conical teeth\n- [ ] Long, segmented, arched armour-plated back tapering to a point, like a lobster tail\n- [ ] Reddish-orange/coral-red skin and plates with a purple-lilac mouth interior\n- [ ] Long, thin, whip-like antennae from the top of the head with dark blue-purple lure tips\n- [ ] Three pairs of thin jointed crab-like legs under the rear body plus a pair of broad fan-shaped pectoral fins\n- [ ] Long, smooth, pink-mauve prehensile tongue that can extend far out of the mouth\n- [ ] Bulbous orange-red eyes high on the wrinkled, lumpy face", "ruling": "", "base": "", "imgs": ["img/b2dc7f7ea1beae716c8c.webp", "img/5e63caffd91d8b07e0a6.webp", "img/9873ab20653a06ae9e30.webp", "img/6ceaa8d640c04eda1fb7.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: OpeeSeaKillerJuv, RSW_OpeeSeaKillerJuv", "rulings": [], "desc": {"def": "RSW_OpeeSeaKillerJuv", "label": "sub-adult opee sea ki ilhouette (heavier, maned, shaggy) disagrees\n  with the sleek hairless AA depiction.\n- `wookieepedia_swamp_pack.jpg` (a multi-creature pack scene in a dark\n  swamp) \u2014 shows several **smooth black-skinned** vornskrs with **glowing\n  yellow eyes** (not red), curved horn-like ears, and the same whip tail\n  shape. The yellow eye color directly contradicts the infobox's \"red\" and\n  the other two images; treat this as an outlier, likely stylized for a\n  dramatic low-light comic/game scene rather than a color-accurate baseline.\n\n**Net read**: body plan is consistent across all three \u2014 quadruped canine\npredator, tall pointed ears, a long whip-like tail ending in a distinct\ntuft, prominent fangs. Coloring is NOT consistent: two of three sources\nagree on red eyes over gray/black skin (matching the infobox), but fur\ndensity/length and the third source's yellow eyes are genuinely\ncontradictory. Treat `wookieepedia_alienarchive.jpg` as the primary color\nanchor (matches infobox exactly) and the other two as showing the plausible\nrange of variation (or inconsistent non-canon art), not settled fact.", "must": "- [ ] Quadruped canine/reptile-hybrid predator body with tall pointed ears (bat-like or curved-horn-like)\n- [ ] Long, whip-thin tail ending in a distinct bushy/dark tuft\n- [ ] Narrow snarling muzzle with prominent visible fangs\n- [ ] Red eyes over gray/black skin as the primary colour anchor (the one yellow-eyed image is treated as an outlier, not a settled fact)\n- [ ] Gray-to-black hide or coat \u2014 texture ranges from smooth/hairless to shaggier pale fur across the references, so a single fixed coat length is not required", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_alienarchive.jpg`\n\n> \"#1 and #3 are compatible and correct, the shaggy #2 is rejected as non-canon.\"", "base": "", "imgs": ["img/7da63a163f5469f867c1.webp", "img/84171d18c5e2cbaadbaa.webp", "img/df78125ccb6834b7f618.webp"]}, "letters": ["A", "B", " ": {"dir": "design/RimStarWars/canon_references/meescalefish", "brief": "Viewed 2026-10-04. Image 1 is canon (rendered mee, infobox); images 2, 3 and 4 are LEGENDS (an ink\nsketch of one mee, a school of mee hunted by otta, and a tee eating a school of mee). Canon\nand Legends agree closely, so this is a stable design.\n- **Silhouette**: a tall, laterally flattened, DIAMOND/angelfish-like disc body, round at the front\n  and sharply forked at the rear into two long wispy tail streamers (upper and lower lobes tipped\n  blue in the canon render). Deeper than long.\n- **Colour/pattern**: bright golden-yellow body with broad dark brown-black diagonal bars (3-4 slanted\n  stripes) and an honeycomb/hexagonal scale texture; tail tips blue (canon) or dark (Legends);\n  yellow-and-brown tiger bars match the Legends text \"black-and-yellow\".\n- **The spine (loud)**: ONE very long thin dark needle spine runs straight back horizontally along\n  the centreline from behind the gill to well past the tail -- longer than the body -- in the canon\n  render (dark red-brown, tapering), and in the Legends sketches as two or three long thin swept-back\n  spines with blue tips. Prose says \"poisonous spine(s) from its centerline\": images confirm.\n- **Face**: blunt, near-vertical face with a tiny downturned mouth and thick lower lip, a red-ringed\n  yellow eye, three thin blue-and-cream whisker/barbel-like filaments across the cheek (canon\n  render), a small dark bump or crest on the brow.\n- **Size cues**: tiny, school fish: palm-sized, shown hunted in schools beside much larger otta and tee.\n- **Prose vs images**: canon prose mentions \"hundreds of razor teeth\" for Koboh mee -- teeth are not\n  visible in the canon image but a Legends tee-feeding panel shows the swarm with tiny teeth. No\n  disagreement on colour.", "must": "- [ ] Tall flat diamond/angelfish body, rounded front, deeply forked tail with two long wispy streamers\n- [ ] Golden-yellow body with 3-4 broad dark brown dia canon": {"dir": "design/RimStarWars/canon_references/paleyobshrimp", "brief": "Viewed 2026-10-04. Only ONE usable image. Image 1 (canon, infobox) is a PHOTO OF A PLATED FOOD DISH\n(Yobshrimp Noodle Salad at Docking Bay 7, Batuu: cooked peeled pink shrimp on glass noodles) --\nit shows only what cooked, shelled yobshrimp look like as food (curled, pale pink-cream, no shell,\nno claws, no head). It is NOT a reference for the living animal; do not use it for sprites.\nImage 2 (LEGENDS, infobox sketch of several yobshrimp) is the only live-animal evidence.\n- **Silhouette (Legends)**: a small crab/crayfish-like crustacean. A flat, pointed, wedge-shaped\n  carapace that tapers to a sharp forward rostrum like a spear-point or a swordfish bill, held low.\n- **Limbs**: eight short walking legs, bristly and segmented, under the body. TWO very long\n  pincer-arms rise up and back over the carapace, each a long jointed arm ending in a huge\n  scissor-like claw whose two blades are long, thin and sharp (claws as long as the whole body).\n- **Face**: a bright green eye with a round pupil and, on short stalks, a pair of small green\n  bead-like feelers with bulb tips; two long thin whip antennae trail back from the face, many\n  times the body length (swirling in the water).\n- **Colour**: purple and lilac shell with dark violet mottling and small raised bumps/speckles,\n  paler lilac belly; green eyes. Painted against green water.\n- **Size cues**: none; \"tiny\" in canon prose (lives in fish gills), so shown small.\n- **Prose vs images**: canon prose is only \"tiny creature\"; Legends text says \"clawed carnivorous\n  crustacean\" -- the sketch matches the claws, but nothing in prose mentions the swordlike snout.\n  Single-source evidence: one artist's sheet, so treat details as moderately confident.", "must": "- [ ] Small flat wedge-shaped carapace tapering to a sharp pointed forward snout/rostrum\n- [ ] Two very long jointed arms ending in huge thin scissor claws, raised up a webp"}, "canon": {"dir": "design/RimStarWars/canon_references/zakkeg", "brief": "Two candidate images, both game-rendered 3D models rather than illustration,\nand they show a body-plan match but a color disagreement worth flagging:\n\n- `wookieepedia_kotor2_juvenile.png` (captioned \"A juvenile zakkeg,\" in-game\n  render, KOTOR II) \u2014 a **rust-red/copper-brown** quadruped with a jagged\n  spiked ridge running along the spine from head to tail, a low-slung\n  reptilian toothy head with small yellow eyes, thick knobbed/bumpy hide,\n  and stocky clawed legs. This is the closer color match to the in-universe\n  \"huge, red lizard\" quote.\n- `wookieepedia_swtor_adult.jpg` (in-game render, *The Old Republic*) \u2014 the\n  same body plan at adult scale: spiked dorsal ridge, low reptilian head\n  with visible fangs and small eyes, thick knobbed scales, four\n  heavy-clawed legs, a tapered tail. Coloring here reads **dark\n  brown-to-near-black**, noticeably darker/duller than the juvenile render\n  and than the \"red lizard\" quote.\n\n**Net read**: body plan is consistent and well-confirmed across both\nsources and the text \u2014 a stegosaur-like reptilian quadruped predator with a\nspiked dorsal ridge, thick knobbed/armored hide, a low toothy head, and four\nheavy taloned legs, roughly the size of \"a battle tank.\" Color is the one\nopen question: the sourced in-universe quote and the juvenile render both\npoint to **red/rust**, while the adult SWTOR render is darker\nbrown-black \u2014 plausibly a juvenile-vs-adult color shift (common in reptile\nWookieepedia analogues) rather than a contradiction, but not confirmed\neither way. Favor red/rust as the primary color anchor since it is the only\none both an in-universe character quote AND an image agree on.", "must": "- [ ] Stegosaur-like reptilian quadruped with a jagged spiked ridge running along the spine from head to tail\n- [ ] Thick, knobbed/bumpy armored hide over the whole body\n- [ ] Low-slung reptilian head with visible fangs/teeth and small eyes\n- [ ] Four heavy, thick, clawed legs on a stocky body (\"battle tank\" scale)\n- [ ] Rust-red/copper-brown as the primary colour anchor (a darker brown-black variant is attested but unconfirmed as a separate life stage)", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_kotor2_juvenile.png`", "base": "", "imgs": ["img/fa0994014758e819bf16.webp", "img/72af6e4d8dede8808e31.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Zakkeg, Zakkeg; artpipe jobs on record: canon_zakkeg_v1, zakkeg_v1", "rulings": [{"at": "2026-09-14", "verdict": "1", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": ""}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Zakkeg", "label": "zakkeg", "description": "Zakkegs were rare alpha-predators indigenous to the moon of Dxun. They were huge, armoured quadrupeds, typically solitary and territorial. Even Mandalorians were impressed by someone who killed one, and one could gain great honor for proving one's success. Due to this, several Mandalorian clans and big game hunters exported these creatures to numerous worlds to provide a ready supply of the beasts.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Zakkeg"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Zakkeg, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Zakkeg.xml (declared)", "kind": "animal", "cells": 5, "bodySize": 5, "mesh": 1, "drawSize": [5, 5], "visualMax": null, "quad": 5, "img": "img/scale_RSW_Zakkeg_80eeda0d5f_0ce4df.png", "full": "img/scale_RSW_Zakkeg_80eeda0d5f_0ce4df_full.png", "set": "A", "by": "prefill", "fac 06926046973fcf3": "img/4bad4bc4f761f8e3343f.webp", "9d63a4733f0f8ff358d154e3208731fa31e9f11d165c5fa43be1b010c58f32ba": "img/9d63a4733f0f8ff358d1.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/anooba", "brief": "The three candidate images agree with each other far more strongly, and more\nspecifically, than the prose summary suggests. All three show:\n- **Large, erect, pointed ears** with visibly pink/red-toned interior skin \u2014\n  bat-like or donkey-like in proportion, not small hyena ears.\n- **A spiky dorsal mane/ridge** of longer fur running from the back of the\n  skull down the spine, distinct from the shorter body coat.\n- **Tiger-like dark stripes over a blue-grey to grey body coat** \u2014 this is the\n  single biggest thing the \"varying tones of gray\" text undersells. Every\n  image (concept-art illustration, in-show 3D render, and a separate painted\n  bestiary piece) independently shows banded/striped fur, not a flat gray or\n  solid color. This is exactly the kind of feature a text-only prompt would\n  invent wrong (cf. the Wyyyschokk case this library exists to prevent).\n- **A long, thin, low-carried or curled tail**, out of proportion to a stocky\n  hyena body \u2014 closer to a rat or lizard tail than a canine brush tail.\n- **Large forward-set eyes**, yellow/amber in the CGI and bestiary pieces\n  (agrees with the \"Yellow\" eye-color citation more than \"Blue\").\n  Note wookieepedia_infobox.jpg is a hand-painted/illustrated concept-style\n  piece (possibly a bestiary-book plate) rather than a film/show frame \u2014 treat\n  its exact palette as one artist's interpretation, though it agrees closely\n  with the separate wookieepedia_bestiary.jpg painting on stripe pattern, ear\n  shape, and mane.\n- **Sloped hyena posture**: front legs visibly longer/more developed than hind\n  legs in all three images, confirming the \"smaller hind legs\" text detail.\n- **Prominent lower jaw and tusk**, visible fangs, in all three.\n\nwookieepedia_citadel.jpg (the in-show CGI frame, a pair of \"dark anoobas\" from\nthe Citadel) is the darkest/most desaturated of the three \u2014 near-black in low\npurple lighting \u2014 but even here the dorsal mane spikes, ear shape, and tail\nare consistent with the other two images. This is plausibly the \"black\"\ncolor-cite individual type rather than contradicting the gray/blue-gray\nmajority.\n\n**donor_current_sprite.png is weak evidence**: it is the ONLY anooba art\npresent on disk in this repo's SWBestiary mod, and it is a Dessicated\n(corpse) variant only \u2014 there is no live/default sprite for RSW_Anooba on\ndisk at all right now. A desiccated corpse pose cannot show fur color, stripe\npattern, ear shape, or live posture reliably, so it should not be used to\nvalidate or invalidate any of t", "must": "- [ ] Large, erect, pointed ears with pink/red-toned interior skin\n- [ ] Spiky dorsal mane/ridge of longer fur running from the skull down the spine\n- [ ] Tiger-like dark stripes over a blue-grey to grey coat \u2014 not a flat solid gray\n- [ ] Long, thin, low-carried or curled tail, not a canine brush tail\n- [ ] Front legs visibly longer/more developed than the hind legs (sloped hyena stance)\n- [ ] Prominent lower jaw with visible fangs (chin tusk present on larger individuals)", "ruling": "", "base": "", "imgs": ["img/b66603f45454cf05f12b.webp", "img/8b6b5c0e0ac581182a3b.webp", "img/07ce82b7b683196a70e4.webp"]}, "letters": ["A", "B", "E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Anooba, RSW_Anooba; artpipe jobs on record: anooba_toyfig_a, anooba_toyfig_b, anooba_toyfig_b2, anooba_v1, desert_swaca_anooba, pyrelands_anooba_f_v3, pyrelands_anooba_v1, pyrelands_anooba_v2", "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "North is HUGE compared to east, \n  through hair\").\n- `wookieepedia_coruscant_scene.webp` (an adult and juvenile grank scavenging\n  from a tipped-over trash can on Coruscant, with a small unrelated\n  yellow/cream creature nearby): confirms the same **reddish-brown/maroon\n  dorsal coloring fading to tan-grey underneath**, the same twin nose-horns,\n  and shows the mouth **open**, revealing a genuinely saw-like double row of\n  jagged white teeth \u2014 the strongest single confirmation of the \"saw-toothed\"\n  name. Also shows faint **darker mottled spotting** on the flank of the\n  adult, consistent with a reptilian/scaled hide rather than a furred one\n  (matching \"Reptomammal\"). Both the adult and the smaller juvenile share\n  identical coloring \u2014 no juvenile/adult color difference visible.\n- `steam_workshop_roster_grid.jpg` (Steam Workshop preview screenshot from\n  the donor mod's current 1.6 listing, id `3497316713` \u2014 a 12-creature\n  roster grid; Grank is the bottom-right tile, clearly labeled \"GRANK\"): the\n  mod's own flat-vector icon art, independently drawn by the mod author,\n  **also lands on a maroon/wine-red back with a tan/cream belly, snout\n  underside, and open mouth showing white fangs**, a long thin down-curving\n  tail, and a small ear/horn nub \u2014 i.e. the mod author converged on\n  essentially the same reddish-brown-over-tan palette as the two Wookieepedia\n  illustrations, independently of them.\n\n**N", "must": "- [ ] Low-slung, digitigrade quadruped with a long, tapering, rat-like tail\n- [ ] Reddish-brown to maroon dorsal/back coloring, fading to a lighter tan-grey underside and throat\n- [ ] Elongated snout packed with large interlocking jagged (saw-like) teeth, visible even with the jaw closed\n- [ ] Small red eyes\n- [ ] A pair of short, blunt, horn-like spikes near the nose\n- [ ] A wispy fringe of hair-like bristles along the belly and backs of the legs", "ruling": "", "base": "", "imgs": ["img/b6ae0e779bc040660694.webp", "img/1a49ad567ce62abbcf3d.webp", "img/b08fb23618200d0f4b04.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Grank, RSW_Grank; artpipe jobs on record: desertportb_grank, grank_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-06", "verdict": "redo", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": "Follow canon PRECISELY, look at the parent image"}], "desc": {"def": "RSW_Grank", "label": "Grank", "description": "The Grank (or 'saw-toothed grank') were a medium-sized carnivore believed to have originated on the planet Naboo. They were a species of predatory scavengers with sharp teeth and powerful jaws. Despite their fearsome gnarled appearance they were very affectionate when domesticated. This made them popular pets and lead to them establishing wild populations on multiple worlds as a result.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Grank"}, "ruledElsewhere": {"sheet": "the Leaning Scrub", "sheetId": "leaningscrub_sheet_2026-10-05", "pick": "redo", "label": "", "note": "Follow canon PRECISELY, look at the parent image", "at": "2026-10-06"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Grank, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Grank.xml (declared)", "kind": "animal", "cells": 1.75, "bodySize": 0.85, "mesh": 1, "drawSize": [1.75, 1.75], "visualMax": null, "quad": 1.75, "img": "img/scale_RSW_Grank_c377f34ffe_fc4058.png", "full": "img/scale_RSW_Grank_c377f34ffe_fc4058_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [512, 512], "ppc": 293, "verdict": "above 256/cell \u2014 beyond even enhanced max zoom", "zoomPpc": 140 quadruped with a huge barrel body, a high rounded hump over the shoulders and a sagging belly, short thick legs with broad padded feet, and a hanging tail with a tuft at the end. The head is held low and nose-down while rooting, long, pig-like or tapir-like.\n- **Pattern/colour**: a whitish-cream coat with bold black-brown (dark brown in the plate) tiger- or zebra-like vertical stripes over the back, flanks and rear legs; the shoulder and neck are a solid darker patch; creamy belly and underside; legs below the knees are darkest. The motion-blur game still shows pale tan with dark banding at the rump and tail.\n- **Head**: a long, flexible, pig-like snout, a down-turned wrinkled snout with a thick lower lip and a pale muzzle; small eyes; two very long, tall, branching ANTLERS rise straight up from the back of the skull like a stag's, flat and palmate with a few short tines, as tall as the head and neck combined, pale brown in the plate (the text says shed annually).\n- **Feet**: broad feet with several toes, and a claw on the front toes (text); the plate shows pale claws on the foreleg.\n- **Tail**: a long tapering tail with a tuft of hair at the tip hanging to the ground.\n- **Disagreement**: the Tran Mariel runyip (Legends 2) has long ears, a long bifurcated trunk and no stripes, so do NOT use it; the Yavin 4 text 'brown and white fur' matches the striped images.", "must": "- [ ] Squat barrel-bodied rhino-tapir shape, high shoulder, sagging belly, short thick legs, head held low\n- [ ] Whitish coat with bold dark brown/black vertical stripes over back, flanks and rump; dark solid shoulder\n- [ ] Long flexible down-turned snout with thick lip\n- [ ] Two tall branching antlers rising straight up from the back of the skull\n- [ ] Broad padded multi-toed feet with front claws\n- [ ] Long tail with a tuft at the tip", "ruling": "", "base": "", "imgs": ["img/9a954bab919b95674c45.webp", "img/08b514447b8d1f1a556d.webp", "img/6fe2922c261330d2f7ab.webp", "img/97fe9319308693 <header>
  <div class="hrow">
    <h1 id="title">Review sheet</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>
  </div>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>
    <select id="fmark">
      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

  <div class="banner bad hide" id="err"></div>
</header>

<div id="list"></div>

<script id="RENDER">
/* Layout (owner complaint 2026-10-04, "poorly constructed"): one compact strip per graphic. Each picture
   set is a card whose facings sit SIDE BY SIDE; cards wrap across the width, so a row is about one
   thumbnail tall. Provenance is a tooltip, never wallpaper. Letters are row-local; the pick buttons on
   the right show only this row's letters. */
const FACE_ABBR = { south: 'S', east: 'E', north: 'N', west: 'W', single: '' };
const faceAbbr = f => f in FACE_ABBR ? FACE_ABBR[f] : f.replace(/^(\d+)_(\w).*$/, (m, n, d) => n + d.toUpperCase());
if (!window.__bsAnim) window.__bsAnim = setInterval(() => document.querySelectorAll('.bs-play[data-anim]').forEach(el => {
  const fr = el.dataset.anim.split('|'), i = ((+el.dataset.i || 0) + 1) % fr.length;
  el.dataset.i = i; const im = el.querySelector('img'); if (im) im.src = fr[i];
}), 66);
/* Variant default (owner, 2026-10-06): a row whose record has no `variants` key starts with EVERY set that is ours
   (not a donor original), not purged and not purgedLive marked as a variant; the owner turns off what is wrong.
   An explicit list, even an empty one, is never overwritten. */
window.artDefaultVariants = (it, d) => {
  const purge = new Set((d && d.purge) || []);
  const out = [];
  for (const g of (it.graphics || [])) for (const c of g.cols) {
    if (c.purgedLive || (c.kind === 'donor' && !c.ours) || out.includes(c.letter)) continue;
    const shas = Object.values(c.faces || {});
    if (shas.length && shas.every(x => purge.has(x))) continue;
    out.push(c.letter);
  }
  return out.sort((a, b) => LETTER_ORDER.indexOf(a) - LETTER_ORDER.indexOf(b));
