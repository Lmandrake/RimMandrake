<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

n and wear, wet ringed earthworm-like tentacle flesh.\n- **Canon (`wookieepedia_canon_1.webp`, Clone Wars 3D render, side view):** a compact, low, crab/trilobite-like body. The top is a smooth teal-blue overlapping armour carapace (flared plates like a horseshoe-crab or isopod shell, pale veining on the head plate) that sweeps back past the body. Beneath it the flesh is soft pinkish-tan, with a wide, lip-lined slit of a mouth low on the front of the underbelly. Two small amber/orange eyes sit under the carapace brim. Six rigid, blade-like blue-grey chitin legs (jointed with rusty-orange joints) point down and slightly forward like picks; two small pincer claws sit near the mouth. Five very long, thick, flesh-pink tentacles (finely ringed like an earthworm) trail and loop from the front/upper body, each longer than the whole body; the distal third is grey and studded with small thorn spikes, ending in a flat pink paddle-pad with a ring of dark suckers.\n- Text agrees with the render on the count: five tentacles, six legs, half-shell.\n- Size: canon dimensions are 6.48 m high and 13.33 m long (Databank, https://starwars.fandom.com/wiki/Blixus); the images give no scale reference, and the \"compact\" low body reading above describes only the central body, not the whole animal. Canon lists yellow eyes and red as well as teal skin; the \"amber\" eyes above are an image reading.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `wookieepedia_canon_1.webp` as the visual brief reads it and the canon text (five tentacles, six legs, half-shell).*\n- [ ] BODY PLAN: a low, compact crab/trilobite-like body under a half-shell carapace of overlapping flared plates that sweeps back past the body; exactly six stiff, blade/pick-like chitin legs angled down and forward; exactly five very long tentacles trailing and looping from the front/upper body, each longer than the body\n- [ ] COLOUR LAYOUT: carapace teal-blue on top (pale veining on the head plate); soft pinkish-tan flesh of the underbelly exposed below it; legs blue-grey with rusty-orange joints; tentacles flesh-pink, turning grey toward the tips\n- [ ] Tentacles finely ringed like an earthworm, thorn-spiked toward the tips, ending in a flat pink paddle-pad ringed with dark suckers\n- [ ] Wide lip-lined slit mouth low on the front of the underbelly, with two small pincer claws beside it\n- [ ] Two small amber/yellow eyes tucked under the carapace brim\n- [ ] Realistic rendering: natural wet chitin and ringed soft-flesh texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using\")\n- [ ] NEGATIVE: not a squid or octopus (has a shell and six rigid legs), not a plain crab (five long tentacles); ", "ruling": "", "base": "", "imgs": ["img/d14f64919d971af0173f.webp"]}, "letters": ["A", "D", "E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Blixus, RSW_Blixus", "rulings": [{"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "miasma_sheet_2026-10-05", "note": "No new art!"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "miasma_sheet_2026-10-05", "note": "No new art!"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "miasma_sheet_2026-10-05", "note": "No new art!"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "2026-10-07_miasma_sheet_2026-10-05", "note": "No new art!"}], "desc": {"def": "RSW_Blixus", "label": "blixus", "description": "Blixus were rare, half-shelled crustapod creatures native to the planet Sljee. These semi-aquatic predators were known to be deadly in the swamps and lagoons they inhabit. They were known to periodically shed their exoskeleton if broken or damaged which could be har 6e54522936baad65dbc6d1fd0d518692e": "img/e67de3567bda6341497b.webp", "65f99bebbfb00f5552ac947c29d889c68c9e519205649dd0af9ef7ff40b9c5a7": "img/65f99bebbfb00f5552ac.webp", "109774f85e5cc00900c2bc9a7d2f9cc985748e448915f29bb13d2c9cabfe78f0": "img/109774f85e5cc00900c2.webp", "f9a36d0cbf69262964101e73057d2c632a0577bcd6f9f17080eb75462a8506ab": "img/f9a36d0cbf6926296410.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/bogwing", "brief": "Viewed 2026-10-04. Image 1 is canon (Bogwing-TVE, Clone Wars-era 3D render); images 2 and 3 are\nLEGENDS (a painted plate, and a film-style CGI still of a bogwing in flight in Dagobah trees).\n- **Silhouette**: a pterosaur-like flier. Tiny slim body, small bird-like head with a short pointed\n  beak (not toothy), thin long neck, and enormous narrow membrane wings, each longer than the whole\n  body, swept up and back to sharp points (canon render: wings held high in a V).\n- **Tail**: a very long, thin, straight whip tail trailing behind, roughly body-plus-neck length or\n  more, tapering to a point.\n- **Limbs**: spindly. Two long thin hind legs with large splayed 3-toed talons (the grabbing feet);\n  two thin forelimbs/arms with clawed hands hang below the wing root (wing membrane is separate from\n  the arms in the canon render).\n- **Colour**: canon render = teal/blue-green back, neck and legs with a pale grey-mauve belly and\n  brown-mauve wing membrane with dark green leading-edge bones; one round yellow-orange eye (the eye visible in profile; the species is not one-eyed). The\n  Legends plate is grey-green and darker; the CGI still is mottled olive/moss-yellow with a red-ringed\n  eye, i.e. swamp-camouflage. Palette is NOT consistent across images: teal-and-mauve (canon) vs\n  olive/grey (Legends) -- the canon image rules. Text: the greater bogwing is bluish-green and the lesser dark brown, so one teal render is the greater form.\n- **Texture**: smooth scaleless skin, faint dark banding on the tail and body; membranous wings.\n- **Size cues**: no scale reference in any image, and lifting nine times its own weight says nothing about absolute size. The only dimensions are Legends (*Behind the Magic*): length 1-5 m, wingspan 1-3 m (https://starwars.fandom.com/wiki/Bogwing/Legends).\n- **Prose vs images**: prose says only \"reptavian, flying\"; images agree it is wyvern/pterosaur-like\n  and give the beak, whip tail and huge wings. Nothing contradicts. Greater vs lesser race: no image\n  distinguishes them.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the canon render `wookieepedia_canon_1.webp` (which rules on colour) and the two Legends images for silhouette, as the visual brief reads them.*\n- [ ] BODY PLAN: a pterosaur-like light flier: tiny slim body, long thin neck, small bird-like head with a short pointed beak (not toothy); two huge narrow membrane wings, each longer than the whole body, swept up and back to sharp points; a very long, thin, straight whip tail trailing well behind (about body-plus-neck length or more)\n- [ ] Spindly hind legs ending in large splayed 3-toed talons, held down/forward; thin forelimbs with clawed hands hanging below the wing root, separate from the wing membrane\n- [ ] COLOUR LAYOUT (canon, greater bogwing): teal/blue-green back, neck and legs over a pale grey-mauve belly; brown-mauve wing membrane with dark green leading-edge bones; faint dark banding on tail and body; smooth scaleless skin\n- [ ] Round yellow-orange eye on each side of the head (one visible in profile)\n- [ ] NEGATIVE: not a feathered bird (no feathers, no wide bird tail) and not a bat (no furry body, no bat face); not a toothy dragon or wyvern head", "ruling": "", "base": "", "imgs": ["img/01c815671100d751dd19.webp", "img/a18aa05fc95980642e13.webp", "img/fb056e77f3c1d6a6120d.webp"]}, "letters": ["A", "C", "D", "E", "F", "G ed, hunched, headless-looking bulk with the 'head' sunk into the shoulders (agrees with the prose).\n- **Skin**: dark teal-green to black-green, leathery, ragged and peeling, with pale blue-grey highlights, mottled with darker blotches and trailing strands that look like moss or hanging vines, so it camouflages into the swamp.\n- **Features**: a dense cluster of round dark red berry-like knobs or bulbs heaped on the top of the mass (where a head would be), reading as clustered red eyes or growths; the prose gives red eyes. Huge claw-fingered forelimbs hang down with raking dark claws. A face, mouth or legs are not shown.\n- **Not shown**: legs, tail, mouth, the exact eye arrangement.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Legends sourced text, the single Corroney illustration as described in the visual brief, and the owner ruling in the brief.*\n- [ ] BODY PLAN: a huge, hulking, hunched bipedal mass far taller than a person, whose skull is sunk so deep between the shoulders that the silhouette reads as a humanoid with no head; huge forelimbs hanging low\n- [ ] COLOUR LAYOUT: dull, peeling, ragged dark grey-green to teal leathery skin all over, mottled with darker blotches and pale blue-grey highlights, hung with moss-like trailing strands; red eyes/bulbs on top are the only bright colour\n- [ ] A cluster of red berry-like bulbs/eyes heaped at the top where the head should be\n- [ ] Huge claw-fingered forelimbs ending in raking dark claws\n- [ ] Realistic rendering: natural wet, leathery, moss-hung hide texture and swamp lighting, no outlines, no comic ink shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a swamp troll or ape with a visible head and face, not a quadruped, not flat comic-book teal colouring", "ruling": "", "base": b1d74aa583e3aba6707fb86a12265": "img/49b00d1439c2b9e5b744.webp", "ef9a7cffd35a1a4d7758b8204cbbc831a707f630188eb0cc52470096c92c5a7d": "img/ef9a7cffd35a1a4d7758.webp", "08e7783b9032b1996b83b15928217bda1352750d9829dd72ccb6aaa10b81ba65": "img/08e7783b9032b1996b83.webp", "9bd1be3ab3a2e3e1a1117b51c7c7c9b2a0a2f56ee501f5a71057fbf6ef48f4bd": "img/9bd1be3ab3a2e3e1a111.webp", "3c8b996f6d1a65e8ebba6ef44f247ccf9d249bcbe91638f3536270f1bc63e90b": "img/3c8b996f6d1a65e8ebba.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/shiro", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** Removed: `shirodisneyinfinity.png` (the canon infobox art \u2014 a low-poly chibi *Disney Infinity 3.0* toy render). No live-action or photoreal shiro exists (searched: `Shiro`, `Shiro/Legends`, `Shiro-trap` page images; the realistic-labelled files there are unrelated *The Old Republic* scenes). The three remaining images are realistic painted Legends plates, and the owner-ruled `shiros_group_legends.jpg` is **the target**.\n\n- `shiros_group_legends.jpg` (file `Shiros.jpg`, Legends infobox; owner-ruled): a single large shiro in side view.\n  - **Shell**: a high domed carapace built from tall, overlapping, backswept ridged plates that end in blunt wavy spines, like a frilled crest running the length of the back. Olive-green with yellow-green highlights along each ridge.\n  - **Legs**: four thick, columnar, elephant-like legs, wrinkled grey-olive skin, broad round feet with blunt toenails. The body stands **high on these legs**, well clear of the ground. It is not a low, stubby-legged turtle.\n  - **Head and neck**: a long, thick, horizontal neck with yellow-green and olive stripes, ending in a long, flat, duck-billed snout. Two small red eyes sit raised on the top of the snout like a frog's or a hippo's.\n  - **Tail**: long, tapering and held level, with a row of small spikes along the top.\n  - **Colour**: olive to moss green on the shell and neck, greyer and wrinkled on the legs. **Where this disagrees with the removed toy render:** it is muted natural olive, not a bright clean green, and the legs are long.\n- `shirotrap_legends.jpg` and `shirotrap_retracted_legends.jpg` show the symbiotic **shiro-trap**, a separate entry (`shirotrap`). A carnivorous plant roots in the shell ridges: a rosette of broad red-and-cream leaves, with long stalks ending in toothed red trap-mouths. In the retracted plate the animal's head, a flat green snout with a red eye, pokes out from under the rosette. Here the shell and skin are mottled moss-green and brown.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `shiros_group_legends.jpg`, the target picked in the `## ruling` below (owner, 2026-09-14), rendered realistically per owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\"*\n- [ ] BODY PLAN: a shelled four-legged reptile standing high on four thick columnar elephant-like wrinkled legs, body well clear of the ground, not stubby turtle legs; long thick horizontal neck in front, long level tail behind\n- [ ] Shell: high domed carapace of tall overlapping backswept ridged plates ending in blunt wavy spines, like a frilled crest running the length of the back\n- [ ] Head: long flat duck-billed snout at the end of the neck, with small raised red eyes on top\n- [ ] Long level tail with a row of small spikes along the top\n- [ ] COLOUR LAYOUT: muted olive-to-moss-green shell and neck with yellow-green ridge highlights; yellow-green and olive stripes along the neck; greyer, wrinkled legs\n- [ ] Realistic rendering: natural horny shell plates and wrinkled reptile hide, natural lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not a turtle or tortoise (no low stubby legs, no smooth round shell, no beaked turtle head), not the bright clean-green *Disney Infinity* toy, and not a shiro-trap (no plant rosette in the shell \u2014 owner ruling 2026-09-14: the Shiro-Trap ", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `shiros_group_legends.jpg`\n\n> \"There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)\"", "base": "", "imgs": ["img/8003243599a18a3071eb.webp", "img/7ba1243aa9a0eb4ceb1e.webp", "img/5232cd876ec65bfde5c6.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: RSW_Shiro, Shiro; artpipe jobs on record: canon_shiro_v1, shiro_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": ""}], "desc": {"def": "RSW_Shiro", "label": "shiro", "description": "Shiros were hard-shelled, benign, slow-moving reptiles native to the planet of Naboo. A Shiro's main defense was to retract its head, legs and tail into its spiny shell. The Shiro's low metabolism meant it could be transported over long journeys and understandably the species was spread to many worlds.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Shiro"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Shiro, last lifeStage bodyGraphicData \u00b te:** a stocky, torpedo-shaped crustacean-fish hybrid: a **huge fish-like head** with the mouth taking up most of the front, and a **long segmented armoured back** like a lobster or woodlouse tail: overlapping arched plates (a ridged carapace) narrowing to a pointed rear. Looks like a lobster with a bullfrog-fish head.\n- **Colour:** **reddish-orange to coral-red/brick-pink** skin and plates with greyer, pale blue-grey on the plate edges and underside (`legends_1`), pink-violet in the dark underwater film frame (`legends_2`). Mouth interior **purple-lilac**. Eyes **orange-red** with black slit pupil (canon infobox and text say yellow, cited to The Phantom Menace; the images lean orange-red, `canon_2` closer to amber-yellow; underwater lighting can shift hue).\n- **Mouth:** an enormous, rounded, gaping mouth edged by thick wrinkled lips and **double rows of long, pale cream, pointed conical teeth** (upper and lower, inner and outer rows), visible in `canon_1`. A **long, smooth, pink-mauve, prehensile tongue** with a knobbed tip shoots out of the mouth (`canon_2`, `legends_2` film frame).\n- **Head details:** wrinkled, folded, lumpy skin on the face; bulbous eyes set high on each side; a few short, fleshy stubs or stalks on the crown of the head, from which grow **one to three very long, thin, whip-like antennae, orange-tan at the base, ending in a dark blue-purple lure bulb at the tip** (the antennae are longer than the whole body).\n- **Limbs:** **three pairs of thin, jointed, crab-like walking legs** hanging from the underside of the rear body, each ending in a flat paddle or blunt claw, plus a **pair of broad, fan-shaped pectoral fins** behind the head (finely ribbed, orange-red).\n- **Size:** 20 m long per the text; the film frame shows it dwarfing a submersible.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded i  Species*) \u2014\n  shows a **hairless, smooth dark-gray/near-black skinned** quadruped:\n  reptilian-textured hide rather than fur, tall pointed bat-like ears, a\n  narrow snarling canine/reptile-hybrid muzzle with visible fangs, **red\n  eyes**, and a long whip-thin tail ending in a bushy black tuft. Four\n  clawed digits per paw. This is the closest single-creature match to the\n  infobox's \"gray, black, red eyes\" and reads as the most credible baseline\n  reference.\n- `wookieepedia_essentialguide_pair.jpg` (captioned \"A pack of vornskrs\" in\n  the source article) \u2014 shows two creatures that are **noticeably shaggier\n  and furrier** than the AA image: pale cream/tan-white long fur, a mane-like\n  ruff around the neck/shoulders, red eyes, a similar whip tail with dark\n  tuft, and a more bulky/boar-like build than the lean AA individual. Still\n  broadly consistent with \"gray/black + red eyes\" if the fur is read as a\n  lighter variant, but the silhouette (heavier, maned, shaggy) disagrees\n  with the sleek hairless AA depiction.\n- `wookieepedia_swamp_pack.jpg` (a multi-creature pack scene in a dark\n  swamp) \u2014 shows several **smooth black-skinned** vornskrs with **glowing\n  yellow eyes** (not red), curved horn-like ears, and the same whip tail\n  shape. The yellow eye color directly contradicts the infobox's \"red\" and\n  the other two images; treat this as an outlier, likely stylized for a\n  dramatic low-light comic/game scene rather than a color-accurate baseline.\n\n**Net read**: body plan is consistent across all three \u2014 quadruped canine\npredator, tall pointed ears, a long whip-like tail ending in a distinct\ntuft, prominent fangs. Coloring is NOT consistent: two of three sources\nagree on red eyes over gray/black skin (matching the infobox), but fur\ndensity/length and the third source's yellow eyes are genuinely\ncontradictory. Treat `wookieepedia_alienarchive.jpg` as the primary color\nanchor (matches infobox exactly) and the other two as showing the plausible\nrange of variation (or inconsistent non-canon art), not settled fact.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of `wookieepedia_alienarchive.jpg` (#1) and `wookieepedia_swamp_pack.jpg` (#3), the infobox colours, and the `## ruling` below (owner 2026-09-14: \"#1 and #3 are compatible and correct, the shaggy #2 is rejected as non-canon.\").*\n- [ ] BODY PLAN: a lean four-legged canine/reptile-hybrid predator, small (about 0.8 m tall), with tall pointed bat-like or curved horn-like ears and a long whip-thin tail ending in a distinct dark bushy tuft\n- [ ] COLOUR LAYOUT: smooth dark-grey to near-black hide over the whole body, the tail tuft black; red eyes the brightest point on the head (infobox and ruled image #1; the yellow-glowing eyes of ruled image #3 are tolerated, not the target)\n- [ ] Hide is smooth and hairless, reptilian-textured: no shaggy coat, no mane (owner ruling 2026-09-14 rejects the shaggy #2)\n- [ ] Narrow snarling muzzle with prominent visible fangs; four clawed digits per paw\n- [ ] NEGATIVE: not a wolf or dog (no fur coat, no bushy dog tail), not the shaggy pale cream/tan maned boar-like build of rejected image #2", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_alienarchive.jpg`\n\n> \"#1 and #3 are compatible and correct, the shaggy #2 is rejected as non-canon.\"\n\n**Confirmed 2026-10-09 \u2014 decision taken by question card:** the Must show stands unchanged; **red eyes are the target; yellow eyes are tolerated** (OK, not a failure).", "base": "", "imgs": ["img/7da63a163f5469f867c1.webp", "img/84171d18c5e2cbaadbaa.webp", "img/df78125ccb6834b7f618.webp"]}, "letters": ["A", "E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 2, "donorPurged": true, "noArtWhy": "searched by graphic an  found (searched: Wookieepedia pageimages Zakkeg and Zakkeg/Legends, catimages \"Images of zakkegs\"; only KOTOR II and SWTOR stylised game models exist).** The images below are animated/stylised; render this creature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions.\n\nTwo candidate images, both game-rendered 3D models rather than illustration,\nand they show a body-plan match but a color disagreement worth flagging:\n\n- `wookieepedia_kotor2_juvenile.png` (file `JuvenileZakkeg.png`, captioned\n  \"A juvenile zakkeg\"; the wiki file page sources it to the 2020 SWTOR Cartel\n  Market announcement, so it is a SWTOR pet render, NOT a KOTOR II render;\n  the filename is historical) \u2014 a **rust-red/copper-brown** quadruped with a jagged\n  spiked ridge running along the spine from head to tail, a low-slung\n  reptilian toothy head with small yellow eyes, thick knobbed/bumpy hide,\n  and stocky clawed legs. This is the closer color match to the in-universe\n  \"huge, red lizard\" quote.\n- `wookieepedia_swtor_adult.jpg` (file `Zakkeg.jpg`, the Legends infobox image;\n  the wiki file page sources it to *Knights of the Old Republic II*, so it is\n  the KOTOR II model, NOT SWTOR; the page does not call it an adult) \u2014 the\n  same body plan: spiked dorsal ridge, low reptilian head\n  with visible fangs and small eyes, thick knobbed scales, four\n  heavy-clawed legs, a tapered tail. Coloring here reads **dark\n  brown-to-near-black**, noticeably darker/duller than the juvenile render\n  and than the \"red lizard\" quote.\n\n**Net read**: body plan is consistent and well-confirmed across both\nsources and the text \u2014 a stegosaur-like reptilian quadruped predator with a\nspiked dorsal ridge, thick knobbed/armored hide, a low toothy head, and four\nheavy taloned legs; Legends gives a length greater than 4 meters\n(*Operation: Shadowpoint*; \"built like a battle tank\" is the guard captain's\nsimile, not a measurement). Color is the one open question: the KOTOR II quote\nsays red and the SWTOR pet render is rust-red, while the KOTOR II model image is\ndark brown-black. No source states an age-based colour change, so none should\nbe assumed. All of this is Legends (appearance reference only); canon\n(`Zakkeg`) holds only ", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Legends text, both game renders as described in the visual brief, and the `## ruling` below (juvenile render chosen).*\n- [ ] BODY PLAN: a huge, low-slung, stocky reptilian quadruped (\"built like a Baragwin battle tank\"), stegosaur-like, on four heavy, thick taloned/clawed legs; low head carried forward; a tapered tail\n- [ ] COLOUR LAYOUT: rust-red/copper-brown as the primary colour over the whole body (owner ruling 2026-09-14 chose `wookieepedia_kotor2_juvenile.png`, the rust-red render, matching the sourced \"huge, red lizard\"); a darker brown-black variant is attested but unconfirmed as a separate life stage\n- [ ] A jagged spiked ridge running along the spine from head to tail\n- [ ] Thick, knobbed/bumpy armoured hide over the whole body\n- [ ] Low-slung reptilian head with visible fangs/teeth and small eyes\n- [ ] Realistic rendering: natural knobbly armoured hide under natural daylight, no low-poly or stylised-game shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a smooth-skinned lizard or crocodile (no smooth scales, no missing dorsal spikes), not a slim long-legged predator; not a low-poly game model", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_kotor2_juvenile.png`", "base": "", "imgs": ["img/fa0994014758e819bf16.webp", "img/72af6e4d8dede8808e31.webp"]}, "letters": ["A", "E"], "related": [], "elsewhere": [], "noArt": f obox illustration (`wookieepedia_infobox.jpg`) were deleted. No live-action or photoreal anooba exists on film; the only REAL physical depiction is the mounted anooba head prop at Dok-Ondar's Den of Antiquities, Star Wars: Galaxy's Edge (`wookieepedia_galaxysedge_prop.jpg`). The full-body anatomy reference is the painted Star Wars Bestiary plate (`wookieepedia_bestiary.jpg`).\n\nWhat the realistic prop shows (head and neck only):\n- **Skin:** bare, deeply wrinkled, leathery pink-to-flesh-brown skin over the muzzle, jaw and throat, folded in heavy creases down the neck \u2014 NOT a furred face.\n- **Hair:** a coarse pale grey-white shaggy mane on the crown and back of the head/neck only.\n- **Mouth:** long open jaw with a heavy, protruding lower jaw, ragged lips and many uneven yellowed fangs.\n- **Eyes:** small, deep-set, dark, under a heavy wrinkled brow.\n\n\ud83d\udd34 **The realistic prop and the illustrations DISAGREE, loudly.** The Bestiary painting (and the deleted animated/illustrated images) show a furred hyena-like beast with blue-grey coat and tiger-like dark stripes; the physical prop shows a bare, wrinkled, pink-brown skinned head with only a pale mane. Per the owner's ruling the realistic look wins where they conflict: render the face, muzzle and neck as bare wrinkled leathery skin with a pale shaggy mane, and treat the striped grey coat as belonging to the body (which no realistic source shows). Body anatomy comes from the Bestiary plate:\n- **Large, erect, pointed ears** with pink/red-toned interior skin.\n- **Spiky dorsal mane** of longer fur from the skull down the spine.\n- **Long, thin, low-carried or curled tail**, rat- or lizard-like, not a canine brush.\n- **Sloped hyena posture**: front legs longer and heavier than the hind legs.\n- **Prominent lower jaw** with a chin tusk and visible fangs.\n\n**donor_current_sprite.png is weak evidence**: it is the ONLY anooba art\npresent on disk in this repo's SWBestiary mod, and it is a Dessicated\n(corpse) variant only \u2014 there is no live/default sprite for RSW_Anooba on\ndisk at all right now. A desiccated corpse pose cannot show fur color, stripe\npattern, ear shape, or live posture reliably, so it should not be used to\nvalidate or invalidate any of the canon findi", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Galaxy's Edge prop (face/neck, realistic look wins per the 2026-10-08 owner ruling in the visual brief) and the Bestiary plate (body anatomy).*\n- [ ] BODY PLAN: a canine-like quadruped in a sloped hyena stance: front legs longer and heavier than the hind legs so the back slopes down to the rump; a long thin rat- or lizard-like tail carried low or curled, not a canine brush\n- [ ] COLOUR LAYOUT: muzzle, jaw, throat and neck are bare, deeply wrinkled, leathery pink-to-flesh-brown skin folded in heavy creases (not a furred face); a coarse pale grey-white shaggy mane on the crown, running down the spine as a spiky dorsal ridge; the body coat (shown only in the Bestiary plate) grey with darker stripes\n- [ ] Large, erect, pointed ears with pink/red-toned interior skin\n- [ ] Heavy protruding lower jaw with many uneven yellowed fangs and a chin tusk jutting from it\n- [ ] Small, deep-set, dark eyes under a heavy wrinkled brow\n- [ ] Realistic rendering: natural wrinkled skin and coarse hair texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using\")\n- [ ] NEGATIVE: not a dog, wolf or plain hyena (no furred face, no bushy tail, no level back); not the blue-grey cartoon of the deleted animated frame", "ruling": "", "base": "", "imgs": ["img/b66603f45454cf05f12b.webp", "img/30204d2fff0cce70cc1c.webp"]}, "letters": ["E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 1, "donorPurged": true, "noArtW g`, a small pre-rendered CGI model (brown, heavy-headed, open saw-toothed jaw) \u2014 low resolution, use it for mass and proportion. The two watercolours carry the detail.\n\nWhat the images show (watercolours `infobox`, `coruscant_scene`; CGI `gunganfrontier`):\n- **Body**: a heavy, low-slung digitigrade quadruped, deep-chested and big-headed, with a long tapering rat-like tail; the CGI model reads bulkier and more theropod-like than the lean watercolour.\n- **Colour**: reddish-brown to maroon back and flanks fading to a lighter tan-grey underside, throat and legs; faint darker mottling on the adult's flank. The CGI is a plainer mid-brown.\n- **Head**: elongated heavy snout packed with large interlocking jagged white teeth, visible even with the jaw closed and a double saw-row when open; small red eyes; a pair of short horn-like spikes near the nose (watercolours only).\n- **Hair**: a wispy fringe of bristles along the belly and the backs of the legs (watercolours; the text says it senses vibrations through hair).\n- A smaller juvenile with the same features appears in `coruscant_scene`.\n\nRender as a real animal: leathery reptomammal hide with sparse coarse bristles, wet teeth, natural light \u2014 not watercolour wash.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the two *Wildlife of Star Wars* watercolours (`infobox`, `coruscant_scene`) for detail and the *Gungan Frontier* CGI for mass and proportion; the Legends text gives no colour at all.*\n- [ ] BODY PLAN: a heavy, low-slung, deep-chested digitigrade quadruped with a big, heavy head on an elongated snout and a long, tapering, rat-like tail\n- [ ] COLOUR LAYOUT: reddish-brown to maroon back and flanks fading to a lighter tan-grey underside, throat and legs; faint darker mottling on the flank; small red eyes\n- [ ] Teeth: the snout packed with large interlocking jagged white saw-like teeth, visible even with the jaw closed (a double saw-row when open)\n- [ ] A pair of short, blunt, horn-like spikes near the nose\n- [ ] A wispy fringe of hair-like bristles along the belly and the backs of the legs\n- [ ] Realistic rendering: natural leathery hide with coarse bristles and lighting, no outlines, no watercolour or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a rat or dog (no full fur coat, no short muzzle with hidden teeth), not a crocodile (no sprawling legs, no armoured scutes)", "ruling": "", "base": "", "imgs": ["img/1a49ad567ce62abbcf3d.webp", "img/ee4d23753f1a7c8db567.webp", "img/b08fb23618200d0f4b04.webp"]}, "letters": ["E", "F", "B", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Grank, RSW_Grank; artpipe jobs on record: desertportb_grank, grank_v1, leaningscrub_grank_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-06", "verdict": "redo", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": "Follow canon PRECISELY, look at the parent image"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": "Follow canon PRECISELY, look at the parent image. Make North and South now."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": "Follow canon PRECISELY, look at the parent image. Make North and South now."}], "desc": {"def": "RSW_Grank", "label": "Grank", "description": "The Grank (or 'saw-toothed grank') were a medium-sized carnivore believed to have originated on the planet Naboo. They were a species aa9799e490822caa10ef6dcbc1ecb1c08743cacc0": "img/05cb88ad0aa971941ca6.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/runyip", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** Removed: `wookieepedia_canon_1.webp` (the flat *Galactic Atlas* map illustration) and `wookieepedia_legends_2.webp` (a black-and-white drawing of the unrelated Tran Mariel runyip \u2014 long ears, bifurcated trunk, no stripes; do NOT use that species). No live-action runyip exists (searched: canon and Legends pages, \"Images of runyips\"; a *Battlefront II* gameplay screenshot was rejected \u2014 the runyips are specks). The two remaining images: `wookieepedia_legends_1.webp`, Terryl Whitlatch's realistic naturalist painting of the Yavin 4 runyip (*The Wildlife of Star Wars: A Field Guide*) \u2014 **the target** \u2014 and `wookieepedia_canon_2.webp`, a photoreal but motion-blurred *Battlefront II* (2017) still of one running through water (canon; confirms pale tan with dark banding at rump and tail). The removed Galactic Atlas art showed the same striped, antlered design, so the look does not change.\n- **Silhouette**: a squat, heavy, rhino/tapir-like quadruped with a huge barrel body, a high rounded hump over the shoulders and a sagging belly, short thick legs with broad padded feet, and a hanging tail with a tuft at the end. The head is held low and nose-down while rooting, long, pig-like or tapir-like.\n- **Pattern/colour**: a whitish-cream coat with bold black-brown (dark brown in the plate) tiger- or zebra-like vertical stripes over the back, flanks and rear legs; the shoulder and neck are a solid darker patch; creamy belly and underside; legs below the knees are darkest. The motion-blur game still shows pale tan with dark banding at the rump and tail.\n- **Head**: a long, flexible, pig-like snout, a down-turned wrinkled snout with a thick lower lip and a pale muzzle; small eyes; two very long, tall, branching ANTLERS rise straight up from the back of the skull like a stag's, flat and palmate with a few short tines, as tall as the head and neck combined, pale brown in the plate (the text says shed annually).\n- **Feet**: broad feet with several toes, and a claw on the front toes (text); the plate shows pale claws on the foreleg.\n- **Tail**: a long tapering tail with a tuft of hair at the tip hanging to the ground.\n- **Disagreement**: the Tran Mariel runyip is a different animal (long ears, bifurcated trunk, no stripes) \u2014 do NOT use it; the Yavin 4 text 'brown and white fur' matches the striped images.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `legends_1` (the only clear image; `canon_2` is motion-blurred).*\n- [ ] BODY PLAN: a heavy barrel-bodied quadruped built like a tapir crossed with a rhino: body longer than tall, a rounded hump over the shoulders higher than the rump, sagging belly, four short thick legs, head carried LOW (snout near the ground) on a short neck\n- [ ] Two tall branching stag-like antlers rising straight up from the back of the skull, together as tall as head and neck combined \u2014 the tallest point of the animal\n- [ ] COLOUR LAYOUT: whitish-cream ground; bold dark brown vertical stripes over the back, flanks, rump and upper hind legs; neck and shoulders a solid darker brown patch; belly cream; lower legs darkest\n- [ ] Long flexible down-turned pig/tapir snout with a thick lower lip and pale muzzle\n- [ ] Long tail ending in a tuft that hangs near the ground; broad padded feet with pale front claws\n- [ ] Realistic rendering: natural short striped fur, wrinkled snout skin and lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not a zebra, horse or deer (no long slim legs, no horse head, no upright neck); not an unstriped rhino or tapir; no nose horn; not the long-eared trunked Tran Mariel runyip", "ruling": "", "base": "", "imgs": ["img/08b514447b8d1f1a556d.webp", "img/6fe2922c261330d2f7ab.webp"]}, "letters": ["B", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Runyip, Runyip; artpipe jobs on record: desertportb_runyip, longshade_rsw_runyip_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": ""}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": ""}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": ""}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "no long-necked, long-winged soaring bird, closer to a heron or crane than a stocky raptor.\n- **Disagreement (loud)**: the deleted *Alien Archive* drawing showed heavy dark banding under the wings, a dark belly\n  patch, a hooked red-tipped beak and big blue-grey talons; the realistic render shows none of that banding, a\n  slimmer straighter beak and the legs tucked out of sight. Follow the render.\n- **Legends painting** (`woswfg_legends`): same bald blue-grey head and long neck, but **pterosaur-like membrane\n  wings** in bright orange-yellow and an open toothed beak. It is Legends; use it for head and neck only, never the\n  wings.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of `wookieepedia_bf2_render.png` (the *Battlefront II* render, primary) and the owner's 2026-10-08 realism ruling.*\n- [ ] BODY PLAN: a lean, long-necked, long-winged soaring bird, heron/crane-like rather than a stocky raptor: long broad feathered wings, a long thin bare neck held stretched forward, and a very long, thin trailing tail streamer longer than the body\n- [ ] COLOUR LAYOUT: warm golden-tan to honey-brown feathers over body and wings, soft darker brown along the feather tracts and paler tips, no heavy black barring and no dark belly patch; the bald head and bare neck blue-grey, contrasting with the golden body; tail streamer golden\n- [ ] Head: bald, vulture-like, with a long, slim, straight pale orange-tan beak (not hooked, not red-tipped)\n- [ ] Wings are feathered bird wings, never pterosaur-like membrane wings\n- [ ] Realistic rendering: natural feather texture and soft natural lighting, no outlines, no ink hatching or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not an eagle or hawk (no stocky build, no hooked beak, <header>

    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>
  </div>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>

      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

const faceAbbr = f => f in FACE_ABBR ? FACE_ABBR[f] : f.replace(/^(\d+)_(\w).*$/, (m, n, d) => n + d.toUpperCase());

    const p = purge.has(s);
    const btn = c.purgeable ? `<button class="ac-purge${p ? ' on' : ''}" title="reject + PURGE: delete this picture from the art store so it never appears again" onclick="event.stopPropagation();artTogglePurge('${it.id}','${s}')">${p ? '✕ purging' : '✕'}</button>` : '';
    const ab = faceAbbr(f);
    return `<div class="bs-cell${p ? ' ac-purged' : ''}"><div class="thumb ac-thumb" data-zoom="${t}" data-cap="${esc(it.label)} · ${c.letter} · ${f}"><img src="${t}" loading="lazy" alt=""></div>${ab ? `<span class="bs-face">${ab}</span>` : ''}${btn}</div>`;

  };
