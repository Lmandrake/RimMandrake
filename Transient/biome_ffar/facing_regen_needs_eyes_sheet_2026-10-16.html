<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
/* true size: the picture AT its real display size beside a reference of known size, on its real background */
.tsize{display:flex;align-items:flex-end;gap:14px;padding:6px 8px 2px;border-radius:5px;margin-top:5px;
  width:max-content;max-width:100%;overflow-x:auto;border:1px solid var(--line)}
.tsize figure{margin:0;display:flex;flex-direction:column;align-items:center;flex:none}
.tsize figcaption{font-size:10.5px;color:#e8e2d4;text-shadow:0 0 3px #000;margin-top:2px}
.tsbox{flex:none}
.tsbox img{width:100%;height:100%;object-fit:fill;display:block}
.tsbox.noimg{border:1px dashed #e8e2d4;box-sizing:border-box}
.tssrc{font-size:10.5px;color:#8b95a3;margin-top:2px}
.tssrc.none{color:var(--warn)}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

lly than they are drawn: real wet amphibian skin, true lighting, no ink outlines.\n\nAll three images are LEGENDS continuity (Blarth/Legends page); no canon-page image exists. They agree closely.\nNeither the canon nor the Legends text gives a colour, spiral pores, tusks or horn nubs: all of those below come from the Legends images alone. Canon recognition rests on *Star Wars: Absolutely Everything You Need to Know* (2015, https://starwars.fandom.com/wiki/Blarth); the species first appeared in *The Art of Star Wars Episode I* (Legends) and not in the film itself.\n- **Body**: a stout, rotund, low-slung amphibian-like quadruped, roughly seal/hippo-pup in bulk, with a barrel torso and short stubby legs. Front legs short with small clawed/toed feet; hind end tapers into a long, thick tail.\n- **Colour**: pale powder blue-grey hide, lighter cream-white on belly and throat, soft warm peach-orange highlights; smooth, wrinkled, rubbery skin with no fur or scales.\n- **Markings**: scattered small circular whorl/spiral dimples (concentric ring pores) over the back and flanks.\n- **Head**: wide, flat, toad-like head with a very broad mouth, small pointed teeth, one or two curved tusk-like lower teeth, small half-closed eyes, ridged/brow-wrinkled skin above, short horn nubs near the eyes.\n- **Tongue/drool**: a huge flat pink-salmon tongue lolling out of the mouth, with drool strands dripping (the infobox piece and the pup piece both show it).\n- **Tail**: very long (about body length or more), thin-ish, tapering, prehensile, ending in tiny finger-like nubs (clearly drawn in the infobox piece). Carried trailing or curled up.\n- **Size cue**: pups are small round blobs with the same pale blue colouring (the deleted comic frame put an adult at about knee-to-waist height of a humanoid child).\n- Captioned: infobox plate (side view) and a mother with pups wearing a ribbed collar (pet context). Prose says amphibian that can stay underwater two hours; images show nothing aquatic but ", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the two Legends field-guide plates as the visual brief reads them (anatomy only) and the canon tail text.*\n- [ ] BODY PLAN: a stout, rotund, low-slung quadruped (seal/hippo-pup bulk): barrel torso on short stubby legs with small clawed/toed feet; a wide, flat, toad-like head; the hind end tapering into a very long, thick-based prehensile tail (about body length or more) ending in tiny finger-like nubs, carried trailing or curled up\n- [ ] COLOUR LAYOUT: pale powder blue-grey hide over back, flanks and head; lighter cream-white belly and throat; soft warm peach-orange highlights; smooth, wrinkled, rubbery skin with no fur or scales\n- [ ] Small circular whorl/spiral dimples (concentric ring pores) scattered over the back and flanks\n- [ ] Very wide toad-like mouth with a big flat pink-salmon tongue lolling out and strands of drool\n- [ ] One or two curved lower tusks/teeth, small half-lidded eyes under wrinkled brow skin, short horn nubs near the eyes\n- [ ] Realistic rendering: natural moist, wrinkled rubbery amphibian skin and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using\")\n- [ ] NEGATIVE: not a dog, pig or seal (no fur, no flippers, no snout, no short tail); not a frog (has a long fingered tail and stands o", "ruling": "", "base": "", "imgs": ["img/60d6b30e1c240c7f2473.webp", "img/0f24f6cbcf24fbc7c36d.webp"]}, "letters": ["A", "B", "C", "D"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Blarth found", "rulings": [{"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "miasma_sheet_2026-10-05", "note": "There's no new art!"}, {"at": "2026-10-08", "verdict": "keep", "trust 026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The stylised Star Wars Galaxies game render (`bolotaur_wookieepedia_2.jpg`, tan rider-in-village scene) was deleted. No live-action or photoreal bolotaur exists (searched: `Images of bolotaurs` \u2014 only SWG game captures and this painting); the reference is the realistic painted illustration `bolotaur_wookieepedia_1.jpg` (Galaxy at War), and the donor sprite.\n\nWhat the painting shows: a squat, low-slung, heavy turtle/lizard-like reptile wading through jungle water with a scout trooper in a simple saddle on its back.\n- **Head:** broad, blunt, turtle-like head with a wide flat mouth, reddish lips/gums, heavy brow, and a crest of short pale spikes running back over the neck.\n- **Neck:** thick and moderately long, folded skin under the throat.\n- **Hide:** dark olive/moss-green on the back and limbs, covered in small rounded pebbly scales; paler cream-green throat and belly.\n- **Limbs:** thick short legs with large splayed feet ending in long curved pale-tan claws.\n- **Tail:** long, trailing behind.\n\nThe colour question is settled toward **olive-green** (the tan/golden-brown version came only from the deleted game render).", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the realistic painting `bolotaur_wookieepedia_1.jpg` as the visual brief reads it, corroborated by the donor sprite.*\n- [ ] BODY PLAN: a squat, low-slung, heavy four-legged reptile: thick short legs with large splayed feet; a thick, moderately long neck with folded skin under the throat; a broad, blunt, turtle-like head carried forward; a long tail trailing behind; big enough to be ridden\n- [ ] COLOUR LAYOUT: dark olive/moss-green on the back and limbs; paler cream-green throat and belly; short pale spikes along the crest; long pale-tan claws\n- [ ] Crest of short pale spikes running from the head back over the neck\n- [ ] Wide flat mouth with reddish lips/gums under a heavy brow\n- [ ] Hide covered in small rounded pebbly scales\n- [ ] Realistic rendering: natural pebbly reptile-scale texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using\")\n- [ ] NEGATIVE: not a sauropod (neck not long and thin, body not tall); not a turtle (no shell); not the tan/golden-brown of the deleted game render", "ruling": "", "base": "", "imgs": ["img/60fba50bfa531c0bcb37.webp"]}, "letters": ["A", "B", "C", "D", "E"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "live def dump: RSW_Bolotaur found", "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "cartoonish, redo to canon"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Focus on canon description. Longer neck. Longer tail. Not chubby.Distinct fangs."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": ""}], "desc": {"def": "RSW_Bolotaur", "label": "bolotaur", "description": "The Bolotaur are a large, long-necked herbivorous reptilian creatures native to the planet Kashyyyk. They were short-lived but reproduced quickly and were a favoured mount by the Trandoshan species, whic  chitin and soft-tissue texture and lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not the Clone Wars can-cell (no stubby red thorax with bright green bug-eyes), not a", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_teth_tcw.jpg`\n\n> \"Rename to Can-cell. Follow this render: https://static.wikia.nocookie.net/starwars/images/9/94/Can-cell.png/revision/latest/scale-to-width-down/1000?cb=20220914023816 (same as #3)\"", "base": "", "imgs": ["img/1e018b664a90dde1fca7.webp", "img/7b16ed7e7fe087fa6870.webp", "img/a062e18e79543a0c9781.webp"]}, "letters": ["A", "B", "C", "D"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_CanCell found", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "Rename to Can-cell. Follow this render: https://static.wikia.nocookie.net/starwars/images/9/94/Can-cell.png/revision/latest/scale-to-width-down/1000?cb=20220914023816 (same as #3)"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_CanCell", "label": "can-cell", "description": "Can-cells were a species of scavenging flying insectoids found on a number of planets across the galaxy (although it is believed they originated on Kashyyk). Can-Cells evolved many of their strange physical characteristics to maximise their survival in the dangerous forests and jungles they inhabit.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_CanCell"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_CanCell, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_CanCell.xml (declared)", "kind": "animal", "cells": 1.9, "bodySize": 1.45, "mesh": 1, "drawSize": [1.9, 1.9], "vi  Menace* CGI model: `wookieepedia_legends_1.webp` (adult, the film's 3D render, Star Wars Encyclopedia / Card Trader) and `wookieepedia_canon_2.webp` (infant, Visual Dictionary render). The painted watercolour `legends_2` stays only to confirm the glow band. Where the deleted illustration differed (plain olive with no spots, small tucked claws, bright red mouth), follow the film render: khaki-brown spotted hide, large forward claws, dark toothy mouth.\n- **Overall silhouette:** a very long, flat, eel/serpent body \u2014 a thick crocodilian head and neck at one end, tapering back into a long ribbon tail. In the 3D render (`legends_1`, Legends) the body is a rippling band whose back is brown-olive and whose belly is darker grey, with a fin-like flat paddle at the tail end.\n- **Head:** a crocodile/alligator head with a long snout, a row of large fangs at the front (white/cream, curved), a red-pink open mouth and tongue, and a yellow eye with a black slit pupil set high on a bony brow. The Legends render adds a toothy lower jaw with mandible-like pincers hanging off it.\n- **Claws:** a pair of jointed, clawed arm-like appendages immediately behind the head, ending in curved talons (large in `legends_1`). The text says these shove food into the mouth.\n- **Bioluminescence:** a glowing cyan/teal fringe runs along the edge between back and belly, plus a row of glowing teal nodules/studs down the spine and flanks (`legends_1`).\n- **Skin:** olive to khaki-brown, finely textured, with scattered dark blue-black spots along the flank (`legends_1`, `canon_2`).\n- **Infant (`canon_2`, canon, a baby):** a smooth tan-olive torpedo with a pale belly, blue flank spots, small yellow eye and a short croc snout; claws only just visible. Not a different species, just a juvenile: no glow fringe.\n- **Painted watercolour (`legends_2`, Legends):** shows opee sea killers escaping from the stomach; the colo is grey-brown with a blue-striped glow band down the body, spines along the back, toothy head with small claws. Useful only to confirm the glow band and the spiny back.\n- **Disagreement:** the prose says \"flat eel-like\" and \"serpentine and sp", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the *Phantom Menace* CGI render `legends_1` (adult) and `canon_2` (infant) as read by the visual brief, which follows the owner's 2026-10-08 realism ruling there.*\n- [ ] BODY PLAN: a huge sea predator with a very long, flat, eel/serpent body \u2014 a thick crocodilian head and neck at one end, tapering back into a long ribbon tail ending in a flat paddle \u2014 with a pair of jointed, clawed arm-like appendages directly behind the head, ending in large curved talons; not a stout fish, no paired fins along the body\n- [ ] COLOUR LAYOUT: olive to khaki-brown, finely textured back and flanks with scattered dark blue-black spots; belly a grey/grey-blue band distinct from the khaki back; a glowing cyan/teal fringe along the edge between back and belly and a row of glowing teal nodules down the spine and flanks; yellow eye\n- [ ] Crocodile-like head with a long snout, large curved white/cream front fangs, and a yellow slit-pupil eye set high on a bony brow\n- [ ] Mandible-like jaw appendages (Legends render) kept subtle, not required in canon art\n- [ ] Realistic rendering: natural wet, finely textured eel/crocodilian skin and underwater lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not a plain eel or moray (must have the croc head and the two clawed arms), not a crocodile or sea serpent with ", "ruling": "", "base": "", "imgs": ["img/7c5cdf4dda6ae6b9d3a2.webp", "img/6b38fff066a77cb54bbf.webp", "img/80f2f0da1200a41b17ce.webp"]}, "letters": ["A", "B", "C"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Col 26b1155b6a7f6aad89b62d4a7cfb23baea7ea": "img/cae403ba359002e43bc6_full.png", "14dcdb69251f771c28241ab92fb30246c32c76563b9aac3951899bc57f4f7bc7": "img/14dcdb69251f771c2824_full.png", "ed17f9f93180fffdf1aa0e15204ab5344d7c18cba004305bdb031a7a44032f0a": "img/ed17f9f93180fffdf1aa_full.png", "ab103e9b3a0ed6e852e84ca64344b166f7cae4e04d9b592613b8e52301b7ec35": "img/ab103e9b3a0ed6e852e8_full.png", "705da5a1d8988980f1d0ecd3f353c6334a972e2a0af00a4db3a2e60bcea3383e": "img/705da5a1d8988980f1d0_full.png", "c1d2796520a1a2d887d53b53463c87d9ee170b06e43592283d7956e6e5a9694d": "img/c1d2796520a1a2d887d5_full.png"}, "canon": {"dir": "design/RimStarWars/canon_references/graniteslug", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\n\n**Animation-only canon \u2014 no realistic source found (searched: Wookieepedia `Granite slug` and `Granite slug/Legends` page images, \"Images of granite slugs\" category \u2014 only two files exist: the *Wildlife of Star Wars* watercolour and a *Jedi Academy Sourcebook* ink drawing).** The images below are animated/stylised; render this creature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions. Think of a real nudibranch or sea slug: wet, glistening mucus-coated skin, translucent fleshy papillae, a real slime sheen; no ink outlines.\n\nBoth images are LEGENDS (Legends page only; the canon page has no image), and they disagree strongly with each other. The prose gives almost nothing visual (a small slug, two mouths, acid trails).\n- **`legends_1` (colour illustration, infobox):** a long, low slug, roughly caterpillar/sea-slug shaped. Body is ochre-orange banded with large blue-teal ringed blotches (concentric spots) running in rows down the flanks. The back carries a dense crest of short fleshy, teal-tipped papillae/fronds, tallest over the hump of the midsection. A pale grey-white foot/belly runs underneath. The head end has three or four thin, tall stalks (eye stalks and tentacle stalks, with trumpet-like flared tips; one points forward and up, others curl) and a small spiky-ringed mouth at the front. The tail end curls upward and finishes in a second spiky starburst-shaped ring of tentacles around an opening, which the earlier reviewer read as the \"second mouth\" the canon prose mentions (an interpretation: no source caption places either mouth). A trail of yellow-green slime sits behind.\n- **`legends_2` (black-and-white ink drawing):** a plain, smooth, fat, tapered slug with two short eye stalks tipped with dark knobs, a faint mottled/plated skin pattern and no frond crest, shown over a spreading black slime trail. Far simpler than `legends_1`; no second mouth visible.\n- Neither image carries a size cue; text says only \"small\". Both agree on: slug body, eye stalks, slime trail.\n- **Trust order:** `legends_1` is the only colour reference and matches the \"two mouths\" prose; `legends_2` supports a plainer baseline silhouette.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `legends_1` (the only colour image, which matches the canon \"two mouths\" prose), with `legends_2` supporting the plain slug baseline; both images are Legends, the canon page has none.*\n- [ ] BODY PLAN: a low, long slug/caterpillar body on a flat foot, with a hump over the mid-body; no legs; head end carrying thin eye and tentacle stalks; tail end curling upward\n- [ ] COLOUR LAYOUT: ochre-orange skin on back and flanks with rows of blue-teal ringed (concentric) spots down the flanks; pale grey-white foot/belly underneath; fronds teal-tipped\n- [ ] Crest of short fleshy teal-tipped fronds/papillae along the back, strongest over the mid-body hump\n- [ ] Two mouths (ca 676a38e566520c6ff16ce8149c55ad84aa46c7": "img/cd910c670783c5456758_full.png"}, "canon": {"dir": "design/RimStarWars/canon_references/hssiss", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\n\n**Animation-only canon \u2014 no realistic source found (searched: Wookieepedia `Hssiss` page images, \"Images of hssiss\" category \u2014 everything is *Tales of the Jedi* / *Splinter of the Mind's Eye* comics, sourcebook paintings, the *Book of Sith* illustration and one *KOTOR II* promotional render).** The images below are animated/stylised; render this creature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions. Deleted: the *Tales of the Jedi* comic panel (`canon_2`, `Ktriss1.jpg`) and the loose *Dark Side Sourcebook* nebula painting (`canon_4`, `Siss.jpg`). Kept (both Legends-continuity art):\n- `canon_1` (`Hssiss-BoS.png`, *Book of Sith* detailed coloured illustration) \u2014 the anatomy target, matching the prose.\n- `canon_3` (`HssissKOTORII.jpg`, *KOTOR II* promotional render) \u2014 the most naturalistic image: glossy, heavy, plated scales with real specular highlights. Use it as the MATERIAL reference for realistic scale texture, not for colour.\n\n- **Silhouette**: a heavy, long-bodied lizard like a giant iguana/komodo crossed with a crocodile; low, quadrupedal, sprawling stance with muscular thighs, long thick tail (prose: 3 m body plus a 1 m tail). `canon_3` crouches lower and more raptor-like.\n- **Spikes (loud)**: a continuous row of conical/serrated spikes runs down the back and the whole tail, climbing the neck into a crest of tall spines behind the head; a few small horn-like spikes on the snout and forelimbs.\n- **Head**: wedge-shaped crocodilian jaws with many sharp teeth, small eyes (`canon_1`: red-ringed pale eye), small horns/tusk-spikes above the nose and at the jaw corner; pale throat.\n- **Limbs**: strong legs with large, long curved claws on each toe (long pale claws in `canon_1`, black scythe claws in `canon_3`).\n- **Colour (images disagree)**: `canon_1` = bright green scaly hide with a pale cream/grey underside and a salmon-red throat/dewlap; `canon_3` = very dark blue-grey-black scales with a copper-red underbelly. The prose says green \u2014 use green, tone it down from the illustration's bright lime to a natural olive-green.\n- **Size**: prose says 3 m body plus 1 m tail; roughly humanoid-length-plus. Not a giant.\n- Invisibility/Force abilities are not depicted.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Legends prose, `canon_1` (anatomy and colour) and `canon_3` (scale material only), per the visual brief.*\n- [ ] BODY PLAN: a heavy, long-bodied, low sprawling four-legged lizard (giant iguana/komodo crossed with a crocodile): muscular thighs, belly near the ground, and a long thick tail (prose: 3 m body plus a 1 m tail)\n- [ ] Spikes: rows of conical/serrated spikes running down the whole tail and back and climbing the neck into a crest of tall spines behind the head\n- [ ] Head: wedge-shaped crocodilian jaws with many sharp bared teeth, small eyes, and small horn-spikes above the nose and at the jaw corner\n- [ ] Large, long curved claws on all four feet\n- [ ] COLOUR LAYOUT: natural olive-green to green scaly hide on back, flanks and tail; paler cream underside; a red/salmon throat dewlap (`canon_1` only; optional)\n- [ ] Realistic rendering: natural glossy reptile scales and lighting, no outlines, no comic or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a winged or upright dragon (it is a low sprawling lizard, no wings), not a smooth-backed crocodile without the spine row; not the dark blue-black `canon_3` colouring; not a giant", "ruling": "", "base": "", "imgs": ["img/69d1d551bedbb52e2641.webp", "img/ad8380b9492133e5fc04.webp"]}, "letters": ["A", "B", "C"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Hssiss found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-06", "verdict": "redo", "trust": "ruled", "sheet": "thesump_sheet_2026-10-05", "note": "follow canon precisely"}, {"at": "2026-10-06", "verdict": "keep", "trust": "ruled", "sheet": "thesump_sheet_2026-10-05", "note": "follow canon precisely"}], "desc": {"def": "RSW_Hssiss", "label": "hssiss", "description": "Hssiss (or \"dark side dragons\") were a poisnous reptile native to the planet Ambria. They were slow but aggressive ambush predators that preferred to live near bodies of water. Hssiss could be found all over the galaxy, especially on worlds where the \"dark side\" was strong (with most being descended from those brought by the many historical \"Sith\" armies).", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Hssiss"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Hssiss, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Hssiss.xml (declared)", "kind": "animal", "cells": 3.5, "bodySize": 2.75, "mesh": 1, "drawSize": [3.5, 3.5], "visualMax": null, "quad": 3.5, "img": "img/scale_RSW_Hssiss_980e61dbe6_acf37c.png", "full": "img/scale_RSW_Hssiss_980e61dbe6_acf37c_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [256, 256], "ppc": 73, "verdict": "below 128/cell \u2014 soft at enhanced max zoom", "zoomPpc": 84, "zoomFitted": false, "zoomCropped": false, "zoomFullPpc": 128, "sets": [{"l": s with the prose)**: segmented ringed body with a hunched, raised front; a round toothed suction-cup maw at the blunt front end, ringed with sharp teeth; 8-10 long curved glossy claws along the sides (glassy blue-violet in the Legends painting); a long banded tail tapering to a small spiked bulb.\n- **Colour disagreement, LOUDLY**: live-action ANH and the prose say PINK; the Legends painting is deep red with purple claws; the deleted comic was orange. Use pink-to-rose as the base.\n- **Size**: canon databank height 1.98 m when reared.\n- `legends_2` (Alien Anthology) shows a k'lor'slug facing a Kirithin; it is not obvious which creature is the k'lor'slug (probably the armoured brown segmented body with a clawed limb in the foreground). Low-confidence evidence.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the canon prose, the live-action *A New Hope* dejarik still and the SWTOR concept painting, as described in the visual brief.*\n- [ ] BODY PLAN: a long, thick, tubular segmented worm body, ringed and creased like a real earthworm or sea cucumber, rearing up in a tall arch with a hunched raised front; a long banded tail tapering behind; about 2 m tall when reared\n- [ ] COLOUR LAYOUT: pink to dusky rose-magenta skin over the whole body (live-action and prose); claws a darker, glossier contrast\n- [ ] Round suction-cup maw ringed with sharp teeth at the blunt front end\n- [ ] Many limbs along the sides ending in large curved claws\n- [ ] Realistic rendering: natural wet, wrinkled skin texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not orange (the deleted comic colour) and not a smooth legless snake or plain earthworm (it has many clawed limbs and a toothed sucker maw); no eyes-and-jaws dragon head odel, Legends):** a blue-grey, scaly four-legged reptile with **two long upswept horns**, a yellow-brown head and back spikes, long snout, a pale belly, and a rat-like thin tail. Four legs.\n- **The images disagree:** canon art (`canon_1`, `canon_2`) = tan sand-coloured, hornless apart from the side barb, many legs, huge toothy maw. Legends art = green or blue-grey, four legs, with long brow horns. Trust the canon pair for the shipping design; keep Legends horns and green colour out unless the owner rules otherwise.\n- **Size:** the two images give no scale object. Canon text for the leviathan form gives 184 m length and 28.68 m height (see Sourced text); the Legends figure of about 45 m is a different-continuity creature and must not be ap", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the canon pair (`canon_1` *Mandalorian* render, `canon_2` spit frame) and the canon leviathan text, which the visual brief names as the shipping design.*\n- [ ] BODY PLAN: a long serpentine lizard body with a very long muscular neck, a thick body and a long tail that curls up carrying a spiked ridge; many short, thick limbs in clustered banks along the body (leviathan variant: sixteen limbs), each with 4\u20135 curved dark claws\n- [ ] COLOUR LAYOUT: sand-tan / desert-brown rough, dry, wrinkled hide over the back and flanks with rock-and-sand texture, a paler cream-grey underside; teeth white; no bright colours, not green or blue\n- [ ] Huge wedge head with a wide mouth packed with rows of conical white teeth and a long tongue; a small hooked horn or barb on the side of the head\n- [ ] Short bony dorsal spikes down the neck and back\n- [ ] Able to show a yellow-green acid spray from the mouth when attacking\n- [ ] NEGATIVE: not the Legends four-legged crocodile-dragon (no four-legs-only body, no big upswept brow horns, no green-  canon with something more realistic. The web is full of them.\"**\nThe low-poly *Star Wars Galaxies* render (`swg_kreetle.jpg`, olive/khaki shell) was deleted. The owner-ruled infobox plate (`wookieepedia_infobox.jpg`, a naturalistic watercolour from *The Wildlife of Star Wars*) is the realistic target; the two small *Republic Commando* screenshots stay as corroboration of colour only (dated game renders, not a rendering model). No live-action kreetle exists. Text and images agree on the body plan:\n\n- `wookieepedia_infobox.jpg` \u2014 the official species-page illustration (naturalistic watercolour plate, *The Wildlife of Star Wars: A Field Guide*). Shows a\n  low, domed, **segmented reddish-maroon ribbed carapace** (like a\n  pillbug/woodlouse or hermit-crab shell), a tan/gold mottled head with\n  dark reddish spots, prominent dark curved mandibles/tusks at the front,\n  bright **yellow eyes**, and short jointed legs along both sides of the\n  body. This matches the sourced text closely (reddish-brown shell, yellow\n  eyes, large jaws, many legs) and is the strongest single reference.\n- `wookieepedia_kashyyyk.jpg` \u2014 small in-game screenshot (*Republic\n  Commando*, \"A kreetle found on Kashyyyk\"): low-res but shows the same\n  domed, ribbed, **pinkish-maroon shell** with visible yellow eye-glints and\n  short leg nubs. Confirms the shell color and low domed-beetle silhouette\n  at production-game fidelity, not just concept art.\n- `wookieepedia_geonosis.jpg` \u2014 small in-game screenshot (\"A kreetle found\n  on Geonosis,\" also *Republic Commando*): same domed **reddish/rust-pink\n  ribbed shell**, yellow eyes, stubby legs \u2014 consistent with the Kashyyyk\n  screenshot, reinforcing reddish-brown/maroon as the in-game standard\n  color rather than a one-off render choice.\n\n**Net read**: a low, domed, segmented/ribbed shell (pillbug or hermit-crab\nsilhouette) in reddish-brown-to-maroon, a mottled tan/spotted head, dark\nmandibles/tusks, bright yellow eyes, and many short jointed legs along the\nsides (five pairs per the text; three pairs as actually modeled in\n*Republic Commando*). This is a small, floor-hugging arthropod \u2014 treat it as\na scavenger/pest-scale creature, not anything human-sized.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Legends text and the owner-ruled infobox plate (`## ruling`, owner 2026-09-13: `wookieepedia_infobox.jpg`), corroborated for colour by the two *Republic Commando* screenshots.*\n- [ ] BODY PLAN: a small, low, floor-hugging arthropod under a domed, segmented/ribbed shell (pillbug or hermit-crab silhouette); head at the front; many short jointed legs along both sides of the body (five pairs per the text)\n- [ ] COLOUR LAYOUT: shell reddish-brown to maroon over the whole back; head mottled tan/gold with dark reddish spots; mandibles dark; eyes bright yellow, the brightest element\n- [ ] Dark, curved mandibles/tusks at the front of the head\n- [ ] Bright yellow eyes\n- [ ] Realistic rendering: natural glossy chitin texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a tall-legged spider or a long-bodied centipede (legs short, body low and domed); not an olive/khaki shell (the deleted Galaxies render); not human-sized", "ruling": "**RULED** (owner, 2026-09-13, review sheet): `wookieepedia_infobox.jpg`", "base": "", "imgs": ["img/2deee56e89234020752f.webp", "img/e68f9a5dbc72f80ff8ec.webp", "img/ea85ecf522dc242f3f91.webp"]}, "letters": ["A", "B", "C", "D"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Kreetle found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": ut and a negative, each checkable on a 256px sprite. Grounded in the live-action Ahsoka/Mandalorian stills described in the visual brief and the owner ruling in it.*\n- [ ] BODY PLAN: a small (cat-sized) four-legged animal with a plump rounded fluffy body on thin stilt-like bird legs with long clawed toes; a bushy fluffy tail carried up; a broad flat head topped by two very tall upright pointed ears\n- [ ] COLOUR LAYOUT: dense soft pale cream-to-oatmeal fur over the body, with sparse dark brown spots on the flanks and on the ears; ear tips dark and tufted, pinkish-grey inside; legs thin dark grey and scaly, the darkest part, contrasting with the fluffy pale body; pale chin pouch\n- [ ] Face: broad and flat with a wide CLOSED frog-like mouth, heavy drooping jowls, small round black eyes set wide, small flat nose, fine whiskers\n- [ ] Realistic photographic fur rendering: no outlines, no cartoon gloss, no reptile skin (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\"; earlier he rejected a glossy frog-lizard render with \"Nope. Try this.\" and the live-action Ahsoka puppet photo)\n- [ ] NEGATIVE: not an ordinary house cat (no cat face, no short ears, no furred cat legs), not a glossy frog or lizard, not the animated Rebels cartoon, no open toothy grin", "ruling": "", "base": "", "imgs": ["img/0f66e41ccad8b173c6e8.webp", "img/93301d676100d30b5499.webp", "img/c318c4e38820072051bb.webp", "img/871fdec51fbac7899c1f.webp", "img/e09a8cc76a37fb085894.webp"]}, "letters": ["A", "B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "live def dump: RSW_Lothcat found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-shee  small horns on snouts (images agree); Legends says semi-aquatic (no web or aquatic features shown).", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the canon CG render and the Legends painting as described in the visual brief, and the sourced text.*\n- [ ] BODY PLAN: a stocky, low-slung, barrel-bodied tapir/rhino-like quadruped on short stubby legs, with a long level back and a very short stub tail; about 1.1 m at the shoulder\n- [ ] COLOUR LAYOUT: two-tone coat with a pale sage-tan/cream-grey back and rump and warm orange-rust flanks and neck; cream-white bands running horizontally across the flanks and rump and ringing the upper legs; cream belly, throat and cheeks\n- [ ] Coat: short, thin, smooth hair over near-bare skin with fine wrinkles at the joints; no mane or long fur\n- [ ] Head: a long, drooping tapir-like snout with a pale muzzle and thick lower lip, a small blunt horn at the snout tip, two short pointed ears, small dark eyes\n- [ ] Feet: broad toes with claws (three or four visible), tapir-like\n- [ ] NEGATIVE: not a pig or boar (no bristly coat, no tusks, no flat pig snout), not a rhino with a big horn, not a uniformly brown unstriped animal", "ruling": "", "base": "", "imgs": ["img/e1949766180cda5ac23b.webp", "img/49f9d91227c007838072.webp", "img/ecdaba2033ba42ef3344.webp", "img/8ec7de62519a2f49eeb9.webp"]}, "letters": ["A", "B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "live def dump: RSW_Mott found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon bulbous eyes set high on each side; a few short, fleshy stubs or stalks on the crown of the head, from which grow **one to three very long, thin, whip-like antennae, orange-tan at the base, ending in a dark blue-purple lure bulb at the tip** (the antennae are longer than the whole body).\n- **Limbs:** **three pairs of thin, jointed, crab-like walking legs** hanging from the underside of the rear body, each ending in a flat paddle or blunt claw, plus a **pair of broad, fan-shaped pectoral fins** behind the head (finely ribbed, orange-red).\n- **Size:** 20 m long per the text; the film frame shows it dwarfing a submersible.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in all four images and the canon/Legends text.*\n- [ ] BODY PLAN: a stocky, torpedo-shaped crustacean-fish hybrid: a huge fish-like head at the front whose mouth takes up most of the front, behind it a long, segmented, arched armour-plated back (overlapping ridged plates) tapering to a pointed rear like a lobster tail; three pairs of thin jointed crab-like legs hanging under the rear body, each ending in a flat paddle or blunt claw; a pair of broad, finely ribbed fan-shaped pectoral fins behind the head\n- [ ] COLOUR LAYOUT: reddish-orange/coral-red skin and plates overall, paler blue-grey on the plate edges and underside; mouth interior purple-lilac; antenna lure tips dark blue-purple\n- [ ] Enormous, rounded gaping mouth edged by thick wrinkled lips, with double rows of long pale cream conical teeth\n- [ ] Long, thin, whip-like antennae (one to three) from stubs on the top of the head, orange-tan at the base, with dark blue-purple lure tips\n- [ ] Long, smooth, pink-mauve prehensile tongue that can extend far out of the mouth\n- [ ] Bulbous orange-red (to amber-yellow) eyes set high on each side of the wrinkled, lumpy face\n- [ ] NEGATIVE: not a plain fish or shark (no smooth scaled body, the back is segmented armour plates), not a lobster or crab with claws at the front (the front is a giant ", "ruling": "", "base": "", "imgs": ["img/b2dc7f7ea1beae716c8c.webp", "img/5e63caffd91d8b07e0a6.webp", "img/9873ab20653a06ae9e30.webp", "img/6ceaa8d640c04eda1fb7.webp"]}, "letters": ["A", "B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_OpeeSeaKiller found", "rulings": [], "desc": {"def": "RSW_OpeeSeaKiller", "label": "opee sea killer", "description": "A brown-armored ambusher of the Naboo core-seas, part crab, part angler. It buries itself in the silt with only its lure stalks showing, then takes prey on an adhesive tongue faster than a diver can turn. Twenty metres of patience; it has never needed to chase anything.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_OpeeSeaKiller"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_OpeeSeaKiller, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, SeaBeasts_Opee.xml (declared)", "kind": "animal", "cells": 2.25, "bodySize": 1.4, "mesh": 1, "drawSize": [2.25, 2.25], "visualMax": null, "quad": 2.25, "img": "img/scale_RSW_OpeeSeaKiller_314da0cc77_8fe787.png", "full": "img/scale_RSW_OpeeSeaKiller_314da0cc77_8fe787_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [256, 256], "ppc": 114, "verdict": "below 128/cell \u2014 soft at enhanced max zoom", "zoomPpc": 128, "zoomFitted": false, "zoomCropped": false, "zoomFullPpc": 128, "sets": [{"l": "A", "ppc": 114, "px": 256}, {"l": "B", "ppc": 114, "px": 256}], "refs": []}, "group": "Fauna", "rev": "ae95e8c81cd2d383"}, {"donorAbsent": "", "id": "RSW_Yobshrimp", "kind": "fauna", "label": "Pale yobshrimp", "effect": "fauna \u00b7  \u00b7 commonality None \u00b7 3 picture set(s)", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry) n/RimStarWars/canon_references/paleyobshrimp", "brief": "Viewed 2026-10-04. Only ONE usable image. Image 1 (canon, infobox) is a PHOTO OF A PLATED FOOD DISH\n(Yobshrimp Noodle Salad at Docking Bay 7, Batuu: cooked peeled pink shrimp on glass noodles) --\nit shows only what cooked, shelled yobshrimp look like as food (curled, pale pink-cream, no shell,\nno claws, no head). It is NOT a reference for the living animal; do not use it for sprites.\nImage 2 (LEGENDS, infobox sketch of several yobshrimp, from The Wildlife of Star Wars: A Field Guide) is the only live-animal image here; everything below is a Legends-derived provisional design, not canon.\n- **Silhouette (Legends)**: a small crab/crayfish-like crustacean. A flat, pointed, wedge-shaped\n  carapace that tapers to a sharp forward rostrum like a spear-point or a swordfish bill, held low.\n- **Limbs**: eight short walking legs, bristly and segmented, under the body. TWO very long\n  pincer-arms rise up and back over the carapace, each a long jointed arm ending in a huge\n  scissor-like claw whose two blades are long, thin and sharp (claws as long as the whole body).\n- **Face**: a bright green eye with a round pupil and, on short stalks, a pair of small green\n  bead-like feelers with bulb tips; two long thin whip antennae trail back from the face, many\n  times the body length (swirling in the water).\n- **Colour**: purple and lilac shell with dark violet mottling and small raised bumps/speckles,\n  paler lilac belly; green eyes. Painted against green water.\n- **Size cues**: none; \"tiny\" in canon prose (lives in fish gills), so shown small.\n- **Prose vs images**: canon prose is only \"tiny creature\"; Legends text says \"clawed carnivorous\n  crustacean\" -- the sketch matches the claws, but nothing in prose mentions the swordlike snout.\n  Single-source evidence: one artist's sheet, so treat details as moderately confident.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the one live-animal image, the Legends field-guide sketch (a provisional design; the canon image is a cooked food dish and is not used). **PROVISIONAL (2026-10-09):** the canon *Star Wars Bestiary, Vol. 1* covers the yobshrimp but its entry could not be read online (see the Bestiary note under Sourced text); re-check this list against the book when it is in hand.*\n- [ ] BODY PLAN: a small, low crab/crayfish-like crustacean: a flat, wedge-shaped carapace tapering to a sharp forward rostrum like a spear-point; eight short, bristly, segmented walking legs under the body in a crab-like stance\n- [ ] COLOUR LAYOUT: purple/lilac shell with dark violet mottling and small raised speckles, paler lilac belly; bright green eyes and green feeler bulbs the only non-purple accents\n- [ ] Two very long jointed arms ending in huge thin scissor claws (claws about as long as the whole body), raised up and back over the body\n- [ ] Face: a bright green round-pupilled eye, a pair of small green bead-tipped feelers on short stalks, and two long thin whip antennae trailing back behind the head, many times the body length\n- [ ] NEGATIVE: not a cooked, peeled pink shrimp (the canon food photo is not the living animal), not a plain prawn (the claws are huge and raised, the snout a sharp rostrum)", "ruling": "**2026-10-09 \u2014 decision taken by question card:** consult the *Star Wars Bestiary, Vol. 1* now and act on it. Done the same day: the book's yobshrimp entry is not reachable on the web (see the Bestiary note), so the Legends-plate reading stays in place, marked provisional.", "base": "", "imgs": ["img/2483a5fb7929291950b3.webp", "img/124254359af2bb561936.webp"]}, "letters": ["A", "B", "C"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Yobshrimp found", "rulings": [{"at /teardrop-shaped birds** with a\ndisproportionately large head-to-body ratio, **huge black-pupiled eyes**\nthat dominate the face, a flat beakless face with only a small nostril\nbump (no visible beak \u2014 this matches the text's \"beakless\" claim, which is\neasy to doubt on a \"bird\" until you actually look), short furry-looking\nstub wings held close to the body, and thin orange legs with webbed feet\ntucked almost entirely under the round belly. Coloration matches text\nexactly: **white/cream face and underbelly, gray-to-brown mottled back and\nwing feathers, warm orange-tan cheek/eye patches** (canon: orange eye plumage is male only). The nest-cliff image\nconfirms the coastal/grassy-cliff-over-ocean habitat and shows the same\ncolor pattern from a side profile. The cliff pair image (with the discarded\nlightsaber) confirms the curious/shiny-object-seeking behavior described in\nthe text and shows the stubby wings spread (the species is able to fly short distances).\n\n**The donor sprite disagrees with canon in two ways.** First, color: the\ndonor sprite's back/wings are rendered in a **flat, fairly dark charcoal\ngray** with almost no brown or warm tone, and its cheek patch is a small,\nsaturated **red-orange** blotch rather than the softer warm tan/orange seen\nin every reference image \u2014 the real animal reads warmer and more\nmottled/textured than the donor's flat two-tone fill. Second, the beak: the\ndonor sprite draws a small **visible dark beak/bill nub** at the front of\nthe face; canon porgs are explicitly and visibly **beakless** \u2014 a flat face\nwith only a tiny nostril crease, no protruding beak shape at all. Body\nsilhouette (round egg shape, big head, tiny legs, short wings) and the\nwhite belly / dark back split are otherwise correctly captured by the donor\nsprite.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable mages of strills\", title search \"strill\"; the only live-action trace is the Armorer's strill-fur mantle in The Mandalorian, which shows no living animal).** The images below are animated/stylised; render this creature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions.\n\nViewed 2026-10-04. Both images are LEGENDS (the canon page has no image, only \"thick brown fur in\nwinter\"). Image 1 is a comic painting of a strill stalking in front of a Mandalorian; image 2 is\na pencil sketch of Lord Mirdalan sitting. They show two different looks.\n- **LOUD DISAGREEMENT with Legends prose**: the prose says \"six-legged\" with \"thick gold or gray-tan\n  fur\", \"gold eyes\", and skin folds forming gliding membranes between the legs. NEITHER image shows\n  six legs, gold fur, or wing membranes. Image 1 shows a four-limbed, bare-skinned, brown\n  creature; image 2 shows a pit-bull-like dog. The canon fur claim (thick brown winter fur) is\n  also not shown. Appearance therefore rests on weak, mutually inconsistent art.\n- **Image 1 (comic)**: a low-slung, hunched, muscular quadruped like a bulldog-hyena with a thick\n  short neck and a huge head; hairless/leathery tan-brown skin with loose pleats and folds\n  all down the sides and back; two small hornlike ear fins; four large curved ivory fangs\n  jutting from a wide dark red mouth; round glossy black eyes; thick clawed forepaws; a very long\n  thin whip tail coiled up and over its back.\n- **Image 2 (sketch)**: a squat dog, like a mastiff or pit bull, sitting upright with a drooping\n  floppy ear, a wide fanged jaw with the tongue hanging out, loose skin folds draped over the\n  haunches and a thin tail rising; reads as a dog in pyjamas. Single pencil sketch, no colour.\n- **Colour**: brown to tan/rosy-brown skin (image 1); no colour in image 2.\n- **Size cues**: prose says about a metre long; image 1 shows it about waist-high-ish to a standing\n  Mandalorian, rather bigger.\n- **Reading**: the one consistent thing is loose folds of leathery skin, fangs, a long thin whip tail.\n  Fur, six legs and glide-wing membranes are text-only.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both Legends images (the comic painting above all) and the visual brief's reading; six legs, fur and glide membranes are text-only.*\n- [ ] BODY PLAN: a low-slung, hunched, muscular bulldog/hyena-like predator on four thick limbs, with a thick short neck and a huge head carried low; a very long thin whip-like tail\n- [ ] COLOUR LAYOUT: brown to tan/rosy-brown leathery skin over the whole body (canon prose: thick brown winter fur; Legends prose: gold or grey-tan); fangs ivory, the lightest element\n- [ ] Loose leathery skin folds and pleats draped along the flanks, back and haunches\n- [ ] Wide fanged mouth: large curved ivory fangs jutting from a wide dark mouth\n- [ ] Six legs, fur and glide membranes are text-only and not shown in either image -- not required until a better image exists\n- [ ] Realistic rendering: natural leathery skin and fur texture with soft natural lighting, no ink outlines, no comic shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a plain dog in a smooth coat (no tight skin, no short stubby tail), not a cartoon/comic-shaded creature", "ruling": "", "base": "", "imgs": ["img/a126e56ef29208c6729e.webp", "img/92243baf215f5f591947.webp"]}, "letters": ["A", "B", "C", "D"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "live def dump: RSW_Strill found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket rul ngulate: slender long legs with knobby knees, a deep ribcage, a short level back, an arched neck carried forward and slightly down; a long thin tail ending in a dark tuft/brush hanging to the hock.\n- **Coat**: tan to light sandy-brown short, mottled hide with a patchy lighter and darker blotch pattern; a ragged mane of longer, shaggy, darker-gold fur running along the top of the neck and the back from the shoulders to the withers.\n- **Head**: heavy, blunt, wide and wrinkled head with a deep, camel-like muzzle and a short trunk-like boss or proboscis at the nose; a pair of small spike-like horn nubs on the snout and brow; and long, wide, pointed, dark-brown ears bent back and out (the Legends text: pointing down when threatened). Two tusks on the lower jaw hook down and forward (a dark curved lower tusk is visible below the chin).\n- **Feet**: two-toed hooves, cream-coloured, split into two broad toes (Legends text and infobox say odd-toed; the render shows two big cream hoof-toes, which may be perspective, stylisation or a hidden digit -- unresolved, canon gives no toe count).\n- **Size**: tall enough to ride; the rider sits on the back with his legs hanging near the mid-barrel; the back is about chest-to-shoulder height of a person or a bit higher.\n- **Harness**: pale teal-green straps and a saddle; the harness belongs to the rider rig only.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the one canon Clone Wars render as read in the visual brief.*\n- [ ] BODY PLAN: a camel/llama-like quadruped: slender long legs with knobby knees, a deep chest, a short level back, an arched neck carried forward and slightly down, and a long thin tail ending in a dark brush hanging to the hock\n- [ ] COLOUR LAYOUT: mottled tan to sandy-brown short hide with lighter and darker blotches over the body; a shaggy darker-gold mane along the top of the neck and back; ears dark brown; hooves cream, the lightest element\n- [ ] Head: blunt, wide, wrinkled head with a deep muzzle, a short trunk-like nose boss, small spike-like horn nubs on snout and brow, and a hooked dark lower tusk below the chin\n- [ ] Long wide pointed dark ears bent back and out\n- [ ] Two broad cream-coloured hooved toes on each foot\n- [ ] Realistic rendering: natural mottled hide, coarse mane hair and hoof keratin under natural lighting, no outlines, no Clone Wars shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a plain camel or llama (no hump, no smooth narrow camel head \u2014 it needs the trunk boss, horn nubs and tusk), not a horse", "ruling": "", "base": "", "imgs": ["img/75978b2f5296d2e28082.webp"]}, "letters": ["A", "B", "C", "D", "E", "F"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_TeeMuss found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Look in canon examples"}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Eyes wide out on side of head but looking forward, with ears extending just beyond that to the back. Two upward-facing tusks protruding from mouth. Flared nostrils. Follow canon closely."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Good! Now make North and South and the proper resolutions."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Good! No , with a black-green variant in the game frame) runs from the neck down the spine and along the top of the tail, ending in a feathery tail-tip tuft. Males per the Legends text are duller orange and brown; the images all show the green-blue (female-like) form, so treat green and teal as default.\n- **Head**: a beaked, bird-like head with a hooked, horn-coloured tan-yellow armoured beak plate and brow cap, a wide pinkish mouth, a small eye; the beak looks a little like a cassowary or a parrot's.\n- **Feet**: very large, five-toed (the Legends text), splayed, webbed-looking clinging feet with long curved claws and rough grey-green toe pads; the film frame shows huge feet.\n- **Size**: GIANT, far larger than a horse: canon 15 m long and 4 m at the shoulder (Legends: 15.24 m long, 3.9 m at the shoulder, tail up to 10 m, 1,150 kg). Obi-Wan rides it saddled behind the shoulders, a clone trooper reaches only to its elbow. https://starwars.fandom.com/wiki/Varactyl\n- **Disagreement**: Legends says orange-brown males; no image shows one. The prose of 'crests and feather ridges, blue and green' matches the images.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of all four images (the Revenge of the Sith frame as anchor) and the canon/Legends size text.*\n- [ ] BODY PLAN: a giant sprawling lizard-like quadruped, far larger than a horse: elbows and knees bent out to the sides like a monitor lizard, a long deep barrel body, a long neck rising to a bird-like head, and a very long thick tail held curved up or trailing\n- [ ] COLOUR LAYOUT: green to teal scaly skin over the back and flanks (darker olive-green acceptable, as in the film frame), paler yellow-green on the throat and belly; feathers teal-blue and green; beak tan-yellow horn colour, contrasting with the green head\n- [ ] Feathers: a ruff o redible baseline\n  reference.\n- `wookieepedia_essentialguide_pair.jpg` (captioned \"A pack of vornskrs\" in\n  the source article) \u2014 shows two creatures that are **noticeably shaggier\n  and furrier** than the AA image: pale cream/tan-white long fur, a mane-like\n  ruff around the neck/shoulders, red eyes, a similar whip tail with dark\n  tuft, and a more bulky/boar-like build than the lean AA individual. Still\n  broadly consistent with \"gray/black + red eyes\" if the fur is read as a\n  lighter variant, but the silhouette (heavier, maned, shaggy) disagrees\n  with the sleek hairless AA depiction.\n- `wookieepedia_swamp_pack.jpg` (a multi-creature pack scene in a dark\n  swamp) \u2014 shows several **smooth black-skinned** vornskrs with **glowing\n  yellow eyes** (not red), curved horn-like ears, and the same whip tail\n  shape. The yellow eye color directly contradicts the infobox's \"red\" and\n  the other two images; treat this as an outlier, likely stylized for a\n  dramatic low-light comic/game scene rather than a color-accurate baseline.\n\n**Net read**: body plan is consistent across all three \u2014 quadruped canine\npredator, tall pointed ears, a long whip-like tail ending in a distinct\ntuft, prominent fangs. Coloring is NOT consistent: two of three sources\nagree on red eyes over gray/black skin (matching the infobox), but fur\ndensity/length and the third source's yellow eyes are genuinely\ncontradictory. Treat `wookieepedia_alienarchive.jpg` as the primary color\nanchor (matches infobox exactly) and the other two as showing the plausible\nrange of variation (or inconsistent non-canon art), not settled fact.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of `wookieepedia_alienarchive.jpg` (#1) and `wookieepedia_swamp_pack.jpg` (#3), the infobox colours, and the `# uted face of dark grey-black bare skin with deep-set small dark eyes\nand a jutting lower jaw of uneven fangs; two short dark ram-like horns curling down beside the face; long arms with\ndark claws. Fur reads warm cream, not pure white, and is matted and dirty-pink with blood where it fed.\n\nThe candidate images broadly agree on white shaggy fur, black facial\nfeatures, and a heavyset ape/bear-like posture with prominent claws \u2014 but\nthey diverge on stance and menace level. The ESB-era infobox still (practical\nsuit, bound and hoisted by rope, arms raised) and the unused behind-the-scenes\nstill (the wiki captions it \"an early, unused wampa costume design\", so it is design evidence, not final on-screen anatomy; the released ESB footage takes priority) (screaming close-up, fangs bared, blood-streaked claws and muzzle) both\nshow a **bipedal, ape/yeti-like posture** with long shaggy white fur, dark\nbald-looking facial skin around the eyes/muzzle, small dark eyes, and visible\nsharp claws and fangs \u2014 genuinely frightening, not cute. The live-action full-body\nstill confirms small dark curled horns on the head matching the \"small cranial\nhorns\" in the text.\n\n**The current donor sprite (`donor_current_sprite.png`) disagrees in body\nplan, not just detail**: it is drawn as a **quadrupedal**, bear/dog-like\ngrazing-animal silhouette (side profile, four legs on the ground, gentle\nposture) with tan/brown blotching on the face \u2014 none of the reference images\nshow a wampa on all fours, and none show brown blotching; every reference is\na bipedal, upright, arms-out predator with a mostly white coat and dark bare\nskin only immediately around the eyes/muzzle. The donor sprite also omits t", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of the live-action *Empire Strikes Back* stills, the owner's 2026-10-08 realism ruling and the `## ruling` below.*\n- [ ] BODY PLAN: a huge, heavy, bipedal, upright ape/yeti-like predator (2.5-3 m), long arms ending in dark claws, standing or reaching upright, not on all fours (owner ruling 2026-09-14: \"Correct. Giant ape-like predator, capable of standing upright.\")\n- [ ] COLOUR LAYOUT: long, thick, shaggy cream-white fur (warm cream, not pure white) over the whole body, hanging in clumps; dark grey-black bare skin confined to the face around the eyes and muzzle; no brown/tan blotching\n- [ ] Face: broad, short-snouted, with small deep-set dark eyes and a jutting lower jaw of uneven sharp fangs\n- [ ] Two small dark ram-like cranial horns curling down beside the face, visible in the head silhouette\n- [ ] Realistic rendering: natural shaggy cream-white fur with clumping and natural snow-cave lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a polar bear or white dog (no quadrupedal grazing stance as in the donor sprite, no long snout), not a cute or cartoon yeti", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox_esb.jpg`\n\n> \"Correct. Giant ape-like predator, capable of standing upright.\"", "base": "", "imgs": ["img/1efb1f74b79e9cfcf233.webp", "img/7d5a7ca8ba99c23c5d4c.webp", "img/c9cb2aa06374741b0fce.webp", "img/6aff8ac12bae27f138e8.webp"]}, "letters": ["A", "B", "C", "D"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Wampa found", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "Correct. Giant ape-like predator, capable of standing upright. "}, {"at": "2026-10-06", "verdict": "keep", "trust": "ruled", "sheet": "nightsideice_sheet_2026-10-05", "note": ""}, {"at": "2026-10-06", "verdict": sperbird", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\n\nThe hatched *Alien Archive* illustration (`wookieepedia_alienarchive.jpg`) was deleted 2026-10-08. The target is now\n**`wookieepedia_bf2_render.png`**, the photoreal *Star Wars Battlefront II* (canon, video game) model of the bird in\nflight. `wookieepedia_woswfg_legends.jpg` is a naturalistic Legends painting from *The Wildlife of Star Wars* and\ndisagrees on wing type (below).\n\nFrom the Battlefront II render (realistic):\n- **Plumage**: warm golden-tan to honey-brown feathers over the body and long broad wings, with soft darker brown\n  shading along the feather tracts and paler tips; the coat is fairly even \u2014 **no strong black barring** is visible.\n- **Head and neck**: a bald, blue-grey, vulture-like head and a long thin bare blue-grey neck, held stretched forward\n  in flight; a long slim pale orange-tan beak.\n- **Tail**: a very long, thin, trailing tail streamer of golden feathers, longer than the body.\n- **Silhouette**: a lean, long-necked, long-winged soaring bird, closer to a heron or crane than a stocky raptor.\n- **Disagreement (loud)**: the deleted *Alien Archive* drawing showed heavy dark banding under the wings, a dark belly\n  patch, a hooked red-tipped beak and big blue-grey talons; the realistic render shows none of that banding, a\n  slimmer straighter beak and the legs tucked out of sight. Follow the render.\n- **Legends painting** (`woswfg_legends`): same bald blue-grey head and long neck, but **pterosaur-like membrane\n  wings** in bright orange-yellow and an open toothed beak. It is Legends; use it for head and neck only, never the\n  wings.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of `wookieepedia_bf2_render.png` (the *Battlefront II* render, primary) and the owner's 2026-10-08 realism ruling.*\n- [ ] BODY PLAN: a lean, long-necked, long-winged soaring bird, heron/crane-like rather than a stocky raptor: long broad feathered wings, a long thin bare neck held stretched forward, and a very long, thin trailing tail streamer longer than the body\n- [ ] COLOUR LAYOUT: warm golden-tan to honey-brown feathers over body and wings, soft darker brown along the feather tracts and paler tips, no heavy black barring and no dark belly patch; the bald head and bare neck blue-grey, contrasting with the golden body; tail streamer golden\n- [ ] Head: bald, vulture-like, with a long, slim, straight pale orange-tan beak (not hooked, not red-tipped)\n- [ ] Wings are feathered bird wings, never pterosaur-like membrane wings\n- [ ] Realistic rendering: natural feather texture and soft natural lighting, no outlines, no ink hatching or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not an eagle or hawk (no stocky build, no hooked beak, no big talons on show), not a vulture (long thin neck and golden coat, long tail streamer), not the Legends membrane-winged orange creature", "ruling": "", "base": "", "imgs": ["img/17e6b28b1c8e3d8b545b.webp", "img/4a012672b5e57173fca9.webp"]}, "letters": ["A", "B", "G", "H", "I"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "live def dump: RSW_Whisperbird found", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-06
