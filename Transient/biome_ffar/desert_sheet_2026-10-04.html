<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

2014 closer to a cartoon manatee than the long low reptile\nin every reference image. Any regen should correct the color to green/olive\nand give the body a longer, lower, more lizard-like silhouette with a visibly\nscaled hide.", "must": "- [ ] Scaly, reptilian, elongated low-slung body \u2014 not a rounded, blobby, seal-like silhouette\n- [ ] Warm olive-green to yellow-green hide, darker/more mottled toward the back ridge\n- [ ] Long heavy tail\n- [ ] Broad, blunt-snouted head with a wide mouth\n- [ ] Short, thick legs built to carry a rider or pack saddle\n- [ ] Visible raised/pebbled scale texture", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"I think the Donor white shading means it can come in a variety of colors or something, Rimworld seems to do this sometimes. Follow #4 closest.\"", "base": "", "imgs": ["img/267471e513653fac4bc5.webp", "img/6bf47d9e937eb7d24d71.webp", "img/f20d371db498633aa8c9.webp"]}, "letters": ["A", "H", "C", "F"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Dewback, RSW_Dewback; artpipe jobs on record: canon_dewback_v1, dewback_toyfig_a, dewback_toyfig_b, dewback_v1, facingrepair_dewback_v1, longshade_rsw_dewback_v1", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "I think the Donor white shading means it can come in a variety of colors or something, Rimworld seems to do this sometimes. Follow #4 closest. "}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Almost done. The head must be MUCH bigger (see canon with riders). Otherwise great green beaded skin. Make it huge and ridable."}], "desc": {"def": "RSW_Dewback", "label": "dewback", "description": "Dewbacks are large, four-legged, omnivorous, cold-blooded reptiles native to the Dune Sea of Tatooine. As such, they are well-adapted to the harsh desert climate. This and the fact that they can be easily domesticated make them commonly employed as beasts of burden by both the inhabitants of the desert planet and the off-worlders wandering its dunes. Due to their numerous useful traits and versatility, they are quite possibly the most respected of all the creatures native to Tatooine.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Dewback"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Dewback, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Dewback.xml (declared)", "kind": "animal", "cells": 3, "bodySize": 3, "mesh": 1, "drawSize": [3, 3], "visualMax": null, "quad": 3, "img": "img/scale_RSW_Dewback_3b7873e344_b64424.png", "full": "img/scale_RSW_Dewback_3b7873e344_b64424_full.png", "set": "A", "by": "prefill", "face": "east", "srcPx": [512, 512], "ppc": 171, "verdict": "in the 128\u2013256/cell range enhanced zoom resolves", "zoomPpc": 140, "zoomFitted": true, "zoomCropped": false, "zoomFullPpc": 171, "sets": [{"l": "A", "ppc": 171, "px": 512}, {"l": "H", "ppc": 85, "px": 256}, {"l": "C", "ppc": 171, "px": 512}, {"l": "F", "ppc": 171, "px": 512}]}, "group": "Fauna"}, {"donorAbsent": "", "id": "RM_Dunejelly", "kind": "fauna", "label": "Dunejelly", "effect": "fauna \u00b7 in this biome's own roster \u00b7 commonality 0.7 \u00b7 5 picture set(s)", "tier": "ours", "tierText": "our own design (franchise-free RM_/RUT_)", "canonTag": "no canon-library entry for this subject \u2014 judge on its own", "flags": ["SIZE FALLBACK \u2014 FALLBACK 1 cell \u2014 no ThingDef in the live dump"], "prefillShort": "your earlier pick (desert sitting 1): IN GAME \u2014 SWBestiary", "prefill": "A", "prefillWhy": "your earlier pick (dese s) but still agrees on the pale\ntan color and the long trunk-snout silhouette, so it corroborates rather than\ncontradicts the higher-fidelity images.\n\n**The current donor sprite (`donor_current_sprite.png`) gets the color\nroughly right** \u2014 it's a similar pale dusty pink-grey \u2014 **but the shape is\nwrong**: it's a rounded, legless blob with a stubby trunk-snout, no visible\nlegs, no saddle/pack gear, and none of the long low camel-backed silhouette\nevery reference image shows. Any regen should keep the pale skin tone but\ngive the body a longer, lower quadruped silhouette with visible legs and the\ndistinctive trunk-like snout reading clearly against the body.", "must": "- [ ] Pale skin tone \u2014 cream, dusty tan, or pinkish-grey \u2014 never brown\n- [ ] Long, low-slung, camel-like barrel body on four thin legs with small clawed/hoofed toes\n- [ ] Elongated trunk-like snout (closer to a tapir or small elephant trunk than a simple long muzzle)\n- [ ] One large dark eye set well back on the head\n- [ ] Smooth-to-leathery hide with no visible fur or hair", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.png`\n\n> \"We have a regenerated Eopie that is pretty good, but it has legs. We should remove and regenerate it to the new spec level.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Eopie/Eopie` (variants A\u2013E and `Eopie_j` marked \"redundant with above\"):\n\n> \"B is closest but still pretty bad. Please look at Canon imagery.\"", "base": "", "imgs": ["img/f4f5ff93f7bdee4e0ef2.webp", "img/cd8af4c6230b8b7a9f7a.webp", "img/0fb8651280c01b018cba.webp"]}, "letters": ["G", "A", "B"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Eopie, RSW_Eopie; artpipe jobs on record: canon_eopie_v1, desert_swaca_eopie, doubles_redo_eopie_j_v1, doub ker purple spots, cream belly | squat frog body, flat head swept into two pointed side-lobes, very wide lipless grin, **four small green eyes in a row**, webbed long-toed hind feet, no tail | small | `wookieepedia_legends_1.webp` (Legends infobox, `Gorg-WoSW.png`, *Wildlife of Star Wars* painting) |\n| 2 | **pale grinning gorg** | pale cream-green, white-speckled bulbous belly | bulbous pear body, huge **toothy grin with red tongue**, fringe of green tendrils/barbels hanging below the mouth, green webbed feet | small, round | `wookieepedia_nl_gorgs1.webp`, left (TPM market concept art) |\n| 3 | **hammer-headed gorg** | mottled mid/dark green | **broad flat hammer/arrowhead head with eyes at the outer corners**, tendril barbels under the jaw, clawed fingers | small, heavy-headed | `wookieepedia_nl_gorgs1.webp`, lower centre |\n| 4 | **spiky-backed gorg** | peach/tan body, **lavender-purple spiky dorsal ridge**, brown speckles | bulbous pear body, spindly limbs with **orange-yellow ball-tipped toes** | small, round | `wookieepedia_nl_gorgs1.webp`, upper centre |\n| 5 | **fin-tailed gorg** | pale green, speckled belly, red eye | slender newt body, upturned **toothy jaw**, **long thin tail ending in a webbed paddle/fin** | small, long | `wookieepedia_nl_gorgs1.webp`, right |\n| 6 | **spotted long-tailed gorg (the film gorg)** | tan/ochre with dark brown spots on screen (`wookieepedia_legends_2.webp`, TPM prop); lime-green with dark-green leopard spots on the canon infobox figure (`wookieepedia_canon_1.webp`); brown in ROTJ (`wookieepedia_legends_3.webp`) | sprawled lizard-frog, bulging eyes, **long thin tail**, long splayed clawed toes, **long red tongue** | small | `wookieepedia_canon_1.webp`, `wookieepedia_legends_2.webp`, `wookieepedia_legends_3.webp` |\n\n`wookieepedia_nl_gorgs1.webp` is the Dutch Wookieepedia's illustration o", "must": "- [ ] Every variant: small, squat or newt-like amphibian with a very wide mouth\n- [ ] Variants differ in SHAPE, not only colour ( k.\n- **Underparts/limbs**: lighter yellow-orange belly and thighs; darker maroon-brown forearms and lower legs; legs jointed insect-like with segmented plated lower limbs ending in single large curved black-brown talon hooks. A segmented, ridged, tapering tail with a tip hook in the infobox render.\n- **Head**: a wide, flat armoured head with a blunt mask-plate brow, deep-set RED eyes, two long curved front fangs/mandible hooks flanking the nose, a wide jaw lined with rows of small pale teeth, a dark red mouth interior.\n- **Size**: clearly larger than a clone trooper in the frames; the prose gives about 2 m high.\n- **Disagreement**: the prose says arms are short and thin (images: yes, thin hooked forelimbs). The prose says \"long hind legs, fast\" (images: yes). Nothing contradicts. Young gutkurrs (chicks) are not shown anywhere; in frame 3 (small ones on prey) the small individuals in the background look like juveniles or smaller adults at a distance and cannot be confirmed.", "must": "- [ ] Hunched posture, long strong hind legs, short thin forearms ending in large curved black talons\n- [ ] Domed rust-orange/tan carapace with weathered pale patches and rows of cream thorn spikes down the back\n- [ ] Lighter yellow-orange belly/thighs, darker maroon-brown limbs\n- [ ] Flat armoured head with red eyes, two long curved front fangs and a wide toothed jaw\n- [ ] Segmented, ridged, tapering tail\n- [ ] Larger than a human (about 2 m tall)", "ruling": "", "base": "", "imgs": ["img/e837d04791d654a8175b.webp", "img/48f7937ee08e733c2b1a.webp", "img/9826a77d9057b1195ad9.webp", "img/e34d73bc320433b56ad3.webp"]}, "letters": ["A", "C"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Gutkurr, RSW_Gutkurr; artpipe jobs on record: desert_swaca_gutkurr, longshade_rsw_gutkurr_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_  a wide V; **orange/yellow eyes**; multiple long\n  saber-like fangs both upper and lower jaw, visible even with the mouth\n  mostly closed; thick clawed forepaws with pale tan claws. A tiny robed\n  figure with a green lightsaber stands at the creature's foot for scale \u2014\n  confirms the \"over 15 meters\" claim is not an exaggeration; the animal\n  dwarfs a standing human many times over.\n- `wookieepedia_battle_horax.jpg` \u2014 a still from the actual 2003 microseries\n  episode (flat 2D animation style, not the concept painting). Same design\n  read through the show's line-art style: blue body, tan curved horns,\n  orange eyes, a wide fanged maw, clawed feet. Clone troopers in white armor\n  ring the creature at the base of its forelimbs, again confirming\n  building-sized scale. This is the strongest single confirmation that the\n  concept-art coloring/shape actually shipped on screen rather than being a\n  promotional-only design.\n- `wookieepedia_tail_attack.jpg` \u2014 a darker action still: a segmented blue\n  tail with pale spiked/clubbed knobs at each joint sweeping through the\n  frame, with a trooper or creature silhouette flung through the air.\n  Confirms the Legends text's \"large spiked and clubbed tail\" as an actual\n  weapon used on-screen, not just a design note.\n\n**One image was checked and discarded**: Wookieepedia's `AnakinKills.jpg`\n(also linked from the Battle of Nelvaan page) was downloaded and inspected,\nbut it shows a *different* scene entirely \u2014 green pig-like creatures in the\nforeground, a machine tower, and a robed spirit figure, with no horax visible\nat all. It is not included as a candidate; the filename is misleading for\nthis creature.\n\n**Net read: render blue**, a massive wrinkled reptilian quadruped, tan\nsweeping horns on the snout, orange eyes, multiple exposed saber fangs, thick\nclawed limbs, and a spiked/clubbed tail as a visible weapon. All three kept\nimages agree with each other and with both text tiers \u2014 there is nothing to\nflag as a text/image mismatch this time.", "must": "- [ ] Deep blue, heavily wrinkled hide\n- [ ] Large tan/beige horns sweeping up and out from the snout in a wide V\n- [ ] Orange/yellow eyes\n- [ ] Multiple long saber-like fangs visible in the upper and lower jaw\n- [ ] Thick clawed limbs\n- [ ] Spiked/clubbed tail visible as a distinct feature", "ruling": "", "base": "", "imgs": ["img/7b83f3f0f7eb39afb0b5.webp", "img/62ab81f481c6d7691975.webp", "img/b1cdeb8eb9fc1bad61fc.webp"]}, "letters": ["A", "E", "F"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Horax, RSW_Horax; artpipe jobs on record: desertportb_horax, horax_v1, longshade_rsw_horax_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "MUST include the distinctive facial Y-shaped bone fixture. Read canon description."}], "desc": {"def": "RSW_Horax", "label": "horax", "description": "Horaxes were colossal, slow reptiles native to the planet Nelvaan. They were capable of growing to huge sizes thanks to the low gravity of their homeworld. Their powerfully muscled frames were covered in thick, knobby, blue skin which provided excellent defence. The mouth of the horax contained many sharp teeth, the most prominent being the four enormous saber-like fangs that protruded from its maw. At the end of the beasts' snouts was a pair of shovel-like horns used to uproot entire trees in search of small prey. Their sale and export to other worlds as juveniles as gladiatorial beasts often resulted in the specimens outgrowing their containment and escaping to form wild populations.", "source": "live def dump 2026- "lightly tanned\" skin. Every image shows a cool **grey-lavender / blue-grey hide** (warmer tan-brown shading only in the Legends side view), with **purple-blue spots** scattered over the flanks and thickening toward the spine. Trust the images: cool lavender-grey, not tan.\n- **Silhouette:** a heavy, broad-backed quadruped with a humped, arched back sloping up from a low head, thick neck and sturdy limbs; short-legged and bulky like a rhino/ankylosaur rather than a deer. Underside and lower belly pale/white.\n- **Back spines:** a row of short, dark purple-indigo cartilaginous spikes/studs along the spine and shoulders, clustered over the shoulder hump (canon_1, legends_1).\n- **Head:** a black-to-dark-purple hooked beak (parrot- or turtle-like) beneath a magenta/purple crest or facial patch; small, round, dark-ringed blue eyes set high and forward; **four long, straight horns sweeping up and back** from the brow: pale cream-white with blue-green streaking and black tips (two upper, two lower, slightly splayed). Horns are as long as the head or longer. Large soft ears are tucked in among them.\n- **Feet:** big paws/hooves with **white shaggy fur on the feet** and black claws or toes (canon_1); a thin, long **white tail** with a purple streak, drooping to the ground (canon_1).\n- **Behaviour in art (legends_2):** a herd stands in a ring facing outward with calves in the centre; adults are much bigger than the calves. Calves are plain grey with small horns.\n- Size: 3 to 4 m tall at the shoulder per prose; no scale object appears in the images.", "must": "- [ ] Cool grey-lavender / blue-grey hide (not tan) with purple-blue spots, denser toward the spine, pale belly\n- [ ] Row of short dark indigo cartilaginous spikes along the spine and shoulders\n- [ ] Four long, straight horns sweeping up and back from the brow: pale with blue streaks and black tips\n- [ ] Hooked black-purple beak under a magenta/purple crest, small round blue eyes high on the face\n- [ ] Heavy, bro iaz", "brief": "Only two images exist for this creature, both drawn from the same cut\nKOTOR asset: promotional card art and an in-engine screenshot of the unused\nmodel. They agree closely with each other. Iriaz reads as a **long-necked,\nantelope/giraffe-proportioned quadruped** \u2014 thin legs, a long slender neck,\nand a horse-or-goat-like head \u2014 with a base skin color of **muted\ngreen/olive-teal**, overlaid with **leopard-style orange-yellow spotted\nmarkings** scattered across the neck, shoulders and flank. It carries a\npair of long, ridged, backward-curving horns sweeping up from the top of the\nhead, as the card art shows (the in-game model reads as one prominent horn;\nthe owner ruled for two on 2026-10-04). The tail is thin and whip-like,\nfeet appear clawed rather than hooved. No fur is visible \u2014 smooth,\nreptilian-adjacent hide despite being classed a \"creature\" rather than\nexplicitly scaled.\n\n**The current donor sprite (`donor_current_sprite.png`) is a genuinely close\nmatch** \u2014 it already uses a green/olive body with yellow-orange spotted\nmarkings, a pair of curved horns, and a long neck, which lines up with both\nreference images far better than most other creatures in this library. The\ndonor's silhouette is more compact/rounded (a coiled sitting pose vs. the\nreferences' standing long-legged pose) and gives it two horns rather than the\none clearly dominant horn in the in-game model, but the palette and marking\npattern are already correct \u2014 this is the strongest existing donor-vs-canon\nagreement found in this pass.", "must": "- [ ] Long-necked, antelope/giraffe-proportioned quadruped body with thin legs\n- [ ] Base skin colour is muted green/olive-teal\n- [ ] Leopard-style orange-yellow spotted markings scattered across neck, shoulders and flank\n- [ ] Exactly two long, ridged, backward-curving horns, a matched pair (owner ruling 2026-10-04; the card art shows a pair)\n- [ ] Four legs\n- [ ] Thin, whip-like tail\n- [ ] Smooth hide with no visible fur", "ruling": "**Antelope \u2014 canon identity stands.** Owner, 2026-09-18: *\"antelope and close,\nthis is acceptance\"* (on PYRELANDS_CREATURE_RERENDER_1's acceptance). The\nfour-legged Dantooine grassland quadruped described above IS the identity;\nthe shipped painterly v2 set was drawn from this entry and the owner locked\nthat specific art 2026-09-17 (*\"Lock in that Iriaz.\"* \u2014 one horn, the second\nprotrusion confirmed as an ear). A \"two-legged Dathomir\" alternative was\nflagged once (2026-09-14) and investigated on IRIAZ_ART_REGEN_1: it matches\nnothing in this repo and is dead \u2014 do not re-render against it.\n\n**Two horns \u2014 REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1), superseding the 2026-09-17 one-horn lock:\n\n> \"Use canon imag", "base": "", "imgs": ["img/c0d83217baccbe877fec.webp", "img/b8a57066d139bb540826.webp"]}, "letters": ["I", "G", "H", "B", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Iriaz, RSW_Iriaz; artpipe jobs on record: desert_swaca_iriaz, doubles_redo_iriaz_edit_v1, longshade_rsw_iriaz_v1, pyrelands_iriaz_v1, pyrelands_iriaz_v2, pyrelands_iriaz_v3", "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "Looks cartoonish, south isn't south, north isn't north"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-04", "verdict": "redo", "trust": "ruled", "sheet": "art_doubles_compare_20 _1` is an all-brown/rust-red form with pale legs. `legends_3` is a grey-lilac hide with black wart-studs and green glowing patches (Rakghoul-plague-infected, per its caption: do not use as a base colour). Base form per text and Legends: brown. Sprites need a brown base and a red aggressive variant.\n- **Skin:** thick, leathery and knobbly: rows of small raised nodules or bumps across the back and shoulders (olive-yellow bumps in `canon_1`, rusty armour-like scales in `legends_1`), wrinkled folds on the legs.\n- **Face:** deep-set small eyes under a heavy brow, wrinkled snout, wide mouth with a hanging lower lip and blunt teeth; in `canon_1` there is a metal nose ring (Petranaki Arena-bred; not a base trait).\n- **Size:** `legends_2` shows a Lannik rider on its back (shoulder reaches well above a human); herd animals appear behind. Big as a rhino or bigger.\n- No tail is visible in any image.", "must": "- [ ] Massive low, hunched quadruped with a sprawling wide-set stance and thick columnar legs\n- [ ] One tall central nose/brow horn plus two thick cheek horns curving out and forward from the lower face\n- [ ] Thick knobbly, leathery hide with rows of raised bumps over the back and shoulders\n- [ ] Brown base colour, with a red-headed meat-fed variant (red knobbly head, neck and shoulders, dark body)\n- [ ] Heavy brow with small deep-set eyes, wrinkled snout and a hanging lower lip\n- [ ] Big three-toed feet with blunt claws", "ruling": "", "base": "", "imgs": ["img/c0c16153077b1d2ec5a0.webp", "img/cf8bc860390fea6b024d.webp", "img/777f6d8b17a4f27375a2.webp", "img/c408fbc337eca834ca65.webp"]}, "letters": ["A", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: IridonianReek, RSW_IridonianReek; artpipe jobs on record: desert_swaca_iridonianreek, longshade_rsw_iridonianreek_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-2 banding). There is no brown anywhere in the images.\n  The Legends colouring is the only visual evidence; brown is unsupported by any image.\n- **Silhouette**: a huge, stocky, bantha-sized quadruped, hunch-shouldered and heavy, with a deep\n  chest, thick pillar legs and a thick tapering tail that curls along the ground. The body is shaggy\n  and tall at the shoulder, sloping down to a rounder rump.\n- **Fur**: long shaggy pale-grey to white coat with vertical dark grey-brown stripes down the flanks\n  and tail; a ridge of stiff dark/white banded bristles along the spine; a shaggy beard/ruff\n  of white fur around the jaw.\n- **Head**: cat-like/boar-like face with a broad dark blue-grey leathery nose, wide snarling mouth,\n  small rounded ears, fierce eyes with several small black spots (wart-like dots) around the muzzle.\n  TWO long thick curved IVORY TUSKS grow from the lower jaw, sweeping up and forward past the face\n  (image 1: huge tusks, one pointing out in profile). TWO ribbed dark-teal/black HORNS sweep back and\n  curl from the crown (image 1 teal-grey, image 2 black with ridges).\n- **Feet**: broad pads/hooves with a few short dark claws or toe-nails; thick fur-feathered legs.\n- **Size cues**: the comic shows its head several times the size of the Jedi's; text says roughly\n  bantha-sized.", "must": "- [ ] Huge shaggy bantha-sized quadruped, shoulders high, thick pillar legs and a thick tail\n- [ ] Grey-and-white coat with vertical dark stripes (Legends images; canon prose says brown, no image supports it)\n- [ ] Two long thick curved ivory tusks from the lower jaw sweeping up and forward\n- [ ] Two ribbed dark horns sweeping back and curling from the crown\n- [ ] Broad dark leathery nose and snarling cat/boar-like face with a shaggy white beard\n- [ ] Ridge of stiff bristles along the spine", "ruling": "", "base": "", "imgs": ["img/a6dfd8d25a607cf0cbdf.webp", "img/3c45dcad24dcb3e5bc60.webp"]}, "letters": ["A", "E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Jakobeast, RSW_Jakobeast; artpipe jobs on record: desertportb_jakobeast, longshade_rsw_jakobeast_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Follow canon images closely. Enormous forward-curved tusks along mouth extrema. Two backward-facing ribbed horns. Tiger-like face. Strange triangular-claw-like hooves along feet, black. Long puffy feline tail."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Follow canon images closely. Enormous forward-curved tusks along mouth extrema. Two backward-facing ribbed horns. Tiger-like face. Strange triangular-claw-like hooves along feet, black. Long puffy feline tail."}], "desc": {"def": "RSW_Jakobeast", "label": "jakobeast", "description": "Jakobeasts were polar herd animals found in the tundras of icy planets in the Outer Rim. Jakobeasts were domesticated primarily for their meat, milk, and fur. While excellent livestock, they were ill-suited to serve as mounts, guards, or attack animals. . Jakobeasts were introduced by colonists that sought herd animals capable of defending themselves. As a result of the settlers' efforts, the creatures spread to hundreds of worlds, occasionally surviving long after the settlers themselves had vanished into history. Wild jakobeasts were hunted for their horns, which supposedly possess mysterious properties.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Jakobeast"}, "scale": {"status": "measured", "so feet.\n- **Head**: a drawn-out, narrow head with a pinkish-red snout/muzzle and red face cap, a pale blue-grey patch around a large round, pale pupilled eye, small ear nubs or horn buds on the brow, and neck flaps/frill behind the head (a note on the sheet says the flaps should move).\n- **Legs/feet**: tall, spindly pillar legs with visible knees, two-three splayed toed feet in dark red-brown with small claws or hooves; front legs a bit shorter than the hind legs, so the back rises toward the hump.\n- **Harness (concept sheet)**: a leather saddle-pad on the hump, a crossbar yoke/shaft rig to pull a cart; the rig is not part of the animal.\n- **Size**: in the concept sheet, the back rises about a head or so above a clone trooper's height.\n- **Disagreement with prose**: prose says \"large hump on their backs\"; sheets show a broad stripy ridge/hump rather than a camel-style fat lump, consistent enough. The \"red snout\" is confirmed.", "must": "- [ ] Tall spindly legs with visible knees; hump/arched back; long drawn-out neck with a small head carried low\n- [ ] Golden-yellow ochre hide with darker orange-brown vertical stripes over the back, blue-grey mottling over the hump\n- [ ] Pinkish-red snout and head cap, pale blue-grey ring around a large round eye, small brow nubs, neck flaps\n- [ ] Long heavy tapering tail carried low behind, pale underside\n- [ ] Splayed dark reddish-brown clawed toed feet\n- [ ] Rises above a person's head height", "ruling": "", "base": "", "imgs": ["img/fcf903a5e58796c5993b.webp", "img/8d15cb28c2e96b52dbef.webp", "img/64abc3dbcbaec7449b27.webp"]}, "letters": ["A", "D", "C"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Jamel, RSW_Jamel; artpipe jobs on record: desert_swaca_jamel, longshade_rsw_jamel_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": ark grey-black wide muzzle/nose pad, small dark eyes set under the fur, blunt teeth, long pink tongue (text), droopy lower lip.\n- **Size**: large for a livestock animal, about 1.3 m at the shoulder (Legends text), roughly chest-high on a person in the Falcon panel; the Legends plate shows a herder dwarfed by the animal.\n- **Disagreement**: the Legends text says 'antlered' and 'four horns'; the images show ram- or bison-style curved horns, not antlers.", "must": "- [ ] Bison-like stocky body with humped shoulders and a low-carried head\n- [ ] Long coarse shaggy curly brown fur (mane over shoulders), short strong legs with dark hoof feet\n- [ ] Curved horns (dark grey in canon) sweeping out and up\n- [ ] Broad dark grey muzzle/nose pad, small eyes under shaggy fur\n- [ ] Thin hairless rope-like tail", "ruling": "", "base": "", "imgs": ["img/7006dd5acabd4733b016.webp", "img/7c1c0e1e046a3f3a2e6a.webp", "img/54cb5d5bd8441a0b873e.webp", "img/ef7928d4f30a9220277d.webp"]}, "letters": ["A", "E"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Nerf, RSW_Nerf; artpipe jobs on record: desertportb_nerf, longshade_rsw_nerf_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Must have two short forward-facing horns and two enormous downward-curving forward horns. Follow canon closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Must have two short forward-facing horns and two enormous downward-curving forwar 1f4634ab5a3821acdbe2a1741f44be7d3e75ff33": "img/d52d491b83afcd6705e2.webp", "454b124b9892052ba9e210acca1116af25e290461e745108a4f460a18276ce54": "img/454b124b9892052ba9e2.webp", "94337b21463b22cd31ae2520a57031fa46984d47dcd1cd4a42dedfcd3099bc09": "img/94337b21463b22cd31ae.webp", "32a2409950576da1c1313ea707b12e79792be9bbca2b7fbcd60139ec8252066d": "img/32a2409950576da1c131.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/nuna", "brief": "The three candidate images (all official render/promotional art of the\nanimal itself, not food shots) are internally consistent with each other but\n**disagree sharply with the \"bird\" / \"swamp turkey\" framing in the text**.\nNone of the three shows anything resembling feathers, a beak, wings, or a\nturkey-like silhouette. What they actually show is a squat, hunched,\n**toad- or turtle-like amphibian/reptile**: a heavy domed/ridged shell-like\nback rising into a peak, a wide froglike head with a broad flat mouth and\nbulging pink or amber eyes, floppy skin flaps hanging at the sides of the\nhead (read as loose jowls/wattle, not ears), thick bent hind legs ending in\nclawed toed feet, and mottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on any of the three images, across two\ndifferent render styles and two different eras of official art. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or wattle rather than a wing. It is far more simplified and\nflat-cartoon-shaded than any candidate image (RimWorld's chunky low-detail\nart style, no visible skin texture or individual toes), and it omits the\nvisible hind legs / froggy stance entirely \u2014 the sprite reads as a rounded\nblob-with-a-face rather than a standing biped \u2014 but the *silhouette family*\n(squat, hunched, domed-backed, green, toad/turtle-adjacent, not bird-like)\nis a genuine match to canon, which is not true of every creature audited so\nfar in this library.", "must": "- [ ] Heavy domed/ridged shell-like back rising to a peak\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing\n- [ ] Mottled olive-to-dark-green pebbled/warty skin \u2014 no feather texture, beak or wings anywhere", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "base": "", "imgs": ["img/7f5a1b03b56e88bce921.webp", "img/b8fc8a62f6e3d7b1bc49.webp", "img/a502c7cabfbb362a4fa7.webp"]}, "letters": ["A", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Nuna, RSW_Nuna; artpipe jobs on record: desert_swaca_nuna, pyrelands_nuna_female_v1, pyrelands_nuna_v1, pyrelands_nuna_v2", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "E3 is canon. May need suggestion of thick bird-like le an wart highlights); the \"Suns of Fortune\"\n  painted art and the film still both show a lighter, more olive-grey-green\n  skin tone with darker striping/banding on the neck and back, and a paler,\n  cream-to-tan underside/inner-ear color. Treat the **film still\n  (`mos_eisley_street.jpg`) as the anchor reference** \u2014 it is the\n  actual on-screen VFX creature all other art derives from/matches, and its\n  olive-grey-green with darker banding is corroborated by the painted\n  Suns of Fortune art (same hue family, just more saturated/painterly).\n  The monochrome-ish infobox illustration is stylized/inked and should be\n  read for silhouette and skin texture (wrinkles, warts, ear-flap shape),\n  not for exact hue.\n- **Scale/use**: every image with human/humanoid figures for scale (film\n  still, concept sketches) confirms the \"huge\" text description \u2014 a ronto\n  towers well over a standing human, consistent with the ~4-5m/16ft quoted\n  height. The film still and the Suns of Fortune art both show tack/rigging\n  \u2014 a bridle/rein around the head and neck, and a cargo saddle/howdah\n  strapped across the shoulders \u2014 matching the sourced role as a Jawa pack\n  and mount animal.\n- No disagreement to flag beyond the production-history correction above:\n  every image's silhouette, ear-flap shape, horn, beak, and body proport", "must": "- [ ] Long, gently S-curved neck rising to a triangular head\n- [ ] A rhino/ceratopsian-style pointed nose horn or nasal ridge, with a beaked, slightly downturned mouth\n- [ ] Two large, wing-like skin-flap \"ears\" fanning out and back from the head/neck like a frill\n- [ ] Thick, heavily columnar legs (four) ending in broad clawed/hoofed feet, with deeply wrinkled/creased skin and scattered wart-like bumps\n- [ ] Muted dark olive-to-brownish-grey coloration \u2014 not saturated brown, not blue-grey \u2014 with darker striping/banding on the neck and back and a paler cream-to-tan underside", "ruling": "", "base": " 41ca6b2faa9799e490822caa10ef6dcbc1ecb1c08743cacc0": "img/05cb88ad0aa971941ca6.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/runyip", "brief": "Four images: CANON (a Battlefront II concept/map illustration labelled RUNYIP, and a motion-blurred game still of one running through water), LEGENDS (a painted plate of the Yavin 4 runyip, and a black-and-white drawing of a DIFFERENT species, the Tran Mariel runyip). The Legends text itself says two unrelated species share the name; use the Yavin 4 (canon) animal.\n- **Silhouette**: a squat, heavy, rhino/tapir-like quadruped with a huge barrel body, a high rounded hump over the shoulders and a sagging belly, short thick legs with broad padded feet, and a hanging tail with a tuft at the end. The head is held low and nose-down while rooting, long, pig-like or tapir-like.\n- **Pattern/colour**: a whitish-cream coat with bold black-brown (dark brown in the plate) tiger- or zebra-like vertical stripes over the back, flanks and rear legs; the shoulder and neck are a solid darker patch; creamy belly and underside; legs below the knees are darkest. The motion-blur game still shows pale tan with dark banding at the rump and tail.\n- **Head**: a long, flexible, pig-like snout, a down-turned wrinkled snout with a thick lower lip and a pale muzzle; small eyes; two very long, tall, branching ANTLERS rise straight up from the back of the skull like a stag's, flat and palmate with a few short tines, as tall as the head and neck combined, pale brown in the plate (the text says shed annually).\n- **Feet**: broad feet with several toes, and a claw on the front toes (text); the plate shows pale claws on the foreleg.\n- **Tail**: a long tapering tail with a tuft of hair at the tip hanging to the ground.\n- **Disagreement**: the Tran Mariel runyip (Legends 2) has long ears, a long bifurcated trunk and no stripes, so do NOT use it; the Yavin 4 text 'brown and white fur' matches the striped images.", "must": "- [ ] Squat barrel-bodied rhino-tapir shape, high shoulder, sagging belly, short thick legs, head held low\n- [ ] Whitish coat with bold dark brown/black vertical stripes over back, flanks and rump; dark solid shoulder\n- [ ] Long flexible down-turned snout with thick lip\n- [ ] Two tall branching antlers rising straight up from the back of the skull\n- [ ] Broad padded multi-toed feet with front claws\n- [ ] Long tail with a tuft at the tip", "ruling": "", "base": "", "imgs": ["img/9a954bab919b95674c45.webp", "img/08b514447b8d1f1a556d.webp", "img/6fe2922c261330d2f7ab.webp", "img/97fe93193086936c99db.webp"]}, "letters": ["A", "G"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Runyip, Runyip; artpipe jobs on record: desertportb_runyip, longshade_rsw_runyip_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Note canon's wide mouth and characteristic stripes. Follow canon imagery closely."}], "desc": {"def": "RSW_Runyip" ots near the legs.\n- **Legs/feet**: thin tapering legs ending in small, flat three-toed splayed feet with tiny claws or nails, jointed at an odd backward angle.\n- **Cutaway (Legends)**: shows a huge internal cavity packed with several unborn young in separate chambers; not needed for the sprite. Wild shaaks are said (Legends text) to be less bulbous.\n- **Size**: huge: the body is several times the leg height; the plate shows pups at about one-fifth size.", "must": "- [ ] Giant egg-shaped body balanced on four short thin weak-looking legs\n- [ ] Small low-slung head on a short neck with a tapering droopy snout, dark red eye\n- [ ] Brown/orange-tan leathery hide with cream marbling or pale streaks along the back and flank\n- [ ] Small flat splayed three-toed feet\n- [ ] Smooth bare skin with deep neck and leg folds", "ruling": "", "base": "", "imgs": ["img/28d725029e9e93313e55.webp", "img/e1b4215cec749b77ec96.webp", "img/ef394bba54e958f4f45c.webp", "img/9fa82a69c95015f8eb9e.webp"]}, "letters": ["A", "C"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Shaak, Shaak; artpipe jobs on record: desertportb_shaak, longshade_rsw_shaak_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Follow very unusual canon images closely. Bodyplan almost like a tick. very powerful back legs, much weaker/smaller front legs, relatively tiny head. 50% bigger."}], "desc": {"def": "RSW_Shaak", "label": "shaaks", "description": "Shaaks were plump pachydermoid herd animals nati  and a small, pointed head, **four narrow, long, translucent insect-like wings** (two forewings and two hindwings, held up and back or beating), and a **very long, thin, whip-like tail, about as long as the rest of the animal or longer** that ends in a small tuft or fan of feather-like fins in the Legends art. Text: four powerful legs, prehensile tail, wingspan up to 1 m.\n- **Head:** a small, narrow, wedge or beak-shaped head with a wide mouth packed with fangs and **two long curved fangs/tusks pointing down from the upper jaw** (strong in both Legends images, hinted in the canon prop where the open mouth shows curved fangs). Eyes are large and orange-red in the Legends art and small in the prop.\n- **Limbs:** four thin, spindly, insect-like legs with long curved claws, tucked under the body in flight; in the canon prop two of them grip a dead branch, with small clawed hands.\n- **Colour disagreement:** canon prop (`canon_1`) is **pale cream-pink bare skin** with a lightly banded tan-striped tail and **amber-brown, veined wing membranes**: it looks like a dried or taxidermied specimen. Legends (`legends_1`, `legends_2`) is a **yellow-green/olive and pale-blue** body with horizontal banding on the tail, **translucent pale blue and yellow wings with dark veins and blotches**. Prose gives no colour. Use the prop for skin texture and wing placement and the Legends sheets for the wing, tail-tuft and fang shapes. Treat the colouring as unsettled.\n- **Size:** 1 m long at most; the swarm in `legends_2` shows many tiny insect prey beside them.", "must": "- [ ] Slim, lean body with a long thin neck and a small narrow wedge-shaped head\n- [ ] Four narrow, long, translucent insect-like wings (two pairs), veined\n- [ ] Very long thin whip-like tail, as long as the body or longer, ending in a small tuft or fan\n- [ ] Mouth full of fangs with two long curved tusk-like fangs hanging from the upper jaw\n- [ ] Four thin spindly clawed legs, held tucked under the body in flight", "r  and a large bat-style wing on each side attached at the shoulders.\n- **Head (loud)**: a distinctive BIRD-LIKE head: a long deep hooked or blunt beak like a raven or\n  toucan, with a huge gaping red mouth; a rounded skull, small spikes along the crest and brow,\n  and ONE round eye on each side of the head (the painting in image 3 shows a pale emerald/teal eye\n  and a crest/brow plate; prose says emerald eyes). Beak is long and thick, and the mouth is lined\n  with red. Image 2 gives the clearest beak profile (raven-like).\n- **Wings**: leathery bat-style membrane over long finger bones, a pointed upper arm ridge;\n  large enough to carry two riders (wing extends well beyond the body).\n- **Feet**: heavily scaled four-toed paws ending in long curved dark talons.\n- **Skin**: covered in fine overlapping scales (pebbled, ridged); in image 1 and 3 the skin is a grainy,\n  warty-textured dark hide.\n- **Colour (images disagree)**: image 1 = near-black charcoal body with red-orange wing\n  membrane; image 2 (stable) = mixed -- purple adults and pink/red/grey/lilac babies and juveniles;\n  image 3 = grey-blue head and neck, dark charcoal body, pink-brown wing; image 4 = pale\n  blue-grey and pink wing membranes. No single colour: choose a base of dark grey with reddish\n  membrane (images 1, 3) and treat purple/pink/blue as variants.\n- **Age cues**: juveniles (image 2) are small, thin, long-tailed, big-eyed, and very bat/pterodactyl-\n  like, with big wings relative to body; adults are heavy and broad.\n- **Size cues**: bigger than a human; carries one or two riders (images 1 and 3).\n- **Prose vs images**: prose \"sharp beaks\" confirmed; images add the wide red gaping mouth. Prose says\n  one set of emerald eyes on the front of the head -- images show eyes at the side.", "must": "- [ ] Wyvern body: heavy scaled reptilian torso, strong legs with four-toed dark talons, long thick tapering tail, long neck\n- [ ] Large bat-style leathery wings with visible finger-bone r l", "brief": "Four images: CANON (a Dark Kingdom/game CG render with a saddle), LEGENDS (a painted plate, the Revenge of the Sith film frame of Boga with Obi-Wan, and a Galaxies game 'preystalker'). The film frame is the fixed canon-look anchor; all four are one design.\n- **Silhouette**: a big lizard-like quadruped, sprawling, low, with elbows and knees bent out to the sides like a monitor lizard or iguana, a long deep barrel body, a long neck rising to a bird-like head, and a very long thick tail (up to 10 m per the Legends text) held curved up or trailing. Forelegs are long and splayed; in the plate it can rear up on its hind legs with the forelimbs held like arms and a more upright, theropod posture.\n- **Skin**: scaly, pebbled, mid-green to blue-green teal, paler yellow-green on the throat and belly; in the film frame it is darker olive-green with a lighter underside; large rough scales over the shoulders and thighs.\n- **Crest/feathers**: a ruff or mane of long stiff teal-blue to green feathers fanned around the back of the head and neck like a headdress; a ridge of shorter feathery spines (blue and green tipped, with a black-green variant in the game frame) runs from the neck down the spine and along the top of the tail, ending in a feathery tail-tip tuft. Males per the Legends text are duller orange and brown; the images all show the green-blue (female-like) form, so treat green and teal as default.\n- **Head**: a beaked, bird-like head with a hooked, horn-coloured tan-yellow armoured beak plate and brow cap, a wide pinkish mouth, a small eye; the beak looks a little like a cassowary or a parrot's.\n- **Feet**: very large, five-toed (the Legends text), splayed, webbed-looking clinging feet with long curved claws and rough grey-green toe pads; the film frame shows huge feet.\n- **Size**: about horse-sized or larger; Obi-Wan rides it saddled behind the shoulders, a clone trooper reaches only to its elbow.\n- **Disagreement**: Legends says orange-brown males; no image shows one. The prose of 'crests and feather ridges, blue and green' matches the images.", "must": "- [ ] Sprawling lizard body with splayed elbows, long neck, very long thick tail, horse-sized\n- [ ] Green to teal scaly skin, paler yellow-green throat and belly\n- [ ] Ruff of long teal-blue and green feathers around the back of the head and a feathered ridge down spine and tail with a tuft at the tip\n- [ ] Beaked bird-like head with a tan hooked armoured beak plate\n- [ ] Huge five-toed clawed climbing feet", "ruling": "", "base": "", "imgs": ["img/cf36e5520903bee227e6.webp", "img/f50065f328a17e000707.webp", "img/e73a9ec632e69423b4c8.webp", "img/8311fc20441098490032.webp"]}, "letters": ["A", "D", "E", "F"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Varactyl, Varactyl; artpipe jobs on record: desertportb_varactyl, longshade_rsw_varactyl_v1, longshade_rsw_varactyl_v2, longshade_rsw_varactyl_v3", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Check lore, each face looks different"}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Color variations welcome. Follow the canon closely. Long, sinewous ridable beast. Not terrestrial. Keep vibrant coloration."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Color variations welcome. Follow the canon closely. Long, sinewous ridable beast. Not terrestrial. Keep vibrant coloration."}], "desc": {"def": "RSW_Varactyl", "label": "varactyl", "description": "Varactyls, also known as 'dragonmounts', wer ce sits on the front of the ball, no neck. Large round **eyes with a coloured mask-like ring or patch around them** (pink-purple/magenta rings in `legends_2` and `legends_3`; a dusky red-brown ring in `canon_1`; yellow patches in `legends_1`), irises blue, lavender or green. A small **pointed pink-brown nose**, a wide smile, and **small needle teeth** in the open mouth (visible in `legends_1`, `legends_2`).\n- **Ears or horns:** **two small tufts or pointed ear-like stalks on top of the head**: pale thin stalks ending in small white bud-like tips (`canon_1`), a pair of rounded ear-tufts (`legends_2`, `legends_3`), or longer horn-like pale blue-green tufts (`legends_1`).\n- **Fur:** very soft, dense, puffy fur covering the whole ball. **Colour disagreement:** canon (`canon_1`) is **cream-white with a pale tan back and white face**; `legends_1` is a **bright orange-red shaggy fur**, almost like a fox or Furby; `legends_2` and `legends_3` are **golden-tan to amber on the back with a white fluffy chest, throat and cheek ruff**. The text says \"soft white fur\" in canon. The white face and chest plus a warm golden-buff back is the common core.\n- **Size:** small enough to be held in one hand (`legends_1` shows it in a palm, the body about the size of a fist). `canon_1` is shown larger, relative to its legs, than the Legends art.", "must": "- [ ] Round, fluffy puffball body with no visible neck, soft white fur in canon (golden-buff back, white face and chest in Legends)\n- [ ] Thin, long, stick-like jointed legs (six per the text) ending in small clawed or toed feet\n- [ ] Large round eyes ringed with a coloured mask-like patch, a small pointed nose and a wide smile with tiny needle teeth\n- [ ] Two small tufts, ear stalks or bud-tipped stalks on top of the head\n- [ ] Hand-sized pet creature (kept small despite the long legs)", "ruling": "", "base": "", "imgs": ["img/0fcf85d4f13b1bc86d9b.webp", "img/78dae2bf16e00e955e7f.webp", "img/b2725622f4f27ec059d0.webp", "img/c8ab74 s with rounded tips in `canon_1`).\n- **Head:** a broad, flat head, no visible neck, with **a very wide, thick-lipped, downturned toad mouth** (a heavy pouty upper lip in `canon_1`), two small nostrils, and **large bulging eyes on top, ringed with heavy lids**: orange-red in `canon_1`, amber/yellow-green in `canon_2` and `legends_1` and `legends_2`, vertical-slit pupils in the 3D renders. Between the eyes is a **ridged, grooved patch or brow plate** (banded folds, `canon_1` and `canon_2`).\n- **Palps:** **two long, thin, curved stalk-like cranial palps (antennae) rise from the top of the head**, bending outward, with small knobbed tips in `canon_1`.\n- **Spikes and skin:** a **crest of conical horn-like spikes around the top and sides of the head, over the shoulders and down the arms and back**: orange-brown in `canon_1`, tan to rose in `canon_2`, grey-brown in `legends_1` and `legends_2`. The skin is **warty, bumpy and rough everywhere**, with small raised tubercles.\n- **Colour disagreement:** `canon_1` is **olive-green with a yellow-ochre belly and orange-brown spikes**; `canon_2` is **rosy brown to dusty pink-tan with tan warts**; `legends_1` (the film puppet) is **tan-brown**; `legends_2` is **grey-brown**. The text says \"brown, warty skin\", and the belly turns bright yellow when full. So brown is the baseline; olive-green and rose-tan are the render variants, and a yellow belly is a state change.\n- **Size:** 1.5 m tall per the text; it looks bigger than a human torso in the puppet shot.", "must": "- [ ] Squat, toad-like body hunched forward, supported on long, thin, strong forelimbs with big long-fingered hands\n- [ ] Very wide, thick-lipped, downturned mouth in a broad flat head with no neck\n- [ ] Large bulging heavy-lidded eyes (orange, amber or yellow-green) with a ridged brow patch between them\n- [ ] Two long, thin, curved palp stalks rising from the top of the head\n- [ ] Row of conical horn-like spikes around the head, over the shoulders and down the arms\n- [ ] Rough warty skin, brown as a baseline (olive-green and rose-tan variants), with a big round belly that can show bright yellow when full", "ruling": "", "base": "", "imgs": ["img/de88ef69ca76b55efcaf.webp", "img/49e2e276cfeeef6564b8.webp", "img/fba316e26b426d38d903.webp", "img/a6a9799ff9e6e231e3b2.webp"]}, "letters": ["E", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Worrt, Worrt; artpipe jobs on record: desert_swaca_worrt, longshade_rsw_worrt_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Check canon"}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Follow canon closely. NOT a frog. Big yellow verticaly slitted eyes. Two antennae. Frilled gills on face. Long hunched back legs, short front legs, suckered feet."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Follow canon closely. NOT a frog. Big yellow verticaly slitted eyes. Two antennae. Frilled gills on face. Long hunched back legs, short front legs, suckered feet."}, {"at": "2026-10-05", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Follow canon closely. NOT a frog. Big yellow verticaly slitted eyes. Two antennae. Frilled gills on face. Long hunched back legs, short front legs, suckered feet."}, {"at": "2026-10-06", "verdict": "keep", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": ""}, {"at": "2026-10-06", "verdict": "keep", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": ""}, {"at": "2026-1 r common\nMods folder), so there is no `donor_current_sprite.png` candidate for this\nentry.", "must": "- [ ] Long thin neck with a small head atop it (giraffe-like silhouette)\n- [ ] Long thin legs and a long thin tail, in giraffe-like proportion \u2014 not stocky\n- [ ] Tawny/tan base coat with dark rust-brown crosswise, tiger-style banding/striping on the neck, shoulders and legs \u2014 not giraffe-style blotches\n- [ ] A pair of pale, thin, curved horns swept back from the top of the head \u2014 not a single thick ridged horn", "ruling": "", "base": "", "imgs": ["img/aca00a1d1a94d9aeba43.webp", "img/40efcabce6d6c52fd60c.webp"]}, "letters": ["A", "I", "J"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: RSW_Zeer, Zeer; artpipe jobs on record: desertportb_zeer, longshade_rsw_zeer_v1, pyrelands_zeer_v1, pyrelands_zeer_v2", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Make it less girrafe like by bulking out the body and slanting it sharply upwards. Follow canon closely. Make it 50% bigger."}], "desc": {"def": "RSW_Zeer", "label": "zeer", "description": "The Zeer were a species of long-necked herbivorous animals of unknown planetary origin. They were sociable herd animals. Their exotic appearance made them popular in both galactic zoological exhibits and circuses, ultimately leading to their spread to multiple worlds in order to supply demand.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Zeer"}, "scale": {"status": "measured", "source": "live <header>
  <div class="hrow">
    <h1 id="title">Review sheet</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>
  </div>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>
    <select id="fmark">
      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

  <div class="banner bad hide" id="err"></div>
</header>

<div id="list"></div>

<div id="zoom"><div><div class="box"><img id="zimg" alt=""></div><div class="cap" id="zcap"></div></div></div>

</div>

/* Layout (owner complaint 2026-10-04, "poorly constructed"): one compact strip per graphic. Each picture

   thumbnail tall. Provenance is a tooltip, never wallpaper. Letters are row-local; the pick buttons on
   the right show only this row's letters. */
const FACE_ABBR = { south: 'S', east: 'E', north: 'N', west: 'W', single: '' };

     re-request every 66 ms, which kept headless Edge's virtual clock from ever settling (req 13 hang, 2026-10-07) */
  const im = el.querySelector('img'); if (!im || !im.complete || !im.naturalWidth) return;
  el.dataset.i = i; im.src = fr[i];
}), 66);
/* Variant default (owner, 2026-10-06): a row whose record has no `variants` key starts with EVERY set that is ours

window.artDefaultVariants = (it, d) => {

    const shas = Object.values(c.faces || {});

    out.push(c.letter);
  }
  return out.sort((a, b) => LETTER_ORDER.indexOf(a) - LETTER_ORDER.indexOf(b));
};
