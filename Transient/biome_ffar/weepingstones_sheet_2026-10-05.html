    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

 \u2014 plausibly the \"light-colored\" eye the Databank cites, seen\n  under different lighting, or an amber variant; no image shows anything\n  resembling brown or green skin, so \"blue and purple\" in the text is\n  confirmed by the art rather than undersold by it.\n- **Riders/scale**: Both the concept-art landscape piece and the trading-card\n  art show a rider in a hooded cloak with a spear/pike, seated at the base of\n  the neck/shoulders with a visible harness/saddle strap \u2014 consistent with\n  \"mount\" and \"battle use, grabbing with claws\" from the text. The card art's\n  riders wear red robes suggestive of Utapaun security or Jedi-adjacent garb.\n- **Disagreement between images**: The concept-art piece (`wookieepedia_concept.jpg`)\n  gives the wings a warmer pink-magenta cast versus the more desaturated\n  maroon/burgundy of the infobox render and the card art \u2014 read this as\n  lighting/render-style variance, not a canon color split; treat maroon/dark\n  red-purple as the safe center.\n- **Donor sprite comparison**: `donor_current_sprite.png` (our current in-game\n  south-facing sprite, head-on/foreshortened view) already lands close to\n  canon \u2014 dark blue-grey head and body, maroon-red visible on the folded\n  wings/ear-like flaps, tan-gold beak, red eyes. This is a solid starting\n  point; nothing in it needs re-inventing. If anything, the donor's body\n  reads a touch darker/more saturated-purple than the flatter slate-grey of\n  the reference art, and the bicorn beak prongs are less pronounced/forked\n  than in the references \u2014 worth sharpening on any redo, not a wrong hue.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in all three images (infobox render, *Clone Wars Legacy* concept, TCG card art) as read by the visual brief, and the canon text (bicorn beak, claws, \"blue and purple\").*\n- [ ] BODY PLAN: a large, rideable pterosaur-shaped flyer: long slender neck, elongated toothless beak, digit-supported membrane wings (not feathered), long thin tail, clawed hands/feet used for perching, gripping and scaling rock walls (not a bird's talons)\n- [ ] COLOUR LAYOUT: body, neck and head blue-grey to slate-grey; wing membranes dark maroon/wine-red (the darkest, warmest element); beak pale tan/bone-coloured with the forked tip gold or pale yellow; eyes red/orange\n- [ ] Beak: long, toothless, ending in a two-pronged (bicorn) hooked tip \u2014 the forked prongs clearly visible\n- [ ] Clawed hands/feet suited to perching and gripping (not a bird's talons)\n- [ ] NEGATIVE: not a bird (no feathers, no fan tail, no single-pointed beak), not a dragon or wyvern (no scaled horned head, no teeth, no thick tail); not purple-bodied with blue wings, not a short-necked bat", "ruling": "", "base": "", "imgs": ["img/aad840df880aa6954acf.webp", "img/ea1312555c060ebe1735.webp", "img/b9e11f68a61824943e35.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Dactillion, RSW_Dactillion; artpipe jobs on record: dactillion_toyfig_b, dactillion_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Dactillion", "label": "dactillion", "description": "The dactillions were a reptavian native to the sinkhole world of Utapau. Dactillions shared both avian and lizard traits, with long, thin wings and thick, scaled hides. A dactillion's pair of wings allowed it to ride the thermal updrafts in a Utapau sinkhole, and its prominent limbs allowed it to scale the rocky side. An avian cousin of the speedy varactyl, the dactillion served as a mounts.", "source": "live def dump 2026-10-0 ebp", "0da76f25f7fddfdfd2a884d03e83cfc85e12a58a09564db625c681529fb0f72e": "img/0da76f25f7fddfdfd2a8.webp", "2a90350be4d698f0ae9088490bc3cc2a1e0a8826f262b8a990ddb5700cb27495": "img/2a90350be4d698f0ae90.webp", "31bba8ca7061c5cfd1aec3c339d2295d04c5709859cecaf8d8d836cbc2d1d3af": "img/31bba8ca7061c5cfd1ae.webp", "cbca68b0099b86e6de4743d25f850ddc9240f0191620a7f41d2fe1c992eb15ba": "img/cbca68b0099b86e6de47.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/fanback", "brief": "Only two images exist on the Wookieepedia page: the species infobox\nillustration and a separate \"fanback egg\" illustration (a nest scene, no\nadult animal visible). Both are the same era/style of Episode I Adventures\nbook illustration \u2014 muted, painterly, sepia-toned page background.\n\n- `wookieepedia_infobox.jpg` \u2014 the primary (and only) reference for the\n  animal itself. Shows a **Dimetrodon-shaped** reptile/amphibian: squat\n  low-slung body, thick tail, short stubby legs, and a wide toothy jaw with\n  visible lower fangs \u2014 reads as an active predator, not docile. Body color\n  is **tan/khaki-olive with darker brown mottled spots**, NOT the vivid or\n  clean green the infobox metadata field claims. The dorsal sail is the\n  standout feature: tall, rounded, running most of the spine's length,\n  colored a darker brown-to-near-black at its trailing/upper edge, lighter\n  tan at its base where it meets the body.\n- `wookieepedia_egg.jpg` \u2014 no animal visible; shows only a sand/mud nest\n  mound with dry grass tufts and one large cream-white egg with fine dark\n  speckling, half-buried in a shallow brown depression. Useful only for\n  confirming egg-laying (oviparous) behavior; the wiki text gives no habitat, so no biome\n  can be read from it, and it says nothing of body color.\n\n**Text vs. image disagreement**: the species infobox metadata field says\n`skincolor=Green`, but the actual illustration does not read as green \u2014 it\nreads as tan/olive-brown with dark mottling, closer to a real-world monitor\nlizard or Dimetrodon reconstruction than anything green-skinned. Treat the\nillustration as the stronger signal (per this library's standing rule that\nimages outrank text), and note the \"Green\" field as likely an\napproximation/rounding by whoever filled in the old infobox rather than an\naccurate description of the single piece of art that exists. No second\nindependent image exists to cross-check this against, which is itself worth\nflagging: this creature has effectively **one** surviving Legends depiction on the wiki page (the Gungan Frontier game is another visual source).\n\n**Net read for art**: sail-backed, Dimetrodon-silhouette reptilian\namphibian; tan/khaki-olive base coat with darker brown mottled spots; sail\ndarker brown to near-black along its edge; toothy predator jaw; short legs;\nthick tail; desert/mudflat nesting habitat with a large speckled egg.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `wookieepedia_infobox.jpg` (the only image of the animal), the Legends text and the `## ruling` below.*\n- [ ] BODY PLAN: a Dimetrodon-shaped quadruped: squat, low-slung body on four short stubby legs, a thick tail, and a head carried low and forward\n- [ ] Sail: a tall, rounded dorsal sail running most of the length of the spine, the tallest element of the silhouette\n- [ ] COLOUR LAYOUT: olive-green base coat over the body with darker brown mottled spots (owner ruling 2026-09-14: \"it's supposed to be olive green, not just brown. That's a sepia picture for some reason. Make it Olive colored.\"); the sail darker brown to near-black at its trailing/upper edge, lighter at its base where it meets the body\n- [ ] Wide, toothy predator jaw with visible lower fangs\n- [ ] NEGATIVE: not a plain brown/sepia lizard (the body must read olive green), not a dinosaur standing tall on long legs, not a sail-less monitor lizard or crocodile", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"But it's supposed to be olive green, not just brown. That's a sepia picture for some reason. Make it Olive colored.\"", "base": "", "imgs": ["img/c0da76dcb4f16c98ad87.webp", "img/d97c6d9321a874ec9ec8.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Fanback, RSW_Fanback; artpipe jobs on record: canon_fanback_v1, fanback_toyfig_a, fanback_toyfig_b, fanback_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "But it's supposed to be olive green, not just brown. That's a sepia picture for some reason. Make it Olive colored."}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Fanback", "label": "fanback", "description": "The fanback was a cold-blooded predatory amphibian from the swamps of Naboo. Each fanback had a big dorsal spine along with a sensitive snout which allowed them to hunt for fish and other small free swimming prey with ease. They lay a high number of eggs and were known to protect these nest sites by hunting any creature bold enough to attempt to eat or threaten their clutch. It's for this reason that these eggs having been sold (or collected as trophies) has resulted in populations of these animals on other worlds.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Fanback"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Fanback, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Fanback.xml (declared)", "kind": "animal", "cells": 3.5, "bodySize": 2, "m .\n\nThe one apparent disagreement is more about presentation than design: the \"Ollie\"\nprop photo reads noticeably more pink/magenta overall than the paintings, and this may be\nthe tank's dim purple show lighting at Galaxy's Edge (an interpretation; no source states it) rather than a\ndifferent color scheme \u2014 the same purple-spotted, green-yellow base and pink tendrils\nare still legible under that light. **Treat the 2024 Bestiary painting\n(`wookieepedia_bestiary_infobox.jpg`) as the anchor reference** \u2014 it's the newest,\nhighest-detail, official-book illustration, and it agrees with the older Legends art\non every structural point (flat spotted body, pink tendrils, purple beak, paddle legs,\nfluked tail), so nothing about the physical-prop lighting should be read into a canon\ncolor change.\n\nA genuine donor mod sprite was also found (see Watch out) and it is a good match: the\nRimWorld mod's flat-shaded south/east textures show the same olive-khaki body with\nmagenta/pink spots, pink head tendrils, and a fluked tail \u2014 i.e. this mod did NOT make\nthe earlier \"generic brown\" mistake that motivated this reference library. Use the\ndonor sprite only as a confirmation of palette/silhouette translation into game style,\nnot as the canon anchor \u2014 the Bestiary painting is.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the 2024 Bestiary painting (anchor), the Galaxy's Edge prop and the two Legends illustrations.*\n- [ ] BODY PLAN: a small, flat, oval/lily-pad-shaped body held at the water's surface; a large flat disc/leaf-shaped head; six paddle-like clawed legs (three pairs) below the flat top; a long, low-hanging fluked (fish-tail-shaped) tail trailing behind\n- [ ] COLOUR LAYOUT: olive-to-yellow-green overall with scattered purple/magenta round spots (spots also occasionally on the tail); pink (sometimes magenta-red) head tendrils the brightest element; legs pale, semi-translucent green-gray with violet/purple claw tips\n- [ ] A cluster of long, thin, pink tendrils sprouting from the head/nape \u2014 the single most distinctive silhouette feature\n- [ ] A small dark purple beak and light brown/amber eyes on the flat head\n- [ ] NEGATIVE: not a generic brown rodent (no plain brown coat, no rounded upright body), not a submerged swimmer \u2014 it floats flat atop the water like a lily pad", "ruling": "", "base": "", "imgs": ["img/8b1de6054fd5b411c7b4.webp", "img/240ff11f4eebea4da99d.webp", "img/58d481160c820957f7b8.webp", "img/637ccbe00f25bbc7ecd9.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Ollopom, RSW_Ollopom; artpipe jobs on record: LEGACY /mnt/d/Luke/dev/RimMandrake/infrastructure/artpipe/_withdrawn/facingrepair_ollopom_v1, facingrepair_ollopom_v1, ollopom_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Ollopom", "label": "ollopom", "description": "Ollopoms were squat, gentle herbivores native to the swamps of the planet Naboo. A species of six-legged aquatic rodent, they were often mistaken for water plants. These short, gentle, dense, green-furred rodents were camouflaged to blend in with the Pom Petals whose edges they fed upon. On their underside, they had gnawing teeth and three pairs of paddle-like claws. Their flukes were used as rudders.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Ollopom"}, "scale": {"status": "measured", "source": "live def dump 2026-10-04 17:39Z \u00b7 PawnKindDef RSW_Ollopom, last lifeStage bodyGraphicData \u00b7 drawSize: XML agrees, RSW_Ollopom.xml (declared)", "kind": "animal", "cells": 1.75, "b r against pale ivory/tan horns; the herd screen\ncapture (dune backdrop) shows the herd reading as uniformly dark brown/black\nen masse; the official Mandalorian-era concept art (Pablo Olivera) shows the\nsame dark brown coat with cream horns, ridden with a full rider saddle rig.\nNo image shows visible skin color (fully fur-covered) or any color variant\noutside the brown/black-with-pale-horn range \u2014 text and images agree here.\n\n**The current donor sprite (`donor_current_sprite.png`) is a reasonable but\nsimplified match**: it gets the dark reddish-brown body color and pale curled\nhorns right, but the horns are drawn smaller/less tightly-spiraled than every\nreference image, the body reads as a flat solid mass with no shag/fur texture\nor chin-beard fringe, and the overall proportions are boxier/more compact\nthan the real animal's heavy-set but clearly leonine-maned silhouette. A\nregen should exaggerate the horn spiral and add visible shaggy fur texture,\nespecially the hanging beard under the chin.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in all three images and the `## ruling` below.*\n- [ ] BODY PLAN: a huge, low-slung, mammoth-like quadruped whose whole body is a mound of long hanging fur reaching nearly to the ground, legs mostly hidden by the coat; massive head carried low and forward, about as wide as the shoulders; back higher at the shoulders than the rump (as in the herd screencap)\n- [ ] Horns: a pair of large thick ridged horns that curl out from the top of the head, back and down into a full spiral beside each side of the face (male; females short-horned per the ruling)\n- [ ] COLOUR LAYOUT: dark brown to near-black coat over the entire body; face fur a warmer chestnut; horns pale ivory/cream, the lightest element and contrasting sharply with the dark head\n- [ ] A very wide, flat, slit-like mouth running nearly the full width of the muzzle below a broad flat nose (owner ruling 2026-10-04: \"it MUST have that very wide-slit mouth as shown in the canon imagery\")\n- [ ] Long beard-like fringe of fur hanging from the chin and chest\n- [ ] Fully fur-covered body with no bare skin visible\n- [ ] NEGATIVE: not a yak, bison or ram (no short coat, no visible slim legs, no narrow goat muzzle, no forward-pointing bison horns); horns are spirals, never straight or antler-like", "ruling": "**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Bantha/BanthaW`:\n\n> \"Look at the canon library and regen to modern standards. Criteria: it MUST have that very wide-slit mouth as shown in the canon imagery.\"\n\nOn `swanimals/Bantha/BanthaW_j`:\n\n> \"Female short-horn version of above\"", "base": "", "imgs": ["img/30732e15cc290ec428aa.webp", "img/f0cd9d82f278c3505128.webp", "img/550521e9c92a1d892bdc.webp"]}, "letters": ["A", "B", "D", "E", "F", "G", "H"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Bantha, RSW_Bantha; artpipe jobs on record: desert_swaca_bantha, doubles_redo_bantha_w_v1, doubles_redo_bantha_wj_v1, leaningscrub_bantha_v1, longshade_rsw_bantha_v1, longshade_rsw_bantha_v2, longshade_rsw_bantha_v3, longshade_rsw_bantha_v4", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}, {"at": "2026-10-04", "verdict": "redo", "trust": "ruled", "sheet": "art_doubles_compare_2026-10-04", "note": "Look at the canon library and regen to modern standards. Criteria: it 6c3b2f118ac58e94313a620e372e4e5dfc1e9b21730fd54041a4cd5f1dc86": "img/5da6c3b2f118ac58e943.webp", "8abaefe6bee04fae0aaf92bb16968ef2a3e5123ea519ef9184908e9bebe5d98d": "img/8abaefe6bee04fae0aaf.webp", "3b7873e344c08bfc53037a0406fd563b6aa07cf790db15b26639eb36725238b2": "img/3b7873e344c08bfc5303.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/dewback", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The smooth, cartoon-shaded Star Wars Insider illustration of Obi-Wan riding a bright yellow-green dewback (`wookieepedia_kenobi_screencap.jpg`) was deleted. The remaining references are realistic: `wookieepedia_infobox.jpg` (realistic CGI side profile, the image this entry's ruling picked) and `wookieepedia_behindthemagic.jpg` (*A New Hope* live-action practical dewback with a sandtrooper rider, the ruling's \"#4\").\n\nWhat they show:\n- **Body:** elongated, heavy, low-slung lizard body on short, thick, bowed legs with blunt clawed toes; a long, heavy, tapering tail dragging low; a deep belly.\n- **Head:** broad, heavy, blunt-snouted head with a wide closed mouth line and small eyes under a heavy brow.\n- **Hide:** dense small pebbled/raised scales over the whole body, thick folded skin at the neck and legs. \ud83d\udd34 **Colour differs between the two realistic sources:** the CGI infobox is a dusty **grey-brown / taupe**, while the ANH live-action puppet reads **olive to yellow-green** in sunlight. The deleted cartoon was bright yellow-green \u2014 do not use that saturation. Aim for a muted, dusty olive-to-grey-brown desert reptile.\n- No back \"fur\" is legible in any image; treat the text's partial back fur as subtle at most.\n\n**The current donor sprite (`donor_current_sprite.png`) disagrees with canon\nin two clear ways**: it is rendered in flat **grey/white**, not green, and it\nhas a rounded, blobby, almost seal-like silhouette with no scale texture and\nno elongated tail \u2014 closer to a cartoon manatee than the long low reptile\nin every reference image. Any regen should correct the color to dusty olive/grey-brown\nand give the body a longer, lower, more lizard-like silhouette with a visibly\nscaled hide.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the CGI infobox profile and the ANH live-action dewback, and the `## ruling` below (owner ruling 2026-09-14: \"Follow #4 closest\", i.e. the ANH live-action `wookieepedia_behindthemagic.jpg`).*\n- [ ] BODY PLAN: a scaly, reptilian, elongated low-slung four-legged body with a deep belly, on short, thick, bowed legs with blunt clawed toes (built to carry a rider or pack saddle); a long heavy tapering tail carried low; head held forward at about back height\n- [ ] COLOUR LAYOUT: muted, dusty olive-green to grey-brown hide over the whole body (between the ANH puppet and the CGI profile), not bright yellow-green; no legible back fur (subtle at most)\n- [ ] Broad, heavy, blunt-snouted head with a wide mouth line and small eyes under a heavy brow\n- [ ] Dense small pebbled scale texture all over, with thick folded skin at neck and legs\n- [ ] Realistic rendering: natural pebbled reptile-hide texture and desert lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a rounded, blobby, seal- or manatee-like silhouette; not a smooth, unscaled body; not short-tailed. A pale/white base on the sprite may be a colour mask (owner ruling 2026-09-14: \"I think the Donor white shading means it can come in a variety o", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"I think the Donor white shading means it can come in a variety of colors or something, Rimworld seems to do this sometimes. Follow #4 closest.\"", "base": "", "imgs": ["img/267471e513653fac4bc5.webp", "img/6bf47d9e937eb7d24d71.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Dewback, RSW_Dewback; artpipe jobs on record: canon_dewback_v1, dewback_toyfig_a, dewback_toyfig_b, dewback_v1, facingrepair_dewback_v1, longshade_rsw_dewback_v1", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "I think the Donor white shading means it can come in a variety of colors or something, Rimworld seems to do this sometimes. Follow #4 closest. "}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Almost done. The head must be MUCH bigger (see canon with riders). Otherwise great green beaded skin. Make it huge and ridable."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Good! Now make North and South versions of that creature, and make it four cells wide."}], "desc": {"def": "RSW_Dewback", "label": "dewback", "description": "Dewbacks are large, four-legged, omnivorous, cold-blooded reptiles native to the Dune Sea of Tatooine. As such, they are well-adapted to the harsh desert climate. This and the fact that they can be easily domesticated make them commonly employed as beasts of burden by both the inhabitants of the desert planet and the off-worlders wandering its dunes. Due to their numerous useful traits and versatility, they are quite possibly the most respected of all the creatures native to Tatooine.", "source": "live def dump 2026-10-04 \u00 ebp", "f45c7cbc5051f9c07d9a618eee0001e90ef28790fda21a454bcf565f166d59f2": "img/f45c7cbc5051f9c07d9a.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/eopie", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The cartoon Star Wars Kids \"EOPIES!\" thumbnail (`wookieepedia_herd.jpg`) was deleted. Every remaining image is the realistic prequel-era CGI/puppet design: `wookieepedia_infobox.png` (Official Star Wars Fact File render) and `wookieepedia_screencap.jpg` (front and side model sheet).\n\nWhat the realistic images show:\n- **Skin:** smooth, finely wrinkled, leathery hide with no fur \u2014 pale grey-lavender to pinkish-grey on the infobox/fact-file render, cream-white on the model sheet, mottled darker grey on the legs and flanks with knot-like bumps at the joints. (The canon article gives no colour; Legends lists brown, pale and white.)\n- **Body:** camel-like \u2014 tall thin legs (taller than the old brief's \"low-slung\" wording implied), a barrel body sloping from high haunches, a long forward-thrust horizontal neck.\n- **Head:** a long drooping trunk-like snout ending in a rounded pink-tipped nose; one large amber-to-dark eye with heavy wrinkled lids set well back on each side; a few sparse bristles on top of the head.\n- **Feet:** broad splayed pads with three or four thick blunt claw-toes, wrinkled like an elephant's foot.\n- **Tack:** leather saddlebags, wicker panniers and a rope bridle in every image \u2014 harness, not body.\n\n**The current donor sprite (`donor_current_sprite.png`) gets the colour roughly right but the shape is wrong**: a rounded legless blob with a stubby trunk, none of the tall thin-legged camel silhouette.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a es/jamel", "brief": "**Animation-only canon \u2014 no realistic source found (searched: Wookieepedia `Jamel` page images, `Category:Images of jamels` (3 files total), title search, StarWars.com databank).** The images below are animated/stylised; render this creature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions.\n\n**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\nThe jamel exists only in unfinished Clone Wars material (*Crystal Crisis*). The low-res animated screen grab (`Jamel.png`) was deleted; the two Pat Presley concept sheets (`canon_2`, `canon_3`) stay as anatomy, with a trooper silhouette for scale. Render it as a real camel-like beast: a hide with real skin folds and fine hair, not flat cel colour blocks.\n- **Silhouette**: a tall, long-legged, long-necked quadruped with a big hump or sail-like arch over the shoulders and back, a heavy tapering tail as long as the body held low and straight out behind (sauropod/hadrosaur-like read, though the designer says camels were the inspiration), and a long forward-hung neck carrying a small head low.\n- **Colour/pattern**: golden-yellow to ochre hide; the hump and flanks carry darker orange-brown vertical stripes/banding, with blue-grey-green mottling over the hump; pale cream belly and underside of the tail; reddish-brown feet.\n- **Head**: a drawn-out, narrow head with a pinkish-red snout/muzzle and red face cap, a pale blue-grey patch around a large round eye, small brow nubs, and neck flaps/frill behind the head (the sheet notes the flaps should move).\n- **Legs/feet**: tall, spindly pillar legs with visible knees, splayed two-three-toed dark red-brown feet with small claws; front legs a bit shorter than the hind legs, so the back rises toward the hump.\n- **Harness (concept sheet)**: leather saddle-pad on the hump and a crossbar yoke/shaft rig for pulling a cart; not part of the animal.\n- **Size**: the back rises about a head above a clone trooper's height.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the canon prose and the two Pat Presley concept sheets (`canon_2`, `canon_3`).*\n- [ ] BODY PLAN: a tall, long-legged quadruped taller than a person (back about a head above a trooper): tall spindly pillar legs with visible knees, front legs a bit shorter than the hind so the back rises to a big hump/arched sail over the shoulders and back; a long drawn-out neck hung forward carrying a small head low; a long heavy tapering tail held low and straight out behind\n- [ ] COLOUR LAYOUT: golden-yellow to ochre hide; darker orange-brown vertical stripes over the hump and flanks, with blue-grey(-green) mottling over the hump; pale cream belly and tail underside; reddish-brown feet\n- [ ] Head: narrow and drawn-out, with a pinkish-red snout and red face cap, a pale blue-grey ring around a large round eye, small brow nubs, and neck flaps behind the head\n- [ ] Feet: splayed two-to-three-toed dark red-brown feet with small claws\n- [ ] Realistic rendering: natural hide texture with skin folds and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a plain real camel (it has a long heavy tail, stripes and a red snout), not a giraffe or horse (no mane, no hooves); no harness or saddle as part of the anima", "ruling": "", "base": "", "imgs": ["img/8d15cb28c2e96b52dbef.webp", "img/64abc3dbcbaec7449b27.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Jamel, RSW_Jamel; artpipe jobs on record: desert_sw <header>

    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>
    <select id="fmark">
      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

  <div class="banner bad hide" id="err"></div>

    const it = byId.get(id);
    if (it && DEC[id]) window.artEnsureVariants(it, DEC[id]);
    return origQueue.apply(this, arguments);
  };
  const orig = window.setDecision;
  if (typeof orig === 'function') window.setDecision = function (id, key, opts) {
    const it_ = byId.get(id);
    if (it_ && window.artNoSelect(it_).has(key)) { if (typeof showErr === 'function') showErr('Set ' + key + ' is placeholder art — it cannot be picked.'); return; }
    orig(id, key, opts);
    if (DEC[id]) { DEC[id].decidedAt = new Date().toISOString(); queue(id); }
  };
  /* The template's patchRow repaints only the buttons; the picked-column frame and the purge
     marks live in the row body, so repaint that too (also covers undo/redo). */
  const origPatch = window.patchRow;
  if (typeof origPatch === 'function') window.patchRow = function (id) { origPatch(id); window.artRepaint(id); };
});
/* Column letters are per row: the pick buttons show only the letters this row has (template hook). */
window.itemOptions = it => OPTS.filter(o => !(o.key.length === 1 && /[A-Za-z]/.test(o.key)) || (it.letters || []).includes(o.key));
</script>
