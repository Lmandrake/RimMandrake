<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

rns; the herd screen\ncapture (dune backdrop) shows the herd reading as uniformly dark brown/black\nen masse; the official Mandalorian-era concept art (Pablo Olivera) shows the\nsame dark brown coat with cream horns, ridden with a full rider saddle rig.\nNo image shows visible skin color (fully fur-covered) or any color variant\noutside the brown/black-with-pale-horn range \u2014 text and images agree here.\n\n**The current donor sprite (`donor_current_sprite.png`) is a reasonable but\nsimplified match**: it gets the dark reddish-brown body color and pale curled\nhorns right, but the horns are drawn smaller/less tightly-spiraled than every\nreference image, the body reads as a flat solid mass with no shag/fur texture\nor chin-beard fringe, and the overall proportions are boxier/more compact\nthan the real animal's heavy-set but clearly leonine-maned silhouette. A\nregen should exaggerate the horn spiral and add visible shaggy fur texture,\nespecially the hanging beard under the chin.", "must": "- [ ] Heavyset, shaggy, long-haired quadruped body\n- [ ] Pair of large, tightly-curled, ram-like spiraling horns\n- [ ] Hanging beard-like fringe of fur at the chin/chest\n- [ ] A very wide, flat, slit-like mouth running nearly the full width of the muzzle below a broad flat nose (as in `wookieepedia_infobox.jpg`)\n- [ ] Body coat dark brown to near-black\n- [ ] Horns pale ivory/tan/cream, contrasting against the dark coat\n- [ ] Fully fur-covered body with no bare skin visible", "ruling": "**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Bantha/BanthaW`:\n\n> \"Look at the canon library and regen to modern standards. Criteria: it MUST have that very wide-slit mouth as shown in the canon imagery.\"\n\nOn `swanimals/Bantha/BanthaW_j`:\n\n> \"Female short-horn version of above\"", "base": "", "imgs": ["img/30732e15cc290ec428aa.webp", "img/f0cd9d82f278c3505128.webp", "img/550521e9c9 isagree with nothing in it \u2014 this is a rare case where text and\nart line up cleanly:\n\n- **Body plan**: Unambiguously pterosaur-shaped \u2014 long slender neck, elongated\n  toothless beak, digit-supported membrane wings (not feathered), long thin\n  tail, clawed hands/feet used for perching and gripping. All three images and\n  the sourced text agree this is a reptilian flyer, not a bird or mammal.\n- **Coloration**: All three images show the same two-tone scheme the wiki's\n  infobox states \u2014 a **blue-grey to slate-grey body** and **dark maroon /\n  wine-red wing membranes**. The beak is consistently **pale tan/bone-colored**\n  with the two-pronged (\"bicorn\") hooked tip rendered gold or pale yellow in\n  every image. Eyes read red/orange in the closer shots (infobox render,\n  donor sprite) \u2014 plausibly the \"light-colored\" eye the Databank cites, seen\n  under different lighting, or an amber variant; no image shows anything\n  resembling brown or green skin, so \"blue and purple\" in the text is\n  confirmed by the art rather than undersold by it.\n- **Riders/scale**: Both the concept-art landscape piece and the trading-card\n  art show a rider in a hooded cloak with a spear/pike, seated at the base of\n  the neck/shoulders with a visible harness/saddle strap \u2014 consistent with\n  \"mount\" and \"battle use, grabbing with claws\" from the text. The card art's\n  riders wear red robes suggestive of Utapaun security or Jedi-adjacent garb.\n- **Disagreement between images**: The concept-art piece (`wookieepedia_concept.jpg`)\n  gives the wings a warmer pink-magenta cast versus the more desaturated\n  maroon/burgundy of the infobox render and the card art \u2014 read this as\n  lighting/render-style variance, not a canon color split; treat maroon/dark\n  red-purple as the safe center.\n- **Donor sprite comparison**: `donor_current_sprite.png` (our current in-game\n  south-facing sprite, head-on/foreshortened view) already lands close to\n  canon \u2014 dark blue-grey head and body, maroon-red visible on the folded\n  wings/ear-like flaps, tan-gold beak, red eyes. This is a solid starting\n  point; nothing in it needs re-inventing. If anything, the donor's body\n  reads a touch darker/more saturated-purple than the flatter slate-grey of\n  the reference art, and the bicorn beak prongs are less pronounced/forked\n  than in the references \u2014 worth sharpening on any redo, not a wrong hue.", "must": "- [ ] Pterosaur-shaped body: long slender neck, elongated toothless beak, digit-supported membrane wings (not feathered), long thin tail\n- [ ] Blue-grey to slate-grey body coloring\n- [ ] Dark maroon/wine-red wing membranes\n- [ ] Pale tan/bone-colored beak, with the two-pronged (bicorn) hooked tip rendered gold or pale yellow\n- [ ] Red/orange eyes\n- [ ] Clawed hands/feet suited to perching and gripping (not a bird's talons)", "ruling": "", "base": "", "imgs": ["img/aad840df880aa6954acf.webp", "img/ea1312555c060ebe1735.webp", "img/b9e11f68a61824943e35.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Dactillion, RSW_Dactillion; artpipe jobs on record: dactillion_toyfig_b, dactillion_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Dactillion", "label": "dactillion", "description": "The dactillions were a reptavian native to the sinkhole world of Utapau. Dactillions shared both avian and lizard traits, with long, thin wings and thick, scaled hides. A dactillion's pair of wings allowed it to ride the thermal updrafts in a Utapau sinkhole, and its prominent limbs allowed it to scale the rocky side. An avian cousin of the speedy varactyl, the dactillion served as a mounts.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Dactillion"}, "gr 2441b": "img/664e965fd886511bbf5d.webp", "c25e20d775248d8b55e9affff1a6f44021cf8dd530aaae33170b6d88079e713f": "img/c25e20d775248d8b55e9.webp", "88aaff25c565b25b88bbd5fab5cf0ceb510a35bcb6af84b6f8ca62e0e48e9f2a": "img/88aaff25c565b25b88bb.webp", "5a292707ae8df49da5c560f19251c73beae3c9343d29dfdf0f20fe3d6d83d137": "img/5a292707ae8df49da5c5.webp", "be61243d6dab85d4e64e372f0d6f7519b3933cdae0bbc6cb0f22693c2fe7e8f3": "img/be61243d6dab85d4e64e.webp", "5da6c3b2f118ac58e94313a620e372e4e5dfc1e9b21730fd54041a4cd5f1dc86": "img/5da6c3b2f118ac58e943.webp", "8abaefe6bee04fae0aaf92bb16968ef2a3e5123ea519ef9184908e9bebe5d98d": "img/8abaefe6bee04fae0aaf.webp", "a7def6a5f6a13e56811fdbc071606cbaf3b814f8c9d92700fb3cd77a9c193c85": "img/a7def6a5f6a13e56811f.webp", "9ba728db4a92098cd09ed5466f3a36321a618db1c9460c6dc68dea8e10b4ac56": "img/9ba728db4a92098cd09e.webp", "2e4e730329d3448cfc411753dbe994f83e9d5846644cffdeb8cc48104ebffb9d": "img/2e4e730329d3448cfc41.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/dewback", "brief": "The candidate images agree with each other and are unambiguous: dewbacks are\n**green**, scaly, reptilian, with an elongated low-slung lizard body, a long\nheavy tail, a broad blunt-snouted head with a wide mouth, and short thick legs\nbuilt for a rider or pack saddle on the back. The Kenobi-riding image and the\nsandtrooper close-up both show visible raised/pebbled scale texture and a\nwarm olive-green to yellow-green hide, darker/more mottled toward the back\nridge. No image shows back \"fur\" clearly \u2014 the Wookieepedia text mentions\npartial back fur but none of the candidate images make it legible; treat that\ndetail as present-but-subtle rather than a bold visual feature.\n\n**The current donor sprite (`donor_current_sprite.png`) disagrees with canon\nin two clear ways**: it is rendered in flat **grey/white**, not green, and it\nhas a rounded, blobby, almost seal-like silhouette with no scale texture and\nno elongated tail \u2014 closer to a cartoon manatee than the long low reptile\nin every reference image. Any regen should correct the color to green/olive\nand give the body a longer, lower, more lizard-like silhouette with a visibly\nscaled hide.", "must": "- [ ] Scaly, reptilian, elongated low-slung body \u2014 not a rounded, blobby, seal-like silhouette\n- [ ] Warm olive-green to yellow-green hide, darker/more mottled toward the back ridge\n- [ ] Long heavy tail\n- [ ] Broad, blunt-snouted head with a wide mouth\n- [ ] Short, thick legs built to carry a rider or pack saddle\n- [ ] Visible raised/pebbled scale texture", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"I think the Donor white shading means it can come in a variety of colors or something, Rimworld seems to do this sometimes. Follow #4 closest.\"", "base": "", "imgs": ["img/267471e513653fac4bc5.webp", "img/6bf47d9e937eb7d24d71.webp", "img/f20d371db498633aa8c9.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G", "H"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Dewback, RSW_Dewback; artpipe jobs on record: canon_dewback_v1, dewback_toyfig_a, dewback_toyfig_b, dewback_v1, facingrepair_dewback_v1, longshade_rsw_dewback_v1", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "I think the Donor white shading means it can come in a variety of colors or something, Rimworld seems to do this sometimes. Follow #4 closest. "}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Dewback", "label": "dewback", "description": "Dewbacks are large, four-legged, omnivorous, cold-blooded reptiles native to the Dune Sea of Tatooine. As such, they are well-adapted to the harsh desert climate. This and the fact that they can be easily domesticated make them commonly employed as beasts of burden by both the inhabitants of the desert planet and the off-worlders wandering its dunes. Due to their numerous useful traits and versatility, they are quite possibly the most respected of all the creatures native to Tatooine.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Dewback"}, "group": "Fauna"}, {"id": "RSW_Eopie", "kind": "fauna", "label": "Eopie", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.1 \u00b7 8 picture set(s) across 2 graphics", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "your earlier pick (desert sitting 1): shipped, shadowed \u2014 StarWarsPatches", "prefill": "B", "prefillWhy": "your earlier pick (desert sitting 1): shipped, shadowed \u2014 StarWarsPatches", "prefillSource": "sit1", "contested": false, "inferred": false, "prefillPicks": {"swanimals/Eopie/Eopie_j": "H"}, "graphics": [{"key": "swanimals/Eopie/Eopie", "res": "swanimals/Eopie/Eopie", "role": "body", "primary": true, "facings": ["south", "east", "north"], "prior": {"text": "your desert sitting 1 pick is set B here (shadowed copy \u00b7 StarWarsPatches)", "note": "", "was": "desert sitting 1 recorded: B \u2014 shipped, shadowed \u2014 StarWarsPatches"}, "cols": [{"kind": "live", "faces": {"east": "175b5632c893c4df8e6ee71932e4113efa20826dbae97003f6a70b80a1c9b5d1", "north": "42f39bfebf676e8dbb530025d7adca91170aecf7797363446ec75dd95e90a1a6", "south": "65248648d1d1ed3398fbdba10379c8882d52653044bdaa7d07cb0a3fcd4d4bf8"}, "label": "IN GAME \u2014 SWBestiary", "detail": "load index 606 (last loaded, wins) \u00b7 bytes from 8dc279c643 2026-09-12: MLIE_FAUNA_ABSORPTION_1: port Dianoga, Dragonsnake, Eopie (77 -> 74 remaining)", "winner": true, "also": ["history SWBestiary 2026-09-12 \u2014 8dc279c643 2026-09-12: MLIE_FAUNA_ABSORPTION_1: port Dianoga, Dragonsnake, Eopie (77 -> 74 remaining)", "donor orig 09c02c2a2ca6eebda8895b0685ccae": "img/3719dbf40fb23d45a177.webp", "aa9d0ab1d5054ef3f7c3cdec779663811fa052358d04c732f25bb40eb6ef04b0": "img/aa9d0ab1d5054ef3f7c3.webp", "e88f9a66d31f0841669164a56ebee1e6b8bfbb18f9744760373aa7a5ef571cfa": "img/e88f9a66d31f08416691.webp", "d5718381cc41b9dcce1d871324a39c4c4bd01b37da4f7ef4b739719e33fc7441": "img/d5718381cc41b9dcce1d.webp", "dfc421ff4d871aeaa1def4a4ed5131c067a9c4ec87eeb2db6ce3c4a0ea027392": "img/dfc421ff4d871aeaa1de.webp", "550bf96d6a9d4bc119024a4327471895a512fe2980e8b1b47b6dc35ba7e8d99b": "img/550bf96d6a9d4bc11902.webp", "f45c7cbc5051f9c07d9a618eee0001e90ef28790fda21a454bcf565f166d59f2": "img/f45c7cbc5051f9c07d9a.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/eopie", "brief": "The candidate images agree closely with each other and diverge sharply from\nthe donor sprite's color. Eopies read as **pale \u2014 cream, dusty tan, or a\npinkish-grey** skin tone, never brown. The body plan is unmistakably\ncamel-like: a long, low-slung barrel body on four thin legs, each ending in\nsmall clawed/hoofed toes, topped by a genuinely elongated **trunk-like\nsnout** (more tapir/small-elephant trunk than a simple long muzzle) with one\nlarge dark eye set well back on the head. None of the images show visible fur\nor hair \u2014 the hide reads smooth-to-leathery, not woolly. Every reference shows\nthe eopie loaded with practical tan/brown leather cargo saddlebags and woven\nwicker panniers strapped across its back and neck, which is core to its\nin-universe role as a pack animal, though that's harness/tack rather than a\nbody feature. The stylized \"EOPIES!\" cartoon thumbnail is a much lower-fidelity\nsource (flat shading, exaggerated cartoon eyes) but still agrees on the pale\ntan color and the long trunk-snout silhouette, so it corroborates rather than\ncontradicts the higher-fidelity images.\n\n**The current donor sprite (`donor_current_sprite.png`) gets the color\nroughly right** \u2014 it's a similar pale dusty pink-grey \u2014 **but the shape is\nwrong**: it's a rounded, legless blob with a stubby trunk-snout, no visible\nlegs, no saddle/pack gear, and none of the long low camel-backed silhouette\nevery reference image shows. Any regen should keep the pale skin tone but\ngive the body a longer, lower quadruped silhouette with visible legs and the\ndistinctive trunk-like snout reading clearly against the body.", "must": "- [ ] Pale skin tone \u2014 cream, dusty tan, or pinkish-grey \u2014 never brown\n- [ ] Long, low-slung, camel-like barrel body on four thin legs with small clawed/hoofed toes\n- [ ] Elongated trunk-like snout (closer to a tapir or small elephant trunk than a simple long muzzle)\n- [ ] One large dark eye set well back on the head\n- [ ] Smooth-to-leathery hide with no visible fur or hair", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.png`\n\n> \"We have a regenerated Eopie that is pretty good, but it has legs. We should remove and regenerate it to the new spec level.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Eopie/Eopie` (variants A\u2013E and `Eopie_j` marked \"redundant with above\"):\n\n> \"B is closest but still pretty bad. Please look at Canon imagery.\"", "base": "", "imgs": ["img/f4f5ff93f7bdee4e0ef2.webp", "img/cd8af4c6230b8b7a9f7a.webp", "img/0fb8651280c01b018cba.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Eopie, RSW_Eopie; artpipe jobs on record: canon_eopie_v1, desert_swaca_eopie, doubles_redo_eopie_j_v1, doubles_redo_eopie_v1, longshade_rsw_eopie_v1", "rulings": [{"at": "", "verdict": "release", "trust": "interpretation", "sheet": "", "note": "Owner's note on this row is 'redundant with above': it follows the Eopie redo (9e96eb7a14f8e7400072), not a keep of column B. Released so these pictures are not prot world monitor\nlizard or Dimetrodon reconstruction than anything green-skinned. Treat the\nillustration as the stronger signal (per this library's standing rule that\nimages outrank text), and note the \"Green\" field as likely an\napproximation/rounding by whoever filled in the old infobox rather than an\naccurate description of the single piece of art that exists. No second\nindependent image exists to cross-check this against, which is itself worth\nflagging: this creature has effectively **one** surviving canon depiction.\n\n**Net read for art**: sail-backed, Dimetrodon-silhouette reptilian\namphibian; tan/khaki-olive base coat with darker brown mottled spots; sail\ndarker brown to near-black along its edge; toothy predator jaw; short legs;\nthick tail; desert/mudflat nesting habitat with a large speckled egg.", "must": "- [ ] Dimetrodon-shaped body: squat, low-slung, thick tail, short stubby legs\n- [ ] Tall, rounded dorsal sail running most of the length of the spine\n- [ ] Tan/khaki-olive base coat with darker brown mottled spots\n- [ ] Sail colored darker brown-to-near-black at its trailing/upper edge, lighter tan at its base\n- [ ] Wide, toothy jaw with visible lower fangs", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"But it's supposed to be olive green, not just brown. That's a sepia picture for some reason. Make it Olive colored.\"", "base": "", "imgs": ["img/c0da76dcb4f16c98ad87.webp", "img/d97c6d9321a874ec9ec8.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Fanback, RSW_Fanback; artpipe jobs on record: canon_fanback_v1, fanback_toyfig_a, fanback_toyfig_b, fanback_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "But it's supposed to be olive green, not just brown. That's a sepia picture for some reason. Make it Olive colored."}, {"at" heir backs\"; sheets show a broad stripy ridge/hump rather than a camel-style fat lump, consistent enough. The \"red snout\" is confirmed.", "must": "- [ ] Tall spindly legs with visible knees; hump/arched back; long drawn-out neck with a small head carried low\n- [ ] Golden-yellow ochre hide with darker orange-brown vertical stripes over the back, blue-grey mottling over the hump\n- [ ] Pinkish-red snout and head cap, pale blue-grey ring around a large round eye, small brow nubs, neck flaps\n- [ ] Long heavy tapering tail carried low behind, pale underside\n- [ ] Splayed dark reddish-brown clawed toed feet\n- [ ] Rises above a person's head height", "ruling": "", "base": "", "imgs": ["img/fcf903a5e58796c5993b.webp", "img/8d15cb28c2e96b52dbef.webp", "img/64abc3dbcbaec7449b27.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Jamel, RSW_Jamel; artpipe jobs on record: desert_swaca_jamel, longshade_rsw_jamel_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}], "desc": {"def": "RSW_Jamel", "label": "Jamel", "description": "Jamel were a slow moving reptomammal creature native to the planet Utapau. Jamels were one of the many creatures used as beasts of burden on their planet of origin and exported offworld for such purposes. Their natural resilience meant they made great livestock even in harsh environments.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Jamel"}, "group": "Fauna"}, {"id": "RM_Karrek", "kind": "fauna", "label": "Karrek", "effect": "fauna \u00b7 in this biome's own roster \u00b7 commonality 0.6 \u00b7 3 picture set(s) across 2 graphics", " icial-book illustration, and it agrees with the older Legends art\non every structural point (flat spotted body, pink tendrils, purple beak, paddle legs,\nfluked tail), so nothing about the physical-prop lighting should be read into a canon\ncolor change.\n\nA genuine donor mod sprite was also found (see Watch out) and it is a good match: the\nRimWorld mod's flat-shaded south/east textures show the same olive-khaki body with\nmagenta/pink spots, pink head tendrils, and a fluked tail \u2014 i.e. this mod did NOT make\nthe earlier \"generic brown\" mistake that motivated this reference library. Use the\ndonor sprite only as a confirmation of palette/silhouette translation into game style,\nnot as the canon anchor \u2014 the Bestiary painting is.", "must": "- [ ] Flat, oval/lily-pad-shaped body held at the water's surface, olive-to-yellow-green with scattered purple/magenta round spots\n- [ ] A cluster of long, thin, pink (sometimes magenta-red) tendrils sprouting from the head/nape \u2014 the single most distinctive silhouette feature\n- [ ] A small dark purple beak and light brown/amber eyes on the flat head\n- [ ] Pale, semi-translucent green-gray paddle-like clawed legs (three pairs) visible below the flat top, claws tipped violet/purple\n- [ ] A long, fluked (fish-tail-shaped) tail trailing behind, same green base with occasional purple spotting", "ruling": "", "base": "", "imgs": ["img/8b1de6054fd5b411c7b4.webp", "img/240ff11f4eebea4da99d.webp", "img/58d481160c820957f7b8.webp", "img/637ccbe00f25bbc7ecd9.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Ollopom, RSW_Ollopom; artpipe jobs on record: LEGACY /mnt/d/Luke/dev/RimMandrake/infrastructure/artpipe/_withdrawn/facingrepair_ollopom_v1, facingrepair_ollopom_v1, ollopom_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling <header>
  <div class="hrow">
    <h1 id="title">Review sheet</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>
  </div>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>
    <select id="fmark">
      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

  <div class="banner bad hide" id="err"></div>
</header>

<div id="list"></div>

<div id="zoom"><div><div class="box"><img id="zimg" alt=""></div><div class="cap" id="zcap"></div></div></div>

<div id="keys">
  <h3>Keyboard</h3>
  <table id="keysBody"></table>
  <div class="sub" style="margin-top:10px">Esc closes. Keys are ignored while typing in a note.</div>
</div>

<script id="RENDER">
/* Layout (owner complaint 2026-10-04, "poorly constructed"): one compact strip per graphic. Each picture
   set is a card whose facings sit SIDE BY SIDE; cards wrap across the width, so a row is about one
   thumbnail tall. Provenance is a tooltip, never wallpaper. Letters are row-local; the pick buttons on
   the right show only this row's letters. */
const FACE_ABBR = { south: 'S', east: 'E', north: 'N', west: 'W', single: '' };
window.itemBody = it => {
  const d = (typeof DEC !== 'undefined' && DEC[it.id]) || {};
  const purge = new Set(d.purge || []);
  const picks = Object.assign({}, it.prefillPicks || {}, d.picks || {});
  const variants = new Set(d.variants || []);
  const cell = (c, f) => {
    const s = c.faces[f];
    if (!s) return `<div class="bs-cell bs-gap" title="no ${f} picture in this set">—</div>`;
    const t = it.thumbs[s];
    if (!t) return `<div class="bs-cell bs-gap" title="picture not archived">?</div>`;
    const p = purge.has(s);
    const btn = c.purgeable ? `<button class="ac-purge${p ? ' on' : ''}" title="reject + PURGE: delete this picture from the art store so it never appears again" onclick="event.stopPropagation();artTogglePurge('${it.id}','${s}')">${p ? '✕ purging' : '✕'}</button>` : '';
    return `<div class="bs-cell${p ? ' ac-purged' : ''}"><div class="thumb ac-thumb" data-zoom="${t}" data-cap="${esc(it.label)} · ${c.letter} · ${f}"><img src="${t}" loading="lazy" alt=""></div>${FACE_ABBR[f] ? `<span class="bs-face">${FACE_ABBR[f]}</span>` : ''}${btn}</div>`;
  };
  const col = (c, g) => {
    const picked = g.primary ? d.decision === c.letter : picks[g.key] === c.letter;
    const tip = `${c.label}\n${c.detail}${c.ppc ? `\n\nresolution: ${c.srcPx[0]}×${c.srcPx[1]} px over the ${it.scale.kind === 'plant' ? 'quad' : 'drawSize'} = ${c.ppc} px/cell` : ''}${c.also ? '\n\nidentical copies:\n' + c.also.join('\n') : ''}${c.prompt ? '\n\nprompt: ' + c.prompt : ''}`;
    const vr = variants.has(c.letter);
    const vbtn = `<button class="bs-var${vr ? ' on' : ''}" title="keep this set as a valid VARIANT as well as your one pick (saved as variants: [...] on the row)" onclick="event.stopPropagation();artToggleVariant('${it.id}','${c.letter}')">${vr ? '✓ variant' : '+ variant'}</button>`;
    return `<div class="bs-set ac-${c.kind}${c.winner ? ' ac-win' : ''}${picked ? ' ac-picked' : ''}${vr ? ' bs-isvar' : ''}">
      <div class="bs-head bs-pick" data-pick-id="${esc(it.id)}" data-pick-g="${esc(g.key)}" data-pick-l="${c.letter}" data-pick-primary="${g.primary ? 1 : 0}" title="${esc(tip)}\n\nclick to pick this set"><b>${c.letter}</b>${c.near_of ? `<i class="bs-nearof" title="near-duplicate of set ${c.near_of} (dHash within ${NEAR_BITS} bits on every facing)">≈${c.near_of}</i>` : ''}<span>${esc(c.short)}</span>${c.also ? `<i class="sub">+${c.also.length}</i>` : ''}</div>
      <div class="bs-faces">${g.facings.map(f => cell(c, f)).join('')}</div>
      <div class="bs-foot">${vbtn}${g.primary && c.ppc ? `<i class="bs-ppc" title="resolution of this set: ${c.srcPx[0]} px wide over ${fmt(it.scale.kind === 'plant' ? it.scale.quad : it.scale.drawSize[0])} cells = ${c.ppc} px per cell (enhanced zoom resolves 128–256)">${c.ppc} px/cell</i>` : ''}</div>
    </div>`;
  };
  const canon = it.canon ? `<div class="bs-canonp"><div class="bs-head bs-chead"><b>canon</b><span>${it.canon.base ? 'entry for the base species: ' + esc(it.canon.base) : 'reference — not pickable'}</span></div>
      <div class="bs-cimgs">${it.canon.imgs.map(u => `<div class="thumb bs-cthumb" data-zoom="${u}" data-cap="canon reference · ${esc(it.canon.dir)}"><img src="${u}" loading="lazy" alt=""></div>`).join('') || '<span class="sub">entry has no images</span>'}</div>
      <div class="bs-must"><b>Must show</b><pre>${esc(it.canon.must || '(this entry lists no Must show)')}</pre>${it.canon.ruling ? `<b>Your ruling on the entry</b><pre>${esc(it.canon.ruling)}</pre>` : ''}<details><summary>visual brief</summary><pre>${esc(it.canon.brief)}</pre></details></div></div>` : '';
  const sec = (g, i) => {
    /* Every set in LETTER order, so the letters read contiguously (owner, Vhaulk note 2026-10-04: "I see only
       A and C, no B"). A near-duplicate keeps its place and its letter as a narrow stub that expands in place. */
    const ordered = g.cols.slice().sort((a, b) => LETTER_ORDER.indexOf(a.letter) - LETTER_ORDER.indexOf(b.letter));
    const stub = c => `<details class="bs-nearstub"${d.decision === c.letter || picks[g.key] === c.letter || variants.has(c.letter) ? ' open' : ''}><summary title="set ${c.letter} looks almost the same as set ${c.near_of} — click to show it"><b>${c.letter}</b><span>≈ ${c.near_of}</span><span class="sub">near-<br>duplicate<br>▸ show</span></summary>${col(c, g)}</details>`;
    const many = it.graphics.length > 1;
    const cur = g.primary ? d.decision : picks[g.key];
    const head = many ? `<div class="bs-gh" title="${esc(g.res || 'renders matched by name, not bound to a texture path')}"><b>${esc(g.role)}</b>${g.res ? ` <span class="sub">${esc(g.res.split('/').pop())}</span>` : ''} · ${g.primary ? 'buttons on the right' : `click a set · picked <b>${esc(cur || 'nothing')}</b>`}</div>` : '';
    const prior = g.prior ? `<div class="bs-prior" title="${esc(g.prior.was)}">${esc(g.prior.text)}${g.prior.note ? ' — “' + esc(g.prior.note) + '”' : ''}</div>` : '';
    return `<div class="bs-g">${head}${prior}
      <div class="bs-strip">${ordered.map(c => c.near_of ? stub(c) : col(c, g)).join('')}</div></div>`;
  };
  const links = it.related.length ? `<div class="bs-links">related (judged separately): ${it.related.map(r => `<a href="#" data-jump="${esc(r.id)}">${esc(r.label)} <span class="sub">${esc(r.id)}</span></a> <span class="sub">${esc(r.why)}</span>`).join(' · ')}</div>` : '';
  const elsewhere = it.elsewhere.length ? `<div class="sub">also related, not in this biome: ${it.elsewhere.map(esc).join(', ')}</div>` : '';
  const noart = it.noArt ? `<div class="bs-noart">NO ART YET — nothing found after searching every source:<div style="font-size:11px;font-weight:normal;opacity:.85;margin-top:3px;word-break:break-word">${esc(it.noArtWhy)}</div></div>` : '';
  const rline = r => `<div class="ac-r bs-r ac-t-${r.trust}" title="${esc(r.at + ' ' + r.verdict + ' · ' + r.trust + ' · ' + r.sheet + (r.note ? '\n“' + r.note + '”' : ''))}">${esc(r.at)} <b>${esc(r.verdict)}</b> <span class="sub">${esc(r.trust)} · ${esc(r.sheet)}</span> ${r.note ? '“' + esc(r.note) + '”' : ''}</div>`;
  const rs = it.rulings.slice().reverse();          /* newest first; older ones fold */
  const rul = rs.length ? `<div class="ac-rulings">${rs.slice(0, 2).map(rline).join('')}${rs.length > 2 ? `<details><summary class="sub">${rs.length - 2} older ruling(s)</summary>${rs.slice(2).map(rline).join('')}</details>` : ''}</div>` : '';
  const ds = it.desc || {};
  const dtext = ds.description || '';
  const desc = !ds.def ? `<div class="bs-desc sub">in-game description: UNMEASURED — no ThingDef of this row in the live def dump</div>`
    : dtext.length > 260 ? `<details class="bs-desc" title="${esc(ds.source)}"><summary><b>${esc(ds.label)}</b> — <span class="bs-dclamp">${esc(dtext)}</span></summary></details>`
    : `<div class="bs-desc" title="${esc(ds.source)}"><b>${esc(ds.label)}</b> — ${esc(dtext || '(the def has no description)')}</div>`;
  const pf = it.prefillSource === 'sit1' ? '' : it.contested ? '<span class="mark inferred" title="' + esc(it.prefillWhy) + '">⚠ agent prefill: ' + esc(it.prefillShort) + '</span>' : '<span class="mark absent">prefill: ' + esc(it.prefillShort) + '</span>';
  return `<div class="ac-body bs-body" style="${it.band ? 'border-left:6px solid ' + it.band + ';padding-left:8px' : ''}">
    <div class="bs-meta"><div class="effect">${esc(it.effect)}</div>
    <div class="marks"><span class="mark bs-tier bs-${it.tier}">${esc(it.tierText)}</span>${it.canonTag ? `<span class="mark bs-nocanon">${esc(it.canonTag)}</span>` : ''}${it.flags.filter(f => f !== 'NO ART YET').map(f => `<span class="mark contested">${esc(f)}</span>`).join('')}${pf}</div>
    ${desc}${links}${elsewhere}${rul}${noart}</div>
    <div class="bs-content"><div class="bs-graphics">${it.graphics.map(sec).join('')}</div>${scaleBlock(it)}${canon}</div></div>`;
};
const fmt = x => (x == null ? '?' : (+x).toFixed(3).replace(/\.?0+$/, ''));
function scaleBlock(it) {
  const s = it.scale; if (!s) return '';
  const size = s.kind === 'plant'
    ? `<b>${fmt(s.quad)}-cell</b> plant <span class="sub">= drawSize.x ${fmt(s.drawSize[0])} × visualSize.max ${fmt(s.visualMax)}</span>${s.mesh > 1 ? ` · <b>×${s.mesh}</b> per cell` : ''}`
    : `<b>${fmt(s.cells)} cells</b> <span class="sub">adult drawSize ${fmt(s.drawSize[0])}×${fmt(s.drawSize[1])}</span> · bodySize ${fmt(s.bodySize)}`;
  const sizeTip = s.kind === 'plant' ? `Plant.Print draws a SQUARE quad of drawSize.x × visualSizeRange (max at maturity)${s.mesh > 1 ? `; maxMeshCount ${s.mesh} prints ${s.mesh} quads on a ${Math.round(Math.sqrt(s.mesh))}×${Math.round(Math.sqrt(s.mesh))} sub-grid of ONE cell` : '; one mesh, centred, lifted so its base sits on the cell edge'}` : 'the adult (last) life stage bodyGraphicData.drawSize — what the engine draws';
  const q = s.kind === 'plant' ? s.quad : (s.drawSize || [])[0];
  const vcls = !s.ppc ? '' : s.ppc < 64 ? 'bs-low' : s.ppc < 120 ? 'bs-mid' : s.ppc > 256 ? 'bs-over' : 'bs-ok';

const LETTER_ORDER = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const NEAR_BITS = 10;
window.artToggleVariant = (id, letter) => {
