<title>the Greentide — flora & fauna art</title>

<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>
</head>

de \u2014 load index 578 \u00b7 bytes from 1135036ce2 2026-09-20: art: zero the sub-visible export halo across 241 of our facing sprites", "history DalgoArtOverride 2026-09-20 \u2014 1135036ce2 2026-09-20: art: zero the sub-visible export halo across 241 of our facing sprites"], "letter": "A", "purgeable": false, "short": "IN GAME \u00b7 SWBestiary", "ppc": 171, "srcPx": [512, 512]}]}], "thumbs": {"3c899a7822f892fca6000caf78c46ba1069e4eb9dd137124d214bbb31ec277dc": "img/3c899a7822f892fca600.webp", "44f229222949dc126256abcc6f685e704cefb4d0d060ee599bd71920e60d3ef8": "img/44f229222949dc126256.webp", "44802e3e140bae63a3424eddec749187e285f3caa0b89a6f124f73376f6a7a2f": "img/44802e3e140bae63a342.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/dalgo", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The Clone Wars season five / Encyclopedia render (`wookieepedia_encyclopedia_art.png`, toon-shaded rearing dalgo with rider) was deleted. No live-action or photoreal dalgo exists (searched: `Images of dalgos`, `Dalgo` and `Dalgo/Legends` page images \u2014 only these two pieces); the reference is the painted *Stay on Target* sourcebook art `wookieepedia_sot_art.png`, which this entry's ruling already picked. Render it more realistically than the painting: real reptile skin, real muscle.\n\nWhat `wookieepedia_sot_art.png` shows: a tall, long-legged, **horse-like four-legged reptilian runner** \u2014 deep muscular chest, long thin legs ending in rounded hoof-like pads, a long upright neck. The head carries a large **ridged, fan-like crest** sweeping back from the crown, a long snout. The hide is a smooth warm **rust-orange** with darker reddish shading and a paler tan underside; the tail ends in a wide, curling, blade/fin-like tip. Shown saddled and bridled as a mount.\n\ud83d\udd34 The earlier brief called it a \"raptor/theropod\" stance; the image shows a **four-legged, horse-like** stance, not a biped.\n\n**The current donor sprite (`donor_current_sprite.png`) disagrees on body\nproportions**: it keeps the correct orange/rust coloring and a small\nhead-crest, but renders the animal as a low, stocky, elongated\ndachshund-shaped quadruped with short stubby legs and a curled tail \u2014 the\nopposite of the tall, long-legged running/sprinting build shown in every\nreference image. The blade-like tail tip and forward-facing nostril crest\nare also not legible on the donor sprite. Any regen should raise the body\nonto long thin legs, lengthen the snout, and keep the orange-with-cream-\nunderside palette and dorsal crest.", "must": "- [ ] Tall, long-legged, horse-like four-legged reptilian runner build, not a low-slung lizard and not a biped\n- [ ] Large ridged fan-like crest sweeping back from the crown of the head\n- [ ] Long snout (text: sharp teeth and two lower tusks)\n- [ ] Smooth rust-orange hide with darker reddish shading and a paler tan underside\n- [ ] Wide, curling, blade/fin-like tail tip\n- [ ] Realistic rendering: natural smooth reptile-skin texture and muscle under real lighting, no outlines, no cartoon shading", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_sot_art.png`\n\n> \"But the Donor mod really isn't too bad this time.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Dalgo/Dalgo`:\n\n> \"Canon shows somthing more like C. We need a high quality version of that. Look at Canon please.\"\n\n(C = render `pyrelands_dalgo_v1`, a cartoon-register sail-crested orange dalgo.)", "base": "", "imgs": ["img/19cfbae208a86f62bcff.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 1, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Dalgo, RSW_Dalgo; artpipe jobs on record: doubles_redo_dalgo_v1, pyrelands_d is the animated Clone Wars `wookieepedia_huntforziro.jpg` \u2014 and \"seriousness of #3\", the flat Galactic Atlas illustration `wookieepedia_visualencyclopedia.jpg`. Both stay because he named them; no cartoon image was removed. Take only colour/spots and attitude from them, never their shading.\n\nRealistic sources added/kept:\n- `wookieepedia_concept_jfo.jpg` \u2014 *Jedi: Fallen Order* (Respawn) painted photoreal concept sheet, four variants with a stormtrooper for scale. This is the best realistic match for the owner's ruled look: a long, low, crocodile-like QUADRUPED with short splayed clawed limbs, a narrow toothy gharial-crocodile snout with fangs projecting outside the jaw, a dorsal row of short spines, a very long tapering eel-like tail (some variants with a fin or spined fan at the tip), dark olive-to-slate scaly hide with moss/algae patches, a pale ridged ventral belly, and \u2014 in the third variant \u2014 scattered bioluminescent yellow-green spots plus a glowing throat sac. Length several times a human.\n- `wookieepedia_mandalorianandgrogu.jpg` \u2014 *The Mandalorian and Grogu* (live-action film, realistic CGI): a gigantic pale bone-white LIMBLESS serpent with an eyeless skull-like head and long venom-dripping fangs. Realistic, but disagrees loudly with everything else on colour and limbs.\n\n**Where they disagree:** the realistic concept art and the ruled images agree on dark olive with glowing green spots and a toothy crocodilian head; the film creature is pale and limbless. The owner's ruling picks the olive/glowing-spot look; render it with the concept sheet's realistic wet scaly hide, not the animated flat colour.\n\n- `donor_current_sprite.png` (our own sprite): tan/khaki quadruped with small clawed limbs, dark spots, gator-like head \u2014 body plan agrees with the concept sheet, colour does not.", "must": "- [ ] Long, low crocodilian quadruped body with short splayed clawed limbs and a very long tapering eel-like tail\n- [ ] Narrow toothy c What the realistic renders show:\n- **Body**: a broad, heavy, low-slung sauropod/iguana-like quadruped with a deep chest, short thick neck held forward and low, thick pillar legs with heavy wrinkled skin folds at the joints, and a long tapering tail.\n- **Hide**: olive-khaki to greenish-tan, covered in a fine raised pebbly/cobbled scale pattern (like a gila monster or crocodile belly) with darker olive mottling; paler grey-cream underside, throat and inner legs.\n- **Head**: broad, blunt, heavy-browed head with a wide lipless mouth; small fangs at the front of the upper jaw and **a short tusk jutting up from each side of the lower jaw**; a **yellow-amber eye** with a dark pupil (this settles the old yellow-vs-reddish-orange uncertainty \u2014 the reddish-orange eye was only in the deleted pencil plate).\n- **Feet**: broad elephant-like feet with short blunt dark claws.\n- **Tack (military role)**: red-brown leather saddle harness and head bridle carrying shield-generator hardware.\n\n**Where the deleted images disagreed**: the pencil plate showed a much brighter yellow-green hide with a white belly and reddish eyes, and a lankier upright browsing pose; the comic icon showed dark saturated olive with warty spots. The realistic renders are duller olive-khaki with fine pebbled scales \u2014 trust them.", "must": "- [ ] Broad, heavy, low-slung quadruped with thick pillar legs, short forward neck and long tapering tail\n- [ ] Olive-khaki to greenish-tan hide with a fine raised pebbly scale pattern and darker mottling\n- [ ] Paler grey-cream underside, throat and inner legs\n- [ ] Broad blunt head with a wide mouth, small upper fangs and a short tusk jutting up from each side of the lower jaw; yellow-amber eye\n- [ ] Broad feet with short blunt dark claws\n- [ ] Realistic rendering: natural pebbled reptile hide and lighting, no outlines, no cartoon shading", "ruling": "", "base": "", "imgs": ["img/588adfba0447a6d52df0.webp", "img/43a7aa2291b1839d5a43.webp", "img/782be82e1 bantha-pony scale, per the riders).\n- **Head/face**: the front end is a bulbous face with a wide, drooping, lipless mouth (open, dark\n  inside) at the bottom and TWO round black eyes stacked vertically on the side of the head (one above\n  the other, per Legends text, confirmed in both images; they sit on a raised, wrinkled brow\n  mound). Wrinkled leathery folds around the mouth and brow.\n- **Legs**: stubby, thick, soft cylindrical leg-stumps in rows under the belly (canon image shows\n  roughly four/five visible per side, short and blob-ended, not jointed); the body hangs low, almost\n  dragging.\n- **Back/colour**: dark teal-green to grey-green flanks and head, with the back a segmented ridge of\n  glossy, translucent BLUE panels (bright cobalt/electric blue in both the render and the film still).\n  Underside and face greener/greyer. (The deleted painted plate showed a far more saturated\n  blue-purple back with lime-green flanks \u2014 do not use that.)\n- **Texture**: smooth, wet, gelatinous, semi-translucent skin with a glossy sheen over the blue back;\n  wrinkles at the face; no hair, no hard shell (the hard mirrored carapace belongs to the adult form,\n  NOT shown in any image).\n- **Prose vs images**: canon prose says \"five pairs of legs\" and \"dark green with blue splotches\";\n  images show dark green with a large contiguous glossy blue segmented back, not scattered\n  splotches. The deleted painted plate added spiky green dorsal ridges on the flanks -- not seen in canon or film; omit them.", "must": "- [ ] Fat soft caterpillar/grub body, blunt headless-looking front with no neck, tapering to a smaller rump\n- [ ] Two round black eyes stacked vertically on the side of the wrinkled brow, above a wide drooping lipless mouth\n- [ ] Rows of short thick soft leg-stumps under a low-hung belly\n- [ ] Dark teal/grey-green skin with a glossy translucent segmented bright-blue back\n- [ ] Smooth wet gelatinous skin, no fur and no hard shell (larval form)\n- [ eature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions. The owner's own KOTOR reference images (`owner_reference_*`) remain the authority for body plan (his 2026-09-16 ruling below); take the anatomy from them and give it real scaly reptile skin, like a small living theropod-shaped lizard, not low-poly game texture.\n\nJudged against the owner's two supplied reference images\n(`owner_reference_sideview.jpg`, `owner_reference_card.jpg`, both of the\nKOTOR in-game model \u2014 owner ruling below). Gizka is a **small bipedal\nDINOSAUR-like reptile, emphatically not a frog or toad**: a compact\ntheropod build with the **body held horizontal** over two strong hind\nlegs, and a **thick tapering tail extending behind for balance** \u2014 the\ntail is prominent in both references and is part of the silhouette. Small\nvestigial forelimbs are held tucked against the chest, never\nweight-bearing. The **head** is oversized relative to the body with a\n**rounded, blunt, beak-like snout**, broad fleshy cheeks, a downturned\nmouth, and a **backswept crest at the rear of the skull**. **TWO\nmodest-sized eyes sit on the sides of the head** \u2014 never a single central\ncyclops eye, and never huge bulging frog eyes dominating the face; a\nfront (south) view shows both. Hide is **scaly and mottled in tan, warm\norange-brown and olive patches** (the side-view reference reads warm\ntan-orange; the card reads greener) \u2014 never a flat colour \u2014 with paler\nskin at the belly and joints. `kotor_screenshot.jpg` shows two gizka in\nthe *Ebon Hawk* cargo hold, confirming pack/infestation behavior and a\nsize reference \u2014 roughly knee-height or smaller, a fast-breeding\nvermin-scale creature rather than a large animal.\n\nNo donor mod screenshot could be obtained \u2014 `mlie.starwarsanimalcollection`\nis not present anywhere on this machine's disk (Workshop cache or common\nMods folder), so there is no `donor_current_", "must": "- [ ] Small bipedal dinosaur-like reptile \u2014 theropod build, body held HORIZONTAL over two strong hind legs; NOT a frog, NOT a toad, NOT an upright hopper\n- [ ] A thick tapering TAIL extending behind for balance \u2014 part of the silhouette in every facing\n- [ ] Tiny vestigial forelimbs tucked against the chest, never weight-bearing\n- [ ] Oversized head with a rounded, blunt, beak-like snout, broad cheeks and a backswept crest at the rear of the skull\n- [ ] TWO modest-sized eyes on the sides of the head \u2014 a front (south) view shows both; never a single central cyclops eye, never huge bulging frog eyes\n- [ ] Scaly mottled hide in tan, warm orange-brown and olive patches \u2014 not a flat colour\n- [ ] Roughly knee-height or smaller \u2014 a vermin-scale creature, not a large animal\n- [ ] Realistic rendering: natural scaly reptile skin and lighting, no outlines, no cartoon shading, no low-poly game look", "ruling": "2026-09-16, owner: \"Check your canon. I see clear references to bipedal and no\nmention of four legs. I think this is a canon error in your search.\" Upheld on\nre-inspection: the background gizka in kotor_screenshot.jpg stands wholly on\nits two hind legs, forelimbs raised; the infobox render's thin forelimbs are\nnot weight-bearing. The earlier Visual brief's \"quadruped in a sprawling\nstance\" was a misread of the foreground close-up and is superseded by the\nMust-show line above. Gizka renders BIPEDAL: two working hind legs, vestigial\nraised forelimbs.\n\n2026-09-16, owner (giz art review): gizka has TWO eyes. The south-facing\nreview renders showed a single central cyclops eye \u2014 that came from this\nentry's own earlier \"reads almost one-eyed/cyclopean\" phrasing, which the\nimage model took literal", "base": "", "imgs": ["img/003a681b515ec1b5ea27.webp", "img/928bdc04dd580c564346.webp", "img/15d2e59decdb4f5e6a72.webp", "img/b5468709d352bd2404f1.webp", "img/3d1e94125adf47e87328.webp"]}, "letters": [ egends painting); a long banded tail tapering to a small spiked bulb.\n- **Colour disagreement, LOUDLY**: live-action ANH and the prose say PINK; the Legends painting is deep red with purple claws; the deleted comic was orange. Use pink-to-rose as the base.\n- **Size**: canon databank height 1.98 m when reared.\n- `legends_2` (Alien Anthology) shows a k'lor'slug facing a Kirithin; it is not obvious which creature is the k'lor'slug (probably the armoured brown segmented body with a clawed limb in the foreground). Low-confidence evidence.", "must": "- [ ] Long thick tubular segmented worm body, ringed and creased like a real earthworm, rearing up in an arch\n- [ ] Pink to dusky rose skin (live-action and prose), not orange\n- [ ] Round suction-cup maw ringed with sharp teeth at the blunt front end\n- [ ] Many limbs ending in large curved claws\n- [ ] About 2 m tall when reared, tapering tail behind\n- [ ] Realistic rendering: natural wet, wrinkled skin texture and lighting, no outlines, no cartoon shading", "ruling": "", "base": "", "imgs": ["img/0ca9e6d9e8db2826901c.webp", "img/a8fe400e5c1c915efa22.webp", "img/aa18da8862a66500f8dc.webp", "img/666a782ac44defc852a1.webp"]}, "letters": ["D", "E", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Klorslug, RSW_Klorslug", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "Follow the canon art precisely, the red and white one"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "Follow the canon art precisely, the red and white one"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10- ender shows the same Legends design).\n\nThe remaining images split along the two design lineages above \u2014 read them as two related but distinct visual\ntargets, not one:\n\n- `wookieepedia_legends_infobox_viperkinrath.png` \u2014 the Legends species\n  infobox image (a rendered 3D model, likely from a later KOTOR-related\n  game asset). Shows the same body plan cleanly and in neutral lighting:\n  **yellow-tan base with rust/reddish-brown mottling**, an upward-curving\n  segmented neck ending in a small mantis-like head, four extremely long\n  jointed legs with clawed/pointed tips, NO visible eyes-cluster or flower\n  organ. This is the strongest clean color+shape reference for the\n  Legends/KOTOR design and confirms \"light yellow-brownish\" from the text.\n- `wookieepedia_currentcanon_netcaster_infobox.png` \u2014 Bad Batch \"Tribe\"\n  render, front-on: confirms the flower organ (orange/red, six petals,\n  positioned below a head bearing **six black eyes in a tight cluster**),\n  golden-tan chitin, dense mossy Kashyyyk forest setting with webbing\n  visible. This is the strongest reference for the current-canon \"netcaster\"\n  design and its two features absent from the KOTOR model (flower organ,\n  eye cluster).\n- `wookieepedia_currentcanon_netcaster_rear.png` \u2014 same creature from\n  behind: confirms the spoon-shaped body silhouette (narrow at top, wider\n  toward the rear) and dark horizontal banding/stripes across the\n  abdomen, matching the text description exactly.\n- `unfinished_tcw_netcasters_conceptclip.png` \u2014 leaked clip from the\n  cancelled *Clone Wars* episode, three creatures shown: bright\n  **ye", "must": "- [ ] Base colour is warm yellow/gold/tan-brown \u2014 no blue anywhere on the body\n- [ ] If depicting the current-canon \"netcaster\" design: six black eyes in a tight cluster above a six-petaled flower organ\n- [ ] If depicting the current-canon \"netcaster\" design: spoon-shaped body (narrow at top, wider toward the rear) with dark horizontal banding across the abdomen\n- [ ] If depicting the KOTOR/Legends design: a long, upward-curving segmented neck ending in a small mantis-like head, with no flower organ and no eye cluster\n- [ ] Four long, thin, multi-jointed legs (true of both design lineages)\n- [ ] Not confused with Wyyyschokk \u2014 no blue-grey body and no abdomen cross marking\n- [ ] Realistic rendering: natural chitin texture and lighting, no outlines, no cartoon shading", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `unfinished_tcw_netcasters_conceptclip.png`\n\n> \"https://www.starwars-holonet.com/holonet/images/5/5e/16407/crea_kinrath_nc_1.webp more like that. Same as 2 and 3.\"", "base": "", "imgs": ["img/ab805ffcacd211d983ee.webp", "img/800a5cc0a4c21d81144d.webp", "img/8ac83cd1f38b50eadb46.webp", "img/4d453a90a0f26c968c68.webp"]}, "letters": ["F", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 2, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Kinrath, RSW_Kinrath; artpipe jobs on record: canon_kinrath_v1, kinrath_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "https://www.starwars-holonet.com/holonet/images/5/5e/16407/crea_kinrath_nc_1.webp more like that. Same as 2 and 3."}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon art closley, looks closest to a mantis shape. Study the donor art for geometry info."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon art closley, looks closest to a mantis shape. Study the donor art for geometry info."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", A.jpg`), the comic panel (`Lylek RS11BT3.png`) and the creature-less nest map tile (`Lylek nest.png`). The one image kept, `legends_1` (`Lylek.jpg`), is a detailed realistic painting of the same design the canon plate shows; it is the target. No live-action lylek exists. The comic's bright yellow-green and the map plate's flat mid-green are dropped: use the painting's olive/moss green.\n- **Silhouette**: a tall, spidery, many-limbed insectoid that stands high on long stilt legs. A\n  compact flattened torso slung between four to six spear-like walking legs (four long stiff\n  stilts in the painting, angled out like tripod stakes), with a raised front body and two pincer-\n  arms held up like a mantis.\n- **Head**: a small wedge/dragon-like head on a short upright neck, a gaping toothed round mouth;\n  the painting shows what reads as THREE heads/knobs at the top -- the central maw plus two\n  head-like pincer-tips on arm stalks held up beside it, each a spiked blob with a small red\n  eye. These are the pincers/claws, not extra heads, but they look like heads. (Prose: \"spiked\n  pincers and powerful mandibles with a pair of tentacles near them\".)\n- **Tentacles (loud)**: TWO long thin, dark, smooth whip-like tentacles with pale underside whip\n  out from the shoulders/front of the torso and curl in big loops through the air and on the ground;\n  they are much longer than the body (Legends text: poisonous barb tip, not visible).\n- **Carapace**: ridged, spiky, leaf-like plates stacked over the back, shoulders and legs, all\n  jagged; underbelly paler, softer and scaly.\n- **Colour**: olive/moss green with darker shading in the recesses of the plates; pale grey-cream\n  underside and joints; tentacles darker brown-black above, pale beneath.\n  Eyes small and red.\n- **Size cues**: the text calls them \"tall beasts\"; the deleted comic showed one towering over armed adult humans.\n- **Prose vs images**: matches -- spiked carapace, pincers, tentacles. The queen/hive a webp", "d6cc815ed7575d3f83f8c04a425a64650aca393185f80b406674ef90b0e6c7b3": "img/d6cc815ed7575d3f83f8.webp", "19393f23d531d34a86ad81ce22b02ad7cfd809fd7d021eb4e3ce0988b76d9de1": "img/19393f23d531d34a86ad.webp", "166d60563795ab825d8fd81e487c128754b307e0f909754900fccc07a0bbc696": "img/166d60563795ab825d8f.webp", "27254b2dc0ebfdbe22684794a1bf2798b729ecb154b012fad0bdd0b9c79da805": "img/27254b2dc0ebfdbe2268.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/mott", "brief": "Four images: CANON infobox render (Visual Encyclopedia) and a tiny blurry film-style still of a mott pup in a stampede (canon_2, almost unusable); LEGENDS: a low-res copy of the same CG render with a red eye, and a painted plate of an adult female with her young. They agree.\n- **Silhouette**: a stocky, low-slung, barrel-bodied tapir/rhino-like quadruped with stubby legs, a long level back, a very short stub tail, shoulder height about 1.1 m (matches text), the body lower at the shoulder than at the haunch only slightly.\n- **Colour/pattern (CG render and painting)**: a two-tone coat. Back and rump pale sage-tan/cream-grey, flanks and neck warm orange-rust; white-cream stripes/bands run across the flanks, rump and the upper legs (horizontal stripes on the body, rings on the legs), cream belly, throat and cheeks. The tiny canon_2 still shows an uniform brown-tan young animal without stripes (lower quality, soft).\n- **Skin/fur**: short, thin, smooth, hair-like coat, almost naked skin with fine wrinkles at joints, no mane or long fur.\n- **Head**: a long, drooping, tapir-like snout with a pale muzzle, a thick lower lip, a small blunt horn at the tip of the snout (in the CG render a short horn on the nose and two short pointed ears with a small horn nub or ear tuft at the back of the head); small dark eyes, red in the Legends copy.\n- **Feet**: broad, clawed toes (three or four visible) on each foot, like a tapir's, and a short tail tuft.\n- **Young**: smaller copies of the adult with the same stripes and a short upright snout horn; litters are shown as a line of piglet-sized young.\n- **Disagreement**: text says they have 'skin' and sharp claws and small horns on snouts (images agree); Legends says semi-aquatic (no web or aquatic features shown).", "must": "- [ ] Stocky barrel-bodied, stubby-legged tapir/rhino-like quadruped (about 1.1 m shoulder)\n- [ ] Two-tone coat: sage-tan back, orange-rust flanks, cream belly, with cream bands across flanks, rump and legs\n- [ ] Short smooth hair, near-bare wrinkled skin, no mane\n- [ ] Long drooping snout with a small blunt horn at the tip and short pointed ears\n- [ ] Broad clawed toes, very short tail", "ruling": "", "base": "", "imgs": ["img/e1949766180cda5ac23b.webp", "img/49f9d91227c007838072.webp", "img/ecdaba2033ba42ef3344.webp", "img/8ec7de62519a2f49eeb9.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Mott, RSW_Mott", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon closely, kinda like a dog hippo rhino or something"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon closely, kinda like a dog hippo rhino or something"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon closely, kinda like a dog hippo rhino or something"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "follow canon closely, kinda like a dog hippo rhino or something"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "2026-10-07_greentide_sheet_2026- ottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on either image. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or watt", "must": "- [ ] Heavy domed/ridged shell-like back rising to a peak\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing\n- [ ] Mottled olive-to-dark-green pebbled/warty skin \u2014 no feather texture, beak or wings anywhere\n- [ ] Realistic rendering: natural wet pebbled amphibian skin texture and lighting, no outlines, no cartoon shading", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "base": "", "imgs": ["img/b8fc8a62f6e3d7b1bc49.webp", "img/a502c7cabfbb362a4fa7.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Nuna, RS e: the same bird on Padm\u00e9's arm, peacock-blue wings, long trailing tail with pale gold edging, a small yellow/gold head, raptor-like curved beak. Confirms the colour.\n- `wookieepedia_infobox.jpg` \u2014 the Legends infobox `Peko-peko.jpg` (Databank original): an untextured grey 3D model, side view. Body plan only \u2014 long S-curved neck, elongated beak/skull with a knob crest, long wings, long tail. Carries **no colour**; do not read \"grey\" as canon.\n\n**Net read: render blue**, as a real bird with real feather structure: peacock/macaw-style plumage, very long trailing tail feathers, clawed wings, a strong hooked nut-cracking beak. The red-orange Toxic mutant is not part of the target.", "must": "- [ ] Peacock/slate-blue wing and tail plumage \u2014 not drab, tan, grey or reddish-orange\n- [ ] Yellow/gold patch at the head or throat\n- [ ] Very long trailing tail feathers with pale gold edging\n- [ ] Long S-curved neck and an elongated hooked beak/skull with a crest at the back of the head\n- [ ] Clawed wings, foldable close to the body\n- [ ] Realistic rendering: natural layered feather texture and lighting, no outlines, no cartoon shading", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_fieldguide.jpg`\n\n> \"Follow #3 closely.\"", "base": "", "imgs": ["img/c26d59f795ffa2aa2017.webp", "img/d84064c17a455d43c3ba.webp", "img/7423963af562c182c5bb.webp"]}, "letters": ["A", "B", "K", "L", "M", "N", "O", "G", "H"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: PekoPeko, RSW_PekoPeko; artpipe jobs on record: gapbs_RSW_PekoPeko_male_v1, pekopeko_toyfig_b, pekopeko_v1", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "Follow #3 closely."}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner b uat tortoise/armadillo-like creature, **brown and ochre with a ridged, banded back-shell** and thick stumpy, clawed, scaly legs; a blunt snout and a long thin forward-reaching arm/neck at the front.\n- **The animal (Shiro) body, `canon_2`:** instead a **low, long, olive-green, segmented, caterpillar- or slug-like carapace**, hump-backed, with ridges, small stub legs, a pointed hooked snout and a tiny red eye, spiky comb-like scutes at the front. The two pieces disagree: brown tortoise-shell versus green segmented caterpillar.\n- **The plant (Tooke trap), common to both:** a **rosette of broad, leathery leaves that looks like a bromeliad or agave**, centred on the animal's back. Leaves are **grey-green to ochre, striped or blotched with orange-red/pink and yellow centres** (strong, saturated warm markings on the leaf blades).\n- **The trap parts:** in `canon_1` **two or three long thin stalks arch out of the rosette, each tipped with a large toothed mouth-like trap** (dark maroon to purple-red, ribbed jaws with spiky teeth, rising overhead like Venus flytraps or snapping jaws). In `canon_2` **a single tall, thin, dark-red stalk** rises from the middle of the rosette and ends in a small ribbed, bud-like trap head with a few small berries or nodules at its base; it is closed and looks like a flower bud.\n- **Overall look:** the animal is hidden under the plant, so from above a viewer sees a plant first; the head and legs appear at the bottom edge.", "must": "- [ ] Low, squat armoured animal body (brown tortoise-like shell or green segmented carapace) with short clawed legs and a blunt or hooked snout\n- [ ] Rosette of broad leathery leaves growing from the animal's back like a bromeliad, grey-green to ochre with orange-red and yellow markings\n- [ ] One or more long thin dark-red stalks rising out of the plant, each ending in a ribbed, toothed trap head\n- [ ] Plant covers most of the back so the creature reads as a plant first, with head and legs showing underneath", tch the reference art and the sourced\n\"blue\" eyecolor both call for, and the donor's head is not as strongly\nsaturated red as the adult reference \u2014 closer to the reference's more muted\njuveniles. The blue \"eyecolor\" infobox field is not tied to a patch by the page; the patch reading is my image interpretation. A regen should push the head toward a more vivid red and add the\nblue-toned eye patch.", "must": "- [ ] Vivid red/crimson head and neck (adults)\n- [ ] Pale grey-blue patch of skin around the eye\n- [ ] Pale grey beak\n- [ ] Brown, ridged, feathered-looking body with a long neck\n- [ ] Sturdy clawed forelimbs used for foraging\n- [ ] Juveniles are smaller and more uniformly brown/olive, lacking the adult's vivid red\n  head", "ruling": "", "base": "", "imgs": ["img/466b1843e0254d7b7bbd.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Clodhopper, RSW_Clodhopper; artpipe jobs on record: desertportb_clodhopper, longshade_rsw_clodhopper_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "less cartoonish"}, {"at": "2026-10-05", "verdict": "redo", "trust": "ruled", "sheet": "desert_sheet_2026-10-04", "note": "Truly alien creature, do not turn into a bird. Ignore the \"avian\" description, they don't look anything like a bird. Four legged. Wingless. Travel in large groups. Bizarre jointed mouth part ending in an extended beak at the end of a fleshy"}], "desc": {"def": "RSW_Clodhopper", "label": "clodhopper", "description": "Clodhoppers were omnivorous and dim-witted flightless avians from the planet Naboo but could be f 0e8": "img/a8dd1f199a5b1a7b2e6c.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/convor", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The flat *Galaxy of Creatures* cartoon still (`wookieepedia_cam_disguise.jpg`) was deleted. The only live-action convor found is **Morai**, the convor that follows Ahsoka, in the live-action *Ahsoka* series \u2014 StarWars.com databank still `starwarscom_morai_ahsoka.jpg` (searched: `Images of convorees`, `Images of Morai`, wiki file search, StarWars.com databank `morai` and `convor`; the wiki holds no live-action Morai file). It is a wide shot and the bird is small in frame. The Card Trader infobox render `wookieepedia_convoree_infobox.png` is a stylised animation-era illustration, KEPT only because it is the one image that shows the prehensile tail and plumage up close \u2014 use it for anatomy, not for its big cartoon eyes.\n\nWhat the live-action Morai shows: a **real-looking barn-owl-like bird** \u2014 upright, slim-to-plump owl standing on a rock, a pale heart-shaped white facial disc, pale cream-white breast, soft pale grey-buff back and wings with faint tawny shoulders, long wing tips folded down past the body. It reads as a real owl, not a big-eyed toy.\n\ud83d\udd34 **Live-action and animated versions DISAGREE:** the animated/illustrated convor is a round, plump ball with huge glowing amber eyes and brown/gold mottling; live-action Morai is a natural, proportionate barn-owl with normal-sized dark eyes in a pale facial disc. Follow the realistic proportions (normal owl head-to-body ratio, normal eyes); plumage may range brown/cream/gold (text: gold, green or brown) \u2014 Morai herself is the pale form. The prehensile tail is not visible in the live-action still; keep it from the text and the infobox.\n\n**The current donor sprite (`donor_current_sprite.png`)** shows a brown/cream mottled owl with a visible long ringed prehensile tail \u2014 keep the tail; push the proportions and plumage toward a real owl.", "must": "- [ ] Real owl proportions: rounded head with a flat facial disc and short hooked beak, normal-sized eyes \u2014 not oversized cartoon eyes\n- [ ] Dense, soft owl plumage in brown/cream/gold (or the pale cream-white Morai form), finely mottled\n- [ ] Long, ringed, prehensile tail used for grasping \u2014 not a standard fan-shaped bird tail\n- [ ] Compact owl body with long folded wing tips\n- [ ] Realistic rendering: natural feather texture and lighting, no outlines, no cartoon shading", "ruling": "", "base": "", "imgs": ["img/123ff9bd281626457b96.webp", "img/6a0a625b4bece650def4.webp"]}, "letters": ["A", "F", "G", "B"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Convor, RSW_Convor; artpipe jobs on record: desertportb_convor, leaningscrub_convor_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "different animals in different faces"}, {"at": "2026-10-06", "verdict": "redo", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": "Small owl-like image with a long monkey-like tail ending in a tassel and stripes. Tuffts on the side of its face. Do not make it cartoonish."}, {"at": "2026-10-06", "verdict": "keep", "trust": "ruled", "sheet": "leaningscrub_sheet_2026-10-05", "note": "Small owl-like image with a long monkey-like tail ending in a tassel and stripes. Tuffts on the side of its face. Do not make it cartoonish."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "leaningscr id-brown hide, finely wrinkled and near-hairless like an elephant or rhino, with scattered dark brown-grey spots/blotches on flanks, back and rump; lighter belly; a little coarse hair at the neck and leg joints.\n- **Head**: small, with a droopy, pendulous upper lip, small round ears, small heavy-lidded eyes, a flattened muzzle; no horns or tusks. Mouth shown closed.\n- **Feet**: heavy, splayed stumpy feet with a few blunt claw/toe tips, broad enough to wade swamp; legs darkened and wrinkled toward the lower joint.\n- **Look change from the deleted plate**: the illustration showed a paler pinkish-grey hide, chocolate \"stocking\" lower legs and a huge gaping hippo mouth; the realistic renders do NOT show the stockings or the gaping mouth \u2014 trust the renders. The Legends text mentions Onderon grey with dark back stripes; no image shows stripes.\n- **Size**: very large, a body deeper than a person's height (the Gungan rider in `canon_2` sits well above head height).", "must": "- [ ] Barrel body on long thick legs, sloping neck, head carried low\n- [ ] Greyish-tan to brown finely wrinkled hide with scattered dark spots\n- [ ] Small head with droopy pendulous lip, small ears, no horns\n- [ ] Broad splayed dark feet, darker lower legs\n- [ ] Short thin tail with a small tuft\n- [ ] Huge size relative to a person\n- [ ] Realistic rendering: natural wrinkled elephant-like hide and lighting, no outlines, no cartoon shading", "ruling": "", "base": "", "imgs": ["img/e957a2591b4e6b05c150.webp", "img/e421b7f20a3b9668cbeb.webp"]}, "letters": ["E", "C", "D", "B", "A"], "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Falumpaset, RSW_Falumpaset; artpipe jobs on record: desertportb_falumpaset, longshade_rsw_falumpaset_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 20 it as the MATERIAL reference for realistic scale texture, not for colour.\n\n- **Silhouette**: a heavy, long-bodied lizard like a giant iguana/komodo crossed with a crocodile; low, quadrupedal, sprawling stance with muscular thighs, long thick tail (prose: 3 m body plus a 1 m tail). `canon_3` crouches lower and more raptor-like.\n- **Spikes (loud)**: a continuous row of conical/serrated spikes runs down the back and the whole tail, climbing the neck into a crest of tall spines behind the head; a few small horn-like spikes on the snout and forelimbs.\n- **Head**: wedge-shaped crocodilian jaws with many sharp teeth, small eyes (`canon_1`: red-ringed pale eye), small horns/tusk-spikes above the nose and at the jaw corner; pale throat.\n- **Limbs**: strong legs with large, long curved claws on each toe (long pale claws in `canon_1`, black scythe claws in `canon_3`).\n- **Colour (images disagree)**: `canon_1` = bright green scaly hide with a pale cream/grey underside and a salmon-red throat/dewlap; `canon_3` = very dark blue-grey-black scales with a copper-red underbelly. The prose says green \u2014 use green, tone it down from the illustration's bright lime to a natural olive-green.\n- **Size**: prose says 3 m body plus 1 m tail; roughly humanoid-length-plus. Not a giant.\n- Invisibility/Force abilities are not depicted.", "must": "- [ ] Heavy sprawling quadrupedal lizard (iguana/komodo build) with a thick tail about as long as the body\n- [ ] Double row of conical spikes running from the tail tip along the back and rising into a spiky crest on the neck behind the head\n- [ ] Green scaly hide (olive to bright green) with a paler cream underside\n- [ ] Wedge-shaped crocodilian head with many sharp bared teeth and small horn-spikes on the snout\n- [ ] Large long curved claws on all four feet\n- [ ] Red/salmon throat dewlap (`canon_1` only; optional)\n- [ ] Realistic rendering: natural glossy reptile scales and lighting, no outlines, no comic or cartoon shading", "ruling": f them.\"**\n\nThe hatched *Alien Archive* illustration (`wookieepedia_alienarchive.jpg`) was deleted 2026-10-08. The target is now\n**`wookieepedia_bf2_render.png`**, the photoreal *Star Wars Battlefront II* (canon, video game) model of the bird in\nflight. `wookieepedia_woswfg_legends.jpg` is a naturalistic Legends painting from *The Wildlife of Star Wars* and\ndisagrees on wing type (below).\n\nFrom the Battlefront II render (realistic):\n- **Plumage**: warm golden-tan to honey-brown feathers over the body and long broad wings, with soft darker brown\n  shading along the feather tracts and paler tips; the coat is fairly even \u2014 **no strong black barring** is visible.\n- **Head and neck**: a bald, blue-grey, vulture-like head and a long thin bare blue-grey neck, held stretched forward\n  in flight; a long slim pale orange-tan beak.\n- **Tail**: a very long, thin, trailing tail streamer of golden feathers, longer than the body.\n- **Silhouette**: a lean, long-necked, long-winged soaring bird, closer to a heron or crane than a stocky raptor.\n- **Disagreement (loud)**: the deleted *Alien Archive* drawing showed heavy dark banding under the wings, a dark belly\n  patch, a hooked red-tipped beak and big blue-grey talons; the realistic render shows none of that banding, a\n  slimmer straighter beak and the legs tucked out of sight. Follow the render.\n- **Legends painting** (`woswfg_legends`): same bald blue-grey head and long neck, but **pterosaur-like membrane\n  wings** in bright orange-yellow and an open toothed beak. It is Legends; use it for head and neck only, never the\n  wings.", "must": "- [ ] Warm golden-tan to honey-brown feathered body and long broad wings, without heavy black barring\n- [ ] Bald blue-grey vulture-like head on a long, thin, bare blue-grey neck stretched forward\n- [ ] Long, slim, pale orange-tan beak\n- [ ] A very long, thin, trailing golden tail streamer, longer than the body\n- [ ] Lean, long-necked soaring silhouette (heron/crane-li <header>
  <div class="hrow">
    <h1 id="title">Review sheet</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>
  </div>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>
    <select id="fmark">
      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

  <div class="banner bad hide" id="err"></div>
</header>

<script id="RENDER">
(function () {  // freshness banner (built at, how many prior rulings are reflected) — always visible under the title
  const add = () => { let fr = ''; try { fr = JSON.parse(document.getElementById('CONFIG').textContent).freshness || ''; } catch (e) {}
    if (!fr || document.getElementById('freshBanner')) return;
    const h = document.querySelector('header .hrow'); if (!h) return;
    const d = document.createElement('div'); d.id = 'freshBanner'; d.className = 'bs-fresh-banner'; d.innerHTML = fr;
    h.insertAdjacentElement('afterend', d); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add); else add();
})();

/* Layout (owner complaint 2026-10-04, "poorly constructed"): one compact strip per graphic. Each picture
   set is a card whose facings sit SIDE BY SIDE; cards wrap across the width, so a row is about one
   thumbnail tall. Provenance is a tooltip, never wallpaper. Letters are row-local; the pick buttons on
   the right show only this row's letters. */
const FACE_ABBR = { south: 'S', east: 'E', north: 'N', west: 'W', single: '' };
const faceAbbr = f => f in FACE_ABBR ? FACE_ABBR[f] : f.replace(/^(\d+)_(\w).*$/, (m, n, d) => n + d.toUpperCase());
if (!window.__bsAnim) window.__bsAnim = setInterval(() => document.querySelectorAll('.bs-play[data-anim]').forEach(el => {
  const fr = el.dataset.anim.split('|'), i = ((+el.dataset.i || 0) + 1) % fr.length;
  /* advance only once the current frame has loaded: a frame that 404s (the gate's image-less scratch copy) must not
     re-request every 66 ms, which kept headless Edge's virtual clock from ever settling (req 13 hang, 2026-10-07) */
  const im = el.querySelector('img'); if (!im || !im.complete || !im.naturalWidth) return;
  el.dataset.i = i; im.src = fr[i];
}), 66);
/* Variant default (owner, 2026-10-06): a row whose record has no `variants` key starts with EVERY set that is ours
   (not a donor original), not purged and not purgedLive marked as a variant; the owner turns off what is wrong.
   An explicit list, even an empty one, is never overwritten. */
window.artDefaultVariants = (it, d) => {
  const purge = new Set((d && d.purge) || []);
  const out = [];
  for (const g of (it.graphics || [])) for (const c of g.cols) {
    if (c.noSelect || c.purgedLive || (c.kind === 'donor' && !c.ours) || out.includes(c.letter)) continue;
    const shas = Object.values(c.faces || {});
    if (shas.length && shas.every(x => purge.has(x))) continue;
    out.push(c.letter);
  }
  return out.sort((a, b) => LETTER_ORDER.indexOf(a) - LETTER_ORDER.indexOf(b));
};
/* Owner rule 2026-10-07 22:33 PDT: a geometric placeholder set (c.noSelect) can never be a pick or a variant. */
window.artNoSelect = it => new Set((it.graphics || []).flatMap(g => g.cols.filter(c => c.noSelect).map(c => c.letter)));

  }

};
const _itemBody = it => {
  const d = (typeof DEC !== 'undefined' && DEC[it.id]) || {};
  const purge = new Set(d.purge || []);
  const picks = Object.assign({}, it.prefillPicks || {}, d.picks || {});
  const variants = new Set(Object.prototype.hasOwnProperty.call(d, 'variants') ? d.variants : window.artDefaultVariants(it, d));
  window.artNoSelect(it).forEach(l => variants.delete(l));
  const cell = (c, f) => {
    const s = c.faces[f];
    if (!s) return `<div class="bs-cell bs-gap" title="no ${f} picture in this set">—</div>`;
    const t = it.thumbs[s];
    if (!t) return `<div class="bs-cell bs-gap" title="picture not archived">?</div>`;
    const p = purge.has(s);
    const btn = c.purgeable ? `<button class="ac-purge${p ? ' on' : ''}" title="reject + PURGE: delete this picture from the art store so it never appears again" onclick="event.stopPropagation();artTogglePurge('${it.id}','${s}')">${p ? '✕ purging' : '✕'}</button>` : '';
    const ab = faceAbbr(f);
    return `<div class="bs-cell${p ? ' ac-purged' : ''}"><div class="thumb ac-thumb" data-zoom="${t}" data-cap="${esc(it.label)} · ${c.letter} · ${f}"><img src="${t}" loading="lazy" alt=""></div>${ab ? `<span class="bs-face">${ab}</span>` : ''}${btn}</div>`;
  };
  /* flip-book (wing-beat) sets: one grid row per facing, a looping playback cell first, then frames 1..N */
  const faces = (c, g) => {
    if (!g.flip) return `<div class="bs-faces">${g.facings.map(f => cell(c, f)).join('')}</div>`;
    const rows = g.flipFacings.map(face => {
      const ks = g.facings.filter(k => k.endsWith('_' + face));
      const fr = ks.map(k => c.faces[k] && it.thumbs[c.faces[k]]).filter(Boolean);
      const play = fr.length ? `<div class="bs-cell bs-play" title="${face}: the frames looping at half game speed" data-anim="${fr.join('|')}"><img src="${fr[0]}" alt=""><span class="bs-face">▶${FACE_ABBR[face]}</span></div>` : '<div class="bs-cell bs-gap">—</div>';
      return play + ks.map(k => cell(c, k)).join('');
    }).join('');
    return `<div class="bs-faces bs-frames" style="grid-template-columns:repeat(${g.nframes + 1},auto)">${rows}</div>`;
  };
  const col = (c, g) => {
    const picked = g.primary ? d.decision === c.letter : picks[g.key] === c.letter;
    const tip = `${c.label}\n${c.detail}${c.ppc ? `\n\nresolution: ${c.srcPx[0]}×${c.srcPx[1]} px over the ${it.scale.kind === 'plant' ? 'quad' : 'drawSize'} = ${c.ppc} px/cell` : ''}${c.also ? '\n\nidentical copies:\n' + c.also.join('\n') : ''}${c.prompt ? '\n\nprompt: ' + c.prompt : ''}`;

    </div>`;
    const vbtn = `<button class="bs-var${vr ? ' on' : ''}" title="keep this set as a valid VARIANT as well as your one pick (saved as variants: [...] on the row)" onclick="event.stopPropagation();artToggleVariant('${it.id}','${c.letter}')">${vr ? '✓ variant' : '+ variant'}</button>`;
    return `<div class="bs-set ac-${c.kind}${c.winner ? ' ac-win' : ''}${picked ? ' ac-picked' : ''}${vr ? ' bs-isvar' : ''}">
      <div class="bs-head${c.purgedLive ? '' : ' bs-pick'}"${c.purgedLive ? '' : ` data-pick-id="${esc(it.id)}" data-pick-g="${esc(g.key)}" data-pick-l="${c.letter}" data-pick-primary="${g.primary ? 1 : 0}"`} title="${esc(tip)}${c.purgedLive ? '' : '\n\nclick to pick this set'}"><b>${c.letter}</b>${c.near_of ? `<i class="bs-nearof" title="near-duplicate of set ${c.near_of} (dHash within ${NEAR_BITS} bits on every facing)">≈${c.near_of}</i>` : ''}<span>${esc(c.short)}</span>${c.placeholder ? `<i class="bs-ph" title="${esc(c.placeholder)}">PLACEHOLDER</i>` : ''}${c.purgedLive ? `<i class="bs-ph" title="You purged this picture. The game still shows it until a replacement is installed, so it is listed here for reference only and cannot be picked.">you purged this — still live until a replacement is installed</i>` : ''}${c.also ? `<i class="sub">+${c.also.length}</i>` : ''}</div>
      ${faces(c, g)}
