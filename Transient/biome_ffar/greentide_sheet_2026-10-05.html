<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

nor sprite. Any regen should raise the body\nonto long thin legs, lengthen the snout, and keep the orange-with-cream-\nunderside palette and dorsal crest.", "must": "- [ ] Tall, long-legged reptilian runner build (raptor/theropod stance), not a low-slung lizard\n- [ ] Sail-like dorsal crest running from the crown of the head down the neck\n- [ ] Long snout with visible sharp teeth, including the two lower tusks\n- [ ] Rust-orange hide with a paler cream/tan underside and belly\n- [ ] Wide, blade-like tail tip", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_sot_art.png`\n\n> \"But the Donor mod really isn't too bad this time.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Dalgo/Dalgo`:\n\n> \"Canon shows somthing more like C. We need a high quality version of that. Look at Canon please.\"\n\n(C = render `pyrelands_dalgo_v1`, a cartoon-register sail-crested orange dalgo.)", "base": "", "imgs": ["img/70d80f0c9917687221c0.webp", "img/19cfbae208a86f62bcff.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Dalgo, RSW_Dalgo; artpipe jobs on record: doubles_redo_dalgo_v1, pyrelands_dalgo_v1, pyrelands_dalgo_v2", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "But the Donor mod really isn't too bad this time."}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-04", "verdict": "redo", "trust": "ruled", "sheet": "art_doubles_compare_2026-10-04", "note": "Canon shows somthing more like C. We need a high quality version of that. Look at Canon please."}], "desc": {"def": "RSW_Dalgo", "label": "dalgo", "description": 988060ba8514907910d7a6": "img/84e46121ae3a69bf065c.webp", "aa131c8fc296372d74e831f17a165410bba11d9085dc244b4e4ac94b96fa3303": "img/aa131c8fc296372d74e8.webp", "ad6234d7754c0b5b160b62b0105c55dfba0157ff687e37bfa2b394285101c920": "img/ad6234d7754c0b5b160b.webp", "3850909de68ee991cdbd44e88eb3ffeb2d70af037475a0118bbcd2712757111d": "img/3850909de68ee991cdbd.webp", "b3e30f80a4206309653e35710a55fb0d79a2003354716645fc0823a32ca1d775": "img/b3e30f80a4206309653e.webp", "f1cc492b887c26331d7165732adc2dd0e8274da1a1d46ae6699be5c2721cfa42": "img/f1cc492b887c26331d71.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/dragonsnake", "brief": "**The three canon sources disagree sharply on body plan, and none of them\nmatch our current donor/vendored sprite closely.**\n\n- `wookieepedia_huntforziro.jpg` (Clone Wars, \"Hunt for Ziro\", Nal Hutta): a\n  thick, segmented, armor-plated body with NO visible limbs, a bony/skeletal\n  jawless-looking skull with prominent fangs, and rows of glowing\n  yellow-green bioluminescent spots down the body. Olive/dark-khaki color.\n  Reads as an eel/worm-like ambush predator, not a \"snake with legs.\"\n- `wookieepedia_visualencyclopedia.jpg` (Star Wars Adventure Journal-style\n  illustration, labeled \"DRAGONSNAKE\" on a map): a lean, green, spotted\n  quadruped with small clawed forelimbs and hindlimbs, a long tapering tail,\n  and an elongated toothy crocodilian head with a pronounced brow ridge \u2014\n  this is the source closest in body plan to a \"dragon\" and closest to our\n  donor sprite (both have four small limbs), but the color is bright green\n  with pale spots, not our sprite's tan/khaki.\n- `wookieepedia_mandalorianandgrogu.jpg` (*The Mandalorian and Grogu*, Nal\n  Hutta pit): a massive, pale bone-white/gray, LIMBLESS eel-like serpent \u2014\n  multiple huge coils breach the water, with a skull-like elongated head and\n  a mouth full of long fangs dripping venom. No legs are visible anywhere on\n  the body. This is the newest, most \"current canon\" screen appearance and it\n  contradicts the quadruped read from the encyclopedia illustration.\n- `donor_current_sprite.png` (our own in-game sprite,\n  `Dragonsnake_Swimming_south.png`): a lean tan/khaki quadruped with small\n  clawed limbs, dark spotted markings, and an alligator-like toothy skull\n  head \u2014 body-plan-wise it agrees with the visual-encyclopedia illustration\n  (four legs) but its muted tan coloring matches none of the three canon\n  images, which run olive-with-glowing-spots, bright green, or bone-pale.\n\n**Net read**: canon dragonsnakes are consistently serpentine/reptilian with a\nelongated toothy skull, but disagree on whether they have visible legs at all\n(illustration: yes: small quadruped legs / both screen appearances: no\nvisible limbs, pure coiling serpent) and on color (olive-glowing, bright\ngreen, bone-pale, vs. our tan). This is a real candidate-image disagreement\nfor the owner to rule on \u2014 likely resolution is either \"keep our quadruped\nbody plan but recolor\" or \"cut the legs to match the two screen\nappearances.\"", "must": "Honest framing: the three canon images disagree sharply on body plan (limbless eel-like\nserpent in two, a small-legged quadruped in the third) and on color \u2014 only what all three\nagree on is listed as testable.\n- [ ] Elongated, toothy, skull-like/crocodilian head with prominent, visible fangs\n- [ ] Long serpentine/reptilian body plan\n- [ ] Shown as an aquatic ambush predator, partially submerged in murky swamp water", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_huntforziro.jpg`\n\n> \"#2 for coloration and glowing-seeming spots. But much less cartoonish, more like seriousness of #3.\"", "base": "", "imgs": ["img/66da4d4aa86df81fc42f.webp", "img/fac29cc2f099753df619.webp", "img/de2388dc94ee51d60fe1.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Dragonsnake, RSW_Dragonsnake; artpipe jobs on record: dragonsnake_toyfig_b, dragonsnake_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "#2 for coloration and glowing-seeming spots. But much less cartoonish, more like seriousness of #3. "}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Dragonsnake", "label": "Dragonsnake", "description": "The dragonsnake (also spelled 'dragon snake') were a large, semi-aquatic predatory reptiles that dwelled in the muddy waters of various planets, including Dagobah and Nal Hutta. Dragonsnakes were large serpentlike beasts with sharp fangs and biolumescent spots along their backs. Although voracious, they were incapable of digesting metal (a lucky escape for some heroic droids!). The dragonsnake \"Bright-Eyes\" displayed a degree of extreme intelligence and cunning.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Dragonsnake"}, "group": "Fauna"}, {"id": "RSW_Falumpaset", "kind": "fauna", "label": "Falumpaset", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.3 \u00b7 2 picture set(s)", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "your earlier pick (desert sitting 1): IN GAME \u2014 SWBestiary", "prefill": "A", "prefillWhy": "your earlier pick (desert sitting 1): IN GAME \u2014 SWBestiary", "prefillSource": "sit1", "contested": false, "inferred": false, "prefillPicks": {}, "graphics": [{"key": "swanimals/Falumpaset/Falumpaset", "res": "swanimals/Falumpaset/Falumpaset", "role": "body", "primary": true, "facings": ["south", "east", "north"], "prior": {"text": "your desert sitting 1 pick is set A here (IN GAME \u00b7 SWBestiary)", "note": "", "was": "desert sitting 1 07902993e5cb8897911574": "img/369bd58c1cc629f01cad.webp", "df0ce2c77dbfe0ee9df9e4b41e05f6dc76923127804ffc04c6154019d973acc7": "img/df0ce2c77dbfe0ee9df9.webp", "9082ec7f8b8ea1fb1413ca1b69358f59013288802c9a3f22aa260b185cbfc416": "img/9082ec7f8b8ea1fb1413.webp", "f9ece556f07e1e95697566c969e62e7bbe20eaac91d5e20bb048214830b8f09e": "img/f9ece556f07e1e956975.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/falumpaset", "brief": "Two images: the CANON infobox (`wookieepedia_canon_1`, a CG render of the Phantom Menace falumpaset) and a LEGENDS painted plate (`wookieepedia_legends_1`, wild herd bellowing at twilight). The two disagree on colour and head, so treat the CG as the film-canon look.\n- **Silhouette**: a huge barrel-bodied, heavy-rumped herbivore on disproportionately long, thick legs, with a long, thick, downward-sloping neck and a smallish head held low; front is lower than the hump-like back, giving a sagging camel/paleo-mammal profile. Short thin tail with a tuft at the tip.\n- **Canon CG colour/skin**: tan to mid-brown hide, finely wrinkled and hairless/short-haired like an elephant or rhino, with scattered dark brown spots/blotches on flanks and back; lighter belly.\n- **Canon CG head**: small head with a droopy, pendulous lip, small round ears, small eyes, a flattened muzzle; no horns or tusks.\n- **Feet**: heavy, splayed, dark-brown stumpy feet with a few blunt claw/toe tips, broad enough to wade swamp; legs darkened toward the lower joint.\n- **Legends plate**: paler pinkish-grey hide with brown speckles, much darker (chocolate) lower legs like stockings with thick pastern joints, calves in the water, and a very large gaping mouth with pink interior and teeth, hippo-like. Calf is a smaller version of the same shape. The Legends text mentions Onderon grey with dark back stripes; the images do not show stripes.\n- **Size**: very large, a body deeper than a person's height, shown towering over birds and tiny swamp creatures.", "must": "- [ ] Barrel body on long thick legs, sloping neck, head carried low\n- [ ] Tan-brown wrinkled hide with scattered dark spots (canon CG look)\n- [ ] Small head with droopy pendulous lip, small ears, no horns\n- [ ] Broad splayed dark feet, darker lower legs\n- [ ] Short thin tail with a small tuft\n- [ ] Huge size relative to a person", "ruling": "", "base": "", "imgs": ["img/e957a2591b4e6b05c150.webp", "img/7cd9b17cca1504da2d37.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Falumpaset, RSW_Falumpaset; artpipe jobs on record: desertportb_falumpaset, longshade_rsw_falumpaset_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "every animal appears to be something different"}], "desc": {"def": "RSW_Falumpaset", "label": "falumpaset", "description": "The falumpaset were a large mammalalian creature native to the planet Naboo. Their distinctive bellowing calls could be heard for kilometers around and their intelligence made them likely to form strong bonds with their handlers. Easily domesticated as beasts of burden (or sometimes war mounts), falumpasets could be found all over the galaxy.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Falumpaset"}, "group": "Fauna"}, {"id": "RSW_Fambaa", "kind": "fauna", "label": "Fambaa", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.25 \u00b7 6 picture set(s) across 4 graphics", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "what the game shows now (no pick of yours)", "prefill": "A", "prefillWhy": "no resolvable keep m the lower\n  jaw, and reddish-orange eyes. This is the best single reference for\n  natural skin pattern and body proportions (long low body, thick\n  pillar-like legs, broad splayed toes).\n- `wookieepedia_shieldgenerator.jpg` (`FambaaShield-SWE.png`, an official\n  encyclopedia-style CG render pair) directly depicts the canon Battle of\n  Naboo role: two fambaas side by side, each saddled with a red-brown\n  leather harness and carrying one half of the deflector shield generator\n  (a dish-shaped emitter on the left animal, a smaller focusing/receiver\n  rig on the right). Skin here reads as smoother, **tan-olive/khaki**\n  mottled hide \u2014 same family as the field guide painting, just smoother\n  and less saturated.\n- `wookieepedia_herd.jpg` (`Fambaas-SWE.jpg`) is the same CG render pair as\n  `wookieepedia_shieldgenerator.jpg`, just re-cropped/re-composited on a\n  green background rather than white \u2014 treat it as a duplicate confirming\n  the tan-olive coloring and harness/shield-generator rigging, not an\n  independent sighting.\n- `wookieepedia_infobox.jpg` (`Fambaa.png`, the current wiki infobox art \u2014\n  comic/ink-illustration style) shows a **darker, more saturated olive\n  green** warty/bumpy hide than the other three images, a wide tusked\n  mouth, and the round dish shield-generator component strapped to its\n  back. It is stylistically the outlier (flat comic inking vs. painted or\n  CG-rendered elsewhere) but is still squarely in the same green-to-olive\n  family the text names \u2014 a style difference, not a color contradiction.\n\n**One minor, worth-flagging disagreement**: the sourced infobox eye color\nis \"Yellow\" (cited to the film itself), but the *Field Guide* painting\ngives the fambaa reddish-orange eyes. Neither the shield-generator CG\nrenders nor the flat infobox icon show eye color clearly enough to\narbitrate. Treat eye color as **uncertain between yellow and\nreddi", "must": "- [ ] Broad, low-slung, thick pillar-like-legged quadruped body\n- [ ] Mottled brown-to-olive-green reptilian/amphibian hide\n- [ ] Pale cream/white underside and inner legs\n- [ ] Long, tapering cartilage tail\n- [ ] A single curved tusk jutting from the lower jaw\n- [ ] Broad feet with wide, splayed toes", "ruling": "", "base": "", "imgs": ["img/8e88b1702c508ff73ef6.webp", "img/43a7aa2291b1839d5a43.webp", "img/2728867d872fde834d66.webp", "img/782be82e18aaf928d0f6.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Fambaa, RSW_Fambaa; artpipe jobs on record: fambaa_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Fambaa", "label": "fambaa", "description": "Fambaas were large herbivorous amphibians most often found in swamps. Fambaas were technically amphibians but had the scaly hide of reptiles. The creatures size and usefulness when domesticated meant they were exported to many worlds as beasts of burden.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Fambaa"}, "group": "Fauna"}, {"id": "RSW_Gelagrub", "kind": "fauna", "label": "Gelagrub", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.3 \u00b7 1 picture set(s)", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "what the game shows now (no pick of yours)", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to what the game shows now", "prefillSource": "inferred", "contested": true, "inferred": true, "prefillPicks": {}, "graphics": [{"key": "swanimals/Gelagrub/Gelagrub", "res": "swanimals/Gelagrub/Gelagrub", "role": "body", "primary": true, "facings": ["south", "east", "north"], "prior": null, "cols": [{"kind": "live", "faces": {"east": "80f34fa32f88 a raised, wrinkled brow\n  mound). Wrinkled leathery folds around the mouth and brow.\n- **Legs**: stubby, thick, soft cylindrical leg-stumps in rows under the belly (canon image shows\n  roughly four/five visible per side, short and blob-ended, not jointed); the body hangs low, almost\n  dragging.\n- **Back/colour**: dark teal-green to grey-green flanks and head, with the back a segmented ridge of\n  glossy, translucent BLUE panels (bright cobalt/electric blue in canon and film images; blue-purple\n  with bright lime-green highlights in the painted plate). Underside and face greener/greyer.\n  Painted plate is far more saturated than the render; canon render is the target.\n- **Texture**: smooth, wet, gelatinous, semi-translucent skin with a glossy sheen over the blue back;\n  wrinkles at the face; no hair, no hard shell (the hard mirrored carapace belongs to the adult form,\n  NOT shown in any image).\n- **Prose vs images**: canon prose says \"five pairs of legs\" and \"dark green with blue splotches\";\n  images show dark green with a large contiguous glossy blue segmented back, not scattered\n  splotches. The painted plate adds spiky green dorsal ridges on the flanks -- not seen in canon or film.", "must": "- [ ] Fat soft caterpillar/grub body, blunt headless-looking front with no neck, tapering to a smaller rump\n- [ ] Two round black eyes stacked vertically on the side of the wrinkled brow, above a wide drooping lipless mouth\n- [ ] Rows of short thick soft leg-stumps under a low-hung belly\n- [ ] Dark teal/grey-green skin with a glossy translucent segmented bright-blue back\n- [ ] Smooth wet gelatinous skin, no fur and no hard shell (larval form)\n- [ ] Large enough to carry a mounted armoured humanoid on its back", "ruling": "", "base": "", "imgs": ["img/3c162262297be12804a8.webp", "img/35433b062cf682a630d3.webp", "img/e96090dd1848d2594161.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: nts. `kotor_screenshot.jpg` shows two gizka in\nthe *Ebon Hawk* cargo hold, confirming pack/infestation behavior and a\nsize reference \u2014 roughly knee-height or smaller, a fast-breeding\nvermin-scale creature rather than a large animal.\n\nNo donor mod screenshot could be obtained \u2014 `mlie.starwarsanimalcollection`\nis not present anywhere on this machine's disk (Workshop cache or common\nMods folder), so there is no `donor_current_sprite.png` candidate for this\nentry.", "must": "- [ ] Small bipedal dinosaur-like reptile \u2014 theropod build, body held HORIZONTAL over two strong hind legs; NOT a frog, NOT a toad, NOT an upright hopper\n- [ ] A thick tapering TAIL extending behind for balance \u2014 part of the silhouette in every facing\n- [ ] Tiny vestigial forelimbs tucked against the chest, never weight-bearing\n- [ ] Oversized head with a rounded, blunt, beak-like snout, broad cheeks and a backswept crest at the rear of the skull\n- [ ] TWO modest-sized eyes on the sides of the head \u2014 a front (south) view shows both; never a single central cyclops eye, never huge bulging frog eyes\n- [ ] Scaly mottled hide in tan, warm orange-brown and olive patches \u2014 not a flat colour\n- [ ] Roughly knee-height or smaller \u2014 a vermin-scale creature, not a large animal", "ruling": "2026-09-16, owner: \"Check your canon. I see clear references to bipedal and no\nmention of four legs. I think this is a canon error in your search.\" Upheld on\nre-inspection: the background gizka in kotor_screenshot.jpg stands wholly on\nits two hind legs, forelimbs raised; the infobox render's thin forelimbs are\nnot weight-bearing. The earlier Visual brief's \"quadruped in a sprawling\nstance\" was a misread of the foreground close-up and is superseded by the\nMust-show line above. Gizka renders BIPEDAL: two working hind legs, vestigial\nraised forelimbs.\n\n2026-09-16, owner (giz art review): gizka has TWO eyes. The south-facing\nreview renders showed a single central cyclops eye \u2014 that came from this\nentry's own earlier \"reads almost one-eyed/cyclopean\" phrasing, which the\nimage model took literal", "base": "", "imgs": ["img/003a681b515ec1b5ea27.webp", "img/928bdc04dd580c564346.webp", "img/15d2e59decdb4f5e6a72.webp", "img/b5468709d352bd2404f1.webp", "img/3d1e94125adf47e87328.webp"]}, "letters": ["A", "B", "C", "D", "E", "F", "G", "H"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Gizka, RSW_Gizka; artpipe jobs on record: desert_swaca_gizka, pyrelands_gizka_2leg_option, pyrelands_gizka_biped_v3, pyrelands_gizka_biped_v4, pyrelands_gizka_dino_v5, pyrelands_gizka_v1, pyrelands_gizka_v2", "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "totally wrong. Four legs instead of 2. Not canon, Not facing differently. "}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "We had a good Gizka.... it didn't need to be redone, and it isn't a frog."}], "desc": {"def": "RSW_Gizka", "label": "gizka", "description": "Whatever their native world, their extraordinary reproduction rate led to a fair amount of gizka on many worlds, even including uncharted planets such as Lehon, finding their way from the wreckage of crashed starships. It has been alternatively postulated that they came from that planet originally, spreading along with the Infinite Empire. Their exponential population growth led to them being considered pests on almost as many worlds as they inhabited, as they commonly ate electrical wiring. They were the source for the delicacy gizka steak.", "source": "live def dum 67b6681779dd9af34764827a3ab9365e901ef8e3c8792766a45038526c": "img/9e907167b6681779dd9a.webp", "c726ee6b94b160bafa486d3c167ac3ae08c62de7bd31a2c38633e2984d1ee39c": "img/c726ee6b94b160bafa48.webp", "1c4c4469265ef5f688089c3f965eb2ad37aa7a6a286ee6fb27b2a5a21f062bbf": "img/1c4c4469265ef5f68808.webp", "66bc6b13db614549528fc043b84cb2222562fe74470d8b35f377cac780e457f2": "img/66bc6b13db614549528f.webp", "0a1878e64116550c660809ebc0fa8ef685e91a91b362f39d1517122053e3ec43": "img/0a1878e64116550c6608.webp", "f3d943c350c13ff14c199af6738213b8b961b140a0fea123728a86a5242dbd72": "img/f3d943c350c13ff14c19.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/hawkbat", "brief": "This is a stronger case of text/image (and current-canon/Legends) disagreement\nthan usual, and three of the four candidate images line up with each other\nagainst the fourth:\n\n- `wookieepedia_current_canon_infobox.jpg` (current canon, a display prop\n  photographed for *Star Wars: Hyperspace Lounge* material) shows something\n  that barely reads as \"hawk-bat\" at all: a squat, **slug/larva-bodied**\n  creature in deep violet-to-near-black skin, a bulky snouted head with\n  small forward-curling horn-like growths, visible curved fangs, and large\n  clawed grasping forelimbs. No batlike membrane wings are visible in this\n  pose. This is a legitimate current-canon depiction but is visually\n  disconnected from everything else found for this creature \u2014 treat it as\n  the minority/outlier reference, not the target.\n- `wookieepedia_legends_infobox.jpg` (*The Wildlife of Star Wars: A Field\n  Guide* illustration) \u2014 the clearest single reference: a pterosaur-like\n  silhouette with **violet-purple dorsal wing membrane fading to\n  cream/pale-gold on the ventral side**, ribbed wing structure, a short\n  beaked head with a small forward horn and a green eye (not the ruby the\n  text names \u2014 see below), clawed wingtips, long tail. Matches the \"purplish\n  yellow-gray adult\" text closely for the wing coloring.\n- `wookieepedia_legends_juvenile.jpg` (same Field Guide source, two\n  individuals) directly illustrates the text's green-juvenile \u2192 purple/gold\n  adult transformation: a green-and-purple individual perched atop a\n  building, still gripping a shed skin below it, next to a separate\n  **pale gray-white** flying individual with a **red/orange eye** diving\n  past. Confirms the molt described in the sourced text and shows the eye\n  color is inconsistently rendered across sources (green in one image, red\n  in another) even though the text says ruby.\n- `donor_mod_workshop_icon.jpg` \u2014 cropped from the donor mod's own Steam\n  Workshop screenshot (full grid screenshot showing \"HAWK-BAT\" labeled next\n  to Gornt/Gorak/Iriaz \u2014 see Source URLs). **This is the strongest\n  confirmation available**: the mod's own stylized icon uses the same\n  **violet-purple-topped, cream/pale-yellow-bottomed wing membrane**,\n  small head with a slight brow horn, and long tail as the Legends Field\n  Guide art \u2014 i.e. whoever built this RimWorld mod referenced the classic\n  Legends hawk-bat, not the Hyperspace Lounge current-canon redesign.\n\n**Net read: render the Legends version** \u2014 a purple-topped, cream-to-pal", "must": "- [ ] Wing membrane violet-purple on the dorsal side fading to cream/pale-gold on the ventral side\n- [ ] Small forward-curling horn-like growth on the forehead\n- [ ] Hooked beak, not a flat bird beak\n- [ ] Long tail present\n- [ ] Ribbed wing membrane structure with clawed wingtips\n- [ ] Reads as a pterosaur-like reptavian, not the slug/larva-bodied current-canon outlier", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_legends_infobox.jpg`\n\n> \"Original donor mod isn't that bad, #3 is canon. Notable hooks on end of wings and \"feet\"\"", "base": "", "imgs": ["img/f04c617c60a9525fdbe4.webp", "img/c9bb113459b998d48279.webp", "img/7d6fd3701a48d755d41e.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Hawkbat, RSW_Hawkbat; artpipe jobs on record: canon_hawkbat_v1, hawkbat_v1", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "Original donor mod isn't that bad, #3 is canon. Notable hooks on end of wings and \"feet\""}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Hawkbat", "label": "hawk-bat", "description": "Hawk-bats were predatory reptavians with a curved beak and leathery wings that could be found on urbanized worlds like Coruscant and Taris. To get on a hawk-bat's bad side could be very dangerous. As a result, very few lived in captivity. Though they favored granite slugs, hawk-bats would feed on almost anything smaller than themselves. When they hatched from their eggs, young hawk-bats had scaly green skin and were precocial, meaning they were fully independent and able to hunt upon the day of hatching. Upon reaching maturity, the hawk-bat would shed its green skin and emerge with mature purplish-gray skin.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Hawkbat"}, "group": "Fauna"}, {"id": "RSW_Hssiss", "kind": "fauna", "label": "Hssiss", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.18 \u00b7 2 picture set(s) across 2 graphics", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "what the game shows now (no pick of yours)", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to what the game shows now", "prefillSource": "inferred", "contested": true, "inferred": true, "prefillPicks": {"swanimals/Hssiss/Hssiss_Swimming": "B"}, "graphics": [{"key": "swanimals/Hssiss/Hssiss", " alcollection \u00b7 AssetBundle extract"], "letter": "B", "purgeable": false, "short": "IN GAME \u00b7 SWBestiary"}]}], "thumbs": {"980e61dbe6a026a073199851f16c33d6c2df9e841aceceed630788bf546be47e": "img/980e61dbe6a026a07319.webp", "f5cc3c557c56ce2d1f5d969b7ec702320b9553701ed678f5071fdc63eca06724": "img/f5cc3c557c56ce2d1f5d.webp", "e84e3fba38c7a0e5cfd71104587134708b800a650f55d9481696ef3fab0e15be": "img/e84e3fba38c7a0e5cfd7.webp", "24ac8ee79856c3a4cb779aaabf512f35ef97d0688e08774205078176161c9c68": "img/24ac8ee79856c3a4cb77.webp", "e0f18f3f10577e1c13a6f3c25cc0c8eba1508e4ff4934a642d94279986f53ebe": "img/e0f18f3f10577e1c13a6.webp", "e242bfec7b768df5f97d0bcca3dd116631106ac12812cc56771aaac4c7876faa": "img/e242bfec7b768df5f97d.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/hssiss", "brief": "Viewed 2026-10-04. All four images are canon, but they are four DIFFERENT artists' takes and they\ndisagree on colour: (1) infobox colour illustration, (2) comic panel (Ktriss, Great Bogga's pet),\n(3) a dark-scaled painted/rendered hssiss, (4) a painted dark-side-nebula scene. Image 1 is the\ncleanest and matches the prose; use it as the target.\n- **Silhouette**: a heavy, long-bodied lizard like a giant iguana/komodo crossed with a crocodile;\n  low, quadrupedal, sprawling stance with muscular thighs, long thick tail about as long as the\n  body. Image 3 crouches lower and more raptor-like.\n- **Spikes (loud)**: a continuous double row of conical/serrated spikes runs down the back and\n  the whole tail (image 1: spiky segmented ridge, tail ringed with spike rows; image 2: a dark\n  comb of spines down back and tail) and climbs up the neck into a crest of tall spines behind the\n  head -- matching the prose. A few small horn-like spikes sit on the snout and forelimbs.\n- **Head**: wedge-shaped, crocodilian jaws, a row of many sharp teeth (very prominent, bared in\n  images 2 and 4), small eyes (image 1: red-ringed pale eye), small horns/tusk-spikes above the nose\n  and at the jaw corner; pale throat.\n- **Limbs**: strong legs with large, long curved claws on each toe (long pale claws in image 1,\n  black scythe claws in image 3).\n- **Colour (images disagree)**: image 1 and 2 = bright to olive GREEN scaly hide with a pale\n  cream/grey underside, and in image 1 a salmon-red throat/dewlap (image 1 only); image 3 = very dark\n  blue-grey-black scales with a copper/red underbelly; image 4 = dark green with pale cream spines.\n  Prose says green scaly hide -- green is the majority and canon-prose-backed; image 3 is the outlier.\n- **Size cues**: prose says 3 m body plus 1 m tail; the comic panel shows one beside a hutt and a\n  humanoid and it is roughly humanoid-length-plus. Not a giant.\n- **Prose vs images**: tail \"stretched up onto their necks\" is clearer in images as a spike ridge\n  running from tail tip over the back to the neck. Invisibility/Force abilities are not depicted.", "must": "- [ ] Heavy sprawling quadrupedal lizard (iguana/komodo build) with a thick tail about as long as the body\n- [ ] Double row of conical spikes running from the tail tip along the back and rising into a spiky crest on the neck behind the head\n- [ ] Green scaly hide (olive to bright green) with a paler cream underside\n- [ ] Wedge-shaped crocodilian head with many sharp bared teeth and small horn-spikes on the snout\n- [ ] Large long curved claws on all four feet\n- [ ] Red/salmon throat dewlap (image 1 only; optional)", "ruling": "", "base": "", "imgs": ["img/69d1d551bedbb52e2641.webp", "img/55509769f1eb3fe6dd47.webp", "img/ad8380b9492133e5fc04.webp", "img/b1ad81fa78c8dbf06e5e.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Hssiss, RSW_Hssiss", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Hssiss", "label": "hssiss", "description": "Hssiss (or \"dark side dragons\") were a poisnous reptile native to the planet Ambria. They were slow but aggressive ambush predators that preferred to live near bodies of water. Hssiss could be found all over the galaxy, especially on worlds where the \"dark side\" was strong (with most being descended from those brought by the many historical \"Sith\" armies).", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Hssiss"}, "group": "Fauna"}, {"id": "RSW_Klorslug", "kind": "fauna", "label": "K'lor'slug", "effect": "fauna \u00b7 added by the mandrake.rut.patches layer \u00b7 commonality 0.4 \u00b7 2 picture set(s) across 2 graphics", "tier": "canon", "tierText": "canon Star Wars creature (has a canon-library entry)", "canonTag": "", "flags": [], "prefillShort": "what the game shows now (no pick of yours)", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to what the game shows now", "prefillSource": "inferred", "contested": true, "inferred": true, "prefillPicks": {"swanimals/Klorslug/Klorslug_j": "B"}, "graphics": [{"key": "swanimals/Klorslug/Klorslug", "res": "swanimals/Klorslug/Klorslug", "role": "body", "primary": true, "facings": ["south", "east", "north"], "prior": null, "cols": [{"kind": "live", "faces": {"east": "58d657d0446ed2dfaaf4d223e1884131a76ba26f5f8200cb8e4f521e600fef1c", "north": "811a513c344626a8ecd101fb4a2824edf62008f7ac1a2de30f1f6baa7e0b64ed", "south": "f737102f185e41b879c83a52b5dd29164169f64220e50972f52e3d00e084497d"}, "label": "IN GAME \u2014 SWBestiary", "detail": "load index 606 (last loaded, wins) \u00b7 bytes from 74e9d49534 2026-09-17: MLIE_FAUNA_ABSORPTION_1 Pass 14: port KraytDragon, KowakianMonkeyLizard, Klorslug (48 -> 45 remaining)", "winner": true, "also": ["history SWBestiary 2026-09-17 \u2014 74e9d49534 2026-09-17: MLIE_FAUNA_ABSORPTION_1 Pass 14: port KraytDragon, KowakianMonkeyLizard, Klorslug (48 -> 45 remaining)", "donor original \u2014 mlie.starwarsanimalcollection \u2014 load index 297 (shadowed by a later mod) \u00b7 mlie.starwarsanimalcollection \u00b7 AssetBundle extract"], "letter": "A", "purgeable": false, "short": "IN GAME \u00b7 SWBestiary"}]}, {"key": "swanimals/Klorslug/Klorslug_j", "res": "swanimals/Klorslug/Klorslug_j", "role": "body", "primary": false, "facings": ["south", "east", "north"], "prior": null, "cols": [{"kind": "live", "faces": {"east": "759785b9f1aac293558eae7bf9fb673275f7113ea161ad8a57b361554a2adf2a", "north": "528d4d2a5e5c2ea88d3d22fd05aa6b951b23315b929695ea3c9574da6e170cec", "south": "86fc678727085a8f4e96ad2b354d9ca1e031a7ad333e6ae62257c1db8443c944"}, "label": "IN GAME \u2014 SWBestiary", "detail": "load index 606 (last loaded, wins) \u00b7 bytes from 74e9d49534 2026-09-17: MLIE_FAUNA_ABSORPTION_1 Pass 14: port KraytDragon, KowakianMonkeyLizard, Klorslug (48 -> 45 remaining)", "winner": true, "also": ["history SWBestiary 2026-09-17 \u2014 74e9d49534 2026-09-17: MLIE_FAUNA_ABSORPTION_1 Pass 14: port KraytDragon, KowakianMonkeyLizard, Klorslug (48 -> 45 remaining)", "donor original \u2014 mlie.starwarsanimalcollection \u2014 load index 297 (shadowed by a later mod) \u00b7 mlie.starwarsanimalcollection \u00b7 AssetBundle extract"], "letter": "B", "purgeable": false, "short": "IN GAME \u00b7 SWBestiary"}]}], "thumbs": {"58d657d0446ed2dfaaf4d223e1884131a76ba26f5f8200cb8e4f521e600fef1c": "img/58d657d0446ed2dfaaf4.webp", "811a513c344626a8ecd101fb4a2824edf62008f7ac1a2de30f1f6baa7e0b64ed": "img/811a513c344626a8ecd1.webp", "f737102f185e41b879c83a52b5dd29164169f64220e50972f52e3d00e084497d": "img/f737102f185e41b879c8.webp", "759785b9f1aac293558eae7bf9fb673275f7113ea161ad8a57b361554a2adf2a": "img/759785b9f1aac293558e.webp", "528d4d2a5e5c2ea88d3d22fd05aa6b951b23315b929695ea3c9574da6e170cec": "img/528d4d2a5e5c2ea88d3d.webp", "86fc678727085a8f4e96ad2b354d9ca1e031a7ad333e6ae62257c1db8443c944": "img/86fc678727085a8f4e96.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/klorslug", "brief": "Viewed 2026-10-04. Image 1 is canon (a comic panel: a k'lor'slug crushing Jango-era Mandalorian\narmour); images 2-4 are LEGENDS (a painted plate, a concept painting, an SWTOR kitchen render).\nThe images split into TWO very different looks -- the canon and Legends versions do not match.\n- **Canon (image 1)**: ORANGE-RED (not pink -- the prose says pink; trust the image, with the\n  caveat that comic colouring varies) tubular, segmented, centipede/caterpillar body, thick and\n  ringed, studded with small blunt bumps/spikes. The front rears up and holds 4+ pairs of\n  thick multi-jointed limbs with big pale-tan curved claws like a mantis/lobster. The head is\n  a round blunt mouth-disc: a circular maw ringed with large pale conical teeth and wrinkled lips,\n  with a pair of small dark eyes above it. Back half stays low on stubby clawed legs.\n- **Legends concept (image 3)**: a dark RED-and-purple armoured thing with the same plan: segmented\n  ringed body, a hunched front raised up with the toothed circular maw hidden among spiky ridges,\n  and 8-10 long curved glassy blue-violet CLAWS (translucent, glossy, sword-like) along the sides. A\n  long banded tail ends in a bulb with small spikes.\n- **Legends SWTOR (image 4)**: the same red-banded, many-clawed body lying dead and long (longer\n  than a counter), segmented back plates, 6-8 long steel-blue claws along each side, a tapering\n  tail with ringed segmentation -- the clearest picture of the whole body plan.\n- **Image 2 (Legends plate)**: shows a pale bony angler-fish-like creature on a beach and a huge\n  armoured segmented crustacean limb in the foreground -- caption says k'lor'slug faces a Kirithin;\n  it is NOT obvious which is the k'lor'slug (the armoured brown segmented body with clawed limb\n  appears to be it); treat as ambiguous, low-confidence evidence.\n- **Size cues**: the canon panel shows it wrapping around a grown humanoid (body about humanoid\n  height when reared); the SWTOR render lies longer than a kitchen counter, roughly 2-3 m.\n- **Prose vs images**: \"pink, tubular beasts, suction cup-like mouths and sharp teeth, clawed\n  multilimbed\" -- tubular, clawed and multilimbed and toothed circular mouth are confirmed;\n  pink is not (orange-red in canon art, deep red in Legends).", "must": "- [ ] Long thick tubular segmented worm/centipede body with a ringed banded back\n- [ ] Round circular maw with concentric/ringed sharp teeth at a blunt front end\n- [ ] Many thick limbs ending in large curved claws (pale tan in canon art, glassy blue-violet in Legends)\n- [ ] Orange-red body (canon art) with small blunt bumps/spikes on the segments\n- [ ] Rears up in front on its claw limbs, back end low with a tapering tail", "ruling": "", "base": "", "imgs": ["img/8d6c196adfe46919b9e8.webp", "img/aa18da8862a66500f8dc.webp", "img/666a782ac44defc852a1.webp", "img/384f9d82fbd2690c9cdc.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Klorslug, RSW_Klorslug", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Klorslug", "label": "k'lor'slug", "description": "K'lor'slugs were poisonous vermiforms native to the swamps of planet Noe'ha'on, but could be found in sizable populations on other worlds (including Korriban and Taris). They were known to invade the darkest spots on unsanitary space vehicles and breed (aiding in their spread to new planets). Because of their notoriety as an aggressive and deadly species (especially among the spacers who encountered them aboard their starships) they were used as a holomonster playing piece in the popular strategy game, dejarik.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Klorslug"}, "group": "Fauna"}, {"id": "RSW_Kinrath", "kind": "fauna", "label": "Kinrath", "effect": "fauna \u00b7 ad  under the scene's warm dark lighting. Matches the\n  \"long-necked mantis-like\" read.\n- `wookieepedia_legends_infobox_viperkinrath.png` \u2014 the Legends species\n  infobox image (a rendered 3D model, likely from a later KOTOR-related\n  game asset). Shows the same body plan cleanly and in neutral lighting:\n  **yellow-tan base with rust/reddish-brown mottling**, an upward-curving\n  segmented neck ending in a small mantis-like head, four extremely long\n  jointed legs with clawed/pointed tips, NO visible eyes-cluster or flower\n  organ. This is the strongest clean color+shape reference for the\n  Legends/KOTOR design and confirms \"light yellow-brownish\" from the text.\n- `wookieepedia_currentcanon_netcaster_infobox.png` \u2014 Bad Batch \"Tribe\"\n  render, front-on: confirms the flower organ (orange/red, six petals,\n  positioned below a head bearing **six black eyes in a tight cluster**),\n  golden-tan chitin, dense mossy Kashyyyk forest setting with webbing\n  visible. This is the strongest reference for the current-canon \"netcaster\"\n  design and its two features absent from the KOTOR model (flower organ,\n  eye cluster).\n- `wookieepedia_currentcanon_netcaster_rear.png` \u2014 same creature from\n  behind: confirms the spoon-shaped body silhouette (narrow at top, wider\n  toward the rear) and dark horizontal banding/stripes across the\n  abdomen, matching the text description exactly.\n- `unfinished_tcw_netcasters_conceptclip.png` \u2014 leaked clip from the\n  cancelled *Clone Wars* episode, three creatures shown: bright\n  **yellow-gold**, more upright/standing posture than the final Bad Batch\n  version, small mandibles visible on the nearest one, the six-eye cluster\n  already present on the two further back. Useful as a third data point\n  confirming yellow/gold as the stable base color across every design\n  iteration, but its posture is closer to upright-standing than either the\n  KOTOR original or the final low-slung \"Tribe\" version \u2014 a third,\n  intermedia", "must": "- [ ] Base colour is warm yellow/gold/tan-brown \u2014 no blue anywhere on the body\n- [ ] If depicting the current-canon \"netcaster\" design: six black eyes in a tight cluster above a six-petaled flower organ\n- [ ] If depicting the current-canon \"netcaster\" design: spoon-shaped body (narrow at top, wider toward the rear) with dark horizontal banding across the abdomen\n- [ ] If depicting the KOTOR/Legends design: a long, upward-curving segmented neck ending in a small mantis-like head, with no flower organ and no eye cluster\n- [ ] Four long, thin, multi-jointed legs (true of both design lineages)\n- [ ] Not confused with Wyyyschokk \u2014 no blue-grey body and no abdomen cross marking", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `unfinished_tcw_netcasters_conceptclip.png`\n\n> \"https://www.starwars-holonet.com/holonet/images/5/5e/16407/crea_kinrath_nc_1.webp more like that. Same as 2 and 3.\"", "base": "", "imgs": ["img/de35602ad973043e6a01.webp", "img/ab805ffcacd211d983ee.webp", "img/800a5cc0a4c21d81144d.webp", "img/8ac83cd1f38b50eadb46.webp", "img/4d453a90a0f26c968c68.webp"]}, "letters": ["A", "B", "C"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Kinrath, RSW_Kinrath; artpipe jobs on record: canon_kinrath_v1, kinrath_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "https://www.starwars-holonet.com/holonet/images/5/5e/16407/crea_kinrath_nc_1.webp more like that. Same as 2 and 3."}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Kinrath", "label": "kinrath", "description": "Kinrath were a species of large, non-sentient arachnoids found on Dantooine, Kashyyyk, and several other planets. Kinrath had four legs and re the pincers/claws, not extra heads, but they look like heads. (Prose: \"spiked\n  pincers and powerful mandibles with a pair of tentacles near them\".)\n- **Tentacles (loud)**: TWO long thin, dark, smooth whip-like tentacles with pale underside whip\n  out from the shoulders/front of the torso and curl in big loops through the air and on the ground;\n  they are much longer than the body (Legends text: poisonous barb tip, not visible).\n- **Carapace**: ridged, spiky, leaf-like plates stacked over the back, shoulders and legs, all\n  jagged; underbelly paler, softer and scaly.\n- **Colour**: green throughout -- olive/moss green (Legends painting), brighter yellow-green (comic),\n  mid dark green (canon plate); pale grey-cream underside and joints; tentacles darker brown-black.\n  Eyes small and red.\n- **Size cues**: comic shows it towering over armed adult humans and flinging them; \"tall beasts\".\n- **Prose vs images**: matches -- spiked carapace, pincers, tentacles. The queen/hive are not shown\n  in any image.", "must": "- [ ] Tall spidery insectoid on long stiff spear-like stilt legs, compact torso slung low between them\n- [ ] Jagged ridged carapace of spiked leaf-like plates in olive to moss green, with a paler soft underbelly\n- [ ] Small spiked wedge head with a toothed round maw and small red eyes\n- [ ] Two spiked pincer-arms held up beside the head (they read as extra heads)\n- [ ] Two long thin dark whip-like tentacles with pale undersides looping out from the shoulders, longer than the body", "ruling": "", "base": "", "imgs": ["img/3942c6c5d00b3c61ab1a.webp", "img/bf8af2c8b165a3ab5973.webp", "img/6f93c801ec130106be0c.webp", "img/ebb4de73c73b5324dcc3.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Lylek, RSW_Lylek", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09 the flanks, rump and the upper legs (horizontal stripes on the body, rings on the legs), cream belly, throat and cheeks. The tiny canon_2 still shows an uniform brown-tan young animal without stripes (lower quality, soft).\n- **Skin/fur**: short, thin, smooth, hair-like coat, almost naked skin with fine wrinkles at joints, no mane or long fur.\n- **Head**: a long, drooping, tapir-like snout with a pale muzzle, a thick lower lip, a small blunt horn at the tip of the snout (in the CG render a short horn on the nose and two short pointed ears with a small horn nub or ear tuft at the back of the head); small dark eyes, red in the Legends copy.\n- **Feet**: broad, clawed toes (three or four visible) on each foot, like a tapir's, and a short tail tuft.\n- **Young**: smaller copies of the adult with the same stripes and a short upright snout horn; litters are shown as a line of piglet-sized young.\n- **Disagreement**: text says they have 'skin' and sharp claws and small horns on snouts (images agree); Legends says semi-aquatic (no web or aquatic features shown).", "must": "- [ ] Stocky barrel-bodied, stubby-legged tapir/rhino-like quadruped (about 1.1 m shoulder)\n- [ ] Two-tone coat: sage-tan back, orange-rust flanks, cream belly, with cream bands across flanks, rump and legs\n- [ ] Short smooth hair, near-bare wrinkled skin, no mane\n- [ ] Long drooping snout with a small blunt horn at the tip and short pointed ears\n- [ ] Broad clawed toes, very short tail", "ruling": "", "base": "", "imgs": ["img/e1949766180cda5ac23b.webp", "img/49f9d91227c007838072.webp", "img/ecdaba2033ba42ef3344.webp", "img/8ec7de62519a2f49eeb9.webp"]}, "letters": ["A"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Mott, RSW_Mott", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "R 6705e2.webp", "454b124b9892052ba9e210acca1116af25e290461e745108a4f460a18276ce54": "img/454b124b9892052ba9e2.webp", "94337b21463b22cd31ae2520a57031fa46984d47dcd1cd4a42dedfcd3099bc09": "img/94337b21463b22cd31ae.webp", "32a2409950576da1c1313ea707b12e79792be9bbca2b7fbcd60139ec8252066d": "img/32a2409950576da1c131.webp", "bb31936d090a504a8a3c3fdb3096792b6284d7e6ba9f63077d763b63a0831bc0": "img/bb31936d090a504a8a3c.webp", "2c70ed792c2fa6111362bc59a464cbfdd0c2cd9bdacdd8f8a7310a1c96fa0167": "img/2c70ed792c2fa6111362.webp", "9006f37f9c6b7b3fca57cdba873c5106ce5955695342a46a6ad14484e0e9a5e0": "img/9006f37f9c6b7b3fca57.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/nuna", "brief": "The three candidate images (all official render/promotional art of the\nanimal itself, not food shots) are internally consistent with each other but\n**disagree sharply with the \"bird\" / \"swamp turkey\" framing in the text**.\nNone of the three shows anything resembling feathers, a beak, wings, or a\nturkey-like silhouette. What they actually show is a squat, hunched,\n**toad- or turtle-like amphibian/reptile**: a heavy domed/ridged shell-like\nback rising into a peak, a wide froglike head with a broad flat mouth and\nbulging pink or amber eyes, floppy skin flaps hanging at the sides of the\nhead (read as loose jowls/wattle, not ears), thick bent hind legs ending in\nclawed toed feet, and mottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on any of the three images, across two\ndifferent render styles and two different eras of official art. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or wattle rather than a wing. It is far more simplified and\nflat-cartoon-shaded than any candidate image (RimWorld's chunky low-detail\nart style, no visible skin texture or individual toes), and it omits the\nvisible hind legs / froggy stance entirely \u2014 the sprite reads as a rounded\nblob-with-a-face rather than a standing biped \u2014 but the *silhouette family*\n(squat, hunched, domed-backed, green, toad/turtle-adjacent, not bird-like)\nis a genuine match to canon, which is not true of every creature audited so\nfar in this library.", "must": "- [ ] Heavy domed/ridged shell-like back rising to a peak\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing\n- [ ] Mottled olive-to-dark-green pebbled/warty skin \u2014 no feather texture, beak or wings anywhere", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "base": "", "imgs": ["img/7f5a1b03b56e88bce921.webp", "img/b8fc8a62f6e3d7b1bc49.webp", "img/a502c7cabfbb362a4fa7.webp"]}, "letters": ["A", "B", "C", "D", "E"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: Nuna, RSW_Nuna; artpipe jobs on record: desert_swaca_nuna, pyrelands_nuna_female_v1, pyrelands_n u2014 a small flat cartoon icon in tan/khaki/gold\n  with a bony reptilian-looking head; this reads as a generic wiki\n  species-icon illustration rather than accurate canon color and visibly\n  UNDERSELLS the blue plumage the text describes \u2014 exactly the failure mode\n  this library exists to catch. Keep it only as a cautionary example, not a\n  reference to render from.\n- `swg_toxic_pekopeko_mount.jpg` \u2014 in-game screenshot from *Star Wars\n  Galaxies* of the mutated \"Toxic peko-peko\" mount: reddish/rust-orange\n  plumage on a winged reptavian body. Per the source text this is an\n  explicitly MUTATED variant (bred by an outlaw for toxin/aggression), so its\n  red-orange color is not representative of a baseline peko-peko \u2014 it is\n  useful for body plan (wings, clawed feet, elongated beak) but the color\n  should be disregarded for a baseline render.\n\n**Net read: render blue** (`wookieepedia_battlefront2_painting.jpg` is the\ntarget), peacock/macaw-style plumage, long trailing tail feathers, clawed\nwings, a strong hooked/nut-cracking beak. The gray model gives the cleanest\nbody-plan silhouette. The tan icon and the red mutant screenshot are both\noff-canon for color and should not be used as color references.", "must": "- [ ] Peacock-blue wing and tail plumage \u2014 not drab, tan, or reddish-orange\n- [ ] Small yellow/gold head crest\n- [ ] Long trailing tail feathers with pale gold edging\n- [ ] Long, S-curved neck and an elongated, toothy-looking beak/skull\n- [ ] Clawed wings, foldable close to the body", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_fieldguide.jpg`\n\n> \"Follow #3 closely.\"", "base": "", "imgs": ["img/2846343299c97b3679f7.webp", "img/c26d59f795ffa2aa2017.webp", "img/d84064c17a455d43c3ba.webp", "img/7423963af562c182c5bb.webp"]}, "letters": ["A", "B", "C", "E"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: PekoPeko, RSW_PekoPeko; artpipe jobs on reco o read precisely (chibi\n  proportions), though the turtle-like rounded-shell silhouette is visible.\n- `shirotrap_legends.jpg` and `shirotrap_retracted_legends.jpg` (both\n  Legends-era, captioned \"a Shiro-trap retracted into its shell\") show the\n  animal fully withdrawn \u2014 from these alone you mostly see a mottled,\n  earth-toned, dirt-and-plant-covered shell mass, consistent with the \"rolls\n  in mud, collects seeds in shell ridges\" text. Because the plant/soil\n  disguise is the whole point of a Shiro-trap, these images are **not a\n  clean read of the animal's own skin/shell color** \u2014 they show it\n  deliberately camouflaged.\n- `shiros_group_legends.jpg` (captioned as the general Legends infobox image,\n  file `Shiros.jpg`, showing multiple individuals) is the best like-for-like\n  match to the text: a group of hard-shelled, dome-backed reptiles with\n  ridged/spiny shells in duller brown-green earth tones, resting in a muddy\n  swamp setting \u2014 consistent with \"hard-shelled... native to the Gungan\n  Swamps,\" \"rolled in mud,\" omnivorous swamp reptile.\n\n**Disagreement**: the canon *Disney Infinity 3.0* art is a bright, clean\ngreen cartoon creature; the Legends reference images (uncamouflaged group\nshot) read as duller, mud-toned brown-green \u2014 but note the Legends text\nitself explicitly says the animals accumulate mud and camouflage, so a\n\"clean\" green Shiro may simply not appear undirtied in any Legends art.\n**Treat the canon infobox image (`shirodisneyinfinity.png`) as the color\nanchor** (it is the current, non-Legends canon source, and its green skin\ncolor is also independently stated in the infobox text, not just visually\ninferred) \u2014 but use the Legends group shot (`shiros_group_legends.jpg`) as\nthe anchor for **body plan and shell texture** (hard ridged/spiny dome\nshell, stubby retractable head/legs/tail, turtle-like proportions), since\nthe canon art is too low-detail/stylized to read shell texture from.", "must": "- [ ] Green skin (per the canon infobox art and text) \u2014 treat as the color anchor over the duller mud-toned Legends group shot\n- [ ] Hard, ridged/spiny dome shell covering the back\n- [ ] Stubby, retractable head, legs and tail (turtle-like withdrawal into the shell)\n- [ ] Turtle-like rounded proportions overall \u2014 not a smooth or unarmoured body", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `shiros_group_legends.jpg`\n\n> \"There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)\"", "base": "", "imgs": ["img/f2756f3129732788f2d5.webp", "img/8003243599a18a3071eb.webp", "img/7ba1243aa9a0eb4ceb1e.webp", "img/5232cd876ec65bfde5c6.webp"]}, "letters": ["A", "B", "C", "D"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: RSW_Shiro, Shiro; artpipe jobs on record: canon_shiro_v1, shiro_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}], "desc": {"def": "RSW_Shiro", "label": "shiro", "description": "Shiros were hard-shelled, benign, slow-moving reptiles native to the planet of Naboo. A Shiro's main defense was to retract its head, legs and tail into its spiny shell. The Shiro's low metabolism meant it could be transported over long journeys and understandably the species was spread to many worlds.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Shiro"}, "group": "Fauna"}, {"id": "RSW_ShiroTrap", "kind": "fauna", "label": "Shiro-trap", "effect": "fauna \u00b7 adde ame.\n\n**Net read**: golden-tan plumage with dark wing banding, bald blue-gray\nvulture-style head and legs, red beak tip \u2014 a raptor/vulture-shaped bird,\nnot a songbird. Single-source image, but it agrees closely with the sourced\ntext's \"golden-colored\" description, so treat it as reliable.", "must": "- [ ] Golden/tan-brown body plumage overall\n- [ ] Dark brown-to-black barred/banded markings across the underside of both wings and a dark chest/belly patch\n- [ ] Bald, blue-gray, vulture-like head and upper neck (no feathers on the head), with a hooked beak carrying a reddish tip\n- [ ] Blue-gray legs and talons, with four sharp curved claws per foot\n- [ ] Broad swept wings on a lean, raptor-proportioned body \u2014 a bird-of-prey/vulture silhouette, not a songbird", "ruling": "", "base": "", "imgs": ["img/e3ce3e55a5b6c4f5a6d9.webp"]}, "letters": ["A", "B", "C", "D", "E"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: RSW_Whisperbird, Whisperbird; artpipe jobs on record: canon_whisperbird_v1, desertportb_whisperbird, whisperbird_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "keep", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": ""}], "desc": {"def": "RSW_Whisperbird", "label": "whisperbird", "description": "Whisper birds were energetic avians native to the moon Yavin 4. They were known for their radiant plumage and gained their name due to their seemingly noiseless flight. They used their dexterous tongue to emit their sweet, low-pitched song or call. These traits made them popular pets with avian enthausiasts and wild populations soon appeared from escapees on numerous worlds (even on polluted worlds like Coruscant).", "source": "live de  brown to dusty pink-tan with tan warts**; `legends_1` (the film puppet) is **tan-brown**; `legends_2` is **grey-brown**. The text says \"brown, warty skin\", and the belly turns bright yellow when full. So brown is the baseline; olive-green and rose-tan are the render variants, and a yellow belly is a state change.\n- **Size:** 1.5 m tall per the text; it looks bigger than a human torso in the puppet shot.", "must": "- [ ] Squat, toad-like body hunched forward, supported on long, thin, strong forelimbs with big long-fingered hands\n- [ ] Very wide, thick-lipped, downturned mouth in a broad flat head with no neck\n- [ ] Large bulging heavy-lidded eyes (orange, amber or yellow-green) with a ridged brow patch between them\n- [ ] Two long, thin, curved palp stalks rising from the top of the head\n- [ ] Row of conical horn-like spikes around the head, over the shoulders and down the arms\n- [ ] Rough warty skin, brown as a baseline (olive-green and rose-tan variants), with a big round belly that can show bright yellow when full", "ruling": "", "base": "", "imgs": ["img/de88ef69ca76b55efcaf.webp", "img/49e2e276cfeeef6564b8.webp", "img/fba316e26b426d38d903.webp", "img/a6a9799ff9e6e231e3b2.webp"]}, "letters": ["A", "B"], "related": [], "elsewhere": [], "noArt": false, "noArtWhy": "searched by graphic and by name: RSW_Worrt, Worrt; artpipe jobs on record: desert_swaca_worrt, longshade_rsw_worrt_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "Check canon"}], "desc": {"def": "RSW_Worrt", "label": "worrt", "description": "The Worrt was an amphibious creature native to the planet Tatooine, though they could also be found on other worlds (including Nal Hut          a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->

<div id="zoom"><div><div class="box"><img id="zimg" alt=""></div><div class="cap" id="zcap"></div></div></div>

<div id="keys">
  <h3>Keyboard</h3>
  <table id="keysBody"></table>
  <div class="sub" style="margin-top:10px">Esc closes. Keys are ignored while typing in a note.</div>
