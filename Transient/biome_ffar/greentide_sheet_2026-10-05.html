<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
/* true size: the picture AT its real display size beside a reference of known size, on its real background */
.tsize{display:flex;align-items:flex-end;gap:14px;padding:6px 8px 2px;border-radius:5px;margin-top:5px;
  width:max-content;max-width:100%;overflow-x:auto;border:1px solid var(--line)}
.tsize figure{margin:0;display:flex;flex-direction:column;align-items:center;flex:none}
.tsize figcaption{font-size:10.5px;color:#e8e2d4;text-shadow:0 0 3px #000;margin-top:2px}
.tsbox{flex:none}
.tsbox img{width:100%;height:100%;object-fit:fill;display:block}
.tsbox.noimg{border:1px dashed #e8e2d4;box-sizing:border-box}
.tssrc{font-size:10.5px;color:#8b95a3;margin-top:2px}
.tssrc.none{color:var(--warn)}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>

er ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The flat purple Galactic Atlas drawing (`beldon_wookieepedia_1.jpg`) was deleted, as this entry's own ruling already ordered. The canon reference is the painted Wildlife of Star Wars field-guide plate `wookieepedia_woswfg.webp` (no live-action beldon exists); render it far more realistically than either that plate or the donor sprite.\n\nWhat `wookieepedia_woswfg.webp` shows:\n- **Body:** a huge cluster of several rounded, swollen, translucent-looking **orange-to-peach gas bladders**, each with paler highlights, fine dark speckling and a puckered, frilled crown \u2014 lumpy and organic, like a bunch of inflated sacs, not one smooth balloon.\n- **Fins:** broad, thin, ragged orange membranous fins/flaps projecting sideways from the bladder cluster.\n- **Underside:** a dense reddish-brown knobbly mass under the bladders, from which hangs a curtain of long, thin, dark tendrils.\n- **Herd:** smaller individuals drift below the large one at a distance \u2014 same shape at reduced size.\n\nThe colour question is settled: **orange** (infobox text, the woswfg plate and the donor sprite all agree); the purple was a one-off stylised drawing. The canon 0.8\u201310 km size is unrenderable at sprite scale (see Engine limits).", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `wookieepedia_woswfg.webp`, the infobox text and both owner rulings in `## ruling` below.*\n- [ ] BODY PLAN: a floating creature with no legs and no head: a lumpy cluster of several rounded, swollen gas bladders, each with a puckered, frilled crown (a bunch of inflated sacs, not one smooth balloon); broad, thin, ragged membranous fins projecting sideways from the cluster; a dense knobbly mass beneath, from which hangs a curtain of long, thin tendrils\n- [ ] COLOUR LAYOUT: bladders orange-to-peach with paler highlights and fine dark speckling; fins orange; the knobbly underside mass reddish-brown, darker than the bladders; hanging tendrils dark, the darkest element\n- [ ] Orange colouring, never purple/lavender (owner ruling 2026-10-08: \"Totally ignore the weird purple drawings you currently have as the canon database entry\")\n- [ ] Silhouette follows the donor sprite and the woswfg plate it came from (owner ruling 2026-09-14: \"I think this is a pretty good rendition of it ... please see that and reproduce it rimworld-style\")\n- [ ] Realistic rendering: natural translucent, moist membrane texture and soft atmospheric lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"Please realize that in a much more realistic manner\")\n- [ ] NEGATIVE: not a jellyfish or a single smooth bal", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `donor_current_sprite.png`\n\n> \"The images for the source material are all over the place. I think this is a pretty good rendition of it. https://static.wikia.nocookie.net/starwars/images/b/bc/Beldons-woswfg.jpg/revision/latest?cb=20070123191252 was clearly its inspiration, please see that and reproduce it rimworld-style.\"\n\n**RULED** (owner, 2026-10-08, Greentide sheet 2026-10-05): the canon image is `wookieepedia_woswfg.webp` (https://static.wikia.nocookie.net/starwars/images/b/bc/Beldons-woswfg.jpg); the purple `beldon_wookieepedia_1.jpg` is to be ignored entirely. Verbatim:\n\n> \"This is a tricky one. Please regenerate the Canon creature based on the current donor art. I know it's low quality.  It comes from here, and you should add this as the ", "base": "", "imgs": ["img/3ad5712897dba9164dc3.webp"]}, "letters": ["H", "J", "A"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Beldon, n the snout, and keep the orange-with-cream-\nunderside palette and dorsal crest.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `wookieepedia_sot_art.png` as read by the visual brief, the canon/Clone Wars wiki text (crest, three nostrils, tusks, blade tail), and the `## ruling` below.*\n- [ ] BODY PLAN: a tall (2.5\u20133 m), long-legged, horse-like four-legged reptilian runner \u2014 deep muscular chest, long thin legs ending in rounded hoof-like pads, a long upright neck, long-snouted head \u2014 not a low-slung lizard and not a biped\n- [ ] COLOUR LAYOUT: smooth rust-orange hide over the body with darker reddish shading along the back and a paler tan underside; eyes purple\n- [ ] Large ridged fan-like crest sweeping back from the crown of the head (text: the crest runs the animal's length)\n- [ ] Long snout (text: sharp teeth and two lower tusks)\n- [ ] Wide, curling, blade/fin-like tail tip\n- [ ] Realistic rendering: natural smooth reptile-skin texture and muscle under real lighting, no outlines, no cartoon shading\n- [ ] Owner rulings carried: 2026-09-14 picked the *Stay on Target* art and noted \"But the Donor mod really isn't too bad this time.\" (palette and crest, per the brief); 2026-10-04 on the redo: \"Canon shows somthing more like C. We need a high quality version of that. Look at Canon please.\" (C = the sail-crested orange dalgo render `pyrelands_dalgo_v1`)\n- [ ] NEGATIVE: not a dachshund-shaped low stocky quadruped wit", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_sot_art.png`\n\n> \"But the Donor mod really isn't too bad this time.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Dalgo/Dalgo`:\n\n> \"Canon shows somthing more like C. We need a high quality version w takes \"#2 for coloration and glowing-seeming spots\" \u2014 #2 in that sheet's order (donor, huntforziro, visualencyclopedia, mandalorianandgrogu) is the animated Clone Wars `wookieepedia_huntforziro.jpg` \u2014 and \"seriousness of #3\", the flat Galactic Atlas illustration `wookieepedia_visualencyclopedia.jpg`. Both stay because he named them; no cartoon image was removed. Take only colour/spots and attitude from them, never their shading.\n\nRealistic sources added/kept:\n- `wookieepedia_concept_jfo.jpg` \u2014 *Jedi: Fallen Order* (Respawn) painted photoreal concept sheet, four variants with a stormtrooper for scale. This is the best realistic match for the owner's ruled look: a long, low, crocodile-like QUADRUPED with short splayed clawed limbs, a narrow toothy gharial-crocodile snout with fangs projecting outside the jaw, a dorsal row of short spines, a very long tapering eel-like tail (some variants with a fin or spined fan at the tip), dark olive-to-slate scaly hide with moss/algae patches, a pale ridged ventral belly, and \u2014 in the third variant \u2014 scattered bioluminescent yellow-green spots plus a glowing throat sac. Length several times a human.\n- `wookieepedia_mandalorianandgrogu.jpg` \u2014 *The Mandalorian and Grogu* (live-action film, realistic CGI): a gigantic pale bone-white LIMBLESS serpent with an eyeless skull-like head and long venom-dripping fangs. Realistic, but disagrees loudly with everything else on colour and limbs.\n\n**Where they disagree:** the realistic concept art and the ruled images agree on dark olive with glowing green spots and a toothy crocodilian head; the film creature is pale and limbless. The owner's ruling picks the olive/glowing-spot look; render it with the concept sheet's realistic wet scaly hide, not the animated flat colour.\n\n- `donor_current_sprite.png` (our own sprite): tan/khaki quadruped with small clawed limbs, dark spots, gator-like head \u2014 body plan agrees with the concept sheet, colour does not.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Jedi: Fallen Order concept sheet as described in the visual brief and the `## ruling` below (owner ruling 2026-09-14: \"#2 for coloration and glowing-seeming spots. But much less cartoonish, more like seriousness of #3.\").*\n- [ ] BODY PLAN: a long, low crocodilian quadruped body with short splayed clawed limbs and a very long tapering eel-like tail, the tail making up a large share of the total length; head held low and forward\n- [ ] Narrow toothy crocodile/gharial snout with fangs projecting outside the jaw\n- [ ] COLOUR LAYOUT: dark olive-to-slate scaly hide over the back, flanks and tail, with scattered glowing yellow-green bioluminescent spots; a pale ridged belly underneath, the lightest area of the body\n- [ ] Dorsal row of short spines along the back\n- [ ] Shown as an aquatic ambush predator, partially submerged in murky swamp water\n- [ ] Realistic rendering: wet scaly reptile hide and natural lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not the pale bone-white limbless serpent of *The Mandalorian and Grogu*; not a tan/khaki gator (the donor's colour); not flat animated Clone Wars colour (take only its colour and spots, never its shading)", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_huntforziro.jpg`\n\n> \"#2 for coloration and glowing-seeming spots. But much less cartoonish, more like seriousness of #3.\"", "base": "", "imgs": ["img/64210e06a826c0a0f58a.webp", "img/66da4d4aa86df81fc42f.webp", "img/fac29cc2f099753df619.webp", "img/de2388dc94ee51d60fe1.webp"]}, "letters": ["E", "G"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by gr elephant-like feet with short blunt dark claws.\n- **Tack (military role)**: red-brown leather saddle harness and head bridle carrying shield-generator hardware.\n\n**Where the deleted images disagreed**: the pencil plate showed a much brighter yellow-green hide with a white belly and reddish eyes, and a lankier upright browsing pose; the comic icon showed dark saturated olive with warty spots. The realistic renders are duller olive-khaki with fine pebbled scales \u2014 trust them.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the three realistic CGI images (`factfile`, `shieldgenerator`, `herd`) and the canon text.*\n- [ ] BODY PLAN: a broad, heavy, low-slung sauropod/iguana-like quadruped with a deep chest; a short thick neck held forward and low; four thick pillar legs with heavy wrinkled skin folds at the joints; a long tapering tail\n- [ ] COLOUR LAYOUT: olive-khaki to greenish-tan hide over back and flanks with darker olive mottling; paler grey-cream underside, throat and inner legs\n- [ ] Hide: a fine raised pebbly/cobbled scale pattern (gila-monster or crocodile-belly texture), not smooth skin\n- [ ] Head: broad, blunt and heavy-browed with a wide lipless mouth, small fangs at the front of the upper jaw and a short tusk jutting up from each side of the lower jaw; yellow-amber eye\n- [ ] Feet: broad elephant-like feet with short blunt dark claws\n- [ ] Realistic rendering: natural pebbled reptile hide and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a two-legged dinosaur, not a long-necked upright browser, not a smooth-skinned hippo or elephant; not the deleted plate's bright yellow-green with white belly and reddish eyes", "ruling": "", "base": "", "imgs": ["img/588adfba0447a6d52df0.webp", "img "letter": "B", "purgeable": false, "short": "IN GAME \u00b7 SWBestiary", "setId": "2d9c979e6320682c", "hint": "", "ppc": 128, "srcPx": [512, 512]}]}], "thumbs": {"7a5cb9489047ba6b5a31e31561cc4e7fc032a991740d86ad58a206a33cf1d03b": "img/7a5cb9489047ba6b5a31.webp", "2f87d1691f424f5a94c771da9a2f5736de997fc19c67d656a1b1368c017fc111": "img/2f87d1691f424f5a94c7.webp", "c9d531f1970eb65b59c274a7335d5343d1d9657bf5e5d04b967abd5358597a60": "img/c9d531f1970eb65b59c2.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/gelagrub", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"** The saturated painted Legends plate (`wookieepedia_legends_2.webp`, `Gelagrub-GAW.jpg`) was deleted. Both remaining images are realistic: `canon_1` is the photoreal Databank CGI render with a clone trooper rider; `legends_1` is a *Revenge of the Sith* live-action film still on Felucia. Both show the LARVAL/mount form.\n- **Silhouette**: a fat, soft, caterpillar/grub-like slug. Long low barrel body, blunt rounded front\n  with NO neck, tapering to a smaller rump. Sized so a full armoured trooper sits on its back like a\n  saddle-beast (roughly dewback/bantha-pony scale, per the riders).\n- **Head/face**: the front end is a bulbous face with a wide, drooping, lipless mouth (open, dark\n  inside) at the bottom and TWO round black eyes stacked vertically on the side of the head (one above\n  the other, per Legends text, confirmed in both images; they sit on a raised, wrinkled brow\n  mound). Wrinkled leathery folds around the mouth and brow.\n- **Legs**: stubby, thick, soft cylindrical leg-stumps in rows under the belly (canon image shows\n  roughly four/five visible per side, short and blob-ended, not jointed); the body hangs low, almost\n  dragging.\n- **Back/colour**: dark teal-green to grey-green flanks and head, with the back a segmented ridge of\n  glossy, translucent BLUE panels (bright cobalt/electric blue in both the render and the film still).\n  Underside and face greener/greyer. (The deleted painted plate showed a far more saturated\n  blue-purple back with lime-green flanks \u2014 do not use that.)\n- **Texture**: smooth, wet, gelatinous, semi-translucent skin with a glossy sheen over the blue back;\n  wrinkles at the face; no hair, no hard shell (the hard mirrored carapace belongs to the adult form,\n  NOT shown in any image).\n- **Prose vs images**: canon prose says \"five pairs of legs\" and \"dark green with blue splotches\";\n  images show dark green with a large contiguous glossy blue segmented back, not scattered\n  splotches. The deleted painted plate added spiky green dorsal ridges on the flanks -- not seen in canon or film; omit them.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both realistic images (`canon_1` Databank CGI, `legends_1` ROTS film still), both showing the larval/mount form, and the canon/Legends text.*\n- [ ] BODY PLAN: a fat, soft caterpillar/grub body, long and low, with a blunt rounded front and no neck, tapering to a smaller rump; rows of short thick soft leg-stumps (not jointed) under a low-hung, almost dragging belly; large enough to carry a mounted armoured humanoid on its back\n- [ ] COLOUR LAYOUT: dark teal/grey-green flanks, head and underside; the back a contiguous segmented ridge of glossy translucent bright cobalt-blue panels, the brightest element\n- [ ] Face: a bulbous front with a wide drooping lipless mouth at the bottom and two round black eyes stacked vertically on the side of a raised, wrinkled brow mound\n- [ ] Smooth, wet, gelatinous, semi-translucent skin with a glossy sheen; no fur and no hard shell (larval form)\n- [ ] Realistic rendering: wet translucent gelatinous skin and natural lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a hard-shelled beetle (that is the adult, shown in no image), not a jointed-legged insect; no spiky green dorsal ridges and no saturated blue-purple back with lime flanks (the deleted painted plat", "ruling": "", "base": "", "imgs": ["img/3c162262297be12804a8.webp", "img/35433b062cf682a630d3.webp"]}, "letters": ["B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": true, "noArtWhy": "searched by graphic and by name: Gelagrub, RSW_Gelagrub", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "feverwood_sheet_2026-10-05", "note": "follow canon precisely"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "feverwood_sheet_2026-10-05", "note": "follow canon precisely"}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "see notes from feverwood"}, {"at": "2026-10-09", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": ""}, {"at": "2026-10-09", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": ""}], "desc": {"def": "RSW_Gelagrub", "label": "gelagrub", "description": "Gelagrubs, also known as 'Felucian ground beetles', were large insectine creatures native to Felucia. This variety (with some genetic tweaking) found themselves popular for export to many Rimworlds because they remained in their useful grub-like state for their entire lives whilst also swapping out their normal phosphorescence for neutroamine production.", "source": "live def dump 2026-10-04 \u00b7 ThingDef RSW_Gelagrub"}, "scale": {"status": "measured", "source": "live de IN GAME \u00b7 SWBestiary", "setId": "347ef5106ff67bf3", "hint": ""}]}], "thumbs": {"974b7c73e1b7b590028d338fb29c6c37357eeedf68a140d1a29b1ebc5149fe9f": "img/974b7c73e1b7b590028d.webp", "22504283ae7eb467f1b320af323201436b8e74ee14917576ca22d02ebcdbbc14": "img/22504283ae7eb467f1b3.webp", "f54b6f747c50e2f26ed741111b03f07b7e07c07b5c1da2adfb1d100ac28b9ecb": "img/f54b6f747c50e2f26ed7.webp", "6bca3a6c5e7664deefc06104dc58afb94011aa76797fd0bf1662e55f792b2d0a": "img/6bca3a6c5e7664deefc0.webp", "1172ecf05b7536934c187a7b4ecfc50abe109c200cbbac3e53bc16a7857b30bd": "img/1172ecf05b7536934c18.webp", "a2d1e6d4121300f1097d61e538e927369bad217661c36c1f900f7e33770eb133": "img/a2d1e6d4121300f1097d.webp", "d7782c51cc7ffc05e9fcf8afeff7992e2a24afe3befb5c657129c75b4e645158": "img/d7782c51cc7ffc05e9fc.webp", "75d6ab0e1513535b1406197a799dc9c0085acef9f13d559ae79aa825f043c04a": "img/75d6ab0e1513535b1406.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/gizka", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\n\n**Animation-only canon \u2014 no realistic source found (searched: Wookieepedia `Gizka` and `Gizka/Legends` page images, \"Images of gizka\" category \u2014 every depiction is the 2003 *Knights of the Old Republic* game model, its painted concept art, a *Disney Infinity 3.0* toy figure, or a Wizards.com card illustration).** The images below are animated/stylised; render this creature realistically anyway \u2014 real-world anatomy, materials and lighting, not the cartoon's flat shading or exaggerated proportions. The owner's own KOTOR reference images (`owner_reference_*`) remain the authority for body plan (his 2026-09-16 ruling below); take the anatomy from them and give it real scaly reptile skin, like a small living theropod-shaped lizard, not low-poly game texture.\n\nJudged against the owner's two supplied reference images\n(`owner_reference_sideview.jpg`, `owner_reference_card.jpg`, both of the\nKOTOR in-game model \u2014 owner ruling below). Gizka is a **small bipedal\nDINOSAUR-like reptile, emphatically not a frog or toad**: a compact\ntheropod build with the **body held horizontal** over two strong hind\nlegs, and a **thick tapering tail extending behind for balance** \u2014 the\ntail is prominent in both references and is part of the silhouette. Small\nvestigial forelimbs are held tucked against the chest, never\nweight-bearing. The **head** is oversized relative to the body with a\n**rounded, blunt, beak-like snout**, broad fleshy cheeks, a downturned\nmouth, and a **backswept crest at the rear of the skull**. **TWO\nmodest-sized eyes sit on the sides of the head** \u2014 never a single central\ncyclops eye, and never huge bulging frog eyes dominating the face; a\nfront (south) view shows both. Hide is **scaly and mottled in tan, warm\norange-brown and olive patches** (the side-view reference reads warm\ntan-orange; the card reads greener) \u2014 never a flat colour \u2014 with paler\nskin at the belly and joints. `kotor_screenshot.jpg` shows two gizka in\nthe *Ebon Hawk* cargo hold, confirming pack/infestation behavior and a\nsize reference \u2014 roughly knee-height or smaller, a fast-breeding\nvermin-scale creature rather than a large animal.\n\nNo donor mod screenshot could be obtained \u2014 `mlie.starwarsanimalcollection`\nis not present anywhere on this machine's disk (Workshop cache or common\nMods folder), so there is no `donor_current_", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the owner's two KOTOR reference images (`owner_reference_sideview.jpg`, `owner_reference_card.jpg`), `kotor_screenshot.jpg`, and the three 2026-09-16 rulings in `## ruling` below.*\n- [ ] BODY PLAN: a small bipedal dinosaur-like reptile with a theropod build: body held HORIZONTAL over two strong hind legs, a thick tapering TAIL extending behind for balance (part of the silhouette in every facing), tiny vestigial forelimbs tucked against the chest and never weight-bearing (owner ruling 2026-09-16: \"I see clear references to bipedal and no mention of four legs.\")\n- [ ] Head: oversized relative to the body, with a rounded, blunt, beak-like snout, broad fleshy cheeks, a downturned mouth and a backswept crest at the rear of the skull\n- [ ] Eyes: TWO modest-sized eyes, one on each side of the head; a front (south) view shows both (owner ruling 2026-09-16: gizka has TWO eyes); never a single central cyclops eye, never huge bulging frog eyes\n- [ ] COLOUR LAYOUT: scaly hide mottled in tan, warm orange-brown and olive patches over back, flanks and head, never a flat colour; paler skin at the belly and joints\n- [ ] Size: roughly knee-height or smaller, a vermin-scale creature, not a large animal; east/west facings are true side profiles, not top-down\n- [ ] Realistic rendering: natural scaly reptil", "ruling": "2026-09-16, owner: \"Check your canon. I see clear references to bipedal and no\nmention of four legs. I think this is a canon error in your search.\" Upheld on\nre-inspection: the background gizka in kotor_screenshot.jpg stands wholly on\nits two hind legs, forelimbs raised; the infobox render's thin forelimbs are\nnot weight-bearing. The earlier Visual brief's \"quadruped in a sprawling\nstance\" was a misread of the foreground close-up and is superseded by the\nMust-show line above. Gizka renders BIPEDAL: two working hind legs, vestigial\nraised forelimbs.\n\n2026-09-16, owner (giz art review): gizka has TWO eyes. The south-facing\nreview renders showed a single central cyclops eye \u2014 that came from this\nentry's own earlier \"reads almost one-eyed/cyclopean\" phrasing, which the\nimage model took literal", "base": "", "imgs": ["img/003a681b515ec1b5ea27.webp", "img/928bdc04dd580c564346.webp", "img/15 09-14 ruling below picks the *Wildlife of Star Wars* watercolour `wookieepedia_legends_infobox.jpg` (and notes the hooks on the wings and feet), so it stays. `wookieepedia_legends_juvenile.jpg` (same watercolour book) also stays \u2014 it is the only image of the green juvenile and the molt. No realistic winged hawk-bat exists: the only realistic depiction is the canon *Hyperspace Lounge* prop photo (`wookieepedia_current_canon_infobox.jpg`), a wingless-looking perched purple-black creature (searched: `Hawk-bat`, `Hawk-bat/Legends`, \"Images of hawk-bats\"). Take the body plan and colours from the ruled watercolour, but render them like a real animal \u2014 leathery translucent wing membrane with visible veins, real skin texture, natural light \u2014 not watercolour wash or ink outline. The prop photo is the material reference for realistic skin (slick, finely wrinkled, dark violet).\n\nThis is a stronger case of text/image (and current-canon/Legends) disagreement\nthan usual, and three of the four candidate images line up with each other\nagainst the fourth:\n\n- `wookieepedia_current_canon_infobox.jpg` (current canon, a display prop\n  photographed for *Star Wars: Hyperspace Lounge* material) shows something\n  that barely reads as \"hawk-bat\" at all: a squat, **slug/larva-bodied**\n  creature in deep violet-to-near-black skin, a bulky snouted head with\n  small forward-curling horn-like growths, visible curved fangs, and large\n  clawed grasping forelimbs. No batlike membrane wings are visible in this\n  pose. This is a legitimate current-canon depiction but is visually\n  disconnected from everything else found for this creature \u2014 treat it as\n  the minority/outlier reference, not the target.\n- `wookieepedia_legends_infobox.jpg` (*The Wildlife of Star Wars: A Field\n  Guide* illustration) \u2014 the clearest single reference: a pterosaur-like\n  silhouette with **violet-purple dorsal wing membrane fading to\n  cream/pale-gold on the ventral side**, ribbed wing structure, a short\n  beaked head with a small forward horn and a green eye (not the ruby the\n  text names \u2014 see below), clawed wingtips, long tail. Matches the \"purplish\n  yellow-gray adult\" text closely for the wing coloring.\n- `wookieepedia_legends_juvenile.jpg` (same Field Guide source, two\n  indivi", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Legends sourced text, `wookieepedia_legends_infobox.jpg` and the `## ruling` below.*\n- [ ] BODY PLAN: a pterosaur-like reptavian flier: two broad leathery membrane wings stretched over ribbed wing-bones (wingspan about 1.5x body height), a small head with a hooked beak, and a long tail\n- [ ] Hooks: clawed hooks at the wingtips and on the feet (owner ruling 2026-09-14: \"Notable hooks on end of wings and \"feet\"\")\n- [ ] COLOUR LAYOUT: wing membrane violet-purple on the dorsal (upper) side fading to cream/pale-gold on the ventral (under) side; adult body purplish yellow-gray\n- [ ] Hooked beak (not a flat bird beak) with a small forward-curling horn-like growth on the forehead\n- [ ] Realistic rendering: leathery veined wing membrane, real skin texture and natural lighting, no outlines, no watercolour or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a feathered bird or hawk (no feathers), not a furry mammal bat; not the wingless slug/larva-bodied current-canon prop outlier; not the green juvenile colouring", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_legends_infobox.jpg`\n\n> \"Original donor mod isn't that bad, #3 is canon. Notable hooks on end of wings and \"feet\"\"", "base": "", "imgs": ["img/f04c617c60a9525fdbe4.webp", "img/c9bb113459b998d48279.webp", "img/7d6fd3701a48d755d41e.webp"]}, "letters": ["J", "Q"], "dependsOn": null, "r : "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\nRemoved: the canon Marvel comic panel (`FettKlorslug-StolenHope.png`, orange cartoon slug crushing Jango Fett) and the stylised SWTOR kitchen render (`KlorslugsKitchen-SWTOR.png`). Added the LIVE-ACTION source: the k'lor'slug is one of the stop-motion holographic dejarik pieces in *A New Hope* (`canon_2` is the full Millennium Falcon dejarik still; `canon_2_crop` enlarges the k'lor'slug, second from left). Kept: the realistic SWTOR concept painting (`legends_1`) and the Alien Anthology painting (`legends_2`). Canon also has a living k'lor'slug in *The Mandalorian and Grogu* (the Pits on Shakari), but no clear still of it was found.\n- **Live-action (the target)**: a **PINK to dusky rose-magenta**, thick, tubular, ringed/segmented worm body that rears up in a tall arch, its surface wrinkled and creased across every ring like a real earthworm or sea cucumber; a clawed limb at the base. This matches the canon prose (\"pink, tubular beasts\"), which the deleted comic had contradicted with orange.\n- **Body plan (concept painting, agrees with the prose)**: segmented ringed body with a hunched, raised front; a round toothed suction-cup maw at the blunt front end, ringed with sharp teeth; 8-10 long curved glossy claws along the sides (glassy blue-violet in the Legends painting); a long banded tail tapering to a small spiked bulb.\n- **Colour disagreement, LOUDLY**: live-action ANH and the prose say PINK; the Legends painting is deep red with purple claws; the deleted comic was orange. Use pink-to-rose as the base.\n- **Size**: canon databank height 1.98 m when reared.\n- `legends_2` (Alien Anthology) shows a k'lor'slug facing a Kirithin; it is not obvious which creature is the k'lor'slug (probably the armoured brown segmented body with a clawed limb in the foreground). Low-confidence evidence.  kept, `legends_1` (`Lylek.jpg`), is a detailed realistic painting of the same design the canon plate shows; it is the target. No live-action lylek exists. The comic's bright yellow-green and the map plate's flat mid-green are dropped: use the painting's olive/moss green.\n- **Silhouette**: a tall, spidery, many-limbed insectoid that stands high on long stilt legs. A\n  compact flattened torso slung between four to six spear-like walking legs (four long stiff\n  stilts in the painting, angled out like tripod stakes), with a raised front body and two pincer-\n  arms held up like a mantis.\n- **Head**: a small wedge/dragon-like head on a short upright neck, a gaping toothed round mouth;\n  the painting shows what reads as THREE heads/knobs at the top -- the central maw plus two\n  head-like pincer-tips on arm stalks held up beside it, each a spiked blob with a small red\n  eye. These are the pincers/claws, not extra heads, but they look like heads. (Prose: \"spiked\n  pincers and powerful mandibles with a pair of tentacles near them\".)\n- **Tentacles (loud)**: TWO long thin, dark, smooth whip-like tentacles with pale underside whip\n  out from the shoulders/front of the torso and curl in big loops through the air and on the ground;\n  they are much longer than the body (Legends text: poisonous barb tip, not visible).\n- **Carapace**: ridged, spiky, leaf-like plates stacked over the back, shoulders and legs, all\n  jagged; underbelly paler, softer and scaly.\n- **Colour**: olive/moss green with darker shading in the recesses of the plates; pale grey-cream\n  underside and joints; tentacles darker brown-black above, pale beneath.\n  Eyes small and red.\n- **Size cues**: the text calls them \"tall beasts\"; the deleted comic showed one towering over armed adult humans.\n- **Prose vs images**: matches -- spiked carapace, pincers, tentacles. The queen/hive are not shown\n  in any image.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_ esign/RimStarWars/canon_references/mott", "brief": "Four images: CANON infobox render (Visual Encyclopedia) and a tiny blurry film-style still of a mott pup in a stampede (canon_2, almost unusable); LEGENDS: a low-res copy of the same CG render with a red eye, and a painted plate of an adult female with her young. They agree.\n- **Silhouette**: a stocky, low-slung, barrel-bodied tapir/rhino-like quadruped with stubby legs, a long level back, a very short stub tail, shoulder height about 1.1 m (matches text), the body lower at the shoulder than at the haunch only slightly.\n- **Colour/pattern (CG render and painting)**: a two-tone coat. Back and rump pale sage-tan/cream-grey, flanks and neck warm orange-rust; white-cream stripes/bands run across the flanks, rump and the upper legs (horizontal stripes on the body, rings on the legs), cream belly, throat and cheeks. The tiny canon_2 still shows an uniform brown-tan young animal without stripes (lower quality, soft).\n- **Skin/fur**: short, thin, smooth, hair-like coat, almost naked skin with fine wrinkles at joints, no mane or long fur.\n- **Head**: a long, drooping, tapir-like snout with a pale muzzle, a thick lower lip, a small blunt horn at the tip of the snout (in the CG render a short horn on the nose and two short pointed ears with a small horn nub or ear tuft at the back of the head); small dark eyes, red in the Legends copy.\n- **Feet**: broad, clawed toes (three or four visible) on each foot, like a tapir's, and a short tail tuft.\n- **Young**: smaller copies of the adult with the same stripes and a short upright snout horn; litters are shown as a line of piglet-sized young.\n- **Disagreement**: text says they have 'skin' and sharp claws and small horns on snouts (images agree); Legends says semi-aquatic (no web or aquatic features shown).", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable pg` \u2014 the in-universe Theed palace painting (*Battlefront II*, canon), realistic oil-painting style: the same bird on Padm\u00e9's arm, peacock-blue wings, long trailing tail with pale gold edging, a small yellow/gold head, raptor-like curved beak. Confirms the colour.\n- `wookieepedia_infobox.jpg` \u2014 the Legends infobox `Peko-peko.jpg` (Databank original): an untextured grey 3D model, side view. Body plan only \u2014 long S-curved neck, elongated beak/skull with a knob crest, long wings, long tail. Carries **no colour**; do not read \"grey\" as canon.\n\n**Net read: render blue**, as a real bird with real feather structure: peacock/macaw-style plumage, very long trailing tail feathers, clawed wings, a strong hooked nut-cracking beak. The red-orange Toxic mutant is not part of the target.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the field-guide plate per the `## ruling` below (owner ruling 2026-09-14: \"Follow #3 closely.\"), the Battlefront II painting, and the owner ruling 2026-10-08 in the visual brief.*\n- [ ] BODY PLAN: a real bird with real feather structure: a long S-curved neck, an elongated hooked beak/skull with a crest at the back of the head, long wings with claws, foldable close to the body, and very long trailing tail feathers \u2014 as in the field-guide plate (owner ruling 2026-09-14: \"Follow #3 closely.\")\n- [ ] COLOUR LAYOUT: peacock/slate-blue wing and tail plumage with pale edging \u2014 not drab, tan, grey or reddish-orange; a yellow/gold patch at the head or throat; tail feathers edged pale gold/olive; dark crest at the back of the head\n- [ ] Very long trailing tail feathers with pale gold edging\n- [ ] Strong hooked, nut-cracking beak\n- [ ] Realistic rendering: natural layered feather texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not the red-orange \"Toxic peko-peko\" mutant, not the untextured grey 3D model colour, not a drab or reptilian-brown creature", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_fieldguide.jpg`\n\n> \"Follow #3 closely.\"", "base": "", "imgs": ["img/c26d59f795ffa2aa2017.webp", "img/d84064c17a455d43c3ba.webp", "img/7423963af562c182c5bb.webp"]}, "letters": ["N"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: PekoPeko, RSW_PekoPeko; artpipe jobs on record: gapbs_RSW_PekoPeko_male_v1, pekopeko_toyfig_b, pekopeko_v1", "rulings": [{"at": "2026-09-14", "verdict": "3", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "Follow #3 closely."}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "kill all this terrible art. Follow the canon very closely. Flyer."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "kill all this terrible art. Follow the canon very closely. Flyer."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "kill all this terrible art. Follow the canon very closely. Flyer."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "kill all this terrible art. Follow the canon very closely. Flyer."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "kill all this terrible art. Follow the canon very closely. Flyer."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ru built from tall, overlapping, backswept ridged plates that end in blunt wavy spines, like a frilled crest running the length of the back. Olive-green with yellow-green highlights along each ridge.\n  - **Legs**: four thick, columnar, elephant-like legs, wrinkled grey-olive skin, broad round feet with blunt toenails. The body stands **high on these legs**, well clear of the ground. It is not a low, stubby-legged turtle.\n  - **Head and neck**: a long, thick, horizontal neck with yellow-green and olive stripes, ending in a long, flat, duck-billed snout. Two small red eyes sit raised on the top of the snout like a frog's or a hippo's.\n  - **Tail**: long, tapering and held level, with a row of small spikes along the top.\n  - **Colour**: olive to moss green on the shell and neck, greyer and wrinkled on the legs. **Where this disagrees with the removed toy render:** it is muted natural olive, not a bright clean green, and the legs are long.\n- `shirotrap_legends.jpg` and `shirotrap_retracted_legends.jpg` show the symbiotic **shiro-trap**, a separate entry (`shirotrap`). A carnivorous plant roots in the shell ridges: a rosette of broad red-and-cream leaves, with long stalks ending in toothed red trap-mouths. In the retracted plate the animal's head, a flat green snout with a red eye, pokes out from under the rosette. Here the shell and skin are mottled moss-green and brown.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `shiros_group_legends.jpg`, the target picked in the `## ruling` below (owner, 2026-09-14), rendered realistically per owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\"*\n- [ ] BODY PLAN: a shelled four-legged reptile standing high on four thick columnar elephant-like wrinkled legs, body well clear of the ground, not stubby turtle legs; long thick horizontal neck in front, long level tail behind\n- [ ] Shell: high domed carapace of tall overlapping backswept ridged plates ending in blunt wavy spines, like a frilled crest running the length of the back\n- [ ] Head: long flat duck-billed snout at the end of the neck, with small raised red eyes on top\n- [ ] Long level tail with a row of small spikes along the top\n- [ ] COLOUR LAYOUT: muted olive-to-moss-green shell and neck with yellow-green ridge highlights; yellow-green and olive stripes along the neck; greyer, wrinkled legs\n- [ ] Realistic rendering: natural horny shell plates and wrinkled reptile hide, natural lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not a turtle or tortoise (no low stubby legs, no smooth round shell, no beaked turtle head), not the bright clean-green *Disney Infinity* toy, and not a shiro-trap (no plant rosette in the shell \u2014 owner ruling 2026-09-14: the Shiro-Trap ", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `shiros_group_legends.jpg`\n\n> \"There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)\"", "base": "", "imgs": ["img/8003243599a18a3071eb.webp", "img/7ba1243aa9a0eb4ceb1e.webp", "img/5232cd876ec65bfde5c6.webp"]}, "letters": ["A", "E", "B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Shiro, Shiro; artpipe jobs on record: canon_shiro_v1, shiro_v1", "rulings": [{"at": "2026-09-14", "verdict": "2", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "There is donor art for this too. There is also Shiro-Trap that looks like (#3, symbiotic pairing) that could be its own creature (and was in the donor mod)"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: repla a58f4f0a8fb1ced49edf1d10f8abefeea288a53d": "img/1638eb06ac8ad05585fa.webp", "64e8a7b01468a6be75d7ff64e1939aef15980e72d7861e769244e1fe8d1c3fb5": "img/64e8a7b01468a6be75d7.webp", "ab0eba0b16a0d64921d64ea8dd3917bf79b20bb6737fc686ab0d292035d9228f": "img/ab0eba0b16a0d64921d6.webp", "0fb340316f7c162bdf1c1bfaf3bc507f4a025e3f199e6ea44e7afcb19e5ee8b1": "img/0fb340316f7c162bdf1c.webp", "081005155dc2c73537267237f86b2e83c1ed423cbc4bb53d4d5a0d06b4be521a": "img/081005155dc2c7353726.webp", "ce84c80fc922ee5bb95898af8236e06f95b7292641bc99013f471888302e3ceb": "img/ce84c80fc922ee5bb958.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/shirotrap", "brief": "Two pencil-and-watercolour concept pieces (images are from the Legends-only Shiro-trap page). Both show the same idea, a **leafy plant growing on the back of a low armoured animal**, but they disagree on the details. Text (the Shiro carrier is a turtle-like, spiny-shelled reptile, so the green \"caterpillar\" reading of `canon_2` is an artistic impression, not sourced anatomy): a symbiosis of a Tooke trap plant (the camouflage and the mouth) and a Shiro (the animal that carries it); no size is sourced.\n- **The animal (Shiro) body, `canon_1`:** a squat tortoise/armadillo-like creature, **brown and ochre with a ridged, banded back-shell** and thick stumpy, clawed, scaly legs; a blunt snout and a long thin forward-reaching arm/neck at the front.\n- **The animal (Shiro) body, `canon_2`:** instead a **low, long, olive-green, segmented, caterpillar- or slug-like carapace**, hump-backed, with ridges, small stub legs, a pointed hooked snout and a tiny red eye, spiky comb-like scutes at the front. The two pieces disagree: brown tortoise-shell versus green segmented caterpillar.\n- **The plant (Tooke trap), common to both:** a **rosette of broad, leathery leaves that looks like a bromeliad or agave**, centred on the animal's back. Leaves are **grey-green to ochre, striped or blotched with orange-red/pink and yellow centres** (strong, saturated warm markings on the leaf blades).\n- **The trap parts:** in `canon_1` **two or three long thin stalks arch out of the rosette, each tipped with a large toothed mouth-like trap** (dark maroon to purple-red, ribbed jaws with spiky teeth, rising overhead like Venus flytraps or snapping jaws). In `canon_2` **a single tall, thin, dark-red stalk** rises from the middle of the rosette and ends in a small ribbed, bud-like trap head with a few small berries or nodules at its base; it is closed and looks like a flower bud.\n- **Overall look:** the animal is hidden under the plant, so from above a viewer sees a plant first; the head and legs appear at the bottom edge.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both images.*\n- [ ] BODY PLAN: two stacked parts read top to bottom: (1) a plant rosette of broad leaves fanning out wider than the animal, sitting on (2) a low, squat, four-legged armoured reptile body (tortoise-like domed shell in `canon_1`, or green segmented carapace in `canon_2`), whose head pokes out at the front below the leaves and whose short thick clawed legs show underneath\n- [ ] One to three long thin dark-red stalks rising ABOVE the leaves, each ending in a ribbed, toothed, jaw-like trap head (flytrap-like); the stalks make the creature the tallest at the top\n- [ ] COLOUR LAYOUT: animal body earth-toned (brown/ochre or olive-green) and darkest at the bottom; leaves grey-green to ochre with orange-red edges or blotches and yellow centres; trap stalks and heads dark maroon/red \u2014 three distinct colour zones stacked bottom, middle, top\n- [ ] Leaves are broad, pointed and leathery like a bromeliad or agave, not grass, moss or flowers\n- [ ] NEGATIVE: not a plant alone (the reptile body, head and legs must be visible); not a turtle with moss or a few sprigs on it (the rosette must be larger than the shell); not a flower bouquet", "ruling": "", "base": "", "imgs": ["img/c323e1fb0599013840b6.webp", "img/2073951db938784140c9.webp"]}, "letters": ["F", "D", "G", "A"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_ShiroTrap, ShiroTrap", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-08", "verdict": "redo", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "This is a shiro with a plant on it... canon. Go for it. Look at the Shiro, then the Trap plant, then put them together."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "This is a shiro with a plant on it... canon. Go for it. Look at the Shiro, then the Trap plant, then put them together."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "This is a shiro with a plant on it... canon. Go for it. Look at the Shiro, then the Trap plant, then put them together."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "greentide_sheet_2026-10-05", "note": "This is a shiro with a plant on it... canon. Go for it. Look at the Shiro, then the Trap plant, then put them together."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "2026-10-07_greentide_sheet_2026-10-05", "note": "This is a shiro with a plant on it... canon. Go for it. Look at the Shiro, then the Trap plant, then put them together."}, {"at": "2026-10-08", "verdict": "keep", "trust": "ruled", "sheet": "2026-10-07_greentide_sheet_2026-10-05", "note": "This is a shiro with a plant on it... canon. Go for it. Look at the Shiro, then the Trap plant, then put them together."}, {"at": "2026-10-09", "verdict": s ever wanted. The body plan is\nFOUR-LIMBED: the long clawed forelimbs are planted on the ground beside the\nhind legs (the text's \"powerful forelegs to forage and hop\"), so it is a\nwingless four-limbed forager, not a two-legged ostrich-like bird (owner\nconfirmed this reading by question card, 2026-10-09). The field guide's own\nsourcebook classifies it \"flightless avian\" yet also calls it an insect in prose.\n\n**The current donor sprite** (`donor_current_sprite.png`) is a solid partial\nmatch: reddish-brown body coloring is right, and there's a pale cream tuft/\nplumage cluster near the head/shoulder consistent with the reference art's\nhead plumage. Two differences worth flagging: the donor's **eye reads plain\ndark/black**, not the blue-toned eye patch the reference art and the sourced\n\"blue\" eyecolor both call for, and the donor's head is not as strongly\nsaturated red as the adult reference \u2014 closer to the reference's more muted\njuveniles. The blue \"eyecolor\" infobox field is not tied to a patch by the page; the patch reading is my image interpretation. A regen should push the head toward a more vivid red and add the\nblue-toned eye patch.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in `wookieepedia_fieldguide.jpg` (the only image, Legends) as read by the visual brief, and the Legends text (\"powerful forelegs to forage and hop\", rarely over three feet tall).*\n- [ ] BODY PLAN: a small (rarely over three feet), stocky, flightless \"avian\" with no wings: sturdy, powerful clawed FORELEGS used for foraging and hopping plus hind legs, a long neck, and a beaked head carried low toward the food\n- [ ] COLOUR LAYOUT (adult): vivid red/crimson head and neck; brown, ridged, feathered-looking body; a pale grey-blue patch of skin around each eye (the eye itself dark within it); a pale grey beak\n live-action convor found is **Morai**, the convor that follows Ahsoka, in the live-action *Ahsoka* series \u2014 StarWars.com databank still `starwarscom_morai_ahsoka.jpg` (searched: `Images of convorees`, `Images of Morai`, wiki file search, StarWars.com databank `morai` and `convor`; the wiki holds no live-action Morai file). It is a wide shot and the bird is small in frame. The Card Trader infobox render `wookieepedia_convoree_infobox.png` is a stylised animation-era illustration, KEPT only because it is the one image that shows the prehensile tail and plumage up close \u2014 use it for anatomy, not for its big cartoon eyes.\n\nWhat the live-action Morai shows: a **real-looking barn-owl-like bird** \u2014 upright, slim-to-plump owl standing on a rock, a pale heart-shaped white facial disc, pale cream-white breast, soft pale grey-buff back and wings with faint tawny shoulders, long wing tips folded down past the body. It reads as a real owl, not a big-eyed toy.\n\ud83d\udd34 **Live-action and animated versions DISAGREE:** the animated/illustrated convor is a round, plump ball with huge glowing amber eyes and brown/gold mottling; live-action Morai is a natural, proportionate barn-owl with normal-sized dark eyes in a pale facial disc. Follow the realistic proportions (normal owl head-to-body ratio, normal eyes); plumage may range brown/cream/gold (text: gold, green or brown) \u2014 Morai herself is the pale form. The prehensile tail is not visible in the live-action still; keep it from the text and the infobox.\n\n**The current donor sprite (`donor_current_sprite.png`)** shows a brown/cream mottled owl with a visible long ringed prehensile tail \u2014 keep the tail; push the proportions and plumage toward a real owl.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the live-action Morai still (proportions, per the owner's 2026-10-08 realism ruling in the visual brief) and the Card Trader infobox render (anatomy only: the tail), as read by the visual brief.*\n- [ ] BODY PLAN: a small (about 0.2 m), compact, upright owl with real owl proportions \u2014 rounded head with a flat facial disc and short hooked beak, normal-sized eyes (not oversized cartoon eyes), two wings with long folded wing tips reaching down past the body \u2014 plus a long, ringed, prehensile grasping tail\n- [ ] COLOUR LAYOUT: dense, soft owl plumage in brown/cream/gold (text: gold, green or brown), finely mottled, with a paler facial disc and breast; or the pale form (Morai): white heart-shaped facial disc, cream-white breast, pale grey-buff back and wings with faint tawny shoulders; eyes dark\n- [ ] Long, ringed, prehensile tail used for grasping \u2014 not a standard fan-shaped bird tail\n- [ ] Realistic rendering: natural feather texture and lighting, no outlines, no cartoon shading\n- [ ] NEGATIVE: not a round plush ball with huge glowing amber eyes (the animated convor); not an ordinary owl with a fan tail; not a Kiros bird (no purple/blue feathers)", "ruling": "", "base": "", "imgs": ["img/123ff9bd281626457b96.webp", "img/6a0a625b4bece650def4.webp"]}, "letters": ["A", "F", "G", "B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Convor, RSW_Convor; artpipe jobs on record: desertportb_convor, leaningscrub_convor_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art."}, {"at": "2026-10-04", "verdict": "redo", "trust": "flawed-sheet", "sheet": "2026-10-03_desert_art_review_2026-10-03", "note": "different animals in different faces"}, {"at": "2026-10-06", "verdict": "redo", "trust": "ruled", "sheet": "leaning ttened muzzle; no horns or tusks. Mouth shown closed.\n- **Feet**: heavy, splayed stumpy feet with a few blunt claw/toe tips, broad enough to wade swamp; legs darkened and wrinkled toward the lower joint.\n- **Look change from the deleted plate**: the illustration showed a paler pinkish-grey hide, chocolate \"stocking\" lower legs and a huge gaping hippo mouth; the realistic renders do NOT show the stockings or the gaping mouth \u2014 trust the renders. The Legends text mentions Onderon grey with dark back stripes; no image shows stripes.\n- **Size**: very large, a body deeper than a person's height (the Gungan rider in `canon_2` sits well above head height).", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both realistic CGI images (`canon_1`, `canon_2`) and the canon text.*\n- [ ] BODY PLAN: a huge barrel-bodied, heavy-rumped quadruped on disproportionately long, thick legs; a long thick neck sloping DOWN from the shoulders so the smallish head is carried low; high back, sagging camel/paleo-mammal profile; short thin tail ending in a small tuft\n- [ ] COLOUR LAYOUT: greyish-tan to mid-brown hide over the whole body with scattered dark brown-grey spots/blotches on flanks, back and rump; lighter belly; legs darkening toward the lower joint and feet\n- [ ] Hide: finely wrinkled and near-hairless like an elephant or rhino (a little coarse hair only at the neck and leg joints)\n- [ ] Head: small, with a droopy pendulous upper lip, small round ears, small heavy-lidded eyes and a flattened muzzle; no horns, no tusks\n- [ ] Feet: heavy, broad, splayed stumpy feet with a few blunt toe tips\n- [ ] Size: very large, body deeper than a person is tall (canon height 3 m)\n- [ ] Realistic rendering: natural wrinkled elephant-like hide and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, rated proportions. Deleted: the *Tales of the Jedi* comic panel (`canon_2`, `Ktriss1.jpg`) and the loose *Dark Side Sourcebook* nebula painting (`canon_4`, `Siss.jpg`). Kept (both Legends-continuity art):\n- `canon_1` (`Hssiss-BoS.png`, *Book of Sith* detailed coloured illustration) \u2014 the anatomy target, matching the prose.\n- `canon_3` (`HssissKOTORII.jpg`, *KOTOR II* promotional render) \u2014 the most naturalistic image: glossy, heavy, plated scales with real specular highlights. Use it as the MATERIAL reference for realistic scale texture, not for colour.\n\n- **Silhouette**: a heavy, long-bodied lizard like a giant iguana/komodo crossed with a crocodile; low, quadrupedal, sprawling stance with muscular thighs, long thick tail (prose: 3 m body plus a 1 m tail). `canon_3` crouches lower and more raptor-like.\n- **Spikes (loud)**: a continuous row of conical/serrated spikes runs down the back and the whole tail, climbing the neck into a crest of tall spines behind the head; a few small horn-like spikes on the snout and forelimbs.\n- **Head**: wedge-shaped crocodilian jaws with many sharp teeth, small eyes (`canon_1`: red-ringed pale eye), small horns/tusk-spikes above the nose and at the jaw corner; pale throat.\n- **Limbs**: strong legs with large, long curved claws on each toe (long pale claws in `canon_1`, black scythe claws in `canon_3`).\n- **Colour (images disagree)**: `canon_1` = bright green scaly hide with a pale cream/grey underside and a salmon-red throat/dewlap; `canon_3` = very dark blue-grey-black scales with a copper-red underbelly. The prose says green \u2014 use green, tone it down from the illustration's bright lime to a natural olive-green.\n- **Size**: prose says 3 m body plus 1 m tail; roughly humanoid-length-plus. Not a giant.\n- Invisibility/Force abilities are not depicted.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the Legends prose, `canon_1` (anatomy and colour) and `canon_3` (scale material only), per the visual brief.*\n- [ ] BODY PLAN: a heavy, long-bodied, low sprawling four-legged lizard (giant iguana/komodo crossed with a crocodile): muscular thighs, belly near the ground, and a long thick tail (prose: 3 m body plus a 1 m tail)\n- [ ] Spikes: rows of conical/serrated spikes running down the whole tail and back and climbing the neck into a crest of tall spines behind the head\n- [ ] Head: wedge-shaped crocodilian jaws with many sharp bared teeth, small eyes, and small horn-spikes above the nose and at the jaw corner\n- [ ] Large, long curved claws on all four feet\n- [ ] COLOUR LAYOUT: natural olive-green to green scaly hide on back, flanks and tail; paler cream underside; a red/salmon throat dewlap (`canon_1` only; optional)\n- [ ] Realistic rendering: natural glossy reptile scales and lighting, no outlines, no comic or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a winged or upright dragon (it is a low sprawling lizard, no wings), not a smooth-backed crocodile without the spine row; not the dark blue-black `canon_3` colouring; not a giant", "ruling": "", "base": "", "imgs": ["img/69d1d551bedbb52e2641.webp", "img/ad8380b9492133e5fc04.webp"]}, "letters": ["A", "B"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: Hssiss, RSW_Hssiss; artpipe jobs on record: thesump_Hssiss_v2", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_port_swac_2026-09-20", "note": "Owner blanket ruling 2026-09-20: replace applied to every row."}, {"at": "2026-10-06", "verdict": "redo", "trust": "ruled", "sheet": "thesump_sheet_2026-10-05", "note": "follow canon precisely"}, {"at": "2026-10-06", "verdict": "keep", ender of a hooded Jawa (filename collision on `Nuna.png`). The two remaining images are realistic CGI of the Phantom Menace-era design: `wookieepedia_infobox.jpg` (detailed 3/4 render, the owner-ruled canon image) and `wookieepedia_walkintime.jpg` (front-on realistic CGI promo, StarWars.com). No live-action/puppet nuna exists on Wookieepedia (searched: Nuna page, \"Images of nunas\"; the realistic-labelled files there are food photos and dinner scenes).\n\nThe two candidate images (official realistic renders of the\nanimal itself, not food shots) are internally consistent with each other but\n**disagree sharply with the \"bird\" / \"swamp turkey\" framing in the text**.\nNeither shows anything resembling feathers, a beak, wings, or a\nturkey-like silhouette (canon text nonetheless says nunas could grow blue and red feathers, so absence of feathers in these renders is not a species-wide prohibition). What they actually show is a squat, hunched,\n**toad- or turtle-like amphibian/reptile**: a heavy domed/ridged shell-like\nback rising into a peak, a wide froglike head with a broad flat mouth and\nbulging pink or amber eyes, floppy skin flaps hanging at the sides of the\nhead (read as loose jowls/wattle, not ears), thick bent hind legs ending in\nclawed toed feet, and mottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on either image. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or watt", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in both realistic renders and the `## ruling` below (owner ruling 2026-10-08 in the visual brief).*\n- [ ] BODY PLAN: a small, squat, hunched two-legged animal, wider than tall seen head-on; a heavy domed/ridged shell-like back rising to a peak; thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing, drawn with a suggestion of thick bird-like legs (owner ruling 2026-09-14: \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\")\n- [ ] COLOUR LAYOUT: mottled olive-to-dark-green pebbled/warty skin over the whole body; bulging pink or amber eyes the brightest element of the head\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Realistic rendering: natural wet pebbled amphibian skin texture and lighting, no outlines, no cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not a turkey or other bird (no beak, no wings, no feathered body \u2014 canon allows some blue/red feathers, never a feather coat), not a plain frog (legs read thick and standing, per the 2026-09-14 ruling), not a rounded legless blob", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "base": "", "imgs": ["img/b8fc8 9ba42cde6e8cb552.webp"}, "canon": {"dir": "design/RimStarWars/canon_references/whisperbird", "brief": "**Owner ruling 2026-10-08 (verbatim): \"That's realistic, not these cartoon versions you keep using. Replace the canon with something more realistic. The web is full of them.\"**\n\nThe hatched *Alien Archive* illustration (`wookieepedia_alienarchive.jpg`) was deleted 2026-10-08. The target is now\n**`wookieepedia_bf2_render.png`**, the photoreal *Star Wars Battlefront II* (canon, video game) model of the bird in\nflight. `wookieepedia_woswfg_legends.jpg` is a naturalistic Legends painting from *The Wildlife of Star Wars* and\ndisagrees on wing type (below).\n\nFrom the Battlefront II render (realistic):\n- **Plumage**: warm golden-tan to honey-brown feathers over the body and long broad wings, with soft darker brown\n  shading along the feather tracts and paler tips; the coat is fairly even \u2014 **no strong black barring** is visible.\n- **Head and neck**: a bald, blue-grey, vulture-like head and a long thin bare blue-grey neck, held stretched forward\n  in flight; a long slim pale orange-tan beak.\n- **Tail**: a very long, thin, trailing tail streamer of golden feathers, longer than the body.\n- **Silhouette**: a lean, long-necked, long-winged soaring bird, closer to a heron or crane than a stocky raptor.\n- **Disagreement (loud)**: the deleted *Alien Archive* drawing showed heavy dark banding under the wings, a dark belly\n  patch, a hooked red-tipped beak and big blue-grey talons; the realistic render shows none of that banding, a\n  slimmer straighter beak and the legs tucked out of sight. Follow the render.\n- **Legends painting** (`woswfg_legends`): same bald blue-grey head and long neck, but **pterosaur-like membrane\n  wings** in bright orange-yellow and an open toothed beak. It is Legends; use it for head and neck only, never the\n  wings.", "must": "*Rewritten 2026-10-09 to the canon_check leniency lesson (`Transient/canon_check_leniency_2026-10-09.md`): body plan, colour layout and a negative, each checkable on a 256px sprite. Grounded in the visual brief's reading of `wookieepedia_bf2_render.png` (the *Battlefront II* render, primary) and the owner's 2026-10-08 realism ruling.*\n- [ ] BODY PLAN: a lean, long-necked, long-winged soaring bird, heron/crane-like rather than a stocky raptor: long broad feathered wings, a long thin bare neck held stretched forward, and a very long, thin trailing tail streamer longer than the body\n- [ ] COLOUR LAYOUT: warm golden-tan to honey-brown feathers over body and wings, soft darker brown along the feather tracts and paler tips, no heavy black barring and no dark belly patch; the bald head and bare neck blue-grey, contrasting with the golden body; tail streamer golden\n- [ ] Head: bald, vulture-like, with a long, slim, straight pale orange-tan beak (not hooked, not red-tipped)\n- [ ] Wings are feathered bird wings, never pterosaur-like membrane wings\n- [ ] Realistic rendering: natural feather texture and soft natural lighting, no outlines, no ink hatching or cartoon shading (owner ruling 2026-10-08: \"That's realistic, not these cartoon versions you keep using.\")\n- [ ] NEGATIVE: not an eagle or hawk (no stocky build, no hooked beak, no big talons on show), not a vulture (long thin neck and golden coat, long tail streamer), not the Legends membrane-winged orange creature", "ruling": "", "base": "", "imgs": ["img/17e6b28b1c8e3d8b545b.webp", "img/4a012672b5e57173fca9.webp"]}, "letters": ["L", "K", "B", "C", "A"], "dependsOn": null, "related": [], "elsewhere": [], "noArt": false, "purgedHidden": 0, "donorPurged": false, "noArtWhy": "searched by graphic and by name: RSW_Whisperbird, Whisperbird; artpipe jobs on record: canon_whisperbird_v1, desertportb_whisperbird, leaningscrub_whisperbird_v1, whisperbird_v1", "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2
