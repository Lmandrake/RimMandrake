<!--
  sheet_template.html — a COMPLETE review sheet, not a fragment to copy hooks out of.

  The chrome in here is the part humans complain about when it is missing: a brief that
  folds AND is height-bounded, a save path that is present and copyable, and a group
  label that follows while scrolling. An earlier version of this asset was a ~100-line
  fragment that said "wire the three marked hooks", and agents rebuilt the chrome from
  scratch and dropped one. So the chrome is no longer yours to author.

  YOU FILL IN EXACTLY THREE THINGS:
    1. script#CONFIG   the brief, posture, criterion, options
    2. script#ITEMS   the rows
    3. (optional) script#RENDER                 window.itemBody = it => html
                                                       — only if the default row is wrong

  Everything else — persistence, keyboard, grid, undo, overrides, sticky labels — is done.
  Run assets/check_sheet.py against your output before you hand it over.
-->

<style>
/* ── palette ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0b0d10; --panel:#14161a; --panel2:#0f1216; --line:#2a2f37;
  --ink:#e8e6e3; --dim:#98a2b3; --accent:#ffb454; --link:#cfe3ff;
  --ok:#5ac37f; --warn:#e8b64c; --bad:#e06c6c; --info:#6aa6e8;
  --rowh:84px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
kbd{background:#1b2028;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11px;color:var(--link)}
a{color:var(--link)}

/* ── 1. THE HEADER, AND THE BRIEF THAT FOLDS *AND* IS BOUNDED ────────────────────────
   Folding alone is not enough. A brief that is open and unbounded still eats the page —
   that is the actual complaint ("the top instructions are persistent and block the
   screen"). max-height turns the worst case from "the rows are off-screen" into "the
   brief scrolls inside itself". Fold state persists, because re-collapsing it on every
   visit is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 18px;flex-wrap:wrap}
.hrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
#brief{max-height:26vh;overflow:auto;padding:0 18px 10px;border-top:1px solid #1e232b}
body.folded #brief{display:none}
@keyframes flash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 3px #3d6a92}}
#fold.flash{animation:flash 1.1s ease-in-out 2}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin:8px 0;font-size:12.5px}
.panel h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.panel.invented{border-color:#5a4320;background:#1a1408}
.panel.invented h3{color:var(--warn)}
.panel.posture{border-color:#2f4358;background:#0d151d}
.crit{color:var(--accent);font-size:12px}

/* buttons */
.btn{cursor:pointer;background:#1b2028;border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;font-size:12px}
.btn:hover{background:#232a34}
.btn.pri{background:#1d2733;border-color:#2f4358;color:var(--link)}
.btn.on{background:#243447;border-color:#3d6a92;color:#dff0ff}

/* ── 2. THE SAVE PATH IS PRESENT AND COPYABLE ────────────────────────────────────────
   Only a fallback now — with the sidecar there is no picker and no path to paste. It
   stays because the sheet must still work opened straight off disk with nothing running. */
.pathbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12px}
.pathbar code{color:var(--link);word-break:break-all}
.pathbar b{color:var(--dim);font-weight:600}
/* the visible fallback for "copy JSON" when the clipboard API is refused: the work itself,
   on screen, selectable — never a button that silently did nothing */
#exportTa{width:100%;margin:0 0 8px;background:#0c1420;border:1px solid #2b3a4d;
  border-radius:6px;padding:7px 9px;color:#dff0ff;font-family:ui-monospace,monospace;
  font-size:11px;resize:vertical}

/* filter bar — OUTSIDE #brief, so folding the brief never hides the search box */
.bar{display:flex;gap:8px;align-items:center;padding:8px 18px;flex-wrap:wrap;
  background:#101317;border-top:1px solid #1e232b}
.bar input[type=search],.bar select{background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font-size:12px}
.bar input[type=search]{min-width:240px}
.pill{font-size:11.5px;color:var(--dim);background:#0d1014;border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.live{border-color:#2f4358;color:var(--link)}
.pill.bad{border-color:#5a2b2b;color:#ffb0b0;background:#1a0e0e}

/* ── 3. THE GROUP LABEL FOLLOWS WHILE SCROLLING ──────────────────────────────────────
   `top` is set from the MEASURED header height at the end of every render and on resize:
   the header changes height when the brief folds, and a hardcoded offset leaves labels
   floating in mid-page or buried under the bar. */
.gh{position:sticky;z-index:20;background:#10141a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:5px 18px;font-size:12px;font-weight:650;
  color:var(--accent);display:flex;gap:10px;align-items:center}
.gh.nostick{position:static}      /* groups of <=3: a sticky label covers the only row */
.gh .ghcount{color:var(--dim);font-weight:400}
.gh .ghbulk{margin-left:auto;display:flex;gap:5px}
.gh .ghbulk button{font-size:11px;padding:2px 7px}

/* ── rows ──────────────────────────────────────────────────────────────────────────── */
#list{padding-bottom:60vh}         /* so the last group can still scroll under the header */
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 18px;
  border-bottom:1px solid #171b21}
body.perf .row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh)}
.row:hover{background:#0f1318}
.row.focus{background:#131a24;box-shadow:inset 3px 0 0 var(--info)}
.row.override{box-shadow:inset 3px 0 0 var(--accent)}
.row.focus.override{box-shadow:inset 3px 0 0 var(--info),inset 6px 0 0 var(--accent)}

.thumb{width:64px;height:64px;flex:0 0 64px;border-radius:5px;border:1px solid var(--line);
  /* checkerboard: a sprite with transparency is unjudgeable on a flat dark field */
  background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                   linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1a1d22;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.main{flex:1;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.label .id{color:#5f6b7a;font-size:11px;font-family:ui-monospace,monospace}
/* the consequence line: what the entry DOES. Not its name. */
.effect{color:#c3cad6;font-size:12.5px;margin-top:2px}
.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mark{font-size:10.5px;border-radius:3px;padding:1px 6px;border:1px solid}
.mark.inferred{color:var(--warn);border-color:#5a4320;background:#1a1408}
.mark.contested{color:#e8a0d8;border-color:#5a2b52;background:#1a0d17}
.mark.absent{color:var(--dim);border-color:var(--line)}
.mark.ovr{color:var(--accent);border-color:#5a4320;background:#1a1408}

.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:210px}
.opts{display:flex;gap:4px}
.opts button{flex:1;cursor:pointer;background:#161a20;border:1px solid var(--line);
  border-radius:5px;padding:5px 4px;font-size:11.5px;color:var(--dim)}
.opts button:hover{border-color:#3d4653;color:var(--ink)}
.opts button.sel{color:#0b0d10;font-weight:700;border-color:transparent}
/* the note must be the most inviting control on the row, not an afterthought beside the
   dropdown: the notes are worth more than the agreements. */
.note{width:100%;background:#0c1420;border:1px solid #2b3a4d;border-radius:5px;
  padding:5px 8px;font-size:12px;min-height:30px;resize:vertical;color:#dff0ff}
.note::placeholder{color:#5c7590}
.note:focus{outline:2px solid #3d6a92;outline-offset:-1px;background:#0e1826}
.row.override .note{border-color:#5a4320;background:#150f06}

/* ── grid / contact-sheet mode ───────────────────────────────────────────────────────── */
body.grid #list{display:grid;gap:10px;padding:12px 18px 60vh;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell,132px),1fr))}
body.grid .gh{grid-column:1/-1;margin:6px -18px 0}
body.grid .row{flex-direction:column;gap:6px;padding:7px;border:1px solid #1b2028;
  border-radius:7px;background:#0f1216;align-items:stretch}
body.grid.perf .row{contain-intrinsic-size:auto 190px}
body.grid .thumb{width:100%;height:var(--cell,132px);flex:none}
body.grid .ctrl{width:auto}
body.grid .effect{font-size:11px;max-height:2.9em;overflow:hidden}
body.grid .note{min-height:26px;font-size:11px}
body.grid .row.sel-tint{border-color:currentColor}

/* zoom overlay — judging a sprite at 64px is judging nothing */
#zoom{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.86);cursor:zoom-out}
#zoom.on{display:flex}
#zoom .box{background-image:linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%),
                            linear-gradient(45deg,#2a2f37 25%,transparent 25%,transparent 75%,#2a2f37 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;background-color:#1a1d22;
  border:1px solid var(--line);border-radius:8px;padding:14px}
#zoom img{image-rendering:pixelated;max-width:70vw;max-height:70vh}
#zoom .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:8px}

/* ── keymap legend ───────────────────────────────────────────────────────────────────── */
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(560px,92vw)}
#keys.on{display:block}
#keys table{border-collapse:collapse;font-size:12.5px}
#keys td{padding:3px 12px 3px 0;vertical-align:top}
#keys h3{margin:0 0 10px;font-size:13px}

.banner{padding:8px 18px;font-size:12.5px;border-bottom:1px solid}
.banner.bad{background:#1e0f0f;border-color:#5a2b2b;color:#ffc9c9}
.banner.warn{background:#1c1608;border-color:#5a4320;color:#ffe2ac}
.banner.ok{background:#0d1a12;border-color:#2b5a3b;color:#c9ffd9}
.banner button{margin-left:8px}
.hide{display:none !important}
</style>
</head>

ngle biggest thing the \"varying tones of gray\" text undersells. Every\n  image (concept-art illustration, in-show 3D render, and a separate painted\n  bestiary piece) independently shows banded/striped fur, not a flat gray or\n  solid color. This is exactly the kind of feature a text-only prompt would\n  invent wrong (cf. the Wyyyschokk case this library exists to prevent).\n- **A long, thin, low-carried or curled tail**, out of proportion to a stocky\n  hyena body \u2014 closer to a rat or lizard tail than a canine brush tail.\n- **Large forward-set eyes**, yellow/amber in the CGI and bestiary pieces\n  (agrees with the \"Yellow\" eye-color citation more than \"Blue\").\n  Note wookieepedia_infobox.jpg is a hand-painted/illustrated concept-style\n  piece (possibly a bestiary-book plate) rather than a film/show frame \u2014 treat\n  its exact palette as one artist's interpretation, though it agrees closely\n  with the separate wookieepedia_bestiary.jpg painting on stripe pattern, ear\n  shape, and mane.\n- **Sloped hyena posture**: front legs visibly longer/more developed than hind\n  legs in all three images, confirming the \"smaller hind legs\" text detail.\n- **Prominent lower jaw and tusk**, visible fangs, in all three.\n\nwookieepedia_citadel.jpg (the in-show CGI frame, a pair of \"dark anoobas\" from\nthe Citadel) is the darkest/most desaturated of the three \u2014 near-black in low\npurple lighting \u2014 but even here the dorsal mane spikes, ear shape, and tail\nare consistent with the other two images. This is plausibly the \"black\"\ncolor-cite individual type rather than contradicting the gray/blue-gray\nmajority.\n\n**donor_current_sprite.png is weak evidence**: it is the ONLY anooba art\npresent on disk in this repo's SWBestiary mod, and it is a Dessicated\n(corpse) variant only \u2014 there is no live/default sprite for RSW_Anooba on\ndisk at all right now. A desiccated corpse pose cannot show fur color, stripe\npattern, ear shape, or live posture reliably, so it should not be used to\nvalidate or invalidate any of t", "must": "- [ ] Large, erect, pointed ears with pink/red-toned interior skin\n- [ ] Spiky dorsal mane/ridge of longer fur running from the skull down the spine\n- [ ] Tiger-like dark stripes over a blue-grey to grey coat \u2014 not a flat solid gray\n- [ ] Long, thin, low-carried or curled tail, not a canine brush tail\n- [ ] Front legs visibly longer/more developed than the hind legs (sloped hyena stance)\n- [ ] Prominent lower jaw with visible fangs (chin tusk present on larger individuals)", "ruling": "", "imgs": ["desert_sitting1_2026-10-04_img/b66603f45454cf05f12b.webp", "desert_sitting1_2026-10-04_img/8b6b5c0e0ac581182a3b.webp", "desert_sitting1_2026-10-04_img/07ce82b7b683196a70e4.webp"]}, "flags": ["AT RISK: your earlier keep would be replaced by the 10-03 'keep render'"], "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "North is HUGE compared to east, and South isn't south.", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art.", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}]}, {"id": "swanimals/Bolotaur/Bolotaur", "group": "1 AT RISK \u00b7 bolotaur", "label": "bolotaur (RSW_Bolotaur) \u2014 Bolotaur", "context": "biome: desert \u2014 live roster desert 0.1", "flawed": {"decision": "keep", "note": ""}, "noCanon": null, "effect": "RSW_Bolotaur \u00b7 4 distinct sets: 1 shipped now, 2 renders, 1 history states \u2014 pick the column the game should show", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to what the game shows no onary example in this task's instructions\nevidently refers to a different creature, not this one).\n\n- **Body plan**: long, gently S-curved sauropod-like neck rising to a\n  triangular head; a distinct rhino/ceratopsian-style pointed nose horn or\n  nasal ridge; a beaked, slightly downturned mouth; two large, wing-like\n  skin-flap \"ears\" that fan out and back from the head/neck like a\n  stylized cape or frill (these read almost as folded elephant ears, per\n  Ellingson's stated elephant/rhino/dinosaur influences). Thick, heavily\n  columnar legs (four), each ending in broad clawed/hoofed feet, and a\n  short thick tail. Skin is deeply wrinkled/creased, especially at the neck\n  and leg joints, with rounded wart-like or pebbly bumps scattered over the\n  body (visible in both the infobox art and the concept sketches).\n- **Color**: consistently a muted, dark olive-to-brownish-grey \u2014 NOT\n  saturated brown, NOT blue-grey. The infobox illustration reads darkest\n  (near-black-brown with ochre/tan wart highlights); the \"Suns of Fortune\"\n  painted art and the film still both show a lighter, more olive-grey-green\n  skin tone with darker striping/banding on the neck and back, and a paler,\n  cream-to-tan underside/inner-ear color. Treat the **film still\n  (`mos_eisley_street.jpg`) as the anchor reference** \u2014 it is the\n  actual on-screen VFX creature all other art derives from/matches, and its\n  olive-grey-green with darker banding is corroborated by the painted\n  Suns of Fortune art (same hue family, just more saturated/painterly).\n  The monochrome-ish infobox illustration is stylized/inked and should be\n  read for silhouette and skin texture (wrinkles, warts, ear-flap shape),\n  not for exact hue.\n- **Scale/use**: every image with human/humanoid figures for scale (film\n  still, concept sketches) confirms the \"huge\" text description \u2014 a ronto\n  towers well over a standing human, consistent with the ~4-5m/16ft quoted\n  height. The film still and the Suns of Fortune art both show tack/rigging\n  \u2014 a bridle/rein around the head and neck, and a cargo saddle/howdah\n  strapped across the shoulders \u2014 matching the sourced role as a Jawa pack\n  and mount animal.\n- No disagreement to flag beyond the production-history correction above:\n  every image's silhouette, ear-flap shape, horn, beak, and body proport", "must": "- [ ] Long, gently S-curved neck rising to a triangular head\n- [ ] A rhino/ceratopsian-style pointed nose horn or nasal ridge, with a beaked, slightly downturned mouth\n- [ ] Two large, wing-like skin-flap \"ears\" fanning out and back from the head/neck like a frill\n- [ ] Thick, heavily columnar legs (four) ending in broad clawed/hoofed feet, with deeply wrinkled/creased skin and scattered wart-like bumps\n- [ ] Muted dark olive-to-brownish-grey coloration \u2014 not saturated brown, not blue-grey \u2014 with darker striping/banding on the neck and back and a paler cream-to-tan underside", "ruling": "", "imgs": ["desert_sitting1_2026-10-04_img/be798174d9f0450f6c2c.webp", "desert_sitting1_2026-10-04_img/52cb0eb3f0c494c0c3cf.webp", "desert_sitting1_2026-10-04_img/893890f6e5749fec29ef.webp", "desert_sitting1_2026-10-04_img/832afb848cfac1589940.webp"]}, "flags": ["AT RISK: your earlier keep would be replaced by the 10-03 'keep render'"], "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art.", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}]}, {"id": "Things/Pawn/Animal/RSW_Vosska/RSW_Vosska", "group": "1 AT RISK \u00b7 sand prowler", "label": "sand prowler (RSW_Vosska) \u2014 RSW_Vosska", "context": "biome: desert \u2014 live roster desert 0.05", "flawed": {"decision": "keep", "note": ""}, "noCanon": "no canon-library entry (looked for: sand prow sks": [], "canon": {"dir": "design/RimStarWars/canon_references/clodhopper", "brief": "The one candidate image (a *Wildlife of Star Wars* field-guide-style\nillustration) matches the sourced text closely and is a clear, information-\ndense reference: **adult clodhoppers have vivid red/crimson heads and necks**\nwith a **pale grey-blue patch of skin around the eye** (this is very likely\nwhat the text's \"blue\" eyecolor field is describing \u2014 the eye itself reads\ndark within a blue-toned surrounding patch, not a glowing blue iris), a\n**pale grey beak**, and **brown, ridged, feathered-looking bodies** with\nlong necks and sturdy clawed forelimbs used for foraging \u2014 shown here\nforaging on a spiny red-and-cream leafed plant (consistent with the\nTooke-trap-plant diet note). Juveniles in the same image are smaller, more\nuniformly brown/olive, and lack the vivid red head coloring of adults \u2014\nuseful if a juvenile/adult variant is ever wanted. The overall silhouette\nreads as a stocky flightless ground bird (ostrich/cassowary-adjacent), which\nmatches the \"flightless avian\" classification even though the field guide's\nown sourcebook oddly also calls them insects in prose.\n\n**The current donor sprite** (`donor_current_sprite.png`) is a solid partial\nmatch: reddish-brown body coloring is right, and there's a pale cream tuft/\nplumage cluster near the head/shoulder consistent with the reference art's\nhead plumage. Two differences worth flagging: the donor's **eye reads plain\ndark/black**, not the blue-toned eye patch the reference art and the sourced\n\"blue\" eyecolor both call for, and the donor's head is not as strongly\nsaturated red as the adult reference \u2014 closer to the reference's more muted\njuveniles. A regen should push the head toward a more vivid red and add the\nblue-toned eye patch.", "must": "- [ ] Vivid red/crimson head and neck (adults)\n- [ ] Pale grey-blue patch of skin around the eye\n- [ ] Pale grey beak\n- [ ] Brown, ridge n the CALF texture, not the adult", "history Jawa_Patches 2026-08-30 \u2014 0772bec77a 2026-08-30: Rename Phase 2b: 31 mod folders moved to tier dirs (git mv, history preserved); Jawa_Patches parked in SPLIT_Phase3", "history StarWarsPatches 2026-09-04 \u2014 2385af297a 2026-09-04: JAWA_PATCHES_SPLIT_1: execute the 3-way split - 95 Patches/Defs + 70 assets into tier mods"], "letter": "B", "purgeable": false}, {"kind": "artpipe", "faces": {"east": "4beba166c81b44be7e2c9cfe4d3588dfdc8bf5dbf82b2bc7d136e2d06dbe9e66", "north": "53a3da0ee8d1eb822a7b9a32429bc286d8a0096c3b0239c2dc68fffb654e6c87", "south": "3719dbf40fb23d45a17789349d8832c36009c02c2a2ca6eebda8895b0685ccae"}, "label": "render desert_swaca_eopie", "detail": "2026-09-20 \u00b7 joined by creature name only (not bound to this graphic) \u00b7 derive_from no \u00b7 DESERT_FAMILY_PORT_EXECUTION_1", "prompt": "A eopie (Eopie), a Star Wars canon creature. Eopies were a species of quadrupedal mammallian herbivores native to the planet Tatooine. These tough creatures were acclimated to their homeworld's endless deserts, and as a result were domestic", "letter": "C", "purgeable": true}], "near": 10, "masks": [], "canon": {"dir": "design/RimStarWars/canon_references/eopie", "brief": "The candidate images agree closely with each other and diverge sharply from\nthe donor sprite's color. Eopies read as **pale \u2014 cream, dusty tan, or a\npinkish-grey** skin tone, never brown. The body plan is unmistakably\ncamel-like: a long, low-slung barrel body on four thin legs, each ending in\nsmall clawed/hoofed toes, topped by a genuinely elongated **trunk-like\nsnout** (more tapir/small-elephant trunk than a simple long muzzle) with one\nlarge dark eye set well back on the head. None of the images show visible fur\nor hair \u2014 the hide reads smooth-to-leathery, not woolly. Every reference shows\nthe eopie loaded with practical tan/brown leather cargo saddlebags and woven\nwicker panniers strapped across its back and neck, which is core to its\nin-universe role as a pack animal, though that's harness/tack rather than a\nbody feature. The stylized \"EOPIES!\" cartoon thumbnail is a much lower-fidelity\nsource (flat shading, exaggerated cartoon eyes) but still agrees on the pale\ntan color and the long trunk-snout silhouette, so it corroborates rather than\ncontradicts the higher-fidelity images.\n\n**The current donor sprite (`donor_current_sprite.png`) gets the color\nroughly right** \u2014 it's a similar pale dusty pink-grey \u2014 **but the shape is\nwrong**: it's a rounded, legless blob with a stubby trunk-snout, no visible\nlegs, no saddle/pack gear, and none of the long low camel-backed silhouette\nevery reference image shows. Any regen should keep the pale skin tone but\ngive the body a longer, lower quadruped silhouette with visible legs and the\ndistinctive trunk-like snout reading clearly against the body.", "must": "- [ ] Pale skin tone \u2014 cream, dusty tan, or pinkish-grey \u2014 never brown\n- [ ] Long, low-slung, camel-like barrel body on four thin legs with small clawed/hoofed toes\n- [ ] Elongated trunk-like snout (closer to a tapir or small elephant trunk than a simple long muzzle)\n- [ ] One large dark eye set well back on the head\n- [ ] Smooth-to-leathery hide with no visible fur or hair", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.png`\n\n> \"We have a regenerated Eopie that is pretty good, but it has legs. We should remove and regenerate it to the new spec level.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Eopie/Eopie` (variants A\u2013E and `Eopie_j` marked \"redundant with above\"):\n\n> \"B is closest but still pretty bad. Please look at Canon imagery.\"", "imgs": ["desert_sitting1_2026-10-04_img/f4f5ff93f7bdee4e0ef2.webp", "desert_sitting1_2026-10-04_img/cd8af4c6230b8b7a9f7a.webp", "desert_sitting1_2026-10-04_img/0fb8651280c -leathery, not woolly. Every reference shows\nthe eopie loaded with practical tan/brown leather cargo saddlebags and woven\nwicker panniers strapped across its back and neck, which is core to its\nin-universe role as a pack animal, though that's harness/tack rather than a\nbody feature. The stylized \"EOPIES!\" cartoon thumbnail is a much lower-fidelity\nsource (flat shading, exaggerated cartoon eyes) but still agrees on the pale\ntan color and the long trunk-snout silhouette, so it corroborates rather than\ncontradicts the higher-fidelity images.\n\n**The current donor sprite (`donor_current_sprite.png`) gets the color\nroughly right** \u2014 it's a similar pale dusty pink-grey \u2014 **but the shape is\nwrong**: it's a rounded, legless blob with a stubby trunk-snout, no visible\nlegs, no saddle/pack gear, and none of the long low camel-backed silhouette\nevery reference image shows. Any regen should keep the pale skin tone but\ngive the body a longer, lower quadruped silhouette with visible legs and the\ndistinctive trunk-like snout reading clearly against the body.", "must": "- [ ] Pale skin tone \u2014 cream, dusty tan, or pinkish-grey \u2014 never brown\n- [ ] Long, low-slung, camel-like barrel body on four thin legs with small clawed/hoofed toes\n- [ ] Elongated trunk-like snout (closer to a tapir or small elephant trunk than a simple long muzzle)\n- [ ] One large dark eye set well back on the head\n- [ ] Smooth-to-leathery hide with no visible fur or hair", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.png`\n\n> \"We have a regenerated Eopie that is pretty good, but it has legs. We should remove and regenerate it to the new spec level.\"\n\n**REDO** (owner, 2026-10-04, doubles sheet `Transient/art_doubles_compare_2026-10-04.decisions.json`, item ART_VERSION_WRANGLING_1) on `swanimals/Eopie/Eopie` (variants A\u2013E and `Eopie_j` marked \"redundant with above\"):\n\n> \"B is closest but still pretty bad. Please look at Canon ima ng the face; a\nfront (south) view shows both. Hide is **scaly and mottled in tan, warm\norange-brown and olive patches** (the side-view reference reads warm\ntan-orange; the card reads greener) \u2014 never a flat colour \u2014 with paler\nskin at the belly and joints. `kotor_screenshot.jpg` shows two gizka in\nthe *Ebon Hawk* cargo hold, confirming pack/infestation behavior and a\nsize reference \u2014 roughly knee-height or smaller, a fast-breeding\nvermin-scale creature rather than a large animal.\n\nNo donor mod screenshot could be obtained \u2014 `mlie.starwarsanimalcollection`\nis not present anywhere on this machine's disk (Workshop cache or common\nMods folder), so there is no `donor_current_sprite.png` candidate for this\nentry.", "must": "- [ ] Small bipedal dinosaur-like reptile \u2014 theropod build, body held HORIZONTAL over two strong hind legs; NOT a frog, NOT a toad, NOT an upright hopper\n- [ ] A thick tapering TAIL extending behind for balance \u2014 part of the silhouette in every facing\n- [ ] Tiny vestigial forelimbs tucked against the chest, never weight-bearing\n- [ ] Oversized head with a rounded, blunt, beak-like snout, broad cheeks and a backswept crest at the rear of the skull\n- [ ] TWO modest-sized eyes on the sides of the head \u2014 a front (south) view shows both; never a single central cyclops eye, never huge bulging frog eyes\n- [ ] Scaly mottled hide in tan, warm orange-brown and olive patches \u2014 not a flat colour\n- [ ] Roughly knee-height or smaller \u2014 a vermin-scale creature, not a large animal", "ruling": "2026-09-16, owner: \"Check your canon. I see clear references to bipedal and no\nmention of four legs. I think this is a canon error in your search.\" Upheld on\nre-inspection: the background gizka in kotor_screenshot.jpg stands wholly on\nits two hind legs, forelimbs raised; the infobox render's thin forelimbs are\nnot weight-bearing. The earlier Visual brief's \"quadruped in a sprawling\nstance\" was a misread of the foreground close-up and is superseded by the\nMust-show line above. Gizka renders BIPEDAL: two working hind legs, vestigial\nraised forelimbs.\n\n2026-09-16, owner (giz art review): gizka has TWO eyes. The south-facing\nreview renders showed a single central cyclops eye \u2014 that came from this\nentry's own earlier \"reads almost one-eyed/cyclopean\" phrasing, which the\nimage model took literal", "imgs": ["desert_sitting1_2026-10-04_img/003a681b515ec1b5ea27.webp", "desert_sitting1_2026-10-04_img/928bdc04dd580c564346.webp", "desert_sitting1_2026-10-04_img/15d2e59decdb4f5e6a72.webp", "desert_sitting1_2026-10-04_img/b5468709d352bd2404f1.webp", "desert_sitting1_2026-10-04_img/3d1e94125adf47e87328.webp"]}, "flags": [], "rulings": [{"at": "2026-09-16", "verdict": "rerender", "trust": "legacy-unresolved", "sheet": "2026-09-15_pyrelands_art_review__pyrelands_art_decisions", "note": "totally wrong. Four legs instead of 2. Not canon, Not facing differently. ", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art.", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}]}, {"id": "swanimals/Gorg/Gorg", "group": "2 Desert \u00b7 gorg", "label": "gorg (RSW_Gorg) \u2014 Gorg", "context": "biome: desert \u2014 live roster desert 0.4; NOTE: cast more heavily in Arid Shrubland (1)", "flawed": {"decision": "redo", "note": "This is absolutely not a Gorg. Look it up. Not frog like. "}, "noCanon": "no canon-library entry (looked for: gorg, RSW_Gorg, Gorg)", "effect": "RSW_Gorg \u00b7 2 distinct sets: 1 shipped now, 1 renders, 0 history states \u2014 pick the column the game should show", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to wh : 10, "masks": [], "canon": {"dir": "design/RimStarWars/canon_references/horax", "brief": "Unlike the wyyyschokk/pekopeko cases, there is **no text/image conflict**\nhere \u2014 the three candidate images (two Legends-tagged, one from the 2003\nmicroseries itself) line up cleanly with both the canon and Legends text:\n\n- `wookieepedia_infobox_cw_horax.jpg` \u2014 painted/rendered concept-style\n  close-up of the head and forepaws in a snowy forest. Confirms: deep\n  **blue**, heavily wrinkled hide; **large tan/beige horns** sweeping up and\n  out from the snout in a wide V; **orange/yellow eyes**; multiple long\n  saber-like fangs both upper and lower jaw, visible even with the mouth\n  mostly closed; thick clawed forepaws with pale tan claws. A tiny robed\n  figure with a green lightsaber stands at the creature's foot for scale \u2014\n  confirms the \"over 15 meters\" claim is not an exaggeration; the animal\n  dwarfs a standing human many times over.\n- `wookieepedia_battle_horax.jpg` \u2014 a still from the actual 2003 microseries\n  episode (flat 2D animation style, not the concept painting). Same design\n  read through the show's line-art style: blue body, tan curved horns,\n  orange eyes, a wide fanged maw, clawed feet. Clone troopers in white armor\n  ring the creature at the base of its forelimbs, again confirming\n  building-sized scale. This is the strongest single confirmation that the\n  concept-art coloring/shape actually shipped on screen rather than being a\n  promotional-only design.\n- `wookieepedia_tail_attack.jpg` \u2014 a darker action still: a segmented blue\n  tail with pale spiked/clubbed knobs at each joint sweeping through the\n  frame, with a trooper or creature silhouette flung through the air.\n  Confirms the Legends text's \"large spiked and clubbed tail\" as an actual\n  weapon used on-screen, not just a design note.\n\n**One image was checked and discarded**: Wookieepedia's `AnakinKills.jpg`\n(also linked from the Battle of Nelvaan page) was downloaded and inspected,\nbut it shows a *different* scene entirely \u2014 green pig-like creatures in the\nforeground, a machine tower, and a robed spirit figure, with no horax visible\nat all. It is not included as a candidate; the filename is misleading for\nthis creature.\n\n**Net read: render blue**, a massive wrinkled reptilian quadruped, tan\nsweeping horns on the snout, orange eyes, multiple exposed saber fangs, thick\nclawed limbs, and a spiked/clubbed tail as a visible weapon. All three kept\nimages agree with each other and with both text tiers \u2014 there is nothing to\nflag as a text/image mismatch this time.", "must": "- [ ] Deep blue, heavily wrinkled hide\n- [ ] Large tan/beige horns sweeping up and out from the snout in a wide V\n- [ ] Orange/yellow eyes\n- [ ] Multiple long saber-like fangs visible in the upper and lower jaw\n- [ ] Thick clawed limbs\n- [ ] Spiked/clubbed tail visible as a distinct feature", "ruling": "", "imgs": ["desert_sitting1_2026-10-04_img/7b83f3f0f7eb39afb0b5.webp", "desert_sitting1_2026-10-04_img/62ab81f481c6d7691975.webp", "desert_sitting1_2026-10-04_img/b1cdeb8eb9fc1bad61fc.webp"]}, "flags": [], "rulings": [{"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, replace with our own def and our own art.", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}]}, {"id": "swanimals/Hrumph/Hrumph", "group": "2 Desert \u00b7 hrumph", "label": "hrumph (RSW_Hrumph) \u2014 Hrumph", "context": "biome: desert \u2014 live roster desert 0.3", "flawed": null, "noCanon": "no canon-library entry (looked for: hrumph, RSW_Hrumph, Hrumph)", "effect": "RSW_Hrumph \u00b7 2 distinct sets: 1 shipped now, 1 renders, 0 history states \u2014 pick the column the game should show", "prefill": "A", "prefillWhy": "no resolvable keep of yours \u2014 prefilled to what with **leopard-style orange-yellow spotted\nmarkings** scattered across the neck, shoulders and flank. It carries a\npair of long, ridged, backward-curving horns sweeping up from the top of the\nhead, as the card art shows (the in-game model reads as one prominent horn;\nthe owner ruled for two on 2026-10-04). The tail is thin and whip-like,\nfeet appear clawed rather than hooved. No fur is visible \u2014 smooth,\nreptilian-adjacent hide despite being classed a \"creature\" rather than\nexplicitly scaled.\n\n**The current donor sprite (`donor_current_sprite.png`) is a genuinely close\nmatch** \u2014 it already uses a green/olive body with yellow-orange spotted\nmarkings, a pair of curved horns, and a long neck, which lines up with both\nreference images far better than most other creatures in this library. The\ndonor's silhouette is more compact/rounded (a coiled sitting pose vs. the\nreferences' standing long-legged pose) and gives it two horns rather than the\none clearly dominant horn in the in-game model, but the palette and marking\npattern are already correct \u2014 this is the strongest existing donor-vs-canon\nagreement found in this pass.", "must": "- [ ] Long-necked, antelope/giraffe-proportioned quadruped body with thin legs\n- [ ] Base skin colour is muted green/olive-teal\n- [ ] Leopard-style orange-yellow spotted markings scattered across neck, shoulders and flank\n- [ ] Exactly two long, ridged, backward-curving horns, a matched pair (owner ruling 2026-10-04; the card art shows a pair)\n- [ ] Four legs\n- [ ] Thin, whip-like tail\n- [ ] Smooth hide with no visible fur", "ruling": "**Antelope \u2014 canon identity stands.** Owner, 2026-09-18: *\"antelope and close,\nthis is acceptance\"* (on PYRELANDS_CREATURE_RERENDER_1's acceptance). The\nfour-legged Dantooine grassland quadruped described above IS the identity;\nthe shipped painterly v2 set was drawn from this entry and the owner locked\nthat specific art 2026-09-17 (*\"Lock in that Iriaz.\"* \u2014 tself, not food shots) are internally consistent with each other but\n**disagree sharply with the \"bird\" / \"swamp turkey\" framing in the text**.\nNone of the three shows anything resembling feathers, a beak, wings, or a\nturkey-like silhouette. What they actually show is a squat, hunched,\n**toad- or turtle-like amphibian/reptile**: a heavy domed/ridged shell-like\nback rising into a peak, a wide froglike head with a broad flat mouth and\nbulging pink or amber eyes, floppy skin flaps hanging at the sides of the\nhead (read as loose jowls/wattle, not ears), thick bent hind legs ending in\nclawed toed feet, and mottled olive-to-dark-green pebbled/warty skin \u2014 no\nvisible feather texture anywhere, on any of the three images, across two\ndifferent render styles and two different eras of official art. The\nfront-on view (`wookieepedia_walkintime.jpg`) confirms the body is wider\nthan tall when viewed head-on, with the two hind legs doing all the\nvisible structural work, consistent with the \"biped\" description, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or wattle rather than a wing. It is far more simplified and\nflat-cartoon-shaded than any candidate image (RimWorld's chunky low-detail\nart style, no visible skin texture or individual toes), and it omits the\nvisible hind legs / froggy stance entirely \u2014 the sprite reads as a rounded\nblob-with- cription, but the\noverall read is far closer to a bloated toad or snapping turtle than to any\nbird. Skin color does match the infobox text (green). \"Swamp turkey\" as a\nnickname reads as a folk/marketing name for a domesticated food animal\nrather than a literal physical descriptor \u2014 the images support \"turtle\"\nfar better than \"turkey.\"\n\n**The donor sprite agrees reasonably well with the images**, better than\nmost creatures in this library: it is green, has a hunched dome-shaped back\nwith lighter banding suggesting a ridged/shell-like top, a forward-jutting\nmouth/head, and a single small orange nub at the front-left that reads as a\nstylized crest or wattle rather than a wing. It is far more simplified and\nflat-cartoon-shaded than any candidate image (RimWorld's chunky low-detail\nart style, no visible skin texture or individual toes), and it omits the\nvisible hind legs / froggy stance entirely \u2014 the sprite reads as a rounded\nblob-with-a-face rather than a standing biped \u2014 but the *silhouette family*\n(squat, hunched, domed-backed, green, toad/turtle-adjacent, not bird-like)\nis a genuine match to canon, which is not true of every creature audited so\nfar in this library.", "must": "- [ ] Heavy domed/ridged shell-like back rising to a peak\n- [ ] Wide, froglike head with a broad flat mouth and bulging pink or amber eyes\n- [ ] Floppy skin flaps hanging at the sides of the head (jowls/wattle, not ears)\n- [ ] Thick, bent hind legs ending in clawed, toed feet, doing the visible structural work of standing\n- [ ] Mottled olive-to-dark-green pebbled/warty skin \u2014 no feather texture, beak or wings anywhere", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`\n\n> \"E3 is canon. May need suggestion of thick bird-like legs to avoid making it look like a frog.\"", "imgs": ["desert_sitting1_2026-10-04_img/7f5a1b03b56e88bce921.webp", "desert_sitting1_2026-10-04_img/b8fc8a62f6e3d7b1bc49.webp", "desert_sitting1 ed dorsal ridge**: a fan/row of thin pointed spines running from the\n  crown of the head down the back \u2014 present in all three images, most\n  dramatic in the concept art (long thin quills radiating off the skull) and\n  the in-game render (shorter spikes continuing down a segmented back plus\n  a spiked tail tip).\n- **Eyes**: the concept art shows a single large deep-socketed eye (not\n  obviously stalked); the in-game render clearly shows **two eyes on\n  short stalks that can be read independently** \u2014 matching the \"bulging\n  eyestalks\" text description more precisely than the concept art does.\n- **Mouth**: both the concept art and in-game render show a wide,\n  low-slung jaw lined with many small sharp teeth, matching the toothy-mouth\n  description.\n- **Legs/feet**: thick, stocky legs ending in clawed toes are visible in the\n  in-game render; the \"4 tridactyl feet\" detail is a bit harder to confirm\n  precisely at this resolution but is consistent with what's visible.\n- The comic panel (*Tales of the Jedi*, first appearance) only shows a\n  cropped close-up of a toothy tan head with the same spike-fringe and\n  needle teeth \u2014 consistent with, not contradicting, the other two.\n\nOverall this is a strongly consistent design across sources: squat toad/frog-\nlike quadruped, mottled tan-olive hide, pale belly, fringe of dorsal spines,\nwide toothy mouth, stalked eyes.\n\n**The current donor sprite** (`donor_current_sprite.png`) is a strong match:\nolive-tan mottled body, spiked dorsal ridge/fringe, wide fanged mouth, and\npebbled belly texture. One difference worth noting: the donor sprite draws a\nsingle large amber eye rather than the two independently-moving stalked eyes\nthe in-game KOTOR2 render and the source text both call for \u2014 a regen should\nadd the stalked-eye detail rather than a single flat eye.", "must": "- [ ] Squat, bloated, toad-like quadruped body\n- [ ] Mottled tan/khaki/olive-yellow-green hide on the back and flanks nd legs**, a long tapering rat-like tail, and an\n  elongated snout packed with **large interlocking jagged teeth** \u2014 visible\n  even with the jaw mostly closed, which is clearly the source of the\n  \"saw-toothed\" name. Small **red eyes**, a pair of short blunt horn-like\n  spikes near the nose, and a wispy fringe of hair-like bristles along the\n  belly and backs of the legs (consistent with the text's \"sensed vibrations\n  through hair\").\n- `wookieepedia_coruscant_scene.webp` (an adult and juvenile grank scavenging\n  from a tipped-over trash can on Coruscant, with a small unrelated\n  yellow/cream creature nearby): confirms the same **reddish-brown/maroon\n  dorsal coloring fading to tan-grey underneath**, the same twin nose-horns,\n  and shows the mouth **open**, revealing a genuinely saw-like double row of\n  jagged white teeth \u2014 the strongest single confirmation of the \"saw-toothed\"\n  name. Also shows faint **darker mottled spotting** on the flank of the\n  adult, consistent with a reptilian/scaled hide rather than a furred one\n  (matching \"Reptomammal\"). Both the adult and the smaller juvenile share\n  identical coloring \u2014 no juvenile/adult color difference visible.\n- `steam_workshop_roster_grid.jpg` (Steam Workshop preview screenshot from\n  the donor mod's current 1.6 listing, id `3497316713` \u2014 a 12-creature\n  roster grid; Grank is the bottom-right tile, clearly labeled \"GRANK\"): the\n  mod's own flat-vector icon art, independently drawn by the mod author,\n  **also lands on a maroon/wine-red back with a tan/cream belly, snout\n  underside, and open mouth showing white fangs**, a long thin down-curving\n  tail, and a small ear/horn nub \u2014 i.e. the mod author converged on\n  essentially the same reddish-brown-over-tan palette as the two Wookieepedia\n  illustrations, independently of them.\n\n**N", "must": "- [ ] Low-slung, digitigrade quadruped with a long, tapering, rat-like tail\n- [ ] Reddish-brown to maroon dorsal/ ecies of omnivorous and gregarious canids from the mineral world Crait. They were distinguished by their c", "letter": "B", "purgeable": true}], "near": 10, "masks": [], "canon": {"dir": "design/RimStarWars/canon_references/vulptex", "brief": "All four candidate images agree closely with each other and with the text.\nThe vulptex is NOT a smooth-furred fox with sparkly highlights \u2014 the\n\"crystalline\" coat is a bold, literal visual feature: individual bristles\nread as hard, faceted, glass-like **shards/spikes** standing up off the\nbody (most visible along the spine, shoulders, and especially the tail,\nwhich is a dense brush of spike-like points rather than a soft fluffy\nbrush). The two studio/promotional renders (`wookieepedia_infobox.jpg`,\n`wookieepedia_masterwork.jpg`) show this clearly in clean lighting: a\ngrey-blue-white coat with visible individual crystal facets catching cool\nlight, a long slender fox muzzle, very large upright triangular ears, a\nlong thin tail covered in the same spiked coat, and notably **long, thin\nlegs and an upright, almost deer-like stance** \u2014 taller and leggier than a\nreal-world fox, not low-slung. The two in-film screencaps\n(`wookieepedia_craitsurface.jpg`, `wookieepedia_battlescreencap.jpg`)\nconfirm the same silhouette and coat under real film lighting/grading, and\nalso confirm the text's eye-color inconsistency firsthand: the cave shot\nshows glowing **orange/amber** eyes, while the daylight battle shot shows\nclearly **blue** eyes \u2014 the two production sources Wookieepedia cites are\nnot reconciled in the actual footage either, so both are genuinely correct\ndepending on shot/lighting.\n\n**The donor sprite (`donor_current_sprite.png`) disagrees with canon on\nnearly every visual axis.** It is a flat cartoon icon: a low-slung,\nelongated, short-legged body (closer to a ferret or a lounging rabbit than\nan upright fox), a smooth smoothly-shaded white coat with pale blue patches\nand a solid black outline, and **no crystalline/faceted texture\nwhatsoever** \u2014 no spikes, no shard shapes, no faceted shading anywhere on\nthe body or tail. The white base color and cool blue tint are the only\nthings it gets right; the silhouette (should be tall/leggy/upright, is\nlow/long/crouched), the ear size (canon's ears are dramatically larger\nrelative to the head), and above all the signature crystalline bristle\ntexture (entirely absent) are all mismatched against every reference image.\nAny regen should prioritize the spiked/faceted coat texture first \u2014 it's\nthe one feature that makes a vulptex recognizable as a vulptex rather than\na generic white fox \u2014 and correct the body proportions toward a taller,\nlonger-legged stance.", "must": "- [ ] Coat reads as hard, faceted, glass-like crystal shards/spikes standing up off the body \u2014 not smooth fur\n- [ ] Tail is a dense brush of spike-like crystalline points, not a soft fluffy brush\n- [ ] Long, slender fox muzzle with very large, upright, triangular ears\n- [ ] Long, thin legs and an upright, deer-like stance \u2014 taller and leggier than a real-world fox, not low-slung\n- [ ] Coat colour is grey-blue-white with visible individual crystal facets", "ruling": "**RULED** (owner, 2026-09-14, review sheet): `wookieepedia_infobox.jpg`", "imgs": ["desert_sitting1_2026-10-04_img/d79ec437a33b1224b5ff.webp", "desert_sitting1_2026-10-04_img/f1fcc9f697a68cc8708c.webp", "desert_sitting1_2026-10-04_img/f95e6d4a9b7abce0166c.webp", "desert_sitting1_2026-10-04_img/f5b4e66980c997715cb9.webp"]}, "flags": [], "rulings": [{"at": "2026-09-14", "verdict": "4", "trust": "legacy-unresolved", "sheet": "2026-09-13_canon_review_decisions", "note": "", "why": "legacy sheet names no exact bytes; shown on sheets, protects nothing until re-confirmed"}, {"at": "2026-09-20", "verdict": "replace", "trust": "legacy-unresolved", "sheet": "2026-09-20_desert_family_review_2026-09-20", "note": "Owner blanket ruling 2026-09-20: keep the creature, rep <header>
  <div class="hrow">
    <h1 id="title">Review sheet</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <span class="pill" id="link">connecting…</span>
    <button class="btn" id="fold">▾ brief</button>
  </div>

  <div id="brief">
    <div id="briefBody"></div>
    <div class="panel posture" id="posturePanel"></div>
    <div class="panel invented hide" id="inventedPanel"></div>
    <div class="pathbar hide" id="pathbar">
      <b>Save decisions to</b>
      <code id="dpath"></code>
      <button class="btn" data-copy="dpath">copy path</button>
      <span class="sub" id="pathwhy"></span>
    </div>
    <div class="pathbar hide" id="spathbar">
      <b>This sheet</b> <code id="spath"></code>
      <button class="btn" data-copy="spath">copy path</button>
    </div>
    <!-- The export route out of browser-only storage. It exists because SKILL.md §8 tells
         a human whose work never reached disk to "reopen the sheet and click copy JSON" —
         and for a long time there was no such control anywhere on the page. -->
    <div class="pathbar hide" id="exportbar">
      <b>Not saving to a file</b>
      <span class="sub">your decisions are held in this browser only</span>
      <button class="btn pri" id="copyJson">copy JSON</button>
      <span class="sub" id="copywhy">puts the whole decisions file on the clipboard — paste it over the .json</span>
    </div>
    <textarea id="exportTa" class="hide" rows="8" spellcheck="false" readonly></textarea>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="search name, id, or effect…">
    <select id="fstate"></select>
    <select id="fgroup"></select>
    <select id="fmark">
      <option value="">all rows</option>
      <option value="override">overrides only</option>
      <option value="contested">contested only</option>
      <option value="inferred">inferred only</option>
      <option value="noted">has a note</option>
    </select>
    <span class="spacer"></span>
    <span class="pill" id="progress"></span>
    <button class="btn" id="nextUndecided" title="jump to the next undecided row (g)">next undecided</button>
    <button class="btn hide" id="btnGrid" title="list / grid (v)">grid</button>
    <input type="range" id="cell" class="hide" min="80" max="260" value="132" title="thumbnail size">
    <button class="btn" id="btnKeys" title="keyboard help (?)">?</button>
  </div>

  <div class="banner bad hide" id="err"></div>
</header>

<div id="list"></div>

<div id="zoom"><div><div class="box"><img id="zimg" alt=""></div><div class="cap" id="zcap"></div></div></div>

<div id="keys">
  <h3>Keyboard</h3>
  <table id="keysBody"></table>
  <div class="sub" style="margin-top:10px">Esc closes. Keys are ignored while typing in a note.</div>
</div>


<script id="RENDER">
window.itemBody = it => {
  const d = (typeof DEC !== 'undefined' && DEC[it.id]) || {};
  const purge = new Set(d.purge || []);
  const facings = it.facings;
  const cell = (c, f) => {
    const s = c.faces[f];
    if (!s) return `<div class="ac-cell ac-gap" title="no ${f} in this set">—</div>`;
    const t = it.thumbs[s];
    const p = purge.has(s);
    const btn = c.purgeable ? `<button class="ac-purge${p ? ' on' : ''}" title="reject + PURGE: delete this picture from the art store so it never appears again" onclick="event.stopPropagation();artTogglePurge('${it.id}','${s}')">${p ? '✕ purging' : '✕'}</button>` : '';
    return `<div class="ac-cell${p ? ' ac-purged' : ''}"><div class="thumb ac-thumb" data-zoom="${t}" data-cap="${esc(it.label)} · ${c.letter} · ${f}"><img src="${t}" loading="lazy" alt=""></div>${btn}</div>`;
  };
  const col = c => `<div class="ac-col ac-${c.kind}${c.winner ? ' ac-win' : ''}${d.decision === c.letter ? ' ac-picked' : ''}">
      <div class="ac-head"><b>${c.letter}</b> ${esc(c.label)}</div>
      ${facings.map(f => cell(c, f)).join('')}
      <div class="ac-detail" title="${esc(c.detail)}${c.prompt ? '\n\nprompt: ' + esc(c.prompt) : ''}">${esc(c.detail)}</div>
      ${c.also ? `<details class="ac-also"><summary>${c.also.length} identical elsewhere</summary>${c.also.map(a => `<div>${esc(a)}</div>`).join('')}</details>` : ''}
    </div>`;
  const main = it.cols.filter(c => !c.near_of), near = it.cols.filter(c => c.near_of);
  /* Canon reference beside the variants on EVERY row (owner rule 2026-10-04): images + Must show
     always visible; the visual brief scrolls in place; no entry = said on the row. */
  const canon = it.canon ? `<div class="ac-col ac-canoncol"><div class="ac-head"><b>canon</b> reference — not pickable</div>
      <div class="ac-canon-imgs">${it.canon.imgs.map(u => `<div class="thumb ac-cthumb" data-zoom="${u}" data-cap="canon reference · ${esc(it.canon.dir)}"><img src="${u}" loading="lazy" alt=""></div>`).join('') || '<span class="sub">entry has no images</span>'}</div>
      <div class="ac-brief"><b>Must show</b><pre>${esc(it.canon.must || '(entry lists none)')}</pre><b>Visual brief</b><pre class="ac-vb">${esc(it.canon.brief)}</pre>${it.canon.ruling ? `<b>Ruling</b><pre>${esc(it.canon.ruling)}</pre>` : ''}<span class="sub">${esc(it.canon.dir)}</span></div></div>`
    : `<div class="ac-col ac-canoncol ac-nocanon"><div class="ac-head"><b>canon</b></div><div class="sub">${esc(it.noCanon || 'no canon-library entry')}</div></div>`;
  const flawed = it.flawed ? `<div class="ac-flawed"><b>Your 2026-10-03 desert sheet:</b> ${esc(it.flawed.decision || '(no decision)')}${it.flawed.note ? ' — “' + esc(it.flawed.note) + '”' : ''} <span class="sub">⚠ made against a flawed sheet (its “current” column showed corpse textures for 65 of 109 rows) — shown, authorises nothing</span></div>` : '';
  const ctx = it.context ? `<div class="ac-ctx">${esc(it.context)}</div>` : '';
  const rul = it.rulings.length ? `<div class="ac-rulings">${it.rulings.map(r => `<div class="ac-r ac-t-${r.trust}" title="${esc(r.why || '')}">${esc(r.at)} <b>${esc(r.verdict)}</b> <span class="sub">${esc(r.trust)} · ${esc(r.sheet)}</span> ${r.note ? '“' + esc(r.note) + '”' : ''}</div>`).join('')}</div>` : '';
  const masks = it.masks.length ? `<details class="ac-masks"><summary>masks (not judged here — they follow the body pick)</summary><div class="ac-canon-imgs">${it.masks.map(m => `<div class="thumb ac-thumb" data-zoom="${m.t}" data-cap="mask ${esc(m.mod)} ${m.f}"><img src="${m.t}" loading="lazy" alt=""></div>`).join('')}</div></details>` : '';
  return `<div class="ac-body"><div class="effect">${esc(it.effect)}</div>
    <div class="marks">${it.flags.map(f => `<span class="mark contested">${esc(f)}</span>`).join('')}${it.contested ? '<span class="mark inferred">⚠ prefill inferred — ' + esc(it.prefillWhy) + '</span>' : '<span class="mark absent">prefill: ' + esc(it.prefillWhy) + '</span>'}</div>
    ${ctx}${flawed}${rul}
    <div class="ac-grid"><div class="ac-col ac-facings"><div class="ac-head">&nbsp;</div>${facings.map(f => `<div class="ac-cell ac-flabel">${f}</div>`).join('')}</div>${main.map(col).join('')}${canon}</div>
    ${near.length ? `<details class="ac-near"><summary>${near.length} near-duplicate set(s) (dHash ≤ ${it.near} on every facing) — folded, not hidden</summary><div class="ac-grid">${near.map(c => col(c)).join('')}</div></details>` : ''}
    ${masks}</div>`;
};
window.artRepaint = id => {
  const node = document.querySelector(`.row[data-id="${cssEsc(id)}"] .ac-body`);
  const it = byId.get(id);
  if (node && it) node.outerHTML = window.itemBody(it);
};
window.artTogglePurge = (id, sha) => {
  if (frozen) return;
  const it = byId.get(id); if (!it) return;
  const rec = DEC[id] || (DEC[id] = { decision: '', note: '', prefill: prefillOf(it) });
  const s = new Set(rec.purge || []);
  if (s.has(sha)) s.delete(sha); else s.add(sha);
  rec.purge = [...s]; rec.purgeTouched = true;
  queue(id); patchRow(id); paintCounts();
};
addEventListener('DOMContentLoaded', () => {
  /* A decision click is recorded as decidedAt, so a row touched ONLY to purge or annotate
     never turns its prefill into a ruling at ingest (art_sheet.py docstring). */
  const orig = window.setDecision;
  if (typeof orig === 'function') window.setDecision = function (id, key, opts) {
    orig(id, key, opts);
    if (DEC[id]) { DEC[id].decidedAt = new Date().toISOString(); queue(id); }
  };
  /* The template's patchRow repaints only the buttons; the picked-column frame and the purge
     marks live in the row body, so repaint that too (also covers undo/redo). */
  const origPatch = window.patchRow;
  if (typeof origPatch === 'function') window.patchRow = function (id) { origPatch(id); window.artRepaint(id); };
});
/* Options are global; grey out a column letter this row does not have (never hide). */
new MutationObserver(() => { try {
  document.querySelectorAll('.row[data-id]').forEach(r => {
    const it = byId.get(r.dataset.id); if (!it) return;
    r.querySelectorAll('[data-set]').forEach(b => {
      const k = b.dataset.set;
      const has = !(k.length === 1 && /[A-Za-z]/.test(k)) || it.letters.includes(k);
      b.disabled = !has; b.style.opacity = has ? '' : '0.25';
    });
  });
} catch (e) { /* main script not initialised yet: the next mutation retries */ } }).observe(document.documentElement, { childList: true, subtree: true });
</script>
